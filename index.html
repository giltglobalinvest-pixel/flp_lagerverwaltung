// Wendet die aktuelle Schwellen-Konfiguration auf die gecachte Rangliste an.
// Strikt (default): Sicher ≥ 70 + strong, Möglicher Treffer ≥ 40
// Lockerer:        Sicher ≥ 60 + strong, Möglicher Treffer ≥ 20, mehr Items
function applyPhotoSearchThresholds() {
  const ranked = state.photoSearchRanked || [];
  const relaxed = !!state.photoSearchRelaxed;
  const textThr = relaxed ? 60 : 70;
  const visThr  = relaxed ? 20 : 40;
  const visMax  = relaxed ? 8 : 4;
  const text = ranked.filter(r => r.score >= textThr && r.strong).slice(0, 3).map(r => r.it);
  const textIds = new Set(text.map(it => it.id));
  const visual = ranked.filter(r => !textIds.has(r.it.id) && r.score >= visThr).slice(0, visMax).map(r => ({ ...r.it, match: r.score }));
  state.photoSearchTextMatches = text;
  state.photoSearchVisualMatches = visual;
}

async function runPhotoSearch() {
  state.photoSearchPhase = 'analyze';
  state.aiStep = 0;
  go('aiAnalyze');
  try {
    if (!state.photoSearchFile) throw new Error('Kein Foto');
    state.aiStep = 1; render();
    const base64 = await fileToBase64(state.photoSearchFile);
    const mediaType = state.photoSearchFile.type || 'image/jpeg';

    // Schritt 1: Claude Vision \u2014 OCR + Bauteil-Identifikation
    const cats = (state.categories || []).join('|') || 'Antrieb|Sicherheit|T\u00fcren|Notruf|Mechanik|Steuerung|Beleuchtung';
    const sys = 'Du analysierst Fotos von Aufzugs-Ersatzteilen. Antworte AUSSCHLIESSLICH als JSON-Objekt, ohne Markdown-Codeblock und ohne erkl\u00e4renden Text.';
    const visionPrompt = `Du bekommst ein Foto eines (vermutlichen) Aufzugs-Ersatzteils, oft ein Typenschild oder Datenblatt.

Extrahiere:
- "model_code": die kurze, eindeutige Modellbezeichnung (z.B. "V3F20", "ZAdyn4C", "3BF040", "Pana 40"). NUR der Code, ohne erkl\u00e4rende Worte. Leerstring wenn nicht erkennbar.
- "probable_maker": Hersteller-Marke (z.B. "Otis", "Ziehl-Abegg", "Memco"). Nur die Marke, mit gro\u00dfem Anfangsbuchstaben. Leer wenn nicht erkennbar.
- "category": fachlich passende Kategorie aus dieser Liste \u2014 gib EINEN davon zur\u00fcck, sonst leer:
  ${cats}
- "keywords": Array bedeutsamer Schl\u00fcsselw\u00f6rter (Bauteilart, Funktion, Eigenschaften). Mind. 3 Zeichen pro Wort, max. 8 St\u00fcck, deutsch oder englisch.
- "text_on_label": die wichtigsten Texte vom Etikett zur Identifikation (mehrzeilig erlaubt).

Sei ehrlich: wenn du etwas NICHT erkennen kannst, gib einen leeren String. Nicht raten.

Format: {"model_code":"...","probable_maker":"...","category":"...","keywords":["..","..","..",".."],"text_on_label":"..."}`;
    const visionRes = await askAI(visionPrompt, { system: sys, imageBase64: base64, imageMediaType: mediaType, maxTokens: 500 });
    let info;
    try { info = parseAIJson(visionRes); } catch (e) { info = { keywords: [] }; }
    // Backward-compat: wenn AI nur "probable_model" liefert (alter Prompt), in model_code mappen
    if (!info.model_code && info.probable_model) info.model_code = info.probable_model;
    state.photoSearchAIInfo = info;
    state.aiStep = 2; render();

    // Schritt 2: Lokal aus Bestand passende Treffer suchen \u2014 strenges Scoring
    const items = inventory;
    const lc = (s) => String(s || '').toLowerCase();
    const stripPunct = (s) => lc(s).replace(/[\s\-_./,]+/g, '');

    // Word-Boundary-Match: verhindert dass "BF" auf "asbestfrei" matcht
    const wordMatch = (haystack, token) => {
      if (!token || token.length < 3) return false;
      const escaped = String(token).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      try { return new RegExp('\\b' + escaped + '\\b', 'i').test(haystack); }
      catch (e) { return haystack.includes(lc(token)); }
    };

    const modelCode = String(info.model_code || '').trim();
    const modelClean = stripPunct(modelCode);
    const makerStr = String(info.probable_maker || '').trim();
    const makerNormAI = makerStr ? normalizeMaker(makerStr) : '';

    // Modell-Code in Tokens splitten (per Whitespace/Bindestriche/Punkte/Slashes)
    // Beispiel: "ZETADYN 3BF040-E110T0" \u2192 ["zetadyn", "3bf040", "e110t0"]
    // So matchen wir auch wenn die OCR ein einzelnes Zeichen falsch liest.
    const modelTokens = modelCode ? lc(modelCode).split(/[\s\-_./,]+/).filter(t => t.length >= 2) : [];

    function scoreItem(it) {
      const titleLow = lc(it.title);
      const titleClean = stripPunct(it.title);
      const titleTokens = titleLow.split(/[\s\-_./,]+/).filter(t => t.length >= 2);
      const titleSet = new Set(titleTokens);
      const makerLow = lc(it.maker);
      const idLow = lc(it.id);
      const descLow = lc(it.description || '');
      const allHay = `${titleLow} ${makerLow} ${idLow} ${descLow}`;
      let score = 0;
      // strongModelMatch = wir sind sicher dass das wirklich dieselbe Modellnummer ist
      // (nicht nur dieselbe Serie/Brand-Line). Nur dann darf das Item unter "Sicher" landen.
      let strongModelMatch = false;

      // 1) MODELL-MATCH \u2014 drei Stufen
      if (modelClean && modelClean.length >= 3) {
        // 1a) FULL-MATCH: kompletter Modell-Code (gestripped) im Title-stripped (60 Punkte)
        if (titleClean.includes(modelClean) || modelClean === titleClean) {
          score += 60;
          strongModelMatch = true;
        }
        // 1b) TOKEN-MATCH: Hauptteile des Modellcodes als ganze W\u00f6rter im Titel
        // Sch\u00fctzt gegen OCR-Fehler in Suffix-Codes (z.B. "E110T0" vs "E1l0T0")
        else if (modelTokens.length > 0) {
          const matchedTokens = modelTokens.filter(t => titleSet.has(t));
          if (matchedTokens.length === modelTokens.length) {
            score += 60;
            strongModelMatch = true;
          } else if (matchedTokens.length >= 2) {
            score += 50;
            strongModelMatch = true; // 2+ Tokens = spezifische Modellnummer trifft, nicht nur Serie
          } else if (matchedTokens.length === 1 && matchedTokens[0].length >= 5) {
            score += 25; // nur Serie/Brand-Line trifft (z.B. "ZETADYN") \u2014 KEIN strong match
          }
        }
        // 1c) ID-Substring (Fallback)
        else if (modelClean.length >= 4 && stripPunct(it.id).includes(modelClean)) {
          score += 50;
          strongModelMatch = true;
        }
      }

      // 2) HERSTELLER-MATCH (30 Punkte)
      if (makerNormAI && makerNormAI.length >= 3) {
        const itMakerNorm = normalizeMaker(it.maker);
        if (itMakerNorm && itMakerNorm === makerNormAI) score += 30;
      }

      // 3) KATEGORIE (10 Punkte)
      if (info.category && it.cat === info.category) score += 10;

      // 4) KEYWORDS \u2014 word-boundary, mindestens 3 Zeichen, max 4 Treffer (16 Punkte)
      if (Array.isArray(info.keywords)) {
        let kwHits = 0;
        for (const kw of info.keywords) {
          const k = String(kw || '').trim();
          if (k.length < 3) continue;
          if (wordMatch(allHay, k)) kwHits++;
        }
        score += Math.min(16, kwHits * 4);
      }

      return { score: Math.min(99, score), strongModelMatch };
    }

    const ranked = items.map(it => {
      const r = scoreItem(it);
      return { it, score: r.score, strong: r.strongModelMatch };
    }).sort((a, b) => b.score - a.score);
    // Ranked-Liste cachen, damit "Suche lockern" ohne neuen API-Call die Schwellen anpassen kann
    state.photoSearchRanked = ranked;
    state.photoSearchRelaxed = false;
    applyPhotoSearchThresholds();
    state.photoSearchPhase = 'results';
    go('photoResults');
  } catch (e) {
    showToast('Foto-Suche fehlgeschlagen: ' + e.message, 'error', 3500);
    state.photoSearchPhase = 'idle';
    go('photoSearch');
  }
}

async function saveNewItemFromVoice() {
  const f = state.voiceFields || {};
  const name = (f.name || '').trim();
  if (!name) { showToast('Bezeichnung fehlt', 'error'); return; }
  const company = state.company;
  if (!company) { showToast('Keine Firma aktiv', 'error'); return; }

  const newItem = {
    id: shortId('A'),
    company_id: company.id,
    // Hersteller dedupen — wenn ähnlicher Name bereits existiert, kanonische Schreibweise nutzen
    maker: normalizeMakerForSave(f.maker),
    // Title dedupen gegen bestehende Bezeichnungen dieses Herstellers
    title: normalizeTitleForSave(name, normalizeMakerForSave(f.maker)),
    description: state.voiceTranscript || '',
    cat: (f.cat || '').trim() || 'Mechanik',
    loc: buildLoc(state.voiceLocDraft || {}),
    cond: state.voiceCond || 'neu',
    func: state.voiceFunc || 'untested',
    specs: [],
    photo: [],
    photoUrl: null,
    tracker: (f.tracker || '').trim(),
    trackerUrl: (f.trackerUrl || '').trim(),
    // Externer Besitzer (leer = eigener Bestand)
    owner: (f.owner || '').trim(),
    // Webshop-Felder vom Wizard / Admin
    vp: (() => {
      const v = String(f.vp || '').replace(',', '.').trim();
      if (!v) return null;
      const n = parseFloat(v);
      return isNaN(n) ? null : Math.max(0, n);
    })(),
    inShop: !!f.inShop,
    sold: false,
    soldAt: null,
    created: nowIso(),
    updated: nowIso(),
  };
  newItem.upd = 'gerade eben';

  setLoading(true, 'Artikel wird angelegt \u2026');
  try {
    const rec = await airWrite(TBL_ITEMS, itemToFields(newItem, teamKey()));
    newItem._recordId = rec.id;

    const files = state.voicePhotoFiles || [];
    if (files.length > 0) {
      for (let i = 0; i < files.length; i++) {
        setLoading(true, `Foto ${i + 1} / ${files.length} wird hochgeladen \u2026`);
        try {
          await uploadFileToRecord(TBL_ITEMS, rec.id, 'photo', files[i]);
        } catch (e) {
          showToast(`Foto ${i + 1} fehlgeschlagen: ` + e.message, 'error', 3500);
        }
      }
      // Frisch nachladen \u2014 alle URLs auf einmal holen mit Retry
      setLoading(true, 'Fotos werden verarbeitet \u2026');
      try {
        const photos = await fetchPhotosWithRetry(rec.id, files.length);
        newItem.photo = photos;
        newItem.photoUrl = photos[0]?.url || null;
      } catch (e) { /* fallback: leer */ }
    }

    company.inventory.unshift(newItem);
    state.item = newItem;

    // Specs im Hintergrund generieren
    if (newItem.photoUrl || (newItem.title && newItem.maker)) {
      regenerateSpecs(); // l\u00e4uft asynchron, aktualisiert state.item
    }

    // Object-URLs aufr\u00e4umen
    (state.voicePhotoPreviews || []).forEach(u => { try { URL.revokeObjectURL(u); } catch(_) {} });
    state.voicePhotoFiles = [];
    state.voicePhotoPreviews = [];
    showToast('Artikel angelegt', 'success');
    go('saved');
  } catch (e) {
    showToast('Speichern fehlgeschlagen: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
  }
}

async function parseVoiceTranscript(transcript) {
  if (!transcript) return;
  try {
    const cats = state.categories || [];
    const catList = cats.length ? cats.join(' | ') : 'beliebig';
    const sys = `Du extrahierst Felder f\u00fcr ein Lager-System f\u00fcr Aufzugsersatzteile aus deutschsprachiger Sprache.

Verf\u00fcgbare Kategorien (w\u00e4hle die fachlich passendste!): ${catList}

Antworte AUSSCHLIESSLICH als JSON in diesem Schema:
{
  "name": "kurzer Artikelname",
  "maker": "Hersteller",
  "cat": "<eine der verf\u00fcgbaren Kategorien ODER neue Bezeichnung wenn keine passt>",
  "cat_is_new": false,
  "loc": {"hall":"","shelf":"","pos":"","box":""},
  "cond": "neu|refurb|used|",
  "func": "ok|untested|unknown|defective|scrap|",
  "stock": ""
}

Regeln zur Kategorie:
- Ordne den Artikel logisch in die fachlich passendste Kategorie aus der Liste ein.
- Beispiele: Frequenzumrichter, Getriebe, Motor \u2192 "Antrieb"; Lichtgitter, Fangvorrichtung \u2192 "Sicherheit"; T\u00fcrantriebe, T\u00fcrschlitten \u2192 "T\u00fcren"; Notrufger\u00e4te \u2192 "Notruf"; Treibscheiben, Seilrollen \u2192 "Mechanik"; Steuerungen, Platinen \u2192 "Steuerung"; Lampen, LEDs \u2192 "Beleuchtung".
- Wenn KEINE der verf\u00fcgbaren Kategorien passt, schlage einen NEUEN, kurzen, sinnvollen deutschen Kategorienamen vor (1 Wort, max 2) und setze "cat_is_new": true.
- Lasse "cat" NIEMALS leer wenn ein Artikel beschrieben wird.

Lasse andere Felder leer wenn nicht erw\u00e4hnt.`;
    const txt = await askAI('Diktat: ' + transcript, { system: sys, maxTokens: 500 });
    const data = parseAIJson(txt);

    // Falls AI eine neue Kategorie vorgeschlagen hat \u2192 automatisch hinzuf\u00fcgen
    if (data.cat && data.cat_is_new && !cats.includes(data.cat) && state.company) {
      state.categories = [...cats, data.cat];
      persistCompanyHallsShelves(state.company);
      showToast('Neue Kategorie erg\u00e4nzt: ' + data.cat, 'info', 2400);
    }

    state.voiceFields = {
      name: data.name || state.voiceFields.name || '',
      maker: data.maker || state.voiceFields.maker || '',
      cat: data.cat || state.voiceFields.cat || '',
      stock: data.stock || state.voiceFields.stock || '',
      tracker: state.voiceFields.tracker || '',          // vom Foto-Scan, nicht vom Diktat
      trackerUrl: state.voiceFields.trackerUrl || '',
      vp: state.voiceFields.vp || '',
      inShop: !!state.voiceFields.inShop,
    };
    if (data.loc) {
      state.voiceLocDraft = {
        hall: data.loc.hall || '',
        shelf: data.loc.shelf || '',
        pos: data.loc.pos || '',
        box: data.loc.box || '',
      };
    }
    if (data.cond) state.voiceCond = data.cond;
    if (data.func) state.voiceFunc = data.func;
    state.voicePhase = 'done';
    render();
  } catch (e) {
    showToast('Sprache konnte nicht ausgewertet werden: ' + e.message, 'error', 3500);
    state.voicePhase = 'done';
    render();
  }
}

/* ============================================================
   WEB SPEECH API
   ============================================================ */
/* ============================================================
   LIVE CAMERA (getUserMedia)
   ============================================================ */
const Camera = {
  stream: null,
  videoEl: null,        // wird vom render() injiziert
  facingMode: 'environment',
  starting: false,

  isSupported() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  },

  async start(videoEl) {
    if (!this.isSupported()) throw new Error('Kamera nicht unterstützt');
    if (this.starting) return;
    this.starting = true;
    try {
      // Bestehenden Stream stoppen falls vorhanden
      this.stop();
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: this.facingMode },
          width: { ideal: 1920 },
          height: { ideal: 1440 },
        },
        audio: false,
      });
      this.videoEl = videoEl;
      if (videoEl) {
        videoEl.srcObject = this.stream;
        videoEl.setAttribute('playsinline', 'true');
        videoEl.setAttribute('muted', 'true');
        videoEl.muted = true;
        await videoEl.play().catch(() => {});
      }
    } finally {
      this.starting = false;
    }
  },

  stop() {
    if (this.stream) {
      this.stream.getTracks().forEach(t => { try { t.stop(); } catch(_) {} });
    }
    this.stream = null;
    if (this.videoEl) {
      try { this.videoEl.srcObject = null; } catch(_) {}
    }
  },

  async toggleFacing() {
    this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
    if (this.videoEl) await this.start(this.videoEl);
  },

  // Captured frame: schneidet zentriert auf 5:4 + resize + JPEG
  async capture() {
    if (!this.videoEl) throw new Error('Kein Live-Bild');
    const v = this.videoEl;
    const srcW = v.videoWidth, srcH = v.videoHeight;
    if (!srcW || !srcH) throw new Error('Live-Bild noch nicht bereit — bitte kurz warten');

    // Zentrierter Crop auf 5:4 (PHOTO_TARGET_RATIO = 1.25)
    const srcRatio = srcW / srcH;
    let cropW, cropH, cropX, cropY;
    if (srcRatio > PHOTO_TARGET_RATIO) {
      cropH = srcH;
      cropW = Math.round(srcH * PHOTO_TARGET_RATIO);
      cropX = Math.round((srcW - cropW) / 2);
      cropY = 0;
    } else {
      cropW = srcW;
      cropH = Math.round(srcW / PHOTO_TARGET_RATIO);
      cropX = 0;
      cropY = Math.round((srcH - cropH) / 2);
    }

    // Resize auf max PHOTO_MAX_EDGE
    let outW = cropW, outH = cropH;
    const longest = Math.max(cropW, cropH);
    if (longest > PHOTO_MAX_EDGE) {
      const scale = PHOTO_MAX_EDGE / longest;
      outW = Math.round(cropW * scale);
      outH = Math.round(cropH * scale);
    }

    const canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(v, cropX, cropY, cropW, cropH, 0, 0, outW, outH);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', PHOTO_JPEG_QUALITY));
    if (!blob) throw new Error('Frame konnte nicht erfasst werden');
    return new File([blob], 'photo_' + Date.now() + '.jpg', { type: 'image/jpeg' });
  },
};

// Startet die Live-Kamera wenn der Camera-Screen aktiv ist und ein Live-Video-Element existiert.
// Wird nach jedem Render aufgerufen — idempotent.
async function startLiveCameraIfNeeded() {
  if (state.view !== 'camera') return;

  } catch (e) {
    if (e.name === 'NotAllowedError' || /denied/i.test(e.message)) {
      state.cameraDenied = true;
      showToast('Kamera-Zugriff verweigert. In den Browser-Einstellungen erlauben.', 'error', 4000);
      render();
    } else {
      showToast('Kamera-Start fehlgeschlagen: ' + e.message, 'error', 3500);
    }
  }
}

// Nimmt einen Frame aus der Live-Kamera, prozessiert ihn und legt ihn ins voicePhotoFiles.

  }
}

// iOS Safari beendet die Erkennung nach jeder kurzen Sprechpause automatisch.
// Wir restarten dann transparent solange der User nicht selbst gestoppt hat.
const Speech = {
  rec: null,
  active: false,
  userStopped: false,        // true = User hat manuell gestoppt
  accumulated: '',           // gesammeltes finales Transkript \u00fcber Restarts hinweg
  onUpdateFn: null,
  onFinalFn: null,
  start(onUpdate, onFinal) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('Sprache nicht unterst\u00fctzt (bitte Chrome/Safari)', 'error', 3500); return false; }
    this.stop(true); // sicherheitshalber, ohne Final-Callback
    this.userStopped = false;
    this.accumulated = '';
    this.onUpdateFn = onUpdate;
    this.onFinalFn = onFinal;
    return this._spawn();
  },
  _spawn() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = 'de-DE';
    rec.interimResults = true;
    rec.continuous = true;
    let sessionFinal = '';
    rec.onresult = (e) => {
      let interim = '';
      sessionFinal = '';
      for (let i = 0; i < e.results.length; i++) {
        const tr = e.results[i][0].transcript;
        if (e.results[i].isFinal) sessionFinal += tr; else interim += tr;
      }
      const combined = (this.accumulated + ' ' + sessionFinal + ' ' + interim).trim();
      this.onUpdateFn?.(combined);
    };
    rec.onerror = (e) => {
      // 'no-speech' und 'aborted' sind harmlos \u2014 onend k\u00fcmmert sich um Restart
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        this.userStopped = true;
        showToast('Mikrofon-Zugriff verweigert. Bitte in den Browser-Einstellungen erlauben.', 'error', 4000);
        return;
      }
      showToast('Mikrofon-Fehler: ' + e.error, 'error', 3500);
    };
    rec.onend = () => {
      // sessionFinal in den Gesamtspeicher \u00fcbernehmen
      if (sessionFinal) {
        this.accumulated = (this.accumulated + ' ' + sessionFinal).trim();
      }
      // Wenn User noch nicht gestoppt hat \u2192 transparent neu starten
      if (this.active && !this.userStopped) {
        try {
          this._spawn();
          return;
        } catch (e) { /* fallthrough */ }
      }
      // Echtes Ende
      this.active = false;
      const finalText = this.accumulated.trim();
      this.accumulated = '';
      this.onFinalFn?.(finalText);
    };
    try {
      rec.start();
      this.rec = rec;
      this.active = true;
      return true;
    } catch (e) {
      showToast('Konnte Mikrofon nicht starten: ' + (e.message || ''), 'error');
      return false;
    }
  },
  stop(silent) {
    this.userStopped = true;
    if (silent) {
      // ohne Final-Callback (bei programmatischem Reset)
      this.onFinalFn = null;
    }
    if (this.rec && this.active) {
      try { this.rec.stop(); } catch(e) {}
    }
  },
};

const stockPill = (s) => {

// Liefert die passende Foto-URL für ein Anzeige-Element. Airtable-Anhänge haben automatisch
// 3 Thumbnail-Größen (small ~36px, large ~512px) — die nutzen wir für Listen + Hero, statt
// jedesmal das volle 1600px-Bild zu laden. Spart auf Mobilfunk extrem viel Bandbreite.
//   p     = ein Eintrag aus it.photo[] ODER ein Item-Objekt (nimmt dann photo[0])
//   size  = 'small' | 'large' | 'full'  (default 'small')
const photoSrc = (p, size = 'small') => {
  if (!p) return null;
  // Wenn ein Item übergeben wurde: erstes Foto nehmen
  if (p.photo && Array.isArray(p.photo)) p = p.photo[0];
  if (!p) return null;
  return p.thumbnails?.[size]?.url || p.url || null;
};

// Format VP als €-String (deutsche Lokalisierung).
const formatVp = (v) => {
  if (v == null || isNaN(v)) return '';
  return v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
};

// Service-Tausch: Wartet der Artikel auf eine Rücksendung?
const isPendingReturn = (it) => !!(it && it.sold && it.saleType === 'service-exchange' && !it.returnedAt);
// Liste aller offenen Rücksendungen im aktuellen Bestand
const getPendingReturns = () => (inventory || []).filter(isPendingReturn);
// Service-Tausch: Verbundener Partner-Artikel (Original ↔ defekte Rücksendung) — sucht per Record-ID
const findLinkedItem = (it) => {
  if (!it?.linkedItemId) return null;
  return (inventory || []).find(x => x._recordId === it.linkedItemId) || null;
};

// Liefert kleine Badges für item-card / compact-item:
//  - Preis-Chip wenn vp gesetzt und (im Shop oder verkauft) — bleibt auch nach Verkauf sichtbar
//  - "VERKAUFT"-Chip rot wenn sold
const shopBadges = (it, opts = {}) => {
  const sm = opts.size === 'sm';
  const priceCls = sm ? 'price-chip price-chip--sm' : 'price-chip';
  const parts = [];
  // Preis weiterhin zeigen — auch wenn verkauft (durchgestrichen wäre auch nice, aber Mono lesbarer)
  const showPrice = it?.vp != null && (it?.inShop || it?.sold);
  if (showPrice) {
    const soldStyle = it.sold ? ' style="background:#FFF1B0;color:#7A5400;border-color:#F5C95B;text-decoration:line-through;text-decoration-color:rgba(122,84,0,.45)"' : '';
    parts.push(`<span class="${priceCls}"${soldStyle}>${formatVp(it.vp)}</span>`);
  }
  if (it?.sold) {
    parts.push(`<span class="price-chip ${sm ? 'price-chip--sm' : ''}" style="background:#FDE2E2;color:#9B1C1F;border-color:#F4A6A8">VERKAUFT</span>`);
  }
  // Service-Tausch: Rücksendung steht noch aus → oranger Hinweis
  if (isPendingReturn(it)) {
    const lbl = sm ? 'RÜCKS.' : 'RÜCKSENDUNG ERWARTET';
    parts.push(`<span class="price-chip ${sm ? 'price-chip--sm' : ''}" style="background:#FFEDD5;color:#9A3412;border-color:#FDBA74;display:inline-flex;align-items:center;gap:3px" title="Service-Tausch: Rücksendung erwartet">${svg('rotate-ccw', sm ? 9 : 10, 2.6)} ${lbl}</span>`);
  }
  return parts.join('');
};

// Tracker-Badge: zeigt #-Nummer prominent. Wenn URL vorhanden → klickbar (öffnet im neuen Tab).
const trackerChip = (it, opts = {}) => {
  if (!it?.tracker && !it?.trackerUrl) return '';
  const sz = opts.size || 'md'; // 'sm' | 'md'
  const label = it.tracker || 'QR-Link';

  const fs = sz === 'sm' ? '10px' : '11px';
  const cls = 'tracker-chip tracker-chip--' + sz;
  if (it.trackerUrl) {
    return `<a href="${it.trackerUrl.replace(/"/g, '&quot;')}" target="_blank" rel="noopener" class="${cls}" style="padding:${px};font-size:${fs}" title="${it.trackerUrl.replace(/"/g, '&quot;')}" onclick="event.stopPropagation()">${svg('qr-code', sz === 'sm' ? 9 : 11, 2.5)}<span>${label}</span></a>`;

  return `<span class="${cls}" style="padding:${px};font-size:${fs}">${svg('hash', sz === 'sm' ? 9 : 11, 2.5)}<span>${label}</span></span>`;

// Returns the active locDraft based on the current view, used by global manage handlers.
// Auto-initializes the draft if missing so add/remove always have a target to mutate.
function getActiveLocDraft() {
  if (state.view === 'detail' && state.quickEdit === 'loc') {
    if (!state.quickLocDraft) state.quickLocDraft = { hall:'', shelf:'', pos:'', box:'' };
    return state.quickLocDraft;
  }
  if (state.view === 'edit' && state.editForm) {
    if (!state.editForm.locDraft) state.editForm.locDraft = { hall:'', shelf:'', pos:'', box:'' };
    return state.editForm.locDraft;
  }
  // Wizard-Step 5 (wizardLoc) und Legacy-Voice-Form teilen sich state.voiceLocDraft
  if (state.view === 'voice' || state.view === 'wizardLoc') {
    if (!state.voiceLocDraft) state.voiceLocDraft = { hall:'', shelf:'', pos:'', box:'' };
    return state.voiceLocDraft;

  return null;
}

// Live-QR-Scanner: nutzt das Camera-Modul + BarcodeDetector im 600ms-Intervall
// Bei Treffer: Tracker + URL füllen, zum Wizard-Tracker-Screen zurück
let _liveScanInterval = null;
let _liveScanDetector = null;
async function startLiveTrackerScan() {
  if (state.view !== 'wizardTrackerScan') return;
  const v = document.getElementById('liveScanVideo');
  if (!v) return;
  // Kamera starten — auch wenn BarcodeDetector fehlt, brauchen wir sie für Snap-OCR
  if (!(Camera.stream && Camera.videoEl === v)) {
    try { await Camera.start(v); } catch (e) {
      showToast('Kamera-Start fehlgeschlagen: ' + e.message, 'error', 3500);
      return;
    }
  }
  // BarcodeDetector-Loop nur wenn verfügbar — sonst rein Snap-OCR über Button
  if (!('BarcodeDetector' in window)) return;
  if (!_liveScanDetector) {
    try {
      const formats = await window.BarcodeDetector.getSupportedFormats();
      if (!formats.includes('qr_code')) return;
      _liveScanDetector = new window.BarcodeDetector({ formats: ['qr_code'] });
    } catch (e) { return; }
  }
  if (_liveScanInterval) clearInterval(_liveScanInterval);
  _liveScanInterval = setInterval(async () => {
    if (state.view !== 'wizardTrackerScan') { stopLiveTrackerScan(); return; }
    const vid = document.getElementById('liveScanVideo');
    if (!vid || vid.readyState < 2) return;
    try {
      const codes = await _liveScanDetector.detect(vid);
      if (codes && codes.length > 0) {
        const url = String(codes[0].rawValue || '').trim();
        if (url) onLiveScanHit(url);
      }
    } catch (e) { /* still next tick */ }
  }, 600);
}
function stopLiveTrackerScan() {
  if (_liveScanInterval) { clearInterval(_liveScanInterval); _liveScanInterval = null; }
  Camera.stop();
}
function onLiveScanHit(rawUrl) {
  stopLiveTrackerScan();
  // QR-Inhalt als URL übernehmen — Tracker-Nummer aus Pfad-Ende ableiten falls möglich
  state.voiceFields.trackerUrl = rawUrl;
  if (!state.voiceFields.tracker) {
    const t = _extractTrackerFromUrl(rawUrl);
    if (t) state.voiceFields.tracker = t;
  }
  // Vibrieren als Feedback (falls verfügbar)
  try { navigator.vibrate?.(80); } catch (_) {}
  showToast('QR erkannt — Tracker übernommen', 'success', 2200);
  state.view = 'wizardTracker';
  render();
}

// Prüft ob ein Bild einen QR-Code enthält — solche Fotos sind in der Regel Tracker-Aufnahmen
// und sollen für die Bauteilbeschreibung NICHT mitanalysiert werden.
async function _photoContainsQR(file) {
  if (!('BarcodeDetector' in window)) return false;
  try {
    const formats = await window.BarcodeDetector.getSupportedFormats();
    if (!formats.includes('qr_code')) return false;
    const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
    const bitmap = await createImageBitmap(file);
    const codes = await detector.detect(bitmap);
    bitmap.close?.();
    return Array.isArray(codes) && codes.length > 0;
  } catch (e) { return false; }
}

// Erster Buchstabe groß (ohne den Rest umzubauen — falls Marke z.B. "BWG-Lift" ist).
function capitalizeFirst(s) {
  s = String(s || '').trim();
  if (!s) return s;
  return s[0].toUpperCase() + s.slice(1);
}

// Entfernt Rechtsform-Suffixe (GmbH, AG, Inc, …) am Wortende eines Hersteller-Namens.
function _stripMakerSuffix(s) {
  return String(s || '')
    .replace(/\s+(GmbH(\s*&\s*Co\.?\s*KG)?|AG|Inc\.?|Incorporated|Ltd\.?|Limited|Co\.?|Corp\.?|Corporation|S\.?p\.?A\.?|S\.?A\.?|S\.?L\.?|S\.?r\.?l\.?|N\.?V\.?|B\.?V\.?|LLC|LLP|KG|OHG|UG|e\.?V\.?)\b\.?/gi, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

// Normalisiert einen Hersteller-Namen für Vergleichszwecke:
// "Ziehl-Abegg" / "ZiehlAbegg" / "Ziehl Abegg GmbH" → alle "ziehlabegg".
function normalizeMaker(s) {
  return _stripMakerSuffix(s).toLowerCase().replace(/[\s\-_.,&/]+/g, '');
}

// Sammelt alle bisher in der Inventory genutzten Hersteller (über alle Firmen) als Strings.
function getAllKnownMakers() {
  const all = new Set();
  for (const c of (state.companies || [])) {
    for (const it of (c.inventory || [])) {
      if (it.maker) all.add(it.maker);
    }
  }
  return [...all];
}

// Sucht im bestehenden Bestand einen Hersteller, dessen Normalisierung mit dem Input übereinstimmt.
// Liefert die kanonische Schreibweise (= das was bereits in der DB steht) oder null wenn nichts gefunden.
function findCanonicalMaker(input) {
  const norm = normalizeMaker(input);
  if (!norm) return null;
  for (const m of getAllKnownMakers()) {
    if (normalizeMaker(m) === norm) return m;
  }
  return null;
}

// Eindeutige Liste bekannter Hersteller — Doppelte (mit unterschiedlicher Schreibung) werden zusammengefasst.
// Erste gefundene Schreibung gewinnt als Anzeige-Form.
function getDedupedMakerList() {
  const map = new Map();
  for (const m of getAllKnownMakers()) {
    const k = normalizeMaker(m);
    if (!k) continue;
    if (!map.has(k)) map.set(k, m);
  }
  return [...map.values()].sort((a, b) => a.localeCompare(b, 'de'));
}

// Maker normalisieren + kanonisieren beim Speichern eines Items.
// - Suffixe weg
// - Match gegen bestehende → bestehende Schreibweise nutzen
// - Sonst capitalizeFirst
function normalizeMakerForSave(input) {
  const raw = String(input || '').trim();
  if (!raw) return '';
  const stripped = _stripMakerSuffix(raw);
  const canonical = findCanonicalMaker(stripped);
  if (canonical) return canonical;
  return capitalizeFirst(stripped);
}

// Title-Normalisierung — etwas lockerer als beim Maker, da Titel mehr Variationen erlauben.
// Lower-case + Whitespace/Bindestriche/Interpunktion zusammenziehen.
function normalizeTitle(s) {
  return String(s || '').toLowerCase().replace(/[\s\-_.,/&]+/g, '').trim();
}

// Liefert die komplette deduplizierte Title-Liste, optional gefiltert auf einen Hersteller.
// Erste gefundene Schreibweise gewinnt als kanonische Form.
function getDedupedProductTitles(maker) {
  const targetNorm = maker ? normalizeMaker(maker) : null;
  const map = new Map();
  for (const c of (state.companies || [])) {
    for (const it of (c.inventory || [])) {
      if (targetNorm && normalizeMaker(it.maker) !== targetNorm) continue;
      const title = (it.title || '').trim();
      if (!title) continue;
      const k = normalizeTitle(title);
      if (!k) continue;
      if (!map.has(k)) map.set(k, title);
    }
  }
  return [...map.values()].sort((a, b) => a.localeCompare(b, 'de'));
}

// Top-N häufigste Titel für einen gegebenen Hersteller. Gut für Chip-Vorschläge.
function getTopProductTitles(maker, limit = 8) {
  const targetNorm = maker ? normalizeMaker(maker) : null;
  const counts = {};
  const canon = {};
  for (const c of (state.companies || [])) {
    for (const it of (c.inventory || [])) {
      if (targetNorm && normalizeMaker(it.maker) !== targetNorm) continue;
      const title = (it.title || '').trim();
      if (!title) continue;
      const k = normalizeTitle(title);
      if (!k) continue;
      if (!canon[k]) canon[k] = title;
      const c2 = canon[k];
      counts[c2] = (counts[c2] || 0) + 1;
    }
  }
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit)
    .map(([t]) => t);
}

// Sucht eine kanonische Schreibweise eines Titels. Erst innerhalb des Herstellers,
// dann global wenn nichts gefunden.
function findCanonicalTitle(input, maker) {
  const norm = normalizeTitle(input);
  if (!norm) return null;
  const scoped = getDedupedProductTitles(maker);
  for (const t of scoped) if (normalizeTitle(t) === norm) return t;
  if (maker) {
    const all = getDedupedProductTitles('');
    for (const t of all) if (normalizeTitle(t) === norm) return t;
  }
  return null;
}

// ===== Stammdaten-Cleanup =====
// Findet Hersteller-Doubletten in der Inventory: gleiche Normalisierung, mehrere Schreibweisen.
// Liefert Array von { norm, canonical, variants: [{name, count}] }, sortiert nach Größe.
function findMakerDuplicates() {
  const groups = {};
  for (const c of (state.companies || [])) {
    for (const it of (c.inventory || [])) {
      if (!it.maker) continue;
      const norm = normalizeMaker(it.maker);
      if (!norm) continue;
      groups[norm] = groups[norm] || {};
      groups[norm][it.maker] = (groups[norm][it.maker] || 0) + 1;
    }
  }
  const dupes = [];
  for (const [norm, variants] of Object.entries(groups)) {
    const names = Object.keys(variants);
    if (names.length < 2) continue;
    // Kanonisch = die meist-genutzte Schreibweise
    const sorted = names.sort((a, b) => variants[b] - variants[a] || a.localeCompare(b));
    dupes.push({
      norm,
      canonical: sorted[0],
      variants: sorted.map(n => ({ name: n, count: variants[n] })),
      totalAffected: sorted.slice(1).reduce((s, n) => s + variants[n], 0),
    });
  }
  return dupes.sort((a, b) => b.totalAffected - a.totalAffected);
}

// Findet Modell-/Title-Doubletten innerhalb desselben (normalisierten) Herstellers.
function findModelDuplicates() {
  const groups = {};
  for (const c of (state.companies || [])) {
    for (const it of (c.inventory || [])) {
      if (!it.title) continue;
      const tNorm = normalizeTitle(it.title);
      if (!tNorm) continue;
      const mNorm = normalizeMaker(it.maker || '');
      const key = mNorm + '||' + tNorm;
      if (!groups[key]) groups[key] = { mNorm, tNorm, makerSample: it.maker || '', titles: {} };
      groups[key].titles[it.title] = (groups[key].titles[it.title] || 0) + 1;
    }
  }
  const dupes = [];
  for (const [key, info] of Object.entries(groups)) {
    const names = Object.keys(info.titles);
    if (names.length < 2) continue;
    const sorted = names.sort((a, b) => info.titles[b] - info.titles[a] || a.localeCompare(b));
    dupes.push({
      mNorm: info.mNorm,
      tNorm: info.tNorm,
      maker: info.makerSample,
      canonical: sorted[0],
      variants: sorted.map(n => ({ name: n, count: info.titles[n] })),
      totalAffected: sorted.slice(1).reduce((s, n) => s + info.titles[n], 0),
    });
  }
  return dupes.sort((a, b) => b.totalAffected - a.totalAffected);
}

// Merge: alle Items mit Hersteller-Variante außer canonical → canonical.
async function mergeMakerDuplicates(norm, canonical) {
  const targets = [];
  for (const c of (state.companies || [])) {
    for (const it of (c.inventory || [])) {
      if (normalizeMaker(it.maker) === norm && it.maker !== canonical) {

  if (targets.length === 0) { showToast('Nichts zu vereinigen', 'info', 2000); return; }
  setLoading(true, `${targets.length} Artikel werden auf „${canonical}" umgetaggt …`);
  let ok = 0, fail = 0;
  try {
    for (let i = 0; i < targets.length; i++) {
      setLoading(true, `Aktualisiere ${i + 1} / ${targets.length} …`);

      const oldMaker = it.maker;

    setLoading(false);
    render();

}

// Merge: alle Items mit Title-Variante (im selben Hersteller-Scope) außer canonical → canonical.

// Title-Save-Helper: kanonische Schreibung verwenden falls existent.
function normalizeTitleForSave(input, maker) {
  const raw = String(input || '').trim();
  if (!raw) return '';
  const canonical = findCanonicalTitle(raw, maker);
  return canonical || capitalizeFirst(raw);
}

// Tolerante Such-Funktion für Item-Listen.
// Handhabt:
//  - Leerzeichen in Query oder Haystack ("V3F 20" findet "V3F20")
//  - Bindestriche, Unterstriche, Punkte, Slashes
//  - Groß/Klein
//  - Multi-Token-Queries: "Otis 3BF" matcht wenn alle Tokens (normalisiert) im Haystack vorkommen
//  - Auch normale Phrasen mit Leerzeichen ("im lager") werden weiter unterstützt
function _normalizeSearchString(s) {
  return String(s || '').toLowerCase().replace(/[\s\-_.,/&]+/g, '');
}
function searchMatch(query, haystack) {
  const q = String(query || '').trim();
  if (!q) return true;
  const hayLow = String(haystack || '').toLowerCase();
  const hayNorm = _normalizeSearchString(hayLow);
  // Tokens splitten — jedes muss matchen
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  for (const t of tokens) {
    const tNorm = _normalizeSearchString(t);
    if (!tNorm) continue;
    // Match: normalisierte Form (toleriert Schreibweise) ODER 1:1 (für Phrasen)
    if (hayNorm.includes(tNorm) || hayLow.includes(t)) continue;
    return false;
  }
  return true;
}

// KI-Vision: liest Bezeichnung, Hersteller und Typenschild-Inhalte aus den Step-2-Fotos.
// Output für "description" ist eine LISTE (jede Zeile = ein Wert vom Etikett), kein Fließtext.
// QR-/Tracker-Fotos werden vorab ausgefiltert — die sind für Step 4 zuständig.
async function extractDescriptionFromPhotos() {

    // Wenn alle Fotos einen QR enthalten: trotzdem alle nehmen (besser als nichts), sonst nur nicht-QR
    const useFiles = (nonQR.length > 0 ? nonQR : files).slice(0, 3); // max 3 Fotos pro Anfrage

    setLoading(true, 'KI liest Datenblätter & Etiketten …');
    const images = [];
    for (const f of useFiles) {
      const base64 = await fileToBase64(f);
      images.push({ base64, mediaType: f.type || 'image/jpeg' });
    }
    const sys = 'Du extrahierst Daten aus Fotos von Aufzugs-Ersatzteilen für ein Lagerverwaltungs-System. Antworte AUSSCHLIESSLICH als JSON-Objekt, ohne Markdown-Codeblock und ohne erklärenden Text.';
    const prompt = `Du bekommst ${useFiles.length} Foto${useFiles.length === 1 ? '' : 's'} eines Aufzugs-Ersatzteils. Es geht um Typenschilder, Datenblätter und Beschriftungen am Bauteil.

Extrahiere folgende Felder:

WICHTIG — was du IGNORIEREN sollst (nicht in description aufnehmen):

- FLP-Klebeetiketten, Lift-Parts-Repair-Sticker, Marketing-Domains wie "aufzug-umrichter.de"
- Hotline-/Service-Nummern, Hinweise wie "Kostenlose Hotline"
- Wiederholungen aus dem Artikel-"name" oder "maker" — wenn der Modellname z.B. "V3F20" schon im name-Feld steht, nicht nochmal in description als "Modell: V3F20" wiederholen. Hersteller ebenso nicht doppeln.
- Hieroglyphen, kryptische Codes ohne erkennbare Bedeutung, Barcodes, Logos ohne Textinhalt
- Eigene Beschreibungen, Funktions-Erklärungen, Marketing-Sprache — nur das was als technischer Wert auf dem Bauteil/Etikett steht
- Leere Tabellenzeilen, "---", "N/A" oder ähnliche Platzhalter

Output-Anforderungen:
- Maximal ~12 Zeilen — qualitativ, nicht quantitativ
- Jede Zeile MUSS einen ":" enthalten ("Label: Wert"). Keine Bullet-Points, keine "-", keine Aufzählungszeichen
- Nicht raten — wenn ein Wert unleserlich ist, weglassen

Antwortformat exakt: {"name":"...","maker":"...","description":"..."}`;
    const txt = await askAI(prompt, { system: sys, images, maxTokens: 800 });
    const parsed = parseAIJson(txt);
    let changed = 0;
    // Maker zuerst dedupen (Title-Dedup nutzt den Maker als Scope)
    if (parsed?.maker) {
      state.voiceFields.maker = normalizeMakerForSave(parsed.maker);
      changed++;
    }
    if (parsed?.name) {
      // Title gegen bekannte Modelle dieses Herstellers dedupen
      state.voiceFields.name = normalizeTitleForSave(parsed.name, state.voiceFields.maker);
      changed++;
    }
    if (parsed?.description) {
      // Cleanup: jede Zeile muss "Label: Wert" sein. Bullet-Prefixe weg, leere/inhaltslose Zeilen raus,
      // Wiederholungen vom Modellnamen oder Hersteller filtern.
      const nm = (state.voiceFields.name || '').toLowerCase();
      const mk = (state.voiceFields.maker || '').toLowerCase();
      const cleaned = String(parsed.description).split('\n')
        .map(l => l.replace(/^[\s•·\-—*]+/, '').trim())
        .filter(l => {
          if (!l || l.length < 3) return false;
          if (!l.includes(':')) return false;          // muss "Label: Wert" sein
          const [lbl, ...rest] = l.split(':');
          const val = rest.join(':').trim();
          if (!val || /^(n\/?a|---|—|n\.?n\.?)$/i.test(val)) return false; // leere Werte raus
          // Hersteller- und Modell-Wiederholungen rausfiltern
          const lblLow = lbl.trim().toLowerCase();
          if (mk && /^(hersteller|manufacturer|maker|brand|marke)$/i.test(lblLow) && val.toLowerCase() === mk) return false;
          if (nm) {
            if (/^(modell|model|typ|type|bezeichnung|name)$/i.test(lblLow) && nm.includes(val.toLowerCase())) return false;
          }
          return true;
        })
        .join('\n');
      state.voiceTranscript = cleaned;
      if (cleaned) changed++;
    }
    if (changed > 0) {
      const skipped = files.length - useFiles.length;
      showToast(`Erkannt: ${changed} Felder${skipped > 0 ? ` · ${skipped} QR-Foto${skipped === 1 ? '' : 's'} übersprungen` : ''}`, 'success', 2800);
    } else {
      showToast('Keine Daten erkannt — manuell ausfüllen', 'info', 3000);
    }
  } catch (e) {
    showToast('KI-Auslese fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Snap: aktuellen Video-Frame greifen, an Vision schicken, Tracker-Nummer/URL extrahieren
async function snapTrackerFromCamera() {
  if (state.wizSnapRunning) return;
  state.wizSnapRunning = true;
  render();
  try {
    if (!Camera.stream) throw new Error('Kamera nicht aktiv');
    const file = await Camera.capture();
    const { tracker, trackerUrl } = await scanLabelFromFile(file);
    let changed = 0;
    if (tracker) { state.voiceFields.tracker = tracker; changed++; }
    if (trackerUrl) { state.voiceFields.trackerUrl = trackerUrl; changed++; }
    if (changed > 0) {
      try { navigator.vibrate?.(80); } catch (_) {}
      const parts = [];
      if (tracker) parts.push('#' + tracker);
      if (trackerUrl) parts.push('QR-Link');
      showToast('Erkannt: ' + parts.join(' · '), 'success', 2400);
      state.wizSnapRunning = false;
      // Zurück zum Tracker-Step
      stopLiveTrackerScan();
      go('wizardTracker');
      return;
    } else {
      showToast('Nichts erkannt — näher rangehen, gerade halten und nochmal versuchen', 'info', 3500);
    }
  } catch (e) {
    showToast('Snap fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    state.wizSnapRunning = false;
    render();
  }
}

          <div class="install-banner__sub">Damit du uns mit einem Tap erreichst</div>
        </div>
        <button data-action="show-install-help" class="install-banner__btn">${svg('arrow-right', 14, 2.4)}</button>
        <button data-action="dismiss-install" class="install-banner__close" title="Hinweis ausblenden">${svg('x', 12, 2.5)}</button>
      </div>
    ` : ''}

    <!-- LAGER-KARUSSELL: prominent, scrollbar, animiert zum Wechseln -->
    ${coCount > 1 ? `
      <div class="lager-section">
        <div class="lager-section__head">
          <div>
            <div class="lager-section__label">${svg('boxes', 12, 2.5)} Du bist gerade hier</div>
            <div class="lager-section__title">${activeCo?.name || '—'}</div>
          </div>
          <span class="lager-section__count">${coCount} Lager</span>
        </div>
        <div class="lager-carousel">
          ${companies.map(c => {
            const active = c.id === state.activeCompanyId;
            const itemCount = (c.inventory || []).length;
            return `
              <button data-action="select-company" data-id="${c.id}" class="lager-tile ${active ? 'lager-tile--active' : ''}" style="${active ? `border-color:${c.color};box-shadow:0 4px 18px ${c.color}33` : ''}">
                <div class="lager-tile__icon" style="background:${c.color}">${svg('boxes', 22, 2.2)}</div>
                <div class="lager-tile__name">${c.name}</div>
                <div class="lager-tile__meta">${itemCount} Artikel</div>
                ${active ? `<div class="lager-tile__active-pill" style="background:${c.color}">${svg('check', 9, 3.5)} aktiv</div>` : ''}
              </button>
            `;
          }).join('')}
        </div>
      </div>
    ` : `
      <div class="lager-section lager-section--single">
        <div class="lager-section__label">${svg('boxes', 12, 2.5)} Lager</div>
        <div class="lager-section__title">${activeCo?.name || '—'}</div>
        <div class="lager-section__meta">${(activeCo?.inventory || []).length} Artikel verfügbar</div>
      </div>
    `}

    <!-- FOTO-CTA HERO -->
    <button class="photo-cta" data-action="go-photo-search">
      <div class="photo-cta__inner">
        <div class="photo-cta__camera">
          <div class="photo-cta__ring"></div>
          <div class="photo-cta__camera-icon">${svg('camera', 36, 2.2)}</div>
        </div>
        <div class="photo-cta__text">
          <h2 class="photo-cta__title">Foto vom Typenschild</h2>
          <p class="photo-cta__sub">Tipp drauf und wir scannen es für dich.</p>
        </div>
        <div class="photo-cta__arrow">${svg('arrow-right', 22, 2.5)}</div>
      </div>
      <div class="photo-cta__hint">
        ${svg('sparkles', 11, 2.5)} <span>KI erkennt Hersteller &amp; Modell automatisch</span>
      </div>
    </button>

    <!-- TEXT-SUCHE als Alternative -->
    <div style="margin-top:14px">
      <div class="search-input" style="position:relative">
        <span class="search-input__icon">${svg('search', 15, 2.5)}</span>
        <input type="text" placeholder="Oder Modellname tippen ..." data-action="customer-search-input" value="${(state.customerSearch || '').replace(/"/g, '&quot;')}" autocomplete="off" inputmode="search">
      </div>
      ${(() => {
        const q = (state.customerSearch || '').trim();
        if (q.length < 2) return '';
        const matches = (inventory || []).filter(it => {
          if (it.sold) return false;
          const hay = `${it.title} ${it.maker} ${it.id} ${it.cat || ''}`;
          return searchMatch(q, hay);
        }).slice(0, 8);
        if (matches.length === 0) return `<div style="margin-top:10px;padding:14px;background:var(--c-bg-soft);border-radius:var(--r-md);text-align:center;font-size:12px;color:var(--c-ink-mute)">Hier nicht gefunden — vielleicht in einem anderen Lager?${coCount > 1 ? ' <button data-action="open-company-switcher" style="color:var(--c-blue);font-weight:600">Lager wechseln</button>' : ''}</div>`;
        return `<div class="item-list" style="margin-top:12px">${matches.map(it => itemCard(it)).join('')}</div>`;
      })()}
    </div>

    <!-- STÖBERN -->
    ${browseSample.length > 0 ? `
      <div style="margin-top:28px">
        <div class="section-head" style="margin-bottom:10px">
          <h2 class="section-head__title">${svg('eye', 13, 2.5)} Stöbern</h2>
          <span style="font-size:11px;color:var(--c-ink-mute);font-weight:500">Beispiele aus ${activeCo?.name || 'dem Lager'}</span>
        </div>
        <div class="browse-grid">
          ${browseSample.map(it => `
            <button data-action="select-item" data-id="${it.id}" class="browse-card">
              <div class="browse-card__photo" style="${it.photoUrl ? `background-image:url('${photoSrc(it, 'large')}')` : ''}">
                ${!it.photoUrl ? `<div style="color:rgba(255,255,255,.6);display:flex">${svg('package', 28, 2)}</div>` : ''}
              </div>
              <div class="browse-card__body">
                <div class="browse-card__title">${it.title}</div>
                <div class="browse-card__sub">${it.maker || it.cat || '—'}</div>
              </div>
            </button>
          `).join('')}
        </div>
      </div>
    ` : ''}

    <!-- HILFE -->
    <div style="margin-top:24px;padding:18px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--c-blue-soft);color:var(--c-blue);display:flex;align-items:center;justify-content:center">${svg('message-circle', 16, 2.4)}</div>
        <div>
          <div style="font-size:13.5px;font-weight:600">Nichts passendes gefunden?</div>
          <div style="font-size:11.5px;color:var(--c-ink-mute);margin-top:2px">Schreib uns direkt — wir melden uns schnell zurück.</div>
        </div>
      </div>
      <a href="mailto:service@flp-shop.com?subject=Anfrage%20FLP%20Stockmanager" style="display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:10px 14px;background:var(--c-blue);color:#fff;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;text-decoration:none">${svg('message-circle', 13, 2.4)} service@flp-shop.com</a>
    </div>
  </div>

  ${state.installHelpOpen ? renderInstallHelpSheet() : ''}
</div>`;
}

  return `
    <div class="sheet-backdrop" data-action="close-install-help"></div>
    <div class="action-sheet" style="max-height:88vh;display:flex;flex-direction:column">
      <div class="action-sheet__handle"></div>
      <div class="action-sheet__title">App auf den Startbildschirm</div>
      <div class="js-scroll" style="padding:12px 18px 18px;overflow-y:auto;flex:1;min-height:0">
        ${os === 'ios' ? `
          <p style="font-size:13px;color:var(--c-ink-soft);line-height:1.5;margin:0 0 16px">Auf dem iPhone bzw. iPad geht das in 3 Schritten:</p>
          <div class="install-help-step">
            <div class="install-help-step__num">1</div>
            <div>
              <div class="install-help-step__title">Teilen-Symbol antippen</div>
              <div class="install-help-step__sub">Das Quadrat mit dem Pfeil nach oben ${svg('share', 12, 2.4)} — unten in der Safari-Leiste (iPhone) oder oben rechts (iPad).</div>
            </div>
          </div>
          <div class="install-help-step">
            <div class="install-help-step__num">2</div>
            <div>
              <div class="install-help-step__title">„Zum Home-Bildschirm" wählen</div>
              <div class="install-help-step__sub">Wische in der erscheinenden Liste etwas nach unten — der Eintrag erscheint mit einem Plus-Symbol ⊕.</div>
            </div>
          </div>
          <div class="install-help-step">
            <div class="install-help-step__num">3</div>
            <div>
              <div class="install-help-step__title">„Hinzufügen" bestätigen</div>
              <div class="install-help-step__sub">Oben rechts — FLP Stockmanager landet jetzt mit dem FLP-Icon auf deinem Startbildschirm.</div>
            </div>
          </div>
          <div style="margin-top:14px;padding:12px 14px;background:var(--c-amber-soft);border-radius:var(--r-md);font-size:11.5px;color:#7C4A06;line-height:1.5">
            ${svg('alert-triangle', 12, 2.4)} <strong>Wichtig:</strong> Funktioniert nur in <strong>Safari</strong> — nicht in Chrome auf iOS.
          </div>
        ` : os === 'android' ? `
          <p style="font-size:13px;color:var(--c-ink-soft);line-height:1.5;margin:0 0 16px">In Chrome auf Android geht das so:</p>
          <div class="install-help-step">
            <div class="install-help-step__num">1</div>
            <div>
              <div class="install-help-step__title">Menü öffnen</div>
              <div class="install-help-step__sub">Oben rechts in Chrome auf die drei Punkte ⋮ tippen.</div>
            </div>
          </div>
          <div class="install-help-step">
            <div class="install-help-step__num">2</div>
            <div>
              <div class="install-help-step__title">„Zum Startbildschirm hinzufügen"</div>
              <div class="install-help-step__sub">Bei manchen Geräten heißt es auch „App installieren".</div>
            </div>
          </div>
          <div class="install-help-step">
            <div class="install-help-step__num">3</div>
            <div>
              <div class="install-help-step__title">Bestätigen</div>
              <div class="install-help-step__sub">„Hinzufügen" antippen — FLP Stockmanager erscheint mit FLP-Icon auf deinem Startbildschirm.</div>
            </div>
          </div>
        ` : `
          <p style="font-size:13px;color:var(--c-ink-soft);line-height:1.5">Öffne die Seite am besten auf deinem Smartphone in <strong>Safari</strong> (iPhone) oder <strong>Chrome</strong> (Android). Dort findest du im jeweiligen Menü die Option „Zum Startbildschirm hinzufügen".</p>
          <p style="font-size:12px;color:var(--c-ink-mute);margin-top:12px">Direkter Link zum Teilen:<br><strong style="font-family:var(--f-mono);font-size:11.5px;word-break:break-all">${location.origin + location.pathname}</strong></p>
        `}
      </div>
      <div style="padding:0 16px 12px;flex-shrink:0">
        <button class="action-bar__btn action-bar__btn--primary" data-action="close-install-help" style="width:100%;padding:14px">${svg('check', 14, 2.5)} Verstanden</button>
      </div>
    </div>
  `;
}

function renderHome() {
  // Kunden bekommen einen komplett anderen Home-Screen — Foto-Suche dominant, kein Bestand-Browse
  if (isCustomer()) return renderCustomerHome();
  const q = (state.query || '').trim();
  const condF = state.homeFilterCond || 'all';
  const funcF = state.homeFilterFunc || 'all';
  const hasFilter = condF !== 'all' || funcF !== 'all';
  const isSearching = q.length > 0 || hasFilter;
  // Live-Suche: nur evaluieren wenn Eingabe / Filter aktiv
  let liveResults = [];
  if (isSearching) {
    liveResults = inventory.filter(it => {
      if (q) {
        const hay = `${it.title} ${it.maker} ${it.cat} ${it.description || ''} ${it.id} ${it.loc || ''} ${it.tracker || ''}`;
        if (!searchMatch(q, hay)) return false;
      }
      if (condF !== 'all' && it.cond !== condF) return false;
      if (funcF !== 'all' && it.func !== funcF) return false;
      return true;
    });
  }
  const totalLive = liveResults.length;
  const topLive = liveResults.slice(0, 5);
  return `
<div class="screen">
  <div class="header">
    <button class="brand" data-action="open-company-switcher" style="background:transparent;border:0;padding:0;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;transition:transform .1s" onmousedown="this.style.transform='scale(.98)'" onmouseup="this.style.transform=''" onmouseleave="this.style.transform=''" ontouchstart="this.style.transform='scale(.98)'" ontouchend="this.style.transform=''">
      <div class="brand__logo" style="background:${state.company?.color || 'var(--c-ink)'}">${svg('boxes', 18, 2.2)}</div>
      <div>
        <div class="brand__name">${state.company?.name || 'Lager'}</div>
        <div class="brand__sub" style="display:inline-flex;align-items:center;gap:4px">${state.companies.length} ${state.companies.length === 1 ? 'Firma' : 'Firmen'} \u00b7 Wechseln ${svg('chevron-down', 9, 2.5)}</div>
      </div>
    </button>
    <button class="logout-btn" data-action="logout" title="${(APP_KEYS.user?.name || 'User')} \u2014 Abmelden">${svg('log-out', 16, 2.4)}</button>
  </div>
  <div class="scroll">
    <!-- Blaue Such-Kachel — enthält das Suchfeld direkt -->
    <div class="hero hero--search">
      <div class="hero__head">
        <div class="pill pill--ghost">${svg('search', 11, 2.5)} Suche</div>
      </div>
      <h1 class="hero__title">Was suchst<br>du heute?</h1>
      <div class="hero__search">
        <span class="hero__search-icon">${svg('search', 16, 2.4)}</span>
        <input
          type="text"
          class="hero__search-input"
          placeholder="Modell, Hersteller, Tracker, Lagerort …"
          data-action="manual-search-input"
          value="${q.replace(/"/g, '&quot;')}"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false">
        ${q ? `<button class="hero__search-clear" data-action="search-clear" title="Suche leeren">${svg('x', 13, 2.6)}</button>` : ''}
      </div>
    </div>

    ${isSearching ? (() => {
      const condCfg = condF !== 'all' ? CONDITION[condF] : null;
      const funcCfg = funcF !== 'all' ? FUNCTION_STATUS[funcF] : null;
      const open = state.homeFilterOpen;
      return `
        <div class="home-filterbar">
          <button class="home-filterpill ${condF !== 'all' ? 'home-filterpill--active' : ''} ${open === 'cond' ? 'home-filterpill--open' : ''}" data-action="home-filter-toggle" data-which="cond">
            <span class="home-filterpill__label">Zustand</span>
            <span class="home-filterpill__val">${condCfg ? `${svg(condCfg.icon, 10, 2.5)} ${condCfg.label}` : 'Alle'}</span>
            ${svg(open === 'cond' ? 'chevron-up' : 'chevron-down', 11, 2.5)}
          </button>
          <button class="home-filterpill ${funcF !== 'all' ? 'home-filterpill--active' : ''} ${open === 'func' ? 'home-filterpill--open' : ''}" data-action="home-filter-toggle" data-which="func">
            <span class="home-filterpill__label">Funktion</span>
            <span class="home-filterpill__val">${funcCfg ? `${svg(funcCfg.icon, 10, 2.5)} ${funcCfg.short || funcCfg.label}` : 'Alle'}</span>
            ${svg(open === 'func' ? 'chevron-up' : 'chevron-down', 11, 2.5)}
          </button>
        </div>
        ${open === 'cond' ? `
          <div class="home-filtermenu">
            ${[['all','Alle']].concat(CONDITION_KEYS.map(k => [k, CONDITION[k].label])).map(([k, lbl]) => {
              const cfg = k === 'all' ? null : CONDITION[k];
              const active = condF === k;
              return `<button class="home-filtermenu__item ${active ? 'home-filtermenu__item--active' : ''}" data-action="home-filter-cond" data-cond="${k}">
                ${cfg ? `<span style="color:${cfg.fg};display:flex">${svg(cfg.icon, 14, 2.4)}</span>` : `<span style="width:14px;height:14px;display:inline-block"></span>`}
                <span style="flex:1">${lbl}</span>
                ${active ? svg('check', 14, 2.8) : ''}
              </button>`;
            }).join('')}
          </div>
        ` : ''}
        ${open === 'func' ? `
          <div class="home-filtermenu">
            ${[['all','Alle']].concat(FUNCTION_KEYS.map(k => [k, FUNCTION_STATUS[k].label])).map(([k, lbl]) => {
              const cfg = k === 'all' ? null : FUNCTION_STATUS[k];
              const active = funcF === k;
              return `<button class="home-filtermenu__item ${active ? 'home-filtermenu__item--active' : ''}" data-action="home-filter-func" data-func="${k}">
                ${cfg ? `<span style="color:${cfg.fg};display:flex">${svg(cfg.icon, 14, 2.4)}</span>` : `<span style="width:14px;height:14px;display:inline-block"></span>`}
                <span style="flex:1">${lbl}</span>
                ${active ? svg('check', 14, 2.8) : ''}
              </button>`;
            }).join('')}
          </div>
        ` : ''}
      `;
    })() : ''}

    ${isSearching ? `
      <!-- Live-Suchergebnisse -->
      <div class="home-results">
        <div class="home-results__head">
          <span class="home-results__count">${totalLive === 0 ? 'Keine Treffer' : totalLive === 1 ? '1 Treffer' : totalLive + ' Treffer'}</span>
          ${totalLive > topLive.length ? `<button class="home-results__more" data-action="go-results">Alle ${totalLive} anzeigen ${svg('arrow-right', 11, 2.4)}</button>` : ''}
        </div>
        ${topLive.length === 0 ? `
          <div class="tile" style="padding:18px;text-align:center;font-size:12.5px;font-weight:500;color:var(--c-ink-mute)">
            Keine Artikel zu „${q.replace(/</g, '&lt;')}". Versuche eine andere Schreibweise oder die Foto-Suche.
          </div>
        ` : `
          <div class="compact-list">
            ${topLive.map(it => `
              <button class="compact-item" data-action="select-item" data-id="${it.id}">
                <div class="compact-item__icon" style="${it.photoUrl ? 'background:#0F1830;overflow:hidden;padding:0' : ''}">
                  ${it.photoUrl ? `<img src="${photoSrc(it, 'small')}" alt="" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;${it.sold ? 'opacity:.5;filter:grayscale(.6)' : ''}">` : svg('package', 19, 2.2)}
                  <span class="item-card__dot" style="background:${FUNCTION_STATUS[it.func]?.dot || '#94A3B8'}"></span>
                  ${it.sold ? `<span class="sold-stamp" style="font-size:8.5px;padding:2px 6px;top:4px;right:4px">Verk.</span>` : ''}
                </div>
                <div class="compact-item__body">
                  <div class="compact-item__id" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">#${it.id}${trackerChip(it, { size: 'sm' })}${shopBadges(it, { size: 'sm' })}</div>
                  <div class="compact-item__name">${it.title}</div>
                  <div class="compact-item__meta">${it.maker || '—'} · ${CONDITION[it.cond]?.label || '—'}</div>
                </div>
              </button>
            `).join('')}
          </div>
        `}
      </div>
    ` : (isTabletMode() ? '' : `
      <!-- Foto-Suche-Hero (prominent, wenn nicht gerade getippt wird) — auf iPad ausgeblendet, weil Typenschild-Fotos ein Mobile-Workflow sind -->
      <button class="hero hero--ai" data-action="go-photo-search">
        <div class="hero__head">
          <div class="pill pill--blue-soft">${svg('sparkles', 11, 2.5)} KI · Foto-Suche</div>
          <div class="hero__icon-circle">${svg('camera', 16, 2.4)}</div>
        </div>
        <h1 class="hero__title">Foto vom<br>Typenschild</h1>
        <div class="hero__foot" style="gap:8px">
          <div class="pill pill--blue-soft" style="font-family:var(--f-mono)">${svg('scan-text', 11, 2.5)} OCR</div>
          <div class="pill pill--neutral" style="font-family:var(--f-mono)">${svg('eye', 11, 2.5)} Vision</div>
          <span style="margin-left:auto;display:flex">${svg('arrow-right', 14, 2.4)}</span>
        </div>
      </button>
    `)}

    ${!isSearching ? `<div class="action-grid">
      ${[
        ...(isTabletMode() ? [] : [{ icon: 'plus', title: 'Neuer Artikel', sub: 'Schritt-für-Schritt-Wizard', action: 'wizard-start' }]),
        { icon: 'boxes', title: 'Bestand', sub: `${inventory.length} Artikel`, action: 'go-bestand' },
        ...((() => {
          const n = (state.itemList || []).filter(id => (inventory || []).some(it => it.id === id)).length;
          return [{ icon: 'list-checks', title: 'Meine Liste', sub: n === 0 ? 'Leer · Artikel hinzufügen' : `${n} ${n === 1 ? 'Artikel' : 'Artikel'} gemerkt`, action: 'go-list' }];
        })()),
        ...(isAdmin() ? [{ icon: 'sparkles', title: 'Dashboard', sub: 'Verkäufe · Eingänge · Filter', action: 'go-dashboard' }] : []),
        ...(isAdmin() ? [{ icon: 'user', title: 'User verwalten', sub: 'Zugänge · WhatsApp-Einladung', action: 'go-users' }] : []),
        ...(isAdmin() ? [{ icon: 'sparkles', title: 'Integrationen', sub: APP_KEYS.inquiryProxyUrl ? 'Freshdesk-Proxy aktiv' : 'Freshdesk einrichten', action: 'go-integrations' }] : []),
        ...((() => {
          const pr = getPendingReturns();
          if (pr.length === 0) return [];
          return [{
            icon: 'rotate-ccw',
            title: 'Offene Rücksendungen',
            sub: `${pr.length} ${pr.length === 1 ? 'Artikel wartet' : 'Artikel warten'} auf Eingang`,
            action: 'go-pending-returns',
            orange: true,
          }];
        })()),
      ].map(a => `
        <button class="action-tile ${a.warn ? 'action-tile--warn' : ''}" data-action="${a.action}" ${a.orange ? 'style="background:linear-gradient(135deg,#FFEDD5 0%,#FED7AA 100%);border-color:#FB923C"' : ''}>
          <div class="action-tile__icon" ${a.orange ? 'style="background:#FB923C;color:#fff"' : ''}>${svg(a.icon, 17, 2.4)}</div>
          <div><h3 class="action-tile__title" ${a.orange ? 'style="color:#9A3412"' : ''}>${a.title}</h3><div class="action-tile__sub" ${a.orange ? 'style="color:#9A3412"' : ''}>${a.sub}</div></div>
        </button>`).join('')}
    </div>
    <div>
      <div class="section-head"><h2 class="section-head__title">Zuletzt bearbeitet</h2></div>
      <div class="compact-list">
        ${inventory.length === 0 ? `
          <div class="tile" style="padding:24px;text-align:center">
            <div style="font-size:13px;font-weight:600;color:var(--c-ink-soft)">Noch keine Artikel angelegt</div>
            <div style="font-size:11.5px;font-weight:500;color:var(--c-ink-mute);margin-top:4px">Tippe auf \u201eNeuer Artikel\u201c oder \u201eFoto-Suche\u201c</div>
          </div>` :
        [...inventory].sort((a,b) => Date.parse(b.updated || 0) - Date.parse(a.updated || 0)).slice(0, 3).map(it => `
          <button class="compact-item" data-action="select-item" data-id="${it.id}">
            <div class="compact-item__icon" style="${it.photoUrl ? 'background:#0F1830;overflow:hidden;padding:0' : ''}">
              ${it.photoUrl ? `<img src="${photoSrc(it, 'small')}" alt="" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;${it.sold ? 'opacity:.5;filter:grayscale(.6)' : ''}">` : svg('package', 19, 2.2)}
              <span class="item-card__dot" style="background:${FUNCTION_STATUS[it.func]?.dot || '#94A3B8'}"></span>
              ${it.sold ? `<span class="sold-stamp" style="font-size:8.5px;padding:2px 6px;top:4px;right:4px">Verk.</span>` : ''}
            </div>
            <div class="compact-item__body">
              <div class="compact-item__id" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">#${it.id}${trackerChip(it, { size: 'sm' })}${shopBadges(it, { size: 'sm' })}</div>
              <div class="compact-item__name">${it.title}</div>
              <div class="compact-item__meta">${CONDITION[it.cond]?.label || '\u2014'} \u00b7 ${FUNCTION_STATUS[it.func]?.short || '\u2014'}</div>
            </div>
            <div style="display:flex;align-items:center;gap:4px;color:var(--c-ink-mute);font-size:11px;font-weight:500;padding-right:4px">
              ${svg('map-pin', 11, 2.4)} <span style="font-family:var(--f-mono);font-size:10.5px;color:var(--c-ink-soft)">${(it.loc || '').split('\u00b7')[0] || '\u2014'}</span>
            </div>
          </button>`).join('')}
      </div>
    </div>` : ''}
  </div>
  <div class="bottom-bar">
    <button class="bottom-bar__btn bottom-bar__btn--active">${svg('search', 15, 2.4)} Suchen</button>
    ${isTabletMode() ? '' : `<button class="bottom-bar__btn" data-action="wizard-start">${svg('plus', 15, 2.4)} Neu</button>`}
    <button class="bottom-bar__btn" data-action="go-bestand">${svg('boxes', 15, 2.4)} Bestand</button>
  </div>
</div>`;
}
