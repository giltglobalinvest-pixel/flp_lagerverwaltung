function renderResults() {
  const filters = ['Alle', 'Funktioniert', 'Defekt/Schrott', 'Generalüberholt'];
  const q = (state.query || '').trim();
  let m = inventory.filter(it => {
    if (!q) return true;
    const hay = `${it.title} ${it.maker} ${it.cat} ${it.description || ''} ${it.id} ${it.loc || ''} ${it.tracker || ''}`;
    return searchMatch(q, hay);
  });
  if (state.filterIdx === 1) m = m.filter(it => it.func === 'ok' || it.func === 'untested');
  if (state.filterIdx === 2) m = m.filter(it => it.func === 'defective' || it.func === 'scrap');
  if (state.filterIdx === 3) m = m.filter(it => it.cond === 'refurb');

  return `
<div class="screen">
  ${headerBar(
    backBtn('go-home'),
    `<div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:18px;font-weight:600;letter-spacing:-.02em">${m.length}</span><span style="font-size:12.5px;font-weight:500;color:var(--c-ink-mute)">Treffer</span></div>`,
    `<button class="icon-btn icon-btn--blue" data-action="go-listen">${svg('mic', 15, 2.5)}</button>`
  )}
  <div style="padding:0 20px;display:flex;flex-direction:column;gap:12px">
    <div class="tile tile--blue qcard">
      <div class="qcard__head">
        <span style="font-size:10.5px;font-weight:600;color:rgba(255,255,255,0.75)">Verstanden als</span>
        ${state.editingQuery
          ? `<button class="qcard__edit" data-action="query-save" style="background:#fff;color:var(--c-blue-deep)">${svg('check', 11, 3)} Übernehmen</button>`
          : `<button class="qcard__edit" data-action="query-edit">${svg('pencil', 10, 2.5)} Korrigieren</button>`}
      </div>
      ${state.editingQuery
        ? `<textarea data-action="query-input" rows="2" style="width:100%;background:transparent;border:0;color:#fff;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;resize:none">${state.query}</textarea>`
        : `<p class="qcard__text">${state.query}</p>`}
    </div>
    <div class="chip-row">
      ${filters.map((f, i) => `<button class="chip ${state.filterIdx === i ? 'chip--active' : ''}" data-action="set-filter" data-idx="${i}">${f}</button>`).join('')}
    </div>
  </div>
  <div class="scroll" style="padding-top:12px;padding-bottom:24px">
    <div style="display:flex;flex-direction:column;gap:8px">
      ${m.length === 0
        ? `<div class="tile" style="padding:32px;text-align:center"><div style="font-size:14px;font-weight:500;color:var(--c-ink-mute)">Keine Treffer</div></div>`
        : m.map(it => itemCard(it)).join('')}
    </div>
  </div>
</div>`;
}

function renderBestand() {
  // Verkaufte Artikel werden standardmäßig ausgeblendet — Toggle "Auch verkaufte zeigen" bringt sie zurück.
  const showSold = !!state.bestandShowSold;
  const baseInventory = showSold ? inventory : inventory.filter(it => !it.sold);
  const soldHiddenCount = inventory.length - baseInventory.length;

  // Aggregate categories
  const catCounts = {};
  baseInventory.forEach(it => { catCounts[it.cat] = (catCounts[it.cat] || 0) + 1; });
  const categories = Object.keys(catCounts).sort();
  const totalHalls = new Set(baseInventory.map(it => parseLoc(it.loc).hall).filter(Boolean)).size;

  // Aggregate manufacturers — Schreibweisen-Varianten werden zusammengefasst (kanonische Form gewinnt)
  const makerCounts = {};
  const makerCanon = {}; // norm -> erste-Schreibweise (kanonisch)
  baseInventory.forEach(it => {
    if (!it.maker) return;
    const norm = normalizeMaker(it.maker);
    if (!norm) return;
    if (!makerCanon[norm]) makerCanon[norm] = it.maker;
    const canon = makerCanon[norm];
    makerCounts[canon] = (makerCounts[canon] || 0) + 1;
  });
  const makers = Object.keys(makerCounts).sort((a, b) => makerCounts[b] - makerCounts[a] || a.localeCompare(b));

  // Aggregate conditions
  const condCounts = {};
  baseInventory.forEach(it => { condCounts[it.cond] = (condCounts[it.cond] || 0) + 1; });

  // Aggregate function statuses
  const funcCounts = {};
  baseInventory.forEach(it => { funcCounts[it.func] = (funcCounts[it.func] || 0) + 1; });

  // Apply category filter
  let items = state.bestandFilter === 'all' ? [...baseInventory] : baseInventory.filter(it => it.cat === state.bestandFilter);

  // Apply manufacturer filter
  if (state.bestandMaker && state.bestandMaker !== 'all') {
    // Normalize-Vergleich: matched auch unterschiedliche Schreibweisen ("Ziehl-Abegg" / "ZiehlAbegg" / …)
    const targetNorm = normalizeMaker(state.bestandMaker);
    items = items.filter(it => normalizeMaker(it.maker) === targetNorm);
  }
  if (state.bestandModel && state.bestandModel !== 'all') {
    const targetNorm = normalizeTitle(state.bestandModel);
    items = items.filter(it => normalizeTitle(it.title) === targetNorm);
  }

  // Apply condition filter
  if (state.bestandCond && state.bestandCond !== 'all') {
    items = items.filter(it => it.cond === state.bestandCond);
  }

  // Apply function status filter
  if (state.bestandFunc && state.bestandFunc !== 'all') {
    items = items.filter(it => it.func === state.bestandFunc);
  }

  // Apply Besitzer-Filter — 'all' = alle, '__own' = nur eigene (kein Owner-String), sonst genau dieser Besitzer
  if (state.bestandOwner && state.bestandOwner !== 'all') {
    if (state.bestandOwner === '__own') {
      items = items.filter(it => !((it.owner || '').trim()));
    } else {
      items = items.filter(it => (it.owner || '').trim() === state.bestandOwner);
    }
  }

  // Apply search query — tolerant gegen Leerzeichen/Bindestriche/Schreibweisen
  const q = (state.bestandQuery || '').trim();
  if (q) {
    items = items.filter(it => {
      const hay = `${it.title} ${it.maker} ${it.id} ${it.description || ''} ${it.loc || ''} ${it.tracker || ''} ${it.cat || ''}`;
      return searchMatch(q, hay);
    });
  }

  // Apply sort
  if (state.bestandSort === 'az') {
    items.sort((a, b) => a.title.localeCompare(b.title));
  } else if (state.bestandSort === 'updated') {
    items.sort((a, b) => Date.parse(b.updated || 0) - Date.parse(a.updated || 0));
  }

  // Group by category when no filter, no maker, no cond, no func and no query active
  const grouped = state.bestandFilter === 'all' && (!state.bestandMaker || state.bestandMaker === 'all') && (!state.bestandCond || state.bestandCond === 'all') && (!state.bestandFunc || state.bestandFunc === 'all') && !q;
  const filterLabel = 'KATEGORIE';

  return `
<div class="screen">
  <div class="header">
    <button class="icon-btn" data-action="go-home">${svg('arrow-left', 17, 2.5)}</button>
    <button data-action="open-company-switcher" style="display:flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;background:var(--c-surface);border:1px solid var(--c-border);box-shadow:var(--elev-1);border-radius:var(--r-pill);cursor:pointer">
      <div style="width:24px;height:24px;border-radius:7px;background:${state.company?.color || 'var(--c-ink)'};color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">${svg('boxes', 11, 2.4)}</div>
      <span style="font-size:12px;font-weight:600;letter-spacing:-.005em;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${state.company?.name || ''}</span>
      ${svg('chevron-down', 11, 2.5)}
    </button>
    <button class="logout-btn" data-action="logout" title="Abmelden">${svg('log-out', 16, 2.4)}</button>
  </div>

  <div style="padding:0 20px 4px">
    <h1 style="font-size:30px;font-weight:600;line-height:1;letter-spacing:-.025em;margin:0">Bestand</h1>
    <p style="font-size:12.5px;font-weight:500;color:var(--c-ink-soft);margin:6px 0 0">${baseInventory.length} Artikel · ${categories.length} Kategorien · ${makers.length} Hersteller · ${totalHalls} ${totalHalls === 1 ? 'Halle' : 'Hallen'}${(soldHiddenCount > 0 && !showSold) ? ` <span style="color:var(--c-ink-mute)">· ${soldHiddenCount} verkauft ausgeblendet</span>` : ''}</p>
  </div>

  <div style="padding:14px 20px 0">
    <div class="search-input">
      <span class="search-input__icon">${svg('search', 15, 2.5)}</span>
      <input type="text" placeholder="Im Bestand suchen ..." data-action="bestand-query" value="${(state.bestandQuery || '').replace(/"/g, '&quot;')}" autocomplete="off">
      ${q ? `<button data-action="bestand-clear" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--c-surface-alt);display:flex;align-items:center;justify-content:center;color:var(--c-ink-mute)">${svg('x', 12, 2.5)}</button>` : ''}
    </div>
  </div>

  ${(() => {
    const activeCount =
      (state.bestandFilter !== 'all' ? 1 : 0) +
      (state.bestandMaker && state.bestandMaker !== 'all' ? 1 : 0) +
      (state.bestandModel && state.bestandModel !== 'all' ? 1 : 0) +
      (state.bestandCond && state.bestandCond !== 'all' ? 1 : 0) +
      (state.bestandFunc && state.bestandFunc !== 'all' ? 1 : 0) +
      (state.bestandOwner && state.bestandOwner !== 'all' ? 1 : 0);
    const expanded = state.bestandFiltersExpanded;
    return `
  <div style="padding:12px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px">
    <button data-action="toggle-bestand-filters" style="display:inline-flex;align-items:center;gap:7px;padding:7px 12px;background:${activeCount > 0 ? 'var(--c-blue)' : 'var(--c-surface)'};color:${activeCount > 0 ? '#fff' : 'var(--c-ink)'};border:1px solid ${activeCount > 0 ? 'var(--c-blue)' : 'var(--c-border)'};box-shadow:${activeCount > 0 ? 'var(--elev-blue)' : 'var(--elev-1)'};border-radius:var(--r-pill);font-size:12.5px;font-weight:600;transition:all .15s">
      ${svg('filter', 12, 2.5)}
      Filter${activeCount > 0 ? ` · ${activeCount}` : ''}
      ${svg(expanded ? 'chevron-up' : 'chevron-down', 12, 2.5)}
    </button>
    <div style="display:flex;align-items:center;gap:2px;padding:3px;background:var(--c-surface);border:1px solid var(--c-border);box-shadow:var(--elev-1);border-radius:var(--r-pill);flex-shrink:0">
      ${[['updated', 'Aktualität'], ['az', 'A – Z']].map(([id, label]) => `
        <button data-action="set-bestand-sort" data-sort="${id}" style="padding:5px 11px;font-size:11px;font-weight:600;border-radius:var(--r-pill);transition:all .15s;${state.bestandSort === id ? 'background:var(--c-ink);color:#fff' : 'color:var(--c-ink-mute)'}">${label}</button>
      `).join('')}
    </div>
  </div>

  ${expanded ? `
  <div style="padding:12px 20px 0">
    <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Kategorie</div>
    <div class="chip-row">
      <button class="chip ${state.bestandFilter === 'all' ? 'chip--active' : ''}" data-action="set-bestand-filter" data-cat="all">
        Alle <span class="chip__count">${baseInventory.length}</span>
      </button>
      ${categories.map(cat => `
        <button class="chip ${state.bestandFilter === cat ? 'chip--active' : ''}" data-action="set-bestand-filter" data-cat="${cat}">
          ${cat} <span class="chip__count">${catCounts[cat]}</span>
        </button>
      `).join('')}
    </div>
  </div>

  <div style="padding:10px 20px 0">
    <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Hersteller</div>
    <div class="chip-row">
      <button class="chip ${(state.bestandMaker || 'all') === 'all' ? 'chip--active' : ''}" data-action="set-bestand-maker" data-maker="all">
        Alle <span class="chip__count">${baseInventory.length}</span>
      </button>
      ${makers.map(m => `
        <button class="chip ${state.bestandMaker === m ? 'chip--active' : ''}" data-action="set-bestand-maker" data-maker="${m.replace(/"/g, '&quot;')}">
          ${m} <span class="chip__count">${makerCounts[m]}</span>
        </button>
      `).join('')}
    </div>
  </div>

  ${(() => {
    // Modell-Filter — Liste scoped auf gewählten Hersteller (sonst zu viele)
    const scopeMaker = (state.bestandMaker && state.bestandMaker !== 'all') ? state.bestandMaker : '';
    const modelOptions = getDedupedProductTitles(scopeMaker);
    if (modelOptions.length === 0) return '';
    // Counts gegen alle inventory-items berechnen (nicht gefiltert), aber per Schreibweisen-Dedup
    const modelCounts = {};
    baseInventory.forEach(it => {
      const k = normalizeTitle(it.title);
      if (!k) return;
      const m = modelOptions.find(t => normalizeTitle(t) === k);
      if (m) modelCounts[m] = (modelCounts[m] || 0) + 1;
    });
    const totalForScope = Object.values(modelCounts).reduce((s, n) => s + n, 0);
    return `
      <div style="padding:10px 20px 0">
        <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">
          Modell ${scopeMaker ? `· nur ${scopeMaker}` : ''}
        </div>
        <div class="chip-row">
          <button class="chip ${(state.bestandModel || 'all') === 'all' ? 'chip--active' : ''}" data-action="set-bestand-model" data-model="all">
            Alle <span class="chip__count">${totalForScope}</span>
          </button>
          ${modelOptions.map(t => `
            <button class="chip ${normalizeTitle(state.bestandModel) === normalizeTitle(t) ? 'chip--active' : ''}" data-action="set-bestand-model" data-model="${t.replace(/"/g, '&quot;')}">
              ${t} <span class="chip__count">${modelCounts[t] || 0}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  })()}

  <div style="padding:10px 20px 0">
    <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Zustand</div>
    <div class="chip-row">
      <button class="chip ${(state.bestandCond || 'all') === 'all' ? 'chip--active' : ''}" data-action="set-bestand-cond" data-cond="all">
        Alle <span class="chip__count">${baseInventory.length}</span>
      </button>
      ${CONDITION_KEYS.map(k => {
        const cfg = CONDITION[k];
        const active = state.bestandCond === k;
        const count = condCounts[k] || 0;
        return `<button class="chip ${active ? 'chip--active' : ''}" data-action="set-bestand-cond" data-cond="${k}">
          ${svg(cfg.icon, 11, 2.5)} ${cfg.label} <span class="chip__count">${count}</span>
        </button>`;
      }).join('')}
    </div>
  </div>

  <div style="padding:10px 20px 0">
    <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Funktion</div>
    <div class="chip-row">
      <button class="chip ${(state.bestandFunc || 'all') === 'all' ? 'chip--active' : ''}" data-action="set-bestand-func" data-func="all">
        Alle <span class="chip__count">${baseInventory.length}</span>
      </button>
      ${FUNCTION_KEYS.map(k => {
        const cfg = FUNCTION_STATUS[k];
        const active = state.bestandFunc === k;
        const count = funcCounts[k] || 0;
        if (count === 0) return '';
        return `<button class="chip ${active ? 'chip--active' : ''}" data-action="set-bestand-func" data-func="${k}">
          ${svg(cfg.icon, 11, 2.5)} ${cfg.short} <span class="chip__count">${count}</span>
        </button>`;
      }).join('')}
    </div>
  </div>

  ${(() => {
    // Besitzer-Filter — nur anzeigen wenn überhaupt Owner gesetzt sind ODER der Admin gerade welche pflegt
    const owners = state.owners || [];
    const itemsWithOwner = baseInventory.filter(it => (it.owner || '').trim());
    if (owners.length === 0 && itemsWithOwner.length === 0 && !isAdmin()) return '';
    const ownCount = baseInventory.length - itemsWithOwner.length;
    const ownerCounts = {};
    itemsWithOwner.forEach(it => { const k = (it.owner || '').trim(); if (k) ownerCounts[k] = (ownerCounts[k] || 0) + 1; });
    const isManaging = !!state.ownerManageMode;
    const sel = state.bestandOwner || 'all';
    return `
      <div style="padding:10px 20px 0">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px;margin-bottom:7px;gap:10px">
          <span style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em">${svg('user', 10, 2.5)} Besitzer</span>
          ${isAdmin() ? `<button data-action="owner-manage-toggle" style="font-size:11px;font-weight:600;color:${isManaging ? 'var(--c-blue)' : 'var(--c-ink-mute)'};display:inline-flex;align-items:center;gap:4px">
            ${isManaging ? svg('check', 10, 3) : svg('pencil', 10, 2.4)} ${isManaging ? 'Fertig' : 'Verwalten'}
          </button>` : ''}
        </div>
        <div class="chip-row">
          ${!isManaging ? `<button class="chip ${sel === 'all' ? 'chip--active' : ''}" data-action="set-bestand-owner" data-owner="all">Alle <span class="chip__count">${baseInventory.length}</span></button>` : ''}
          ${!isManaging ? `<button class="chip ${sel === '__own' ? 'chip--active' : ''}" data-action="set-bestand-owner" data-owner="__own">Eigener Bestand <span class="chip__count">${ownCount}</span></button>` : ''}
          ${(!isManaging && isAdmin()) ? renderOwnerAddRow() : ''}
          ${owners.map(o => {
            const ev = String(o).replace(/"/g, '&quot;');
            if (isManaging) {
              return `<button class="chip" data-action="owner-remove" data-val="${ev}" style="background:var(--c-red-soft);color:var(--c-red);border-color:rgba(229,72,77,0.2)">${o} ${svg('x', 11, 2.8)}</button>`;
            }
            const active = sel === o;
            const cnt = ownerCounts[o] || 0;
            return `<button class="chip ${active ? 'chip--active' : ''}" data-action="set-bestand-owner" data-owner="${ev}" style="${active ? 'background:#FB923C;color:#fff;border-color:#FB923C' : 'border-color:#FDBA74;color:#9A3412'}">${svg('user', 10, 2.4)} ${o} <span class="chip__count" style="${active ? 'background:rgba(255,255,255,.25);color:#fff' : ''}">${cnt}</span></button>`;
          }).join('')}
        </div>
      </div>
    `;
  })()}

  <div style="padding:12px 20px 0">
    <button data-action="toggle-bestand-show-sold" style="display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:${showSold ? 'var(--c-ink)' : 'var(--c-surface)'};color:${showSold ? '#fff' : 'var(--c-ink-soft)'};border:1px solid ${showSold ? 'var(--c-ink)' : 'var(--c-border)'};box-shadow:var(--elev-1);border-radius:var(--r-pill);font-size:11.5px;font-weight:600;transition:all .15s">
      ${svg(showSold ? 'check' : 'eye', 12, 2.5)}

</div>`;
}

function renderGroupedItems(items) {
  // Group by cat
  const groups = {};
  items.forEach(it => { (groups[it.cat] = groups[it.cat] || []).push(it); });
  return Object.entries(groups).map(([cat, list]) => `
    <div style="margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:8px;padding:0 4px;margin-bottom:10px">
        <h2 style="font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c-ink-mute);margin:0">${cat}</h2>
        <span style="flex:1;height:1px;background:var(--c-divider)"></span>
        <span style="font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--c-ink-mute)">${list.length}</span>
      </div>
      <div class="item-list">${list.map(it => itemCard(it)).join('')}</div>
    </div>
  `).join('');
}

/* ============================================================
   ADMIN-DASHBOARD
   Übersicht: Bestand, Verkäufe, Eingänge, Filter nach Kategorie/Hersteller.
   Nur für Admins.
   ============================================================ */
function renderDashboard() {
  if (!isAdmin()) {
    return `
<div class="screen">
  ${headerBar(backBtn('go-home'), `<div class="pill pill--ink">Dashboard</div>`, `<div class="header__slot"></div>`)}
  <div class="scroll" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:40px 24px">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--c-surface-alt);color:var(--c-ink-mute);display:flex;align-items:center;justify-content:center">${svg('alert-triangle', 28, 2.2)}</div>
    <div style="text-align:center">
      <div style="font-size:14px;font-weight:600">Kein Zugriff</div>
      <div style="font-size:12px;font-weight:500;color:var(--c-ink-mute);margin-top:4px">Das Dashboard ist nur für Admins.</div>
    </div>
  </div>
</div>`;
  }

  const items = inventory || [];
  const range = state.dashRange || '30d';     // 'today' | '7d' | '30d' | 'all'
  const catFilter = state.dashCat || 'all';
  const makerFilter = state.dashMaker || 'all';

  // Zeit-Range bestimmen
  const now = Date.now();
  const ms = { today: 24*3600e3, '7d': 7*24*3600e3, '30d': 30*24*3600e3, all: Infinity }[range];
  const inRange = (iso) => {
    if (!iso) return false;
    if (ms === Infinity) return true;
    const t = Date.parse(iso); if (isNaN(t)) return false;
    return (now - t) <= ms;
  };

  // Filter-Pipeline (Kategorie / Hersteller)
  const matchesFilters = (it) => {
    if (catFilter !== 'all' && it.cat !== catFilter) return false;
    if (makerFilter !== 'all' && normalizeMaker(it.maker) !== normalizeMaker(makerFilter)) return false;
    return true;
  };
  const visible = items.filter(matchesFilters);

  // KPIs
  const totalCount = visible.length;
  const inShopCount = visible.filter(it => it.inShop && !it.sold).length;
  const soldAll = visible.filter(it => it.sold);
  const soldInRange = visible.filter(it => it.sold && inRange(it.soldAt));
  const addedInRange = visible.filter(it => inRange(it.created));
  // Service-Tausch: offene Rücksendungen (gefiltert nach Kat/Maker)
  const pendingReturnsAll = visible.filter(isPendingReturn);
  const inShopValue = visible.filter(it => it.inShop && !it.sold && it.vp != null).reduce((s, it) => s + it.vp, 0);
  const soldValueInRange = soldInRange.filter(it => it.vp != null).reduce((s, it) => s + it.vp, 0);
  const soldValueAll = soldAll.filter(it => it.vp != null).reduce((s, it) => s + it.vp, 0);

  // Kategorie-Verteilung (nur visible, nicht-verkauft, im Lager)
  const inStock = visible.filter(it => !it.sold);
  const catDist = {};
  inStock.forEach(it => { const k = it.cat || '—'; catDist[k] = (catDist[k] || 0) + 1; });
  const catRows = Object.entries(catDist).sort((a,b) => b[1] - a[1]);
  const catMax = Math.max(1, ...catRows.map(r => r[1]));

  // Hersteller-Verteilung im Bestand — entdupliziert nach Schreibweise
  const makerDist = {};
  const makerCanon = {};
  inStock.forEach(it => {
    if (!it.maker) return;
    const norm = normalizeMaker(it.maker);
    if (!norm) return;
    if (!makerCanon[norm]) makerCanon[norm] = it.maker;
    const c = makerCanon[norm];
    makerDist[c] = (makerDist[c] || 0) + 1;
  });
  const makerRows = Object.entries(makerDist).sort((a, b) => b[1] - a[1]);
  const makerMax = Math.max(1, ...makerRows.map(r => r[1]));

  // Modell-/Bezeichnungs-Verteilung — Schreibweisen-Varianten zusammenfassen (kanonische Form gewinnt)
  const modelDist = {};
  const modelCanon = {};
  inStock.forEach(it => {
    const t = (it.title || '').trim();
    if (!t) return;
    const k = normalizeTitle(t);
    if (!k) return;
    if (!modelCanon[k]) modelCanon[k] = t;
    const c = modelCanon[k];
    modelDist[c] = (modelDist[c] || 0) + 1;
  });
  const modelRows = Object.entries(modelDist).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const modelMax = Math.max(1, ...modelRows.map(r => r[1]));

  // Funktion-Status-Verteilung im Bestand
  const funcDist = {};
  inStock.forEach(it => { const k = it.func || 'unknown'; funcDist[k] = (funcDist[k] || 0) + 1; });
  const funcRows = FUNCTION_KEYS.map(k => [k, funcDist[k] || 0]).filter(([, n]) => n > 0);
  const funcMax = Math.max(1, ...funcRows.map(r => r[1]));

  // Verkäufe nach Hersteller (im Zeitraum) — Anzahl + Umsatz
  const salesByMaker = {};
  soldInRange.forEach(it => {
    if (!it.maker) return;
    const norm = normalizeMaker(it.maker);
    if (!norm) return;
    if (!makerCanon[norm]) makerCanon[norm] = it.maker;
    const c = makerCanon[norm];
    if (!salesByMaker[c]) salesByMaker[c] = { count: 0, value: 0 };
    salesByMaker[c].count++;
    if (it.vp != null) salesByMaker[c].value += it.vp;
  });
  const salesByMakerRows = Object.entries(salesByMaker).sort((a, b) => (b[1].value || 0) - (a[1].value || 0) || b[1].count - a[1].count);
  const salesMaxValue = Math.max(1, ...salesByMakerRows.map(r => r[1].value));

  // Aktivitätslisten — sortiert nach Datum desc
  const recentSold = visible.filter(it => it.sold).sort((a,b) => Date.parse(b.soldAt || 0) - Date.parse(a.soldAt || 0)).slice(0, 6);
  const recentAdded = [...visible].sort((a,b) => Date.parse(b.created || 0) - Date.parse(a.created || 0)).slice(0, 6);

  const allCats = state.categories || [];
  // Hersteller dedupen — gleiche Marken in unterschiedlicher Schreibweise zählen als eine
  const allMakers = (() => {
    const map = new Map();
    for (const it of items) {
      if (!it.maker) continue;
      const norm = normalizeMaker(it.maker);
      if (!norm || map.has(norm)) continue;
      map.set(norm, it.maker);
    }
    return [...map.values()].sort((a, b) => a.localeCompare(b, 'de'));
  })();

  const rangeLabel = { today: 'Heute', '7d': '7 Tage', '30d': '30 Tage', all: 'Alle Zeit' }[range];

  return `
<div class="screen">
  ${headerBar(backBtn('go-home'),
    `<div class="pill pill--ink">Dashboard</div>`,
    `<div class="header__slot"></div>`)}
  <div class="scroll" style="padding-bottom:24px">

    <!-- Zeitraum-Filter -->
    <div>
      <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Zeitraum</div>
      <div class="chip-row">
        ${[['today','Heute'],['7d','7 Tage'],['30d','30 Tage'],['all','Alle Zeit']].map(([k,l]) => `
          <button class="chip ${range === k ? 'chip--active' : ''}" data-action="dash-set-range" data-range="${k}">${l}</button>
        `).join('')}
      </div>
    </div>

    <!-- KPI-Kacheln -->
    <div class="dash-grid">
      <div class="dash-kpi">
        <div class="dash-kpi__label">${svg('boxes', 11, 2.4)} Bestand</div>
        <div class="dash-kpi__val">${totalCount - soldAll.length}</div>
        <div class="dash-kpi__sub">aktuell im Lager</div>
      </div>
      <div class="dash-kpi dash-kpi--blue">
        <div class="dash-kpi__label">${svg('arrow-down-left', 11, 2.4)} Eingang</div>
        <div class="dash-kpi__val">${addedInRange.length}</div>
        <div class="dash-kpi__sub">neu · ${rangeLabel}</div>
      </div>
      <div class="dash-kpi dash-kpi--red">
        <div class="dash-kpi__label">${svg('arrow-up-right', 11, 2.4)} Verkauft</div>
        <div class="dash-kpi__val">${soldInRange.length}</div>
        <div class="dash-kpi__sub">${rangeLabel} · ${formatVp(soldValueInRange) || '— €'}</div>
      </div>
      <div class="dash-kpi dash-kpi--green">
        <div class="dash-kpi__label">${svg('sparkles', 11, 2.4)} Im Shop</div>
        <div class="dash-kpi__val">${inShopCount}</div>
        <div class="dash-kpi__sub">Wert ${formatVp(inShopValue) || '— €'}</div>
      </div>
      ${pendingReturnsAll.length > 0 ? `
        <button class="dash-kpi dash-kpi--orange" data-action="dash-scroll-pending-returns" style="text-align:left;cursor:pointer;grid-column:span 2">
          <div class="dash-kpi__label">${svg('rotate-ccw', 11, 2.4)} Offene Rücksendungen</div>
          <div class="dash-kpi__val">${pendingReturnsAll.length}</div>
          <div class="dash-kpi__sub">Service-Tausch · warten auf Eingang</div>
        </button>
      ` : ''}
    </div>

    <!-- Filter Kategorie / Hersteller -->
    <div>
      <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Kategorie</div>
      <div class="chip-row">
        <button class="chip ${catFilter === 'all' ? 'chip--active' : ''}" data-action="dash-set-cat" data-cat="all">Alle <span class="chip__count">${items.length}</span></button>
        ${allCats.map(c => {
          const n = items.filter(it => it.cat === c).length;
          return `<button class="chip ${catFilter === c ? 'chip--active' : ''}" data-action="dash-set-cat" data-cat="${c.replace(/"/g,'&quot;')}">${c} <span class="chip__count">${n}</span></button>`;
        }).join('')}
      </div>
    </div>
    ${allMakers.length > 0 ? `
      <div>
        <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Hersteller</div>
        <div class="chip-row">
          <button class="chip ${makerFilter === 'all' ? 'chip--active' : ''}" data-action="dash-set-maker" data-maker="all">Alle</button>
          ${allMakers.map(m => {
            const n = items.filter(it => it.maker === m).length;
            return `<button class="chip ${makerFilter === m ? 'chip--active' : ''}" data-action="dash-set-maker" data-maker="${m.replace(/"/g,'&quot;')}">${m} <span class="chip__count">${n}</span></button>`;
          }).join('')}
        </div>
      </div>
    ` : ''}

    <!-- Service-Tausch: Offene Rücksendungen -->
    ${pendingReturnsAll.length > 0 ? `
      <div id="dashPendingReturnsAnchor">
        <div class="section-head">
          <h2 class="section-head__title">${svg('rotate-ccw', 13, 2.5)} Offene Rücksendungen</h2>
          <span class="pill" style="background:#FFEDD5;color:#9A3412;border:1px solid #FDBA74">${pendingReturnsAll.length} ${pendingReturnsAll.length === 1 ? 'Artikel' : 'Artikel'}</span>
        </div>
        <div class="hint-banner" style="background:#FFEDD5;color:#9A3412;border-color:#FDBA74;margin-bottom:8px;font-size:11.5px">
          ${svg('alert-triangle', 12, 2.4)} Diese Artikel wurden als Service-Tausch verkauft — die defekten Rücksendungen werden noch erwartet.
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${[...pendingReturnsAll].sort((a,b) => Date.parse(b.soldAt || 0) - Date.parse(a.soldAt || 0)).map(it => {
            const days = it.soldAt ? Math.floor((Date.now() - Date.parse(it.soldAt)) / 86400000) : null;
            const ageBadge = days != null ? `<span style="font-family:var(--f-mono);font-size:10px;font-weight:600;color:#9A3412;background:#FFEDD5;border:1px solid #FDBA74;padding:2px 7px;border-radius:var(--r-pill)">${days === 0 ? 'heute' : days === 1 ? '1 Tag' : days + ' Tage'}</span>` : '';
            return `
              <button class="item-card" data-action="select-item" data-id="${it.id}" style="border-color:#FDBA74;background:linear-gradient(135deg,#fff 0%,#FFEDD5 100%)">
                <div class="item-card__icon" style="${it.photoUrl ? 'background:#0F1830;overflow:hidden;padding:0' : ''}">
                  ${it.photoUrl ? `<img src="${photoSrc(it, 'small')}" alt="" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;opacity:.65;filter:grayscale(.4)">` : svg('package', 22, 2.2)}
                  <span class="item-card__dot" style="background:#FB923C"></span>
                </div>
                <div class="item-card__body">
                  <div class="item-card__row" style="gap:6px;flex-wrap:wrap">
                    <span class="code-chip">#${it.id}</span>
                    ${it.orderNumber ? `<span class="code-chip" style="background:#FFEDD5;color:#9A3412;border-color:#FDBA74" title="Auftragsnummer">${svg('hash', 9, 2.5)} ${it.orderNumber}</span>` : ''}
                    ${ageBadge}
                  </div>
                  <h3 class="item-card__name">${it.title}</h3>
                  <div class="item-card__sub">${it.maker || '—'} · ${it.cat || '—'}</div>
                  <div class="item-card__divider">
                    <span class="item-card__loc" style="color:#9A3412">${svg('rotate-ccw', 11, 2.4)} Verkauft am ${it.soldAt ? new Date(it.soldAt).toLocaleDateString('de-DE') : '—'} · Rücksendung erwartet</span>
                  </div>
                </div>
              </button>
            `;
          }).join('')}
        </div>
      </div>
    ` : ''}

    <!-- Stammdaten-Cleanup: nur sichtbar wenn Doubletten erkannt -->
    ${(() => {
      const makerDupes = findMakerDuplicates();
      const modelDupes = findModelDuplicates();
      const totalDupes = makerDupes.length + modelDupes.length;
      if (totalDupes === 0) return '';
      return `
        <div>
          <div class="section-head">
            <h2 class="section-head__title">${svg('sparkles', 13, 2.5)} Stammdaten bereinigen</h2>
            <span class="pill pill--amber">${totalDupes} ${totalDupes === 1 ? 'Verdacht' : 'Verdachtsfälle'}</span>
          </div>
          <div class="hint-banner" style="background:rgba(245,158,11,0.10);color:#7C4A06;margin-bottom:8px;font-size:11.5px">
            ${svg('alert-triangle', 12, 2.4)} Gleicher Eintrag in unterschiedlicher Schreibweise gefunden. Mit einem Klick zusammenführen — alle betroffenen Artikel werden aktualisiert.
          </div>
          <div class="tile" style="padding:0;overflow:hidden">
            ${makerDupes.length > 0 ? `
              <div style="padding:12px 14px;border-bottom:1px solid var(--c-divider)">
                <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:700;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Hersteller · ${makerDupes.length}</div>
                <div style="display:flex;flex-direction:column;gap:14px">
                  ${makerDupes.map(g => `
                    <div>
                      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px">
                        ${g.variants.map(v => `
                          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px">
                            <span style="${v.name === g.canonical ? 'font-weight:700;color:var(--c-blue-deep)' : 'color:var(--c-ink-soft)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v.name === g.canonical ? svg('badge-check', 10, 2.5) + ' ' : ''}${v.name}</span>
                            <span style="font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--c-ink-mute);flex-shrink:0">${v.count} ${v.count === 1 ? 'Art.' : 'Art.'}</span>
                          </div>
                        `).join('')}
                      </div>
                      <button data-action="cleanup-merge-maker" data-norm="${g.norm.replace(/"/g, '&quot;')}" data-canonical="${g.canonical.replace(/"/g, '&quot;')}" style="width:100%;padding:9px;background:var(--c-blue);color:#fff;border-radius:10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px">
                        ${svg('check', 11, 2.8)} Vereinigen unter „${g.canonical}" (${g.totalAffected} Artikel)
                      </button>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
            ${modelDupes.length > 0 ? `
              <div style="padding:12px 14px">
                <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:700;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Modelle · ${modelDupes.length}</div>
                <div style="display:flex;flex-direction:column;gap:14px">
                  ${modelDupes.map(g => `
                    <div>
                      <div style="font-size:10.5px;color:var(--c-ink-mute);margin-bottom:4px">${g.maker || '— ohne Hersteller —'}</div>
                      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px">
                        ${g.variants.map(v => `
                          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px">
                            <span style="${v.name === g.canonical ? 'font-weight:700;color:var(--c-blue-deep)' : 'color:var(--c-ink-soft)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v.name === g.canonical ? svg('badge-check', 10, 2.5) + ' ' : ''}${v.name}</span>
                            <span style="font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--c-ink-mute);flex-shrink:0">${v.count} ${v.count === 1 ? 'Art.' : 'Art.'}</span>
                          </div>
                        `).join('')}
                      </div>
                      <button data-action="cleanup-merge-model" data-mnorm="${g.mNorm.replace(/"/g, '&quot;')}" data-tnorm="${g.tNorm.replace(/"/g, '&quot;')}" data-canonical="${g.canonical.replace(/"/g, '&quot;')}" style="width:100%;padding:9px;background:var(--c-blue);color:#fff;border-radius:10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px">
                        ${svg('check', 11, 2.8)} Vereinigen unter „${g.canonical}" (${g.totalAffected} Artikel)
                      </button>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    })()}

    <!-- Kategorie-Verteilung im Lager -->
    <div>
      <div class="section-head">
        <h2 class="section-head__title">Bestand nach Kategorie</h2>
        <span class="pill pill--neutral" style="font-family:var(--f-mono)">${inStock.length}</span>
      </div>
      ${catRows.length === 0 ? `
        <div class="tile" style="padding:18px;text-align:center;font-size:12px;font-weight:500;color:var(--c-ink-mute)">Keine Daten im Filter</div>
      ` : `
        <div class="tile" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
          ${catRows.map(([cat, n]) => `
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;margin-bottom:4px">
                <span>${cat}</span>
                <span style="font-family:var(--f-mono);color:var(--c-ink-soft)">${n} · ${Math.round(n / inStock.length * 100)}%</span>
              </div>
              <div style="height:6px;background:var(--c-bg-soft);border-radius:3px;overflow:hidden"><div style="height:100%;width:${(n / catMax * 100).toFixed(1)}%;background:var(--c-blue);border-radius:3px;transition:width .3s"></div></div>
            </div>
          `).join('')}
        </div>
      `}
    </div>

    <!-- Bestand nach Hersteller — alle, mit Balken-Diagramm -->
    ${makerRows.length > 0 ? `
      <div>
        <div class="section-head">
          <h2 class="section-head__title">Bestand nach Hersteller</h2>
          <span class="pill pill--neutral" style="font-family:var(--f-mono)">${makerRows.length}</span>
        </div>
        <div class="tile" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
          ${makerRows.map(([m, n]) => `
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;margin-bottom:4px">
                <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;padding-right:8px">${m}</span>
                <span style="font-family:var(--f-mono);color:var(--c-ink-soft);flex-shrink:0">${n} · ${Math.round(n / inStock.length * 100)}%</span>
              </div>
              <div style="height:6px;background:var(--c-bg-soft);border-radius:3px;overflow:hidden"><div style="height:100%;width:${(n / makerMax * 100).toFixed(1)}%;background:var(--c-blue);border-radius:3px;transition:width .3s"></div></div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}

    <!-- Top Modelle / Bezeichnungen -->
    ${modelRows.length > 0 ? `
      <div>
        <div class="section-head">
          <h2 class="section-head__title">Top-Modelle</h2>
          <span class="pill pill--neutral" style="font-family:var(--f-mono)">Top ${modelRows.length}</span>
        </div>
        <div class="tile" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
          ${modelRows.map(([t, n], i) => `
            <div style="display:flex;align-items:center;gap:10px;${i > 0 ? 'padding-top:8px;border-top:1px solid var(--c-divider)' : ''}">
              <div style="width:22px;height:22px;border-radius:6px;background:#FFF1B0;color:#7A5400;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10.5px;font-weight:700;flex-shrink:0">${i+1}</div>
              <div style="flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</div>
              <div style="font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--c-ink)">${n}×</div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}

    <!-- Funktions-Status-Verteilung -->
    ${funcRows.length > 0 ? `
      <div>
        <div class="section-head">
          <h2 class="section-head__title">Funktions-Status</h2>
          <span class="pill pill--neutral" style="font-family:var(--f-mono)">${inStock.length} Stk im Lager</span>
        </div>
        <div class="tile" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
          ${funcRows.map(([k, n]) => {
            const cfg = FUNCTION_STATUS[k] || FUNCTION_STATUS.unknown;
            return `
              <div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                  <div style="width:22px;height:22px;border-radius:6px;background:${cfg.bg};color:${cfg.fg};display:flex;align-items:center;justify-content:center;flex-shrink:0">${svg(cfg.icon, 12, 2.4)}</div>
                  <span style="flex:1;min-width:0;font-size:12.5px;font-weight:600">${cfg.label}</span>
                  <span style="font-family:var(--f-mono);font-size:12.5px;color:var(--c-ink-soft);flex-shrink:0">${n} · ${Math.round(n / inStock.length * 100)}%</span>
                </div>
                <div style="height:5px;background:var(--c-bg-soft);border-radius:3px;overflow:hidden"><div style="height:100%;width:${(n / funcMax * 100).toFixed(1)}%;background:${cfg.fg};border-radius:3px;transition:width .3s"></div></div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    ` : ''}

    <!-- Verkäufe nach Hersteller im Zeitraum -->
    ${salesByMakerRows.length > 0 ? `
      <div>
        <div class="section-head">
          <h2 class="section-head__title">Verkäufe nach Hersteller</h2>
          <span class="pill pill--neutral" style="font-family:var(--f-mono)">${rangeLabel} · ${formatVp(soldValueInRange) || '— €'}</span>
        </div>
        <div class="tile" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
          ${salesByMakerRows.map(([m, info], i) => `
            <div style="${i > 0 ? 'padding-top:8px;border-top:1px solid var(--c-divider)' : ''}">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <span style="flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m}</span>
                <span style="font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--c-ink-soft);flex-shrink:0">${info.count}× · ${formatVp(info.value) || '— €'}</span>
              </div>
              <div style="height:6px;background:var(--c-bg-soft);border-radius:3px;overflow:hidden"><div style="height:100%;width:${(info.value / salesMaxValue * 100).toFixed(1)}%;background:#10B981;border-radius:3px;transition:width .3s"></div></div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}

    <!-- Verkäufe -->
    <div>
      <div class="section-head">
        <h2 class="section-head__title">Verkäufe gesamt</h2>
        <span class="pill pill--neutral" style="font-family:var(--f-mono)">${soldAll.length} · ${formatVp(soldValueAll) || '— €'}</span>
      </div>
      ${recentSold.length === 0 ? `
        <div class="tile" style="padding:18px;text-align:center;font-size:12px;font-weight:500;color:var(--c-ink-mute)">Noch nichts verkauft</div>
      ` : `
        <div class="compact-list">
          ${recentSold.map(it => `
            <button class="compact-item" data-action="select-item" data-id="${it.id}">

                <div class="compact-item__name">${it.title}</div>
                <div class="compact-item__meta">${it.cat || '—'} · ${it.maker || '—'}</div>

</div>`;
}

      <div class="field">
        <label class="field__label">Val.town API-Token (vtwn_pat_…)</label>

        <input class="field__input" data-action="integration-input" data-key="freshdeskDomain" value="${(d.freshdeskDomain || '').replace(/"/g, '&quot;')}" placeholder="flpliftparts" autocomplete="off">
        <div style="font-size:10.5px;color:var(--c-ink-mute);margin-top:5px">Nur die Subdomain — bei <code>flpliftparts.freshdesk.com</code> reicht <code>flpliftparts</code>.</div>

      <div class="field" style="margin-top:14px">
        <label class="field__label">Freshdesk API-Key</label>
        <input class="field__input" data-action="integration-input" data-key="freshdeskApiKey" value="${(d.freshdeskApiKey || '').replace(/"/g, '&quot;')}" placeholder="z.B. abc123XyZ" type="password" autocomplete="off">

      <div class="field" style="margin-top:14px">

      <div style="margin-top:18px;display:flex;flex-direction:column;gap:8px">

            <button data-action="valtown-update-code" class="action-bar__btn" ${state.integrationsBusy ? 'disabled' : ''}>${svg('rotate-ccw', 13, 2.5)} Code aktualisieren</button>
          </div>
        ` : ''}
      </div>
    </div>

    <!-- Log -->
    ${log.length > 0 ? `
      <div style="margin-top:18px;padding:14px 16px;background:#0F1830;color:#A0E4B4;border-radius:var(--r-md);font-family:var(--f-mono);font-size:11px;line-height:1.7;max-height:280px;overflow-y:auto">

      </div>
    ` : ''}

    <!-- Erklärung -->
    <div style="margin-top:20px;padding:16px 18px;background:var(--c-bg-soft);border-radius:var(--r-md);font-size:12px;line-height:1.6;color:var(--c-ink-soft)">
      <strong style="color:var(--c-ink)">Wie das funktioniert:</strong>
      <ol style="margin:8px 0 0;padding-left:20px">
        <li>Du trägst val.town-Token + Freshdesk-Zugang ein</li>
        <li>„Setup starten" erstellt einen val.town-Val mit dem Proxy-Code, setzt die Env-Variablen, und speichert Proxy-URL + Shared-Token in der Master-Base</li>
        <li>Wenn ein Kunde „Anfrage absenden" klickt, schickt die App ein JSON an den val.town-Proxy</li>
        <li>Der Proxy erzeugt das Freshdesk-Ticket mit dem Kunden als Requester (kein Email-Programm)</li>
      </ol>
    </div>
  </div>
</div>`;
}

function renderUsers() {
  if (!isAdmin()) {
    return `
<div class="screen">
  ${headerBar(backBtn('go-home'), `<div class="pill pill--ink">User</div>`, `<div class="header__slot"></div>`)}
  <div class="scroll" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:40px 24px">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--c-surface-alt);color:var(--c-ink-mute);display:flex;align-items:center;justify-content:center">${svg('alert-triangle', 28, 2.2)}</div>
    <div style="text-align:center">
      <div style="font-size:14px;font-weight:600">Kein Zugriff</div>
      <div style="font-size:12px;font-weight:500;color:var(--c-ink-mute);margin-top:4px">Die Userverwaltung ist nur für Admins.</div>
    </div>
  </div>
</div>`;
  }
  const users = state.users || [];
  const loading = !!state.usersLoading;
  const error = state.usersError;
  const isMe = (u) => APP_KEYS.user && u._recordId === APP_KEYS.user._recordId;
  const adminCount = users.filter(u => u.role === 'admin').length;
  const activeCount = users.filter(u => u.status === 'aktiv').length;

  return `
<div class="screen">
  ${headerBar(backBtn('go-home'),
    `<div class="pill pill--ink">${svg('user', 11, 2.5)} Userverwaltung</div>`,
    `<div class="header__slot"></div>`)}
  <div class="scroll" style="padding-bottom:24px">
    <div style="padding:0 20px 4px">
      <h1 style="font-size:30px;font-weight:600;line-height:1;letter-spacing:-.025em;margin:0">User</h1>
      <p style="font-size:12.5px;font-weight:500;color:var(--c-ink-soft);margin:6px 0 0">${users.length} ${users.length === 1 ? 'User' : 'User'} · ${adminCount} Admin · ${activeCount} aktiv</p>
    </div>

    <div style="padding:14px 20px 0">
      <button data-action="user-add" class="action-bar__btn action-bar__btn--primary" style="width:100%;padding:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px">${svg('plus', 14, 2.6)} Neuen User anlegen</button>
    </div>

    <div style="padding:14px 20px 0">
      ${loading ? `
        <div class="tile" style="padding:28px;text-align:center">
          <div class="spinner" style="margin:0 auto 12px"></div>
          <div style="font-size:12.5px;color:var(--c-ink-mute)">User werden geladen …</div>
        </div>
      ` : error ? `
        <div class="tile" style="padding:20px;text-align:center;border-color:var(--c-red)">
          <div style="color:var(--c-red);font-size:13px;font-weight:600;margin-bottom:6px">${svg('alert-triangle', 14, 2.4)} Fehler</div>
          <div style="font-size:11.5px;color:var(--c-ink-mute);margin-bottom:10px">${String(error).replace(/</g, '&lt;')}</div>
          <button data-action="user-reload" style="padding:7px 14px;background:var(--c-blue);color:#fff;border-radius:var(--r-pill);font-size:11.5px;font-weight:600">Erneut versuchen</button>
        </div>
      ` : users.length === 0 ? `
        <div class="tile" style="padding:28px;text-align:center">
          <div style="font-size:13px;color:var(--c-ink-soft);font-weight:600">Noch keine User</div>
          <div style="font-size:11.5px;color:var(--c-ink-mute);margin-top:4px">Lege oben einen neuen User an.</div>
        </div>
      ` : `
        <div style="display:flex;flex-direction:column;gap:8px">
          ${users.map(u => {
            const me = isMe(u);
            const isAdminUser = u.role === 'admin';
            const isInactive = u.status !== 'aktiv';
            const initial = (u.name || '?').trim().charAt(0).toUpperCase();
            return `
              <div class="tile" style="padding:0;overflow:hidden;${isInactive ? 'opacity:.65' : ''}">
                <button data-action="user-edit" data-rid="${u._recordId}" style="display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;cursor:pointer">
                  <div style="flex-shrink:0;width:40px;height:40px;border-radius:50%;background:${isAdminUser ? '#FFD45C' : 'var(--c-blue-soft)'};color:${isAdminUser ? '#3A2400' : 'var(--c-blue-deep)'};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">${initial}</div>
                  <div style="flex:1;min-width:0">
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                      <span style="font-size:14px;font-weight:600;letter-spacing:-.005em">${(u.name || '— Ohne Name —').replace(/</g, '&lt;')}</span>
                      ${me ? `<span class="pill pill--neutral" style="font-size:9px">Du</span>` : ''}
                      <span class="pill ${isAdminUser ? 'pill--amber' : 'pill--neutral'}" style="font-size:9px">${isAdminUser ? 'Admin' : 'User'}</span>
                      ${isInactive ? `<span class="pill" style="font-size:9px;background:var(--c-red-soft);color:var(--c-red);border:1px solid rgba(229,72,77,.3)">inaktiv</span>` : ''}
                    </div>
                    <div style="font-size:11px;font-weight:500;color:var(--c-ink-mute);margin-top:3px;font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.apiKey ? svg('key', 9, 2.5) + ' ' + u.apiKey.slice(0, 14) + (u.apiKey.length > 14 ? '…' : '') : '— kein Schlüssel —'}</div>
                  </div>
                  <span style="color:var(--c-ink-subtle);display:flex;flex-shrink:0">${svg('chevron-right', 14, 2.5)}</span>
                </button>
                <div style="display:flex;border-top:1px solid var(--c-divider)">
                  <button data-action="user-copy-wa" data-rid="${u._recordId}" style="flex:1;padding:11px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;font-weight:600;color:#0A6B2C;background:#E6F4EA;cursor:pointer" title="Einladungstext für WhatsApp kopieren">
                    ${svg('message-circle', 13, 2.4)} WhatsApp-Text kopieren

                  <button data-action="user-copy-key" data-rid="${u._recordId}" style="flex:none;padding:11px 14px;display:inline-flex;align-items:center;justify-content:center;color:var(--c-ink-soft);background:var(--c-surface-alt);border-left:1px solid var(--c-divider);cursor:pointer" title="Nur Schlüssel kopieren">
                    ${svg('copy', 13, 2.4)}
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}

function renderIssues() {
  const defective = inventory.filter(it => it.func === 'defective');
  const scrap = inventory.filter(it => it.func === 'scrap');
  const untested = inventory.filter(it => it.func === 'unknown' || it.func === 'untested');
  const tabs = {
    defect:   { label: 'Defekt', items: defective, color: 'var(--c-amber)', icon: 'alert-triangle', hint: 'Reparatur pr\u00fcfen' },
    scrap:    { label: 'Schrott', items: scrap, color: 'var(--c-red)', icon: 'trash-2', hint: 'Entsorgung dokumentieren' },
    untested: { label: 'Test offen', items: untested, color: 'var(--c-ink-soft)', icon: 'help-circle', hint: 'Funktion noch nicht best\u00e4tigt' },
  };
  if (!tabs[state.issuesTab]) state.issuesTab = 'defect';
  const a = tabs[state.issuesTab];

  return `
<div class="screen">
  ${headerBar(backBtn('go-home'),
    `<div class="pill pill--amber">${svg('alert-triangle', 11, 2.5)} Aufmerksamkeit</div>`,
    `<div class="header__slot"></div>`)}
  <div style="padding:0 20px 8px"><h1 style="font-size:26px;font-weight:600;line-height:1.05;letter-spacing:-.025em;margin:0">Was Aufmerksamkeit<br>braucht</h1></div>
  <div style="padding:8px 20px">
    <div class="chip-row">
      ${Object.entries(tabs).map(([id, t]) => `
        <button class="chip ${state.issuesTab === id ? 'chip--active' : ''}" data-action="set-issues-tab" data-tab="${id}">
          <span style="color:${state.issuesTab === id ? '#fff' : t.color};display:flex">${svg(t.icon, 12, 2.5)}</span>
          ${t.label}
          <span class="chip__count">${t.items.length}</span>
        </button>`).join('')}
    </div>
  </div>
  <div style="padding:12px 20px 0">
    <div class="hint-banner" style="background:${a.color}15;border:1px solid ${a.color}30;color:${a.color}">
      ${svg(a.icon, 13, 2.5)} ${a.hint}

  <div class="scroll" style="padding-top:12px;padding-bottom:24px">
    ${a.items.length === 0
      ? `<div class="tile" style="padding:32px;text-align:center"><div style="margin-bottom:8px;color:var(--c-green)">${svg('check', 28, 2)}</div><div style="font-size:14px;font-weight:600">Keine Eintr\u00e4ge</div></div>`

  </div>
</div>`;
}

      <img id="cropperImg" src="${c.imageUrl}" alt="">

  </div>

// Wendet die aktuelle Pan/Zoom-Position als CSS-Transform an (clamped).
function applyCropperTransform() {
  const c = state.cropper;
  if (!c || !c.imgW) return;
  const img = document.getElementById('cropperImg');
  if (!img) return;
  const s = c.baseScale * c.scale;
  const dispW = c.imgW * s;
  const dispH = c.imgH * s;
  const maxX = Math.max(0, (dispW - c.frameW) / 2);
  const maxY = Math.max(0, (dispH - c.frameH) / 2);
  c.offsetX = Math.max(-maxX, Math.min(maxX, c.offsetX || 0));
  c.offsetY = Math.max(-maxY, Math.min(maxY, c.offsetY || 0));
  const tx = (c.frameW - dispW) / 2 + c.offsetX;
  const ty = (c.frameH - dispH) / 2 + c.offsetY;
  img.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
}

function setupCropper() {
  const c = state.cropper;
  if (!c) return;
  const frame = document.getElementById('cropperFrame');
  const img = document.getElementById('cropperImg');
  if (!frame || !img) return;

  const ready = () => {
    if (!c.imgW) {
      c.imgW = img.naturalWidth;
      c.imgH = img.naturalHeight;
    }
    const fb = frame.getBoundingClientRect();
    c.frameW = fb.width;
    c.frameH = fb.height;
    if (!c.imgW || !c.imgH || !c.frameW || !c.frameH) return;
    c.baseScale = Math.max(c.frameW / c.imgW, c.frameH / c.imgH);
    if (!c.scale || c.scale < 1) c.scale = 1;
    applyCropperTransform();
  };
  if (img.complete && img.naturalWidth > 0) ready();
  else img.addEventListener('load', ready, { once: true });

  // Pointer-Gesten (Pan + Pinch-Zoom)
  const pointers = new Map();
  let startDist = 0;
  let startScale = 1;
  let startOffset = { x: 0, y: 0 };
  let startMid = { x: 0, y: 0 };

  const refreshStart = () => {
    const cur = state.cropper;
    if (!cur) return;
    if (pointers.size === 1) {
      const [p] = pointers.values();
      startMid = { x: p.x, y: p.y };
      startOffset = { x: cur.offsetX || 0, y: cur.offsetY || 0 };
    } else if (pointers.size === 2) {
      const arr = [...pointers.values()];
      startDist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y) || 1;
      startScale = cur.scale;
      startMid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
      startOffset = { x: cur.offsetX || 0, y: cur.offsetY || 0 };
    }
  };

  const onDown = (e) => {
    if (!state.cropper) return;
    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { frame.setPointerCapture(e.pointerId); } catch (_) {}
    refreshStart();
  };
  const onMove = (e) => {
    const cur = state.cropper;
    if (!cur || !pointers.has(e.pointerId)) return;
    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      const [p] = pointers.values();
      cur.offsetX = startOffset.x + (p.x - startMid.x);
      cur.offsetY = startOffset.y + (p.y - startMid.y);
    } else if (pointers.size === 2) {
      const arr = [...pointers.values()];
      const dist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y) || 1;
      cur.scale = Math.max(1, Math.min(6, startScale * (dist / startDist)));
      const mid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
      cur.offsetX = startOffset.x + (mid.x - startMid.x);
      cur.offsetY = startOffset.y + (mid.y - startMid.y);
    }
    applyCropperTransform();
  };
  const onUp = (e) => {
    pointers.delete(e.pointerId);
    try { frame.releasePointerCapture(e.pointerId); } catch (_) {}
    refreshStart();
  };

  frame.addEventListener('pointerdown', onDown);
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', onUp);
  frame.addEventListener('pointerleave', onUp);

  // Maus-Wheel-Zoom (Desktop-Komfort)
  frame.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -e.deltaY * 0.0015;
    c.scale = Math.max(1, Math.min(6, (c.scale || 1) * (1 + delta)));
    applyCropperTransform();
  }, { passive: false });
}

function cropperReset() {
  const c = state.cropper;
  if (!c) return;
  c.scale = 1;
  c.offsetX = 0;
  c.offsetY = 0;
  applyCropperTransform();
}

function cropperCancel() {
  const c = state.cropper;
  const ret = c?.returnView || 'camera';
  if (c) { try { URL.revokeObjectURL(c.imageUrl); } catch (_) {} }
  state.cropper = null;
  go(ret);
}

async function cropperConfirm() {
  const c = state.cropper;
  if (!c || !c.imgW) { cropperCancel(); return; }
  setLoading(true, 'Foto wird zugeschnitten …');
  try {
    const s = c.baseScale * c.scale;
    const tx = (c.frameW - c.imgW * s) / 2 + c.offsetX;
    const ty = (c.frameH - c.imgH * s) / 2 + c.offsetY;
    // Frame-Bereich in Bildkoordinaten:
    let cropX = -tx / s;
    let cropY = -ty / s;
    let cropW = c.frameW / s;
    let cropH = c.frameH / s;
    // Sicherheitsclamp auf Bildgrenzen
    cropX = Math.max(0, Math.min(c.imgW, cropX));
    cropY = Math.max(0, Math.min(c.imgH, cropY));
    cropW = Math.max(1, Math.min(c.imgW - cropX, cropW));
    cropH = Math.max(1, Math.min(c.imgH - cropY, cropH));

    const imgEl = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('Bild-Decoder-Fehler'));
      i.src = c.imageUrl;
    });

    let outW = cropW, outH = cropH;
    const longest = Math.max(cropW, cropH);
    if (longest > PHOTO_MAX_EDGE) {
      const k = PHOTO_MAX_EDGE / longest;
      outW = Math.round(cropW * k);
      outH = Math.round(cropH * k);
    } else {
      outW = Math.round(outW);
      outH = Math.round(outH);
    }
    const canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(imgEl, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', PHOTO_JPEG_QUALITY));
    if (!blob) throw new Error('Encoding fehlgeschlagen');
    const baseName = (c.file?.name || 'photo').replace(/\.[^./]+$/, '');
    const file = new File([blob], baseName + '.jpg', { type: 'image/jpeg', lastModified: Date.now() });
    const url = URL.createObjectURL(file);
    const ret = c.returnView || 'camera';
    const mode = c.mode || 'newItem';

    if (mode === 'itemPhoto') {
      // Direkt-Upload zu bestehendem Item
      try { URL.revokeObjectURL(c.imageUrl); } catch (_) {}
      state.cropper = null;
      go(ret);
      // Upload nach Render starten (handleItemPhotoAdd setzt eigenen Loader)
      setLoading(false);
      handleItemPhotoAdd(file);
      return;
    }

    if (mode === 'replaceItemPhoto') {
      // Bestehendes Foto an targetPhotoIdx ersetzen — neue Datei hochladen, an Position einsortieren, altes löschen
      const targetItemId = c.targetItemId;
      const targetPhotoId = c.targetPhotoId;
      const targetIdx = c.targetPhotoIdx;
      try { URL.revokeObjectURL(c.imageUrl); } catch (_) {}
      state.cropper = null;
      go(ret);
      setLoading(false);
      replaceItemPhoto(targetItemId, targetPhotoId, targetIdx, file);
      return;
    }

    // Default-Mode 'newItem': zu Capture-Liste hinzufügen
    const wasFirst = (state.voicePhotoFiles || []).length === 0;
    state.voicePhotoFiles = [...(state.voicePhotoFiles || []), file];
    state.voicePhotoPreviews = [...(state.voicePhotoPreviews || []), url];
    state.galleryIndex = state.voicePhotoFiles.length - 1;
    state.cameraShowLive = false; // User soll das frisch zugeschnittene Foto sehen

    // Original-Datei für Scan vor URL-Revoke merken — Original hat höhere Auflösung als der Crop
    const scanFile = c.file || file;
    try { URL.revokeObjectURL(c.imageUrl); } catch (_) {}
    state.cropper = null;
    go(ret);
    // Erstes Foto: im Hintergrund nach Etikett/QR scannen — Original-Foto, da QR im gecroppten Bild oft zu klein ist.
    // Im Wizard NICHT auto-scannen — dort gibt's Step 4 dafür.
    if (wasFirst && !state.wizardStep) autoScanFirstPhotoForTracker(scanFile);
  } catch (e) {
    showToast('Foto konnte nicht zugeschnitten werden: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
  }
}

// Swipe-Gesten auf der Foto-Galerie im Detail-Screen (links/rechts wischen blättert).
function setupGallerySwipe() {
  const it = state.item;
  const photos = it?.photo || [];
  if (photos.length < 2) return;
  const el = document.querySelector('.hero-image--photo');
  if (!el) return;
  let sx = 0, sy = 0, st = 0, active = false;

  const onDown = (e) => {
    // Nur erster Pointer; nicht wenn auf einem Button gestartet
    if (e.target.closest('button')) return;
    sx = e.clientX; sy = e.clientY; st = Date.now(); active = true;
  };
  const onUp = (e) => {
    if (!active) return;
    active = false;
    const dx = e.clientX - sx;
    const dy = e.clientY - sy;
    const dt = Date.now() - st;
    // Horizontaler Swipe: mind. 40px, dominanter als vertikal, nicht zu langsam
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.3 || dt > 700) return;
    const cur = state.item?.photo || [];
    const cnt = cur.length;
    if (cnt < 2) return;
    let i = Math.min(state.galleryIndex || 0, cnt - 1);
    if (dx < 0 && i < cnt - 1) i++;
    else if (dx > 0 && i > 0) i--;
    else return;
    state.galleryIndex = i;
    render();
  };
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', () => { active = false; });
}
