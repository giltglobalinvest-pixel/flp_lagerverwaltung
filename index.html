async function ensureFieldsExist(tableName, expectedFields) {
  if (!APP_KEYS.airtableWriteKey) return;
  try {
    const metaUrl = 'https://api.airtable.com/v0/meta/bases/' + AIR_BASE() + '/tables';
    const r = await fetch(metaUrl, { headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey } });
    if (!r.ok) return;
    const meta = await r.json();
    const tbl = (meta.tables || []).find(t => t.name === tableName);
    if (!tbl) return;
    const existingNames = new Set((tbl.fields || []).map(f => f.name));
    const missing = expectedFields.filter(f => !existingNames.has(f.name));
    for (const f of missing) {
      try {
        await fetch(metaUrl + '/' + tbl.id + '/fields', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: f.name, type: f.type }),
        });
      } catch (e) { /* feld bereits da oder permission fehlt – egal */ }
    }
  } catch (e) { /* offline / metadata-API nicht verfügbar */ }
}

function userRole() { return String(APP_KEYS.user?.role || 'user').toLowerCase(); }
function isAdmin() { return userRole() === 'admin'; }

// Team-Schlüssel: wird in das api_key-Feld der Records (Companies/Items/Halls) geschrieben
// und ist gleichzeitig der Filter beim Laden. Mehrere User können sich Daten teilen,
// indem sie in ihrem User-Record dasselbe `tenant_key` gesetzt haben.
// Fallback: persönlicher api_key (= bisheriges Verhalten).
function teamKey() {
  const u = APP_KEYS.user;
  if (!u) return '';
  // tenant_key kann je nach Airtable-Schreibung unterschiedlich heißen
  return (u.tenant_key || u.team_key || u.tenantKey || u.api_key || '').trim();
}

function nowIso() { return new Date().toISOString(); }
function shortId(prefix) { return (prefix || '') + Math.random().toString(36).slice(2, 8).toUpperCase(); }
function relTime(iso) {
  if (!iso) return '\u2014';
  const t = Date.parse(iso); if (isNaN(t)) return '\u2014';
  const diffH = Math.max(0, (Date.now() - t) / 36e5);
  if (diffH < 1) return Math.max(1, Math.round(diffH * 60)) + ' min';
  if (diffH < 24) return Math.round(diffH) + ' h';
  return Math.round(diffH / 24) + ' d';
}

function recordToCompany(rec) {
  const f = rec.fields || {};
  let halls = SEED_FLP_HALLS.slice();

  try { if (f.halls) halls = JSON.parse(f.halls); } catch(e) {}
  try { if (f.shelves) shelves = JSON.parse(f.shelves); } catch(e) {}
  try { if (f.categories) categories = JSON.parse(f.categories); } catch(e) {}
  return {
    id: f.company_id,
    _recordId: rec.id,
    name: f.name || '',
    color: f.color || COMPANY_COLORS[0],
    halls, shelves, categories,
    inventory: [],
  };
}

function recordToItem(rec) {
  const f = rec.fields || {};
  let specs = [];
  try { if (f.specs) specs = JSON.parse(f.specs); } catch(e) {}
  const photoArr = Array.isArray(f.photo) ? f.photo : [];
  return {
    _recordId: rec.id,
    id: f.item_id,
    company_id: f.company_id,
    title: f.title || '',
    description: f.description || '',
    maker: f.maker || '',
    cat: f.cat || '',
    loc: f.loc || '',
    cond: f.cond || 'used',
    func: f.func || 'unknown',
    specs,
    photo: photoArr,
    photoUrl: photoArr[0]?.url || null,
    tracker: f.tracker || '',
    trackerUrl: f.tracker_url || '',
    // Webshop
    vp: (f.vp !== '' && f.vp != null) ? parseFloat(String(f.vp).replace(',', '.')) : null,

    created: f.created || f.updated || nowIso(),

  };
}

async function renameHallEverywhere(oldName, newName) {
  oldName = String(oldName).trim();
  newName = String(newName).trim();
  if (!oldName || !newName || oldName === newName) return;
  if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); return; }
  const c = state.company;
  if (!c) { showToast('Keine Firma aktiv', 'error'); return; }
  if ((state.halls || []).includes(newName)) {
    showToast('Halle „' + newName + '" existiert bereits', 'error', 2800);
    return;
  }
  setLoading(true, 'Halle wird umbenannt …');
  try {
    // 1) state.halls Array updaten (Reihenfolge erhalten)
    state.halls = (state.halls || []).map(h => h === oldName ? newName : h);

    // 2) hallPhotos-Map umtaggen + Halls-Tabelle patchen wenn Record existiert
    const hp = state.hallPhotos?.[oldName];
    if (hp) {
      delete state.hallPhotos[oldName];
      state.hallPhotos[newName] = { ...hp, name: newName };
      if (hp._recordId) {
        try { await airUpdate(TBL_HALLS, hp._recordId, { name: newName }); } catch (e) { /* lokal trotzdem behalten */ }
      }
    }

    // 3) Companies-Tabelle: halls JSON persistieren
    setLoading(true, 'Firmen-Daten werden aktualisiert …');
    await persistCompanyHallsShelves(c);

    // 4) Items mit alter Halle in loc-String umtaggen
    const affected = (c.inventory || []).filter(it => {
      const p = parseLoc(it.loc);
      return p.hall === oldName;
    });
    if (affected.length > 0) {
      setLoading(true, `${affected.length} Artikel werden umgetaggt …`);
      for (const it of affected) {
        const p = parseLoc(it.loc);
        p.hall = newName;
        it.loc = buildLoc(p);
        try { await airUpdate(TBL_ITEMS, it._recordId, { loc: it.loc }); } catch (e) { /* nächster */ }
      }
    }
    showToast(`Halle umbenannt: „${oldName}" → „${newName}"${affected.length ? ` · ${affected.length} Artikel mit angepasst` : ''}`, 'success', 3000);
  } catch (e) {
    showToast('Umbenennen fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Lädt ein Foto für eine Halle hoch — legt den Halls-Record bei Bedarf an, optimiert das Bild vorher.
async function uploadHallPhoto(hallName, file) {
  const c = state.company;
  if (!c) { showToast('Keine Firma aktiv', 'error'); return; }
  setLoading(true, 'Halle-Foto wird optimiert …');
  try {
    // Bild auf 5:4 + 1600 px reduzieren (gleiche Pipeline wie Item-Fotos)
    const processed = await processImage(file);
    // Record sicherstellen
    let rec = state.hallPhotos[hallName];
    if (!rec?._recordId) {
      setLoading(true, 'Halle wird angelegt …');
      const created = await airWrite(TBL_HALLS, {
        hall_id: 'h_' + Math.random().toString(36).slice(2, 10),
        company_id: c.id,
        name: hallName,
        api_key: teamKey(),
      });
      rec = { _recordId: created.id, id: created.fields?.hall_id, company_id: c.id, name: hallName, photo: null };
      state.hallPhotos[hallName] = rec;
    }
    setLoading(true, 'Foto wird hochgeladen …');
    await uploadFileToRecord(TBL_HALLS, rec._recordId, 'photo', processed);
    // Frisch nachladen — Airtable liefert Foto + Thumbnails asynchron
    setLoading(true, 'Foto wird verarbeitet …');
    let attempts = 0, freshPhoto = null;
    while (attempts < 6 && !freshPhoto) {
      await new Promise(r => setTimeout(r, 600 + attempts * 400));
      try {
        const fresh = await airReadOne(TBL_HALLS, rec._recordId);
        const arr = Array.isArray(fresh.fields?.photo) ? fresh.fields.photo : [];
        if (arr[0]?.url) freshPhoto = arr[0];
      } catch (e) { /* retry */ }
      attempts++;
    }
    if (freshPhoto) rec.photo = freshPhoto;
    showToast('Foto für „' + hallName + '" gespeichert', 'success', 2400);
  } catch (e) {
    showToast('Hall-Foto fehlgeschlagen: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

function recordToHall(rec) {

async function loadAllData() {
  // Geteilte Datenquelle: alle eingeloggten User sehen dieselben Firmen / Artikel / Hallen.
  // Isolation passiert auf Datenbank-Ebene (separate Project-Base pro Kunde) — nicht pro User.
  const apiKey = teamKey(); // wird beim Schreiben weiterhin als "angelegt von" mitgegeben
  const [companyRecs, itemRecs, hallRecs] = await Promise.all([
    airRead(TBL_COMPANIES),
    airRead(TBL_ITEMS),
    airRead(TBL_HALLS).catch(() => []), // Tabelle könnte beim ersten Mal noch fehlen
  ]);

  let companies = companyRecs.map(recordToCompany).filter(c => c.id);

  // Hallen-Foto-Records pro Company als Map { hallName → hallRecord }
  const hallsByCompany = {};
  hallRecs.forEach(r => {
    const h = recordToHall(r);
    if (!h.company_id || !h.name) return;
    (hallsByCompany[h.company_id] = hallsByCompany[h.company_id] || {})[h.name] = h;
  });
  companies.forEach(c => { c.hallPhotos = hallsByCompany[c.id] || {}; });

  // Seed bei erstem Start: FLP Lift Parts mit Beispiel-Bestand
  if (companies.length === 0) {
    showToast('Erste Einrichtung \u2026 Beispieldaten werden angelegt', 'info', 3000);
    const flpId = 'co_flp_' + Date.now().toString(36);
    const seedCompany = {
      id: flpId,
      name: 'FLP Lift Parts',
      color: '#2456E5',
      halls: SEED_FLP_HALLS.slice(),
      shelves: SEED_FLP_SHELVES.slice(),
      categories: SEED_FLP_CATEGORIES.slice(),
      inventory: [],
      _created: nowIso(),
    };
    const created = await airWrite(TBL_COMPANIES, companyToFields(seedCompany, apiKey));
    seedCompany._recordId = created.id;
    companies = [seedCompany];

    // Seed-Artikel anlegen (mit kleiner Verz\u00f6gerung gegen Rate-Limit)
    for (const tpl of SEED_FLP_INVENTORY) {
      const it = {
        ...tpl,
        company_id: flpId,
        updated: nowIso(),
        photo: [],
        photoUrl: null,
      };
      try {
        const rec = await airWrite(TBL_ITEMS, itemToFields(it, apiKey));
        it._recordId = rec.id;
        seedCompany.inventory.push(it);
      } catch (e) {
        console.warn('Seed-Artikel \u00fcbersprungen:', e.message);
      }
    }
  } else {
    // Items den Companies zuordnen
    const items = itemRecs.map(recordToItem);
    const byCompany = {};
    items.forEach(it => {
      (byCompany[it.company_id] = byCompany[it.company_id] || []).push(it);
    });
    companies.forEach(c => {
      c.inventory = byCompany[c.id] || [];
    });
    // Migration: falls categories-Feld in Airtable noch leer war, im Hintergrund nachziehen
    for (const c of companies) {
      const recCategories = companyRecs.find(r => r.id === c._recordId)?.fields?.categories;
      if (!recCategories && c.categories?.length) {
        airUpdate(TBL_COMPANIES, c._recordId, { categories: JSON.stringify(c.categories) }).catch(() => {});
      }
    }
  }

  state.companies = companies;
  state.activeCompanyId = companies[0]?.id || null;
}

function persistItemPatch(it, patch) {
  if (!it?._recordId) return Promise.resolve();
  const fields = {};
  Object.keys(patch).forEach(k => {
    if (k === 'specs') fields.specs = JSON.stringify(patch.specs || []);
    else fields[k] = patch[k];
  });
  fields.updated = nowIso();
  return airUpdate(TBL_ITEMS, it._recordId, fields)
    .catch(err => showToast('Sync fehlgeschlagen: ' + err.message, 'error', 3500));
}

async function persistCompany(c) {
  const fields = companyToFields(c, teamKey());
  if (c._recordId) return await airUpdate(TBL_COMPANIES, c._recordId, fields);
  const rec = await airWrite(TBL_COMPANIES, fields);
  c._recordId = rec.id;

}

async function regenerateSpecs() {
  const it = state.item;
  if (!it) return;

  state.specsRegenerating = true;
  showToast('AI generiert technische Daten \u2026', 'info', 1800);
  try {
    const sys = 'Du bist Experte f\u00fcr Aufzugsersatzteile. Aus den Angaben erzeugst du eine pr\u00e4zise Liste technischer Daten f\u00fcr ein Lager-System. Antworte AUSSCHLIESSLICH mit einem JSON-Array von [label, value]-Paaren. Werte kompakt, mit Einheiten. Keine Erkl\u00e4rungen, kein Markdown.';
    const prompt = 'Artikel:\nTitel: ' + it.title + '\nHersteller: ' + it.maker + '\nKategorie: ' + it.cat + '\nBeschreibung: ' + (it.description || '') + '\n\nErzeuge 6 bis 10 technische Datenfelder. Beispiel-Format:\n[["Antriebsleistung","22 kW"],["Schutzart","IP21"]]';
    const opts = { system: sys, maxTokens: 700 };
    if (it.photoUrl) opts.imageUrl = it.photoUrl;

// Lädt die Photo-Liste eines bereits angezeigten Items frisch nach (im Hintergrund).
// Macht den Detail-Screen self-healing wenn die in-memory-Daten veraltet sind.
async function refreshItemPhotos(it) {
  if (!it?._recordId) return;
  try {
    const rec = await airReadOne(TBL_ITEMS, it._recordId);
    const photos = rec.fields?.photo || [];
    // Nur neu rendern wenn sich etwas geändert hat
    const sameCount = (it.photo || []).length === photos.length;
    const sameFirst = (it.photo?.[0]?.id || '') === (photos[0]?.id || '');
    if (sameCount && sameFirst) return;
    it.photo = photos;
    it.photoUrl = photos[0]?.url || null;
    if (state.item === it) render();
  } catch (e) { /* offline / 404 — egal */ }
}

// Holt Photo-Liste eines Records mit Retry, weil Airtable die Attachment-URLs
// nach Upload manchmal erst nach 1-2 Sekunden ausliefert.
async function fetchPhotosWithRetry(recordId, expectedCount, maxAttempts = 5) {
  let lastPhotos = [];
  for (let i = 0; i < maxAttempts; i++) {
    try {
      const rec = await airReadOne(TBL_ITEMS, recordId);
      const photos = (rec.fields?.photo) || [];
      lastPhotos = photos;
      // Wenn wir mindestens die erwartete Anzahl haben UND alle URLs vorhanden sind \u2192 fertig
      if (photos.length >= expectedCount && photos.every(p => p.url)) {
        return photos;
      }
    } catch (e) { /* n\u00e4chster Versuch */ }
    await new Promise(r => setTimeout(r, 600 + i * 400)); // 600, 1000, 1400, 1800, 2200 ms
  }
  return lastPhotos; // Fallback: das, was wir zuletzt gesehen haben
}

// H\u00e4ngt ein neues Foto an das Item an (Multi-Photo).
// Wenn bereits PHOTO_MAX_PER_ITEM erreicht, abbrechen mit Hinweis.
async function handleItemPhotoAdd(file) {
  const it = state.item;
  if (!it) return;
  const current = it.photo || [];
  if (current.length >= PHOTO_MAX_PER_ITEM) {
    showToast('Max ' + PHOTO_MAX_PER_ITEM + ' Fotos pro Artikel', 'error');
    return;
  }
  const expectedCount = current.length + 1;
  setLoading(true, 'Foto wird optimiert & hochgeladen \u2026');
  try {
    await uploadFileToRecord(TBL_ITEMS, it._recordId, 'photo', file);
    setLoading(true, 'Foto wird verarbeitet \u2026');
    // Frisch nachladen \u2014 uploadAttachment-Response ist nicht zuverl\u00e4ssig
    const photos = await fetchPhotosWithRetry(it._recordId, expectedCount);
    it.photo = photos;
    it.photoUrl = photos[0]?.url || null;
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = Math.max(0, photos.length - 1); // springe auf neues Foto
    showToast('Foto hinzugef\u00fcgt', 'success');
  } catch (e) {
    showToast('Upload fehlgeschlagen: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Entfernt ein Foto am Index aus dem Item.
async function handleItemPhotoDelete(idx) {
  const it = state.item;
  if (!it || !it.photo || idx < 0 || idx >= it.photo.length) return;
  const remaining = it.photo.filter((_, i) => i !== idx).map(p => ({ id: p.id }));
  const expectedCount = remaining.length;
  setLoading(true, 'Foto wird entfernt \u2026');
  try {
    await airUpdate(TBL_ITEMS, it._recordId, { photo: remaining });
    const photos = await fetchPhotosWithRetry(it._recordId, expectedCount);
    it.photo = photos;
    it.photoUrl = photos[0]?.url || null;
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = Math.min(state.galleryIndex || 0, Math.max(0, photos.length - 1));
    showToast('Foto entfernt', 'success');
  } catch (e) {
    showToast('L\u00f6schen fehlgeschlagen: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Setzt ein Foto als Hauptbild (auf Index 0 verschieben).
async function handleItemPhotoSetPrimary(idx) {
  const it = state.item;
  if (!it || !it.photo || idx <= 0 || idx >= it.photo.length) return;

async function runPhotoSearch() {
  state.photoSearchPhase = 'analyze';
  state.aiStep = 0;
  go('aiAnalyze');
  try {
    if (!state.photoSearchFile) throw new Error('Kein Foto');
    state.aiStep = 1; render();
    const base64 = await fileToBase64(state.photoSearchFile);
    const mediaType = state.photoSearchFile.type || 'image/jpeg';

    // Schritt 1: Claude Vision \u2014 OCR + Bauteil-Identifikation
    const cats = (state.categories || []).join('|') || 'Antrieb|Sicherheit|T\u00fcren|Notruf|Mechanik|Steuerung|Beleuchtung';
    const visionPrompt = `Du analysierst ein Foto eines Aufzugs-Ersatzteils. Antworte AUSSCHLIESSLICH als JSON:\n{"text_on_label":"...","probable_maker":"...","probable_model":"...","category":"${cats}","keywords":["w1","w2",...]}\nW\u00e4hle die fachlich passendste Kategorie aus der Liste. Wenn keine passt, lasse "category" leer.`;
    const visionRes = await askAI(visionPrompt, { imageBase64: base64, imageMediaType: mediaType, maxTokens: 400 });
    let info; try { info = parseAIJson(visionRes); } catch(e) { info = { keywords: [] }; }
    state.aiStep = 2; render();

    // Schritt 2: Lokal aus Bestand passende Treffer suchen (Text-Match + Vision-Match)
    const items = inventory;
    const lc = (s) => (s || '').toLowerCase();
    const labelText = lc(info.text_on_label) + ' ' + lc(info.probable_maker) + ' ' + lc(info.probable_model);
    const tokens = (info.keywords || []).concat([info.probable_maker, info.probable_model]).map(lc).filter(Boolean);

    function scoreItem(it) {
      const hay = (it.title + ' ' + it.maker + ' ' + it.id + ' ' + (it.description || '')).toLowerCase();
      let score = 0;
      tokens.forEach(tk => { if (tk && hay.includes(tk)) score += 30; });
      if (info.category && it.cat === info.category) score += 25;
      if (info.probable_maker && lc(it.maker) === lc(info.probable_maker)) score += 35;
      // Etikett-Text ein- oder enth\u00e4lt
      if (labelText.trim() && (hay.includes(lc(it.title)) || labelText.includes(lc(it.id)))) score += 40;
      return Math.min(99, score);
    }
    const ranked = items.map(it => ({ it, score: scoreItem(it) })).sort((a,b) => b.score - a.score);
    const text = ranked.filter(r => r.score >= 60).slice(0, 2).map(r => r.it);
    const visual = ranked.filter(r => r.score < 60 && r.score >= 15).slice(0, 4).map(r => ({ ...r.it, match: r.score }));

    state.photoSearchTextMatches = text;
    state.photoSearchVisualMatches = visual;
    state.photoSearchPhase = 'results';
    go('photoResults');
  } catch (e) {
    showToast('Foto-Suche fehlgeschlagen: ' + e.message, 'error', 3500);
    state.photoSearchPhase = 'idle';
    go('photoSearch');
  }
}

async function parseVoiceTranscript(transcript) {
  if (!transcript) return;
  try {
    const cats = state.categories || [];
    const catList = cats.length ? cats.join(' | ') : 'beliebig';
    const sys = `Du extrahierst Felder f\u00fcr ein Lager-System f\u00fcr Aufzugsersatzteile aus deutschsprachiger Sprache.

Verf\u00fcgbare Kategorien (w\u00e4hle die fachlich passendste!): ${catList}

Antworte AUSSCHLIESSLICH als JSON in diesem Schema:
{
  "name": "kurzer Artikelname",
  "maker": "Hersteller",
  "cat": "<eine der verf\u00fcgbaren Kategorien ODER neue Bezeichnung wenn keine passt>",
  "cat_is_new": false,
  "loc": {"hall":"","shelf":"","pos":"","box":""},
  "cond": "neu|refurb|used|",
  "func": "ok|untested|unknown|defective|scrap|",
  "stock": ""
}

Regeln zur Kategorie:
- Ordne den Artikel logisch in die fachlich passendste Kategorie aus der Liste ein.
- Beispiele: Frequenzumrichter, Getriebe, Motor \u2192 "Antrieb"; Lichtgitter, Fangvorrichtung \u2192 "Sicherheit"; T\u00fcrantriebe, T\u00fcrschlitten \u2192 "T\u00fcren"; Notrufger\u00e4te \u2192 "Notruf"; Treibscheiben, Seilrollen \u2192 "Mechanik"; Steuerungen, Platinen \u2192 "Steuerung"; Lampen, LEDs \u2192 "Beleuchtung".
- Wenn KEINE der verf\u00fcgbaren Kategorien passt, schlage einen NEUEN, kurzen, sinnvollen deutschen Kategorienamen vor (1 Wort, max 2) und setze "cat_is_new": true.
- Lasse "cat" NIEMALS leer wenn ein Artikel beschrieben wird.

Lasse andere Felder leer wenn nicht erw\u00e4hnt.`;
    const txt = await askAI('Diktat: ' + transcript, { system: sys, maxTokens: 500 });
    const data = parseAIJson(txt);

    // Falls AI eine neue Kategorie vorgeschlagen hat \u2192 automatisch hinzuf\u00fcgen
    if (data.cat && data.cat_is_new && !cats.includes(data.cat) && state.company) {
      state.categories = [...cats, data.cat];
      persistCompanyHallsShelves(state.company);
      showToast('Neue Kategorie erg\u00e4nzt: ' + data.cat, 'info', 2400);
    }

    state.voiceFields = {
      name: data.name || state.voiceFields.name || '',
      maker: data.maker || state.voiceFields.maker || '',
      cat: data.cat || state.voiceFields.cat || '',
      stock: data.stock || state.voiceFields.stock || '',
      tracker: state.voiceFields.tracker || '',          // vom Foto-Scan, nicht vom Diktat
      trackerUrl: state.voiceFields.trackerUrl || '',
    };
    if (data.loc) {
      state.voiceLocDraft = {
        hall: data.loc.hall || '',
        shelf: data.loc.shelf || '',
        pos: data.loc.pos || '',
        box: data.loc.box || '',
      };
    }
    if (data.cond) state.voiceCond = data.cond;
    if (data.func) state.voiceFunc = data.func;
    state.voicePhase = 'done';
    render();
  } catch (e) {
    showToast('Sprache konnte nicht ausgewertet werden: ' + e.message, 'error', 3500);
    state.voicePhase = 'done';
    render();
  }
}

/* ============================================================
   LIVE CAMERA (getUserMedia)
   ============================================================ */
const Camera = {
  stream: null,
  videoEl: null,        // wird vom render() injiziert
  facingMode: 'environment',
  starting: false,

  isSupported() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  },

  async start(videoEl) {
    if (!this.isSupported()) throw new Error('Kamera nicht unterstützt');
    if (this.starting) return;
    this.starting = true;
    try {
      // Bestehenden Stream stoppen falls vorhanden
      this.stop();
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: this.facingMode },
          width: { ideal: 1920 },
          height: { ideal: 1440 },
        },
        audio: false,
      });
      this.videoEl = videoEl;
      if (videoEl) {
        videoEl.srcObject = this.stream;
        videoEl.setAttribute('playsinline', 'true');
        videoEl.setAttribute('muted', 'true');
        videoEl.muted = true;
        await videoEl.play().catch(() => {});
      }
    } finally {
      this.starting = false;
    }
  },

  stop() {
    if (this.stream) {
      this.stream.getTracks().forEach(t => { try { t.stop(); } catch(_) {} });
    }
    this.stream = null;
    if (this.videoEl) {
      try { this.videoEl.srcObject = null; } catch(_) {}
    }
  },

  async toggleFacing() {
    this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
    if (this.videoEl) await this.start(this.videoEl);
  },

  // Captured frame: schneidet zentriert auf 5:4 + resize + JPEG
  async capture() {
    if (!this.videoEl) throw new Error('Kein Live-Bild');
    const v = this.videoEl;
    const srcW = v.videoWidth, srcH = v.videoHeight;
    if (!srcW || !srcH) throw new Error('Live-Bild noch nicht bereit — bitte kurz warten');

    // Zentrierter Crop auf 5:4 (PHOTO_TARGET_RATIO = 1.25)
    const srcRatio = srcW / srcH;
    let cropW, cropH, cropX, cropY;
    if (srcRatio > PHOTO_TARGET_RATIO) {
      cropH = srcH;
      cropW = Math.round(srcH * PHOTO_TARGET_RATIO);
      cropX = Math.round((srcW - cropW) / 2);
      cropY = 0;
    } else {
      cropW = srcW;
      cropH = Math.round(srcW / PHOTO_TARGET_RATIO);
      cropX = 0;
      cropY = Math.round((srcH - cropH) / 2);
    }

    // Resize auf max PHOTO_MAX_EDGE
    let outW = cropW, outH = cropH;
    const longest = Math.max(cropW, cropH);
    if (longest > PHOTO_MAX_EDGE) {
      const scale = PHOTO_MAX_EDGE / longest;
      outW = Math.round(cropW * scale);
      outH = Math.round(cropH * scale);
    }

    const canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(v, cropX, cropY, cropW, cropH, 0, 0, outW, outH);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', PHOTO_JPEG_QUALITY));
    if (!blob) throw new Error('Frame konnte nicht erfasst werden');
    return new File([blob], 'photo_' + Date.now() + '.jpg', { type: 'image/jpeg' });
  },
};

// Startet die Live-Kamera wenn der Camera-Screen aktiv ist und ein Live-Video-Element existiert.
// Wird nach jedem Render aufgerufen — idempotent.
async function startLiveCameraIfNeeded() {
  if (state.view !== 'camera') return;
  const v = document.getElementById('liveCamVideo');
  if (!v) return; // kein Live-Element im DOM (z.B. Preview-Modus)
  if (Camera.stream && Camera.videoEl === v) return; // läuft bereits
  try {
    await Camera.start(v);
  } catch (e) {
    if (e.name === 'NotAllowedError' || /denied/i.test(e.message)) {
      state.cameraDenied = true;
      showToast('Kamera-Zugriff verweigert. In den Browser-Einstellungen erlauben.', 'error', 4000);
      render();
    } else {
      showToast('Kamera-Start fehlgeschlagen: ' + e.message, 'error', 3500);
    }
  }
}

// Nimmt einen Frame aus der Live-Kamera, prozessiert ihn und legt ihn ins voicePhotoFiles.
async function captureLiveFrame() {
  if (state.voicePhotoFiles.length >= PHOTO_MAX_PER_ITEM) {
    showToast('Max ' + PHOTO_MAX_PER_ITEM + ' Fotos pro Artikel', 'error');
    return;
  }
  try {
    const file = await Camera.capture();
    const url = URL.createObjectURL(file);
    const wasFirst = state.voicePhotoFiles.length === 0;
    state.voicePhotoFiles = [...state.voicePhotoFiles, file];
    state.voicePhotoPreviews = [...state.voicePhotoPreviews, url];
    state.galleryIndex = state.voicePhotoFiles.length - 1;
    // Live-Cam aktiv lassen — User soll direkt weiter fotografieren können
    state.cameraShowLive = true;
    render();
    // Stream nach Re-Render neu starten falls nötig
    setTimeout(startLiveCameraIfNeeded, 30);
    // Erstes Foto: im Hintergrund nach Etikett/QR scannen
    if (wasFirst) autoScanFirstPhotoForTracker(file);
  } catch (e) {
    showToast('Foto fehlgeschlagen: ' + e.message, 'error', 3500);
  }
}

// iOS Safari beendet die Erkennung nach jeder kurzen Sprechpause automatisch.
// Wir restarten dann transparent solange der User nicht selbst gestoppt hat.
const Speech = {
  rec: null,
  active: false,
  userStopped: false,        // true = User hat manuell gestoppt
  accumulated: '',           // gesammeltes finales Transkript \u00fcber Restarts hinweg
  onUpdateFn: null,
  onFinalFn: null,
  start(onUpdate, onFinal) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('Sprache nicht unterst\u00fctzt (bitte Chrome/Safari)', 'error', 3500); return false; }
    this.stop(true); // sicherheitshalber, ohne Final-Callback
    this.userStopped = false;
    this.accumulated = '';
    this.onUpdateFn = onUpdate;
    this.onFinalFn = onFinal;
    return this._spawn();
  },
  _spawn() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = 'de-DE';
    rec.interimResults = true;
    rec.continuous = true;
    let sessionFinal = '';
    rec.onresult = (e) => {
      let interim = '';
      sessionFinal = '';
      for (let i = 0; i < e.results.length; i++) {
        const tr = e.results[i][0].transcript;
        if (e.results[i].isFinal) sessionFinal += tr; else interim += tr;
      }
      const combined = (this.accumulated + ' ' + sessionFinal + ' ' + interim).trim();
      this.onUpdateFn?.(combined);
    };
    rec.onerror = (e) => {
      // 'no-speech' und 'aborted' sind harmlos \u2014 onend k\u00fcmmert sich um Restart
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        this.userStopped = true;
        showToast('Mikrofon-Zugriff verweigert. Bitte in den Browser-Einstellungen erlauben.', 'error', 4000);
        return;
      }
      showToast('Mikrofon-Fehler: ' + e.error, 'error', 3500);
    };
    rec.onend = () => {
      // sessionFinal in den Gesamtspeicher \u00fcbernehmen
      if (sessionFinal) {
        this.accumulated = (this.accumulated + ' ' + sessionFinal).trim();
      }
      // Wenn User noch nicht gestoppt hat \u2192 transparent neu starten
      if (this.active && !this.userStopped) {
        try {
          this._spawn();
          return;
        } catch (e) { /* fallthrough */ }
      }
      // Echtes Ende
      this.active = false;
      const finalText = this.accumulated.trim();
      this.accumulated = '';
      this.onFinalFn?.(finalText);
    };
    try {
      rec.start();
      this.rec = rec;
      this.active = true;
      return true;
    } catch (e) {
      showToast('Konnte Mikrofon nicht starten: ' + (e.message || ''), 'error');
      return false;
    }
  },
  stop(silent) {
    this.userStopped = true;
    if (silent) {
      // ohne Final-Callback (bei programmatischem Reset)
      this.onFinalFn = null;
    }
    if (this.rec && this.active) {
      try { this.rec.stop(); } catch(e) {}
    }
  },
};

// Liefert die passende Foto-URL für ein Anzeige-Element. Airtable-Anhänge haben automatisch
// 3 Thumbnail-Größen (small ~36px, large ~512px) — die nutzen wir für Listen + Hero, statt
// jedesmal das volle 1600px-Bild zu laden. Spart auf Mobilfunk extrem viel Bandbreite.
//   p     = ein Eintrag aus it.photo[] ODER ein Item-Objekt (nimmt dann photo[0])
//   size  = 'small' | 'large' | 'full'  (default 'small')
const photoSrc = (p, size = 'small') => {
  if (!p) return null;
  // Wenn ein Item übergeben wurde: erstes Foto nehmen
  if (p.photo && Array.isArray(p.photo)) p = p.photo[0];
  if (!p) return null;
  return p.thumbnails?.[size]?.url || p.url || null;
};

// Format VP als €-String (deutsche Lokalisierung).
const formatVp = (v) => {
  if (v == null || isNaN(v)) return '';
  return v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
};

// Liefert kleine Badges für item-card / compact-item:
//  - Preis-Chip wenn vp gesetzt und (im Shop oder verkauft) — bleibt auch nach Verkauf sichtbar
//  - "VERKAUFT"-Chip rot wenn sold
const shopBadges = (it, opts = {}) => {
  const sm = opts.size === 'sm';
  const priceCls = sm ? 'price-chip price-chip--sm' : 'price-chip';
  const parts = [];
  // Preis weiterhin zeigen — auch wenn verkauft (durchgestrichen wäre auch nice, aber Mono lesbarer)
  const showPrice = it?.vp != null && (it?.inShop || it?.sold);
  if (showPrice) {
    const soldStyle = it.sold ? ' style="background:#FFF1B0;color:#7A5400;border-color:#F5C95B;text-decoration:line-through;text-decoration-color:rgba(122,84,0,.45)"' : '';
    parts.push(`<span class="${priceCls}"${soldStyle}>${formatVp(it.vp)}</span>`);
  }
  if (it?.sold) {
    parts.push(`<span class="price-chip ${sm ? 'price-chip--sm' : ''}" style="background:#FDE2E2;color:#9B1C1F;border-color:#F4A6A8">VERKAUFT</span>`);
  }
  return parts.join('');
};

// Tracker-Badge: zeigt #-Nummer prominent. Wenn URL vorhanden → klickbar (öffnet im neuen Tab).
const trackerChip = (it, opts = {}) => {
  if (!it?.tracker && !it?.trackerUrl) return '';

  const label = it.tracker || 'QR-Link';

  const fs = sz === 'sm' ? '10px' : '11px';
  const cls = 'tracker-chip tracker-chip--' + sz;
  if (it.trackerUrl) {
    return `<a href="${it.trackerUrl.replace(/"/g, '&quot;')}" target="_blank" rel="noopener" class="${cls}" style="padding:${px};font-size:${fs}" title="${it.trackerUrl.replace(/"/g, '&quot;')}" onclick="event.stopPropagation()">${svg('qr-code', sz === 'sm' ? 9 : 11, 2.5)}<span>${label}</span></a>`;
  }
  return `<span class="${cls}" style="padding:${px};font-size:${fs}">${svg('hash', sz === 'sm' ? 9 : 11, 2.5)}<span>${label}</span></span>`;
};

// Live-QR-Scanner: nutzt das Camera-Modul + BarcodeDetector im 600ms-Intervall
// Bei Treffer: Tracker + URL füllen, zum Wizard-Tracker-Screen zurück
let _liveScanInterval = null;
let _liveScanDetector = null;
async function startLiveTrackerScan() {
  if (state.view !== 'wizardTrackerScan') return;
  if (!('BarcodeDetector' in window)) return;
  const v = document.getElementById('liveScanVideo');
  if (!v) return;
  if (Camera.stream && Camera.videoEl === v) {
    // Stream läuft schon — nur Detector-Loop sicherstellen
  } else {
    try { await Camera.start(v); } catch (e) {
      showToast('Kamera-Start fehlgeschlagen: ' + e.message, 'error', 3500);
      return;
    }
  }
  if (!_liveScanDetector) {
    try {
      const formats = await window.BarcodeDetector.getSupportedFormats();
      if (!formats.includes('qr_code')) return;
      _liveScanDetector = new window.BarcodeDetector({ formats: ['qr_code'] });
    } catch (e) { return; }
  }
  if (_liveScanInterval) clearInterval(_liveScanInterval);
  _liveScanInterval = setInterval(async () => {
    if (state.view !== 'wizardTrackerScan') { stopLiveTrackerScan(); return; }
    const vid = document.getElementById('liveScanVideo');
    if (!vid || vid.readyState < 2) return;
    try {
      const codes = await _liveScanDetector.detect(vid);
      if (codes && codes.length > 0) {
        const url = String(codes[0].rawValue || '').trim();
        if (url) onLiveScanHit(url);
      }
    } catch (e) { /* still next tick */ }
  }, 600);
}
function stopLiveTrackerScan() {
  if (_liveScanInterval) { clearInterval(_liveScanInterval); _liveScanInterval = null; }
  Camera.stop();
}
function onLiveScanHit(rawUrl) {
  stopLiveTrackerScan();
  // QR-Inhalt als URL übernehmen — Tracker-Nummer aus Pfad-Ende ableiten falls möglich
  state.voiceFields.trackerUrl = rawUrl;
  if (!state.voiceFields.tracker) {
    const t = _extractTrackerFromUrl(rawUrl);
    if (t) state.voiceFields.tracker = t;
  }
  // Vibrieren als Feedback (falls verfügbar)
  try { navigator.vibrate?.(80); } catch (_) {}
  showToast('QR erkannt — Tracker übernommen', 'success', 2200);
  state.view = 'wizardTracker';
  render();
}

// KI-Vision: liest Bezeichnung, Hersteller, Beschreibung aus den hochgeladenen Step-2-Fotos.
// Wichtig: QR-Code-Etiketten + Tracker-Nummern werden ignoriert (separater Step 4).
async function extractDescriptionFromPhotos() {
  const files = (state.voicePhotoFiles || []).slice(0, 3); // max 3 Fotos pro Anfrage (Token-Sparen)
  if (files.length === 0) { showToast('Keine Fotos zum Auslesen', 'info', 2200); return; }
  setLoading(true, 'KI liest Datenblätter & Etiketten …');
  try {
    // Files in base64 wandeln
    const images = [];
    for (const f of files) {
      const base64 = await fileToBase64(f);
      images.push({ base64, mediaType: f.type || 'image/jpeg' });
    }
    const sys = 'Du extrahierst Daten aus Fotos von Aufzugs-Ersatzteilen für ein Lagerverwaltungs-System. Antworte AUSSCHLIESSLICH als JSON-Objekt, ohne Markdown-Codeblock und ohne erklärenden Text.';
    const prompt = `Du bekommst ${files.length} Foto${files.length === 1 ? '' : 's'} eines Aufzugs-Ersatzteils. Auf einigen Fotos können Datenblätter, Typenschilder oder Etiketten zu sehen sein.

Extrahiere folgende Felder:
- "name": Eindeutige Bezeichnung des Bauteils, möglichst kurz (z.B. "ZAdyn4C Frequenzumrichter", "Pana 40 Lichtgitter", "V3F20 Frequenzumrichter")
- "maker": Marken-/Herstellername (z.B. "Ziehl-Abegg", "Memco", "Wittur", "Otis"). Nur die Marke, ohne GmbH/AG.
- "description": 2–4 Sätze Fließtext: Funktion, typische Verwendung, wichtigste technische Eigenschaften. Auf Deutsch.

WICHTIG — was du IGNORIEREN sollst:
- QR-Codes auf dem Etikett
- Tracker-Nummern wie "#12696" oder "Nr. 12345" (das ist intern, nicht Teil der Beschreibung)
- FLP-Klebeetiketten oder Lift-Parts-Repair-Sticker
- Hotline-Nummern, Marketing-Domains wie "aufzug-umrichter.de"

Wenn du etwas nicht erkennen kannst, gib einen leeren String "" zurück. Nie raten.

Antwortformat exakt: {"name":"...","maker":"...","description":"..."}`;
    const txt = await askAI(prompt, { system: sys, images, maxTokens: 700 });
    const parsed = parseAIJson(txt);
    let changed = 0;
    if (parsed?.name) { state.voiceFields.name = String(parsed.name).trim(); changed++; }
    if (parsed?.maker) { state.voiceFields.maker = String(parsed.maker).trim(); changed++; }
    if (parsed?.description) { state.voiceTranscript = String(parsed.description).trim(); changed++; }
    if (changed > 0) showToast(`Erkannt: ${changed} Felder ausgefüllt`, 'success', 2400);
    else showToast('Keine Daten erkannt — manuell ausfüllen', 'info', 3000);
  } catch (e) {
    showToast('KI-Auslese fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

function renderResults() {
  const filters = ['Alle', 'Funktioniert', 'Defekt/Schrott', 'Generalüberholt'];
  const lo = state.query.toLowerCase();
  let m = inventory.filter(it => {
    if (!lo) return true;
    const hay = (it.title + ' ' + it.maker + ' ' + it.cat + ' ' + (it.description || '') + ' ' + it.id + ' ' + (it.loc || '')).toLowerCase();
    return hay.includes(lo);
  });
  if (state.filterIdx === 1) m = m.filter(it => it.func === 'ok' || it.func === 'untested');

  return `

function renderBestand() {
  // Aggregate categories
  const catCounts = {};
  inventory.forEach(it => { catCounts[it.cat] = (catCounts[it.cat] || 0) + 1; });
  const categories = Object.keys(catCounts).sort();
  const totalHalls = new Set(inventory.map(it => parseLoc(it.loc).hall).filter(Boolean)).size;

  // Aggregate manufacturers
  const makerCounts = {};
  inventory.forEach(it => { makerCounts[it.maker] = (makerCounts[it.maker] || 0) + 1; });
  const makers = Object.keys(makerCounts).sort((a, b) => makerCounts[b] - makerCounts[a] || a.localeCompare(b));

  // Aggregate conditions
  const condCounts = {};
  inventory.forEach(it => { condCounts[it.cond] = (condCounts[it.cond] || 0) + 1; });

  // Aggregate function statuses
  const funcCounts = {};
  inventory.forEach(it => { funcCounts[it.func] = (funcCounts[it.func] || 0) + 1; });

  // Apply category filter
  let items = state.bestandFilter === 'all' ? [...inventory] : inventory.filter(it => it.cat === state.bestandFilter);

  // Apply manufacturer filter
  if (state.bestandMaker && state.bestandMaker !== 'all') {
    items = items.filter(it => it.maker === state.bestandMaker);
  }

  // Apply condition filter
  if (state.bestandCond && state.bestandCond !== 'all') {
    items = items.filter(it => it.cond === state.bestandCond);
  }

  // Apply function status filter
  if (state.bestandFunc && state.bestandFunc !== 'all') {
    items = items.filter(it => it.func === state.bestandFunc);
  }

  // Apply search query
  const q = (state.bestandQuery || '').trim().toLowerCase();
  if (q) {
    items = items.filter(it =>
      it.title.toLowerCase().includes(q) ||
      it.maker.toLowerCase().includes(q) ||
      it.id.toLowerCase().includes(q) ||
      (it.description || '').toLowerCase().includes(q)
    );
  }

  // Apply sort
  if (state.bestandSort === 'az') {
    items.sort((a, b) => a.title.localeCompare(b.title));
  } else if (state.bestandSort === 'updated') {
    items.sort((a, b) => Date.parse(b.updated || 0) - Date.parse(a.updated || 0));
  }

  // Group by category when no filter, no maker, no cond, no func and no query active
  const grouped = state.bestandFilter === 'all' && (!state.bestandMaker || state.bestandMaker === 'all') && (!state.bestandCond || state.bestandCond === 'all') && (!state.bestandFunc || state.bestandFunc === 'all') && !q;
  const filterLabel = 'KATEGORIE';

  return `
<div class="screen">
  <div class="header">
    <button class="icon-btn" data-action="go-home">${svg('arrow-left', 17, 2.5)}</button>
    <button data-action="open-company-switcher" style="display:flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;background:var(--c-surface);border:1px solid var(--c-border);box-shadow:var(--elev-1);border-radius:var(--r-pill);cursor:pointer">
      <div style="width:24px;height:24px;border-radius:7px;background:${state.company?.color || 'var(--c-ink)'};color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">${svg('boxes', 11, 2.4)}</div>
      <span style="font-size:12px;font-weight:600;letter-spacing:-.005em;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${state.company?.name || ''}</span>
      ${svg('chevron-down', 11, 2.5)}
    </button>
    <button class="logout-btn" data-action="logout" title="Abmelden">${svg('log-out', 16, 2.4)}</button>
  </div>

  <div style="padding:0 20px 4px">
    <h1 style="font-size:30px;font-weight:600;line-height:1;letter-spacing:-.025em;margin:0">Bestand</h1>
    <p style="font-size:12.5px;font-weight:500;color:var(--c-ink-soft);margin:6px 0 0">${inventory.length} Artikel · ${categories.length} Kategorien · ${makers.length} Hersteller · ${totalHalls} ${totalHalls === 1 ? 'Halle' : 'Hallen'}</p>
  </div>

  <div style="padding:14px 20px 0">
    <div class="search-input">
      <span class="search-input__icon">${svg('search', 15, 2.5)}</span>
      <input type="text" placeholder="Im Bestand suchen ..." data-action="bestand-query" value="${(state.bestandQuery || '').replace(/"/g, '&quot;')}" autocomplete="off">
      ${q ? `<button data-action="bestand-clear" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--c-surface-alt);display:flex;align-items:center;justify-content:center;color:var(--c-ink-mute)">${svg('x', 12, 2.5)}</button>` : ''}
    </div>
  </div>

  ${(() => {
    const activeCount =
      (state.bestandFilter !== 'all' ? 1 : 0) +
      (state.bestandMaker && state.bestandMaker !== 'all' ? 1 : 0) +
      (state.bestandCond && state.bestandCond !== 'all' ? 1 : 0) +
      (state.bestandFunc && state.bestandFunc !== 'all' ? 1 : 0);
    const expanded = state.bestandFiltersExpanded;
    return `
  <div style="padding:12px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px">
    <button data-action="toggle-bestand-filters" style="display:inline-flex;align-items:center;gap:7px;padding:7px 12px;background:${activeCount > 0 ? 'var(--c-blue)' : 'var(--c-surface)'};color:${activeCount > 0 ? '#fff' : 'var(--c-ink)'};border:1px solid ${activeCount > 0 ? 'var(--c-blue)' : 'var(--c-border)'};box-shadow:${activeCount > 0 ? 'var(--elev-blue)' : 'var(--elev-1)'};border-radius:var(--r-pill);font-size:12.5px;font-weight:600;transition:all .15s">
      ${svg('filter', 12, 2.5)}
      Filter${activeCount > 0 ? ` · ${activeCount}` : ''}
      ${svg(expanded ? 'chevron-up' : 'chevron-down', 12, 2.5)}
    </button>
    <div style="display:flex;align-items:center;gap:2px;padding:3px;background:var(--c-surface);border:1px solid var(--c-border);box-shadow:var(--elev-1);border-radius:var(--r-pill);flex-shrink:0">
      ${[['updated', 'Aktualität'], ['az', 'A – Z']].map(([id, label]) => `
        <button data-action="set-bestand-sort" data-sort="${id}" style="padding:5px 11px;font-size:11px;font-weight:600;border-radius:var(--r-pill);transition:all .15s;${state.bestandSort === id ? 'background:var(--c-ink);color:#fff' : 'color:var(--c-ink-mute)'}">${label}</button>
      `).join('')}
    </div>
  </div>

  ${expanded ? `
  <div style="padding:12px 20px 0">
    <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Kategorie</div>
    <div class="chip-row">
      <button class="chip ${state.bestandFilter === 'all' ? 'chip--active' : ''}" data-action="set-bestand-filter" data-cat="all">
        Alle <span class="chip__count">${inventory.length}</span>
      </button>
      ${categories.map(cat => `
        <button class="chip ${state.bestandFilter === cat ? 'chip--active' : ''}" data-action="set-bestand-filter" data-cat="${cat}">
          ${cat} <span class="chip__count">${catCounts[cat]}</span>
        </button>
      `).join('')}
    </div>
  </div>

  <div style="padding:10px 20px 0">
    <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Hersteller</div>
    <div class="chip-row">
      <button class="chip ${(state.bestandMaker || 'all') === 'all' ? 'chip--active' : ''}" data-action="set-bestand-maker" data-maker="all">
        Alle <span class="chip__count">${inventory.length}</span>
      </button>
      ${makers.map(m => `
        <button class="chip ${state.bestandMaker === m ? 'chip--active' : ''}" data-action="set-bestand-maker" data-maker="${m.replace(/"/g, '&quot;')}">
          ${m} <span class="chip__count">${makerCounts[m]}</span>
        </button>
      `).join('')}
    </div>
  </div>

  <div style="padding:10px 20px 0">
    <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Zustand</div>
    <div class="chip-row">
      <button class="chip ${(state.bestandCond || 'all') === 'all' ? 'chip--active' : ''}" data-action="set-bestand-cond" data-cond="all">
        Alle <span class="chip__count">${inventory.length}</span>
      </button>
      ${CONDITION_KEYS.map(k => {
        const cfg = CONDITION[k];
        const active = state.bestandCond === k;
        const count = condCounts[k] || 0;
        return `<button class="chip ${active ? 'chip--active' : ''}" data-action="set-bestand-cond" data-cond="${k}">
          ${svg(cfg.icon, 11, 2.5)} ${cfg.label} <span class="chip__count">${count}</span>
        </button>`;
      }).join('')}
    </div>
  </div>

  <div style="padding:10px 20px 0">
    <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Funktion</div>
    <div class="chip-row">
      <button class="chip ${(state.bestandFunc || 'all') === 'all' ? 'chip--active' : ''}" data-action="set-bestand-func" data-func="all">
        Alle <span class="chip__count">${inventory.length}</span>
      </button>
      ${FUNCTION_KEYS.map(k => {
        const cfg = FUNCTION_STATUS[k];
        const active = state.bestandFunc === k;
        const count = funcCounts[k] || 0;
        if (count === 0) return '';
        return `<button class="chip ${active ? 'chip--active' : ''}" data-action="set-bestand-func" data-func="${k}">
          ${svg(cfg.icon, 11, 2.5)} ${cfg.short} <span class="chip__count">${count}</span>
        </button>`;
      }).join('')}
    </div>
  </div>

  ${activeCount > 0 ? `
    <div style="padding:12px 20px 0;display:flex;justify-content:flex-end">
      <button data-action="reset-bestand-filters" style="font-size:11.5px;font-weight:600;color:var(--c-blue);display:inline-flex;align-items:center;gap:5px;padding:6px 10px">
        ${svg('rotate-ccw', 11, 2.5)} Filter zurücksetzen
      </button>
    </div>
  ` : ''}
  ` : ''}

  <div style="padding:12px 20px 0">
    <span style="font-size:11.5px;font-weight:500;color:var(--c-ink-mute);font-variant-numeric:tabular-nums">${items.length} ${items.length === 1 ? 'Treffer' : 'Treffer'}${q ? ` für „${q}"` : ''}</span>
  </div>

function renderGroupedItems(items) {
  // Group by cat
  const groups = {};
  items.forEach(it => { (groups[it.cat] = groups[it.cat] || []).push(it); });
  return Object.entries(groups).map(([cat, list]) => `
    <div style="margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:8px;padding:0 4px;margin-bottom:10px">
        <h2 style="font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c-ink-mute);margin:0">${cat}</h2>
        <span style="flex:1;height:1px;background:var(--c-divider)"></span>
        <span style="font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--c-ink-mute)">${list.length}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">${list.map(it => itemCard(it)).join('')}</div>
    </div>
  `).join('');
}

        })() : ''}

    })()}

        ${(() => {

          return preview ? `<span class="code-chip" style="font-size:11px">${preview}</span>` : '';
        })()}

        const noneStyle = (active) => `font-family:var(--f-mono);font-size:10px;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);transition:all .15s;${active ? 'background:var(--c-ink);color:#fff' : 'background:var(--c-surface-alt);color:var(--c-ink-mute)'}`;
        return `
          <div style="display:flex;flex-direction:column;gap:14px">

            <div class="field">

              <input class="field__input" data-action="edit-loc-box" value="${(ld.box || '').replace(/"/g, '&quot;')}" placeholder="z.B. K-12" style="font-family:var(--f-mono);font-size:15px" autocomplete="off">
            </div>
          </div>
        `;
      })()}
    </div>

    <!-- Zustand -->
    <div>
      <div class="section-head"><h2 class="section-head__title">Zustand</h2></div>
      <div class="picker-grid">
        ${CONDITION_KEYS.map(k => {
          const cfg = CONDITION[k];
          const active = f.cond === k;
          return `
            <button class="picker-tile" style="${active ? `background:${cfg.bg};border-color:${cfg.fg};border-width:1.5px` : ''}" data-action="edit-cond" data-id="${k}">
              <span style="color:${active ? cfg.fg : 'var(--c-ink-mute)'};display:flex">${svg(cfg.icon, 18, 2.2)}</span>
              <span class="picker-tile__label" style="color:${active ? cfg.fg : 'var(--c-ink-soft)'}">${cfg.label}</span>
            </button>`;
        }).join('')}
      </div>
    </div>

    <!-- Funktion -->
    <div>
      <div class="section-head"><h2 class="section-head__title">Funktion</h2></div>
      <div class="picker-list">
        ${FUNCTION_KEYS.map(k => {
          const cfg = FUNCTION_STATUS[k];
          const active = f.func === k;
          return `
            <button class="picker-row" style="${active ? `background:${cfg.bg};border-color:${cfg.fg};border-width:1.5px` : ''}" data-action="edit-func" data-id="${k}">
              <div class="picker-row__icon" style="background:${active ? '#fff' : cfg.bg};color:${cfg.fg}">${svg(cfg.icon, 16, 2.4)}</div>
              <div style="flex:1;min-width:0"><h4 class="picker-row__title" style="${active ? `color:${cfg.fg}` : ''}">${cfg.label}</h4></div>
              ${active ? `<div class="picker-row__check" style="background:${cfg.fg}">${svg('check', 11, 3.5)}</div>` : ''}
            </button>`;

      </div>
    </div>

    <!-- Technische Daten — editierbar -->
    <div>
      <div class="section-head">
        <h2 class="section-head__title">Technische Daten</h2>
        <span class="pill pill--neutral" style="font-family:var(--f-mono)">${(f.specs || []).length}</span>
      </div>
      <div style="padding:8px 12px;background:var(--c-bg-soft);border-radius:12px;margin-bottom:10px;display:flex;align-items:center;gap:8px">
        <span style="color:var(--c-ink-mute);display:flex">${svg('edit-3', 12, 2.5)}</span>
        <span style="font-size:11px;font-weight:500;color:var(--c-ink-soft);line-height:1.35">Eigenschaften manuell ergänzen, ändern oder entfernen</span>
      </div>
      <div class="spec-edit-list">
        ${(f.specs || []).map(([k, v], i) => `
          <div class="spec-edit-row">
            <input class="field__input spec-edit-row__key" data-action="edit-spec-cell" data-key="${i}" data-target="key" value="${(k || '').replace(/"/g, '&quot;')}" placeholder="Eigenschaft" autocomplete="off">
            <input class="field__input spec-edit-row__val" data-action="edit-spec-cell" data-key="${i}" data-target="val" value="${(v || '').replace(/"/g, '&quot;')}" placeholder="Wert" autocomplete="off" style="font-family:var(--f-mono)">
            <button data-action="edit-spec-delete" data-idx="${i}" class="spec-edit-row__del" title="Entfernen">${svg('trash-2', 13, 2.5)}</button>

        <button data-action="edit-spec-add" style="width:100%;padding:11px;background:transparent;border:1px dashed var(--c-border-strong);border-radius:var(--r-md);font-size:12.5px;font-weight:600;color:var(--c-ink-soft);display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px">

    <!-- Gefahrenzone -->

  </div>

  <div class="action-bar" style="grid-template-columns:1fr 2fr">
    <button class="action-bar__btn" data-action="cancel-edit">Abbrechen</button>

</div>`;
}

/* ============================================================
   ADMIN-DASHBOARD
   Übersicht: Bestand, Verkäufe, Eingänge, Filter nach Kategorie/Hersteller.
   Nur für Admins.
   ============================================================ */
function renderDashboard() {
  if (!isAdmin()) {
    return `
<div class="screen">
  ${headerBar(backBtn('go-home'), `<div class="pill pill--ink">Dashboard</div>`, `<div class="header__slot"></div>`)}
  <div class="scroll" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:40px 24px">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--c-surface-alt);color:var(--c-ink-mute);display:flex;align-items:center;justify-content:center">${svg('alert-triangle', 28, 2.2)}</div>
    <div style="text-align:center">
      <div style="font-size:14px;font-weight:600">Kein Zugriff</div>
      <div style="font-size:12px;font-weight:500;color:var(--c-ink-mute);margin-top:4px">Das Dashboard ist nur für Admins.</div>
    </div>
  </div>
</div>`;
  }

  const items = inventory || [];
  const range = state.dashRange || '30d';     // 'today' | '7d' | '30d' | 'all'
  const catFilter = state.dashCat || 'all';
  const makerFilter = state.dashMaker || 'all';

  // Zeit-Range bestimmen
  const now = Date.now();
  const ms = { today: 24*3600e3, '7d': 7*24*3600e3, '30d': 30*24*3600e3, all: Infinity }[range];
  const inRange = (iso) => {
    if (!iso) return false;
    if (ms === Infinity) return true;
    const t = Date.parse(iso); if (isNaN(t)) return false;
    return (now - t) <= ms;
  };

  // Filter-Pipeline (Kategorie / Hersteller)
  const matchesFilters = (it) => {
    if (catFilter !== 'all' && it.cat !== catFilter) return false;
    if (makerFilter !== 'all' && it.maker !== makerFilter) return false;
    return true;
  };
  const visible = items.filter(matchesFilters);

  // KPIs
  const totalCount = visible.length;
  const inShopCount = visible.filter(it => it.inShop && !it.sold).length;
  const soldAll = visible.filter(it => it.sold);
  const soldInRange = visible.filter(it => it.sold && inRange(it.soldAt));
  const addedInRange = visible.filter(it => inRange(it.created));
  const inShopValue = visible.filter(it => it.inShop && !it.sold && it.vp != null).reduce((s, it) => s + it.vp, 0);
  const soldValueInRange = soldInRange.filter(it => it.vp != null).reduce((s, it) => s + it.vp, 0);
  const soldValueAll = soldAll.filter(it => it.vp != null).reduce((s, it) => s + it.vp, 0);

  // Kategorie-Verteilung (nur visible, nicht-verkauft, im Lager)
  const inStock = visible.filter(it => !it.sold);
  const catDist = {};
  inStock.forEach(it => { const k = it.cat || '—'; catDist[k] = (catDist[k] || 0) + 1; });
  const catRows = Object.entries(catDist).sort((a,b) => b[1] - a[1]);
  const catMax = Math.max(1, ...catRows.map(r => r[1]));

  // Hersteller-Verteilung (Top 5)
  const makerDist = {};
  inStock.forEach(it => { if (it.maker) makerDist[it.maker] = (makerDist[it.maker] || 0) + 1; });
  const makerTop = Object.entries(makerDist).sort((a,b) => b[1] - a[1]).slice(0, 5);

  // Aktivitätslisten — sortiert nach Datum desc
  const recentSold = visible.filter(it => it.sold).sort((a,b) => Date.parse(b.soldAt || 0) - Date.parse(a.soldAt || 0)).slice(0, 6);
  const recentAdded = [...visible].sort((a,b) => Date.parse(b.created || 0) - Date.parse(a.created || 0)).slice(0, 6);

  const allCats = state.categories || [];
  const allMakers = [...new Set(items.map(it => it.maker).filter(Boolean))].sort();

  const rangeLabel = { today: 'Heute', '7d': '7 Tage', '30d': '30 Tage', all: 'Alle Zeit' }[range];

  return `
<div class="screen">
  ${headerBar(backBtn('go-home'),
    `<div class="pill pill--ink">Dashboard</div>`,
    `<div class="header__slot"></div>`)}
  <div class="scroll" style="padding-bottom:24px">

    <!-- Zeitraum-Filter -->
    <div>
      <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Zeitraum</div>
      <div class="chip-row">
        ${[['today','Heute'],['7d','7 Tage'],['30d','30 Tage'],['all','Alle Zeit']].map(([k,l]) => `
          <button class="chip ${range === k ? 'chip--active' : ''}" data-action="dash-set-range" data-range="${k}">${l}</button>
        `).join('')}
      </div>
    </div>

    <!-- KPI-Kacheln -->
    <div class="dash-grid">
      <div class="dash-kpi">
        <div class="dash-kpi__label">${svg('boxes', 11, 2.4)} Bestand</div>
        <div class="dash-kpi__val">${totalCount - soldAll.length}</div>
        <div class="dash-kpi__sub">aktuell im Lager</div>
      </div>
      <div class="dash-kpi dash-kpi--blue">
        <div class="dash-kpi__label">${svg('arrow-down-left', 11, 2.4)} Eingang</div>
        <div class="dash-kpi__val">${addedInRange.length}</div>
        <div class="dash-kpi__sub">neu · ${rangeLabel}</div>
      </div>
      <div class="dash-kpi dash-kpi--red">
        <div class="dash-kpi__label">${svg('arrow-up-right', 11, 2.4)} Verkauft</div>
        <div class="dash-kpi__val">${soldInRange.length}</div>
        <div class="dash-kpi__sub">${rangeLabel} · ${formatVp(soldValueInRange) || '— €'}</div>
      </div>
      <div class="dash-kpi dash-kpi--green">
        <div class="dash-kpi__label">${svg('sparkles', 11, 2.4)} Im Shop</div>
        <div class="dash-kpi__val">${inShopCount}</div>
        <div class="dash-kpi__sub">Wert ${formatVp(inShopValue) || '— €'}</div>
      </div>
    </div>

    <!-- Filter Kategorie / Hersteller -->
    <div>
      <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Kategorie</div>
      <div class="chip-row">
        <button class="chip ${catFilter === 'all' ? 'chip--active' : ''}" data-action="dash-set-cat" data-cat="all">Alle <span class="chip__count">${items.length}</span></button>
        ${allCats.map(c => {
          const n = items.filter(it => it.cat === c).length;
          return `<button class="chip ${catFilter === c ? 'chip--active' : ''}" data-action="dash-set-cat" data-cat="${c.replace(/"/g,'&quot;')}">${c} <span class="chip__count">${n}</span></button>`;
        }).join('')}
      </div>
    </div>
    ${allMakers.length > 0 ? `
      <div>
        <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:7px">Hersteller</div>
        <div class="chip-row">
          <button class="chip ${makerFilter === 'all' ? 'chip--active' : ''}" data-action="dash-set-maker" data-maker="all">Alle</button>
          ${allMakers.map(m => {
            const n = items.filter(it => it.maker === m).length;

function renderIssues() {
  const defective = inventory.filter(it => it.func === 'defective');
  const scrap = inventory.filter(it => it.func === 'scrap');
  const untested = inventory.filter(it => it.func === 'unknown' || it.func === 'untested');
  const tabs = {
    defect:   { label: 'Defekt', items: defective, color: 'var(--c-amber)', icon: 'alert-triangle', hint: 'Reparatur pr\u00fcfen' },
    scrap:    { label: 'Schrott', items: scrap, color: 'var(--c-red)', icon: 'trash-2', hint: 'Entsorgung dokumentieren' },
    untested: { label: 'Test offen', items: untested, color: 'var(--c-ink-soft)', icon: 'help-circle', hint: 'Funktion noch nicht best\u00e4tigt' },
  };
  if (!tabs[state.issuesTab]) state.issuesTab = 'defect';
  const a = tabs[state.issuesTab];

  return `
<div class="screen">
  ${headerBar(backBtn('go-home'),
    `<div class="pill pill--amber">${svg('alert-triangle', 11, 2.5)} Aufmerksamkeit</div>`,
    `<div class="header__slot"></div>`)}
  <div style="padding:0 20px 8px"><h1 style="font-size:26px;font-weight:600;line-height:1.05;letter-spacing:-.025em;margin:0">Was Aufmerksamkeit<br>braucht</h1></div>
  <div style="padding:8px 20px">
    <div class="chip-row">
      ${Object.entries(tabs).map(([id, t]) => `
        <button class="chip ${state.issuesTab === id ? 'chip--active' : ''}" data-action="set-issues-tab" data-tab="${id}">
          <span style="color:${state.issuesTab === id ? '#fff' : t.color};display:flex">${svg(t.icon, 12, 2.5)}</span>
          ${t.label}
          <span class="chip__count">${t.items.length}</span>
        </button>`).join('')}
    </div>
  </div>
  <div style="padding:12px 20px 0">
    <div class="hint-banner" style="background:${a.color}15;border:1px solid ${a.color}30;color:${a.color}">
      ${svg(a.icon, 13, 2.5)} ${a.hint}
    </div>

  <div class="scroll" style="padding-top:12px;padding-bottom:24px">
    ${a.items.length === 0
      ? `<div class="tile" style="padding:32px;text-align:center"><div style="margin-bottom:8px;color:var(--c-green)">${svg('check', 28, 2)}</div><div style="font-size:14px;font-weight:600">Keine Eintr\u00e4ge</div></div>`
      : `<div style="display:flex;flex-direction:column;gap:8px">${a.items.map(it => itemCard(it)).join('')}</div>`}
  </div>
</div>`;
}

/* ============================================================
   INTERAKTIVER CROP-EDITOR (Datei-Upload aus Galerie)
   User pannt + zoomt das Bild in einem fixen 5:4-Rahmen.
   Was im Rahmen sichtbar ist, wird gespeichert.
   ============================================================ */
function renderCropper() {

  if (!c) return '<div class="screen"></div>';
  return `
<div class="screen cam-screen">

  <div class="cropper-stage">
    <div class="cropper-frame" id="cropperFrame">
      <img id="cropperImg" src="${c.imageUrl}" alt="">
      <div class="cropper-grid"></div>
    </div>
    <div class="cropper-hint">Ziehen · Pinch zum Zoomen</div>
  </div>

  <div style="padding:14px 20px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px">
    <button class="icon-btn icon-btn--ghost" style="width:48px;height:48px;border-radius:14px" data-action="cropper-cancel" title="Abbrechen">${svg('x', 18, 2.2)}</button>
    <button class="cam-shutter" style="background:var(--c-blue);color:#fff" data-action="cropper-confirm" title="Übernehmen">${svg('check', 26, 2.5)}</button>

  </div>

// Wendet die aktuelle Pan/Zoom-Position als CSS-Transform an (clamped).
function applyCropperTransform() {
  const c = state.cropper;
  if (!c || !c.imgW) return;
  const img = document.getElementById('cropperImg');
  if (!img) return;
  const s = c.baseScale * c.scale;
  const dispW = c.imgW * s;
  const dispH = c.imgH * s;
  const maxX = Math.max(0, (dispW - c.frameW) / 2);
  const maxY = Math.max(0, (dispH - c.frameH) / 2);
  c.offsetX = Math.max(-maxX, Math.min(maxX, c.offsetX || 0));
  c.offsetY = Math.max(-maxY, Math.min(maxY, c.offsetY || 0));
  const tx = (c.frameW - dispW) / 2 + c.offsetX;
  const ty = (c.frameH - dispH) / 2 + c.offsetY;
  img.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
}

function setupCropper() {
  const c = state.cropper;
  if (!c) return;
  const frame = document.getElementById('cropperFrame');
  const img = document.getElementById('cropperImg');
  if (!frame || !img) return;

  const ready = () => {
    if (!c.imgW) {
      c.imgW = img.naturalWidth;
      c.imgH = img.naturalHeight;
    }
    const fb = frame.getBoundingClientRect();
    c.frameW = fb.width;
    c.frameH = fb.height;
    if (!c.imgW || !c.imgH || !c.frameW || !c.frameH) return;
    c.baseScale = Math.max(c.frameW / c.imgW, c.frameH / c.imgH);
    if (!c.scale || c.scale < 1) c.scale = 1;
    applyCropperTransform();
  };
  if (img.complete && img.naturalWidth > 0) ready();
  else img.addEventListener('load', ready, { once: true });

  // Pointer-Gesten (Pan + Pinch-Zoom)
  const pointers = new Map();
  let startDist = 0;
  let startScale = 1;
  let startOffset = { x: 0, y: 0 };
  let startMid = { x: 0, y: 0 };

  const refreshStart = () => {
    const cur = state.cropper;
    if (!cur) return;
    if (pointers.size === 1) {
      const [p] = pointers.values();
      startMid = { x: p.x, y: p.y };
      startOffset = { x: cur.offsetX || 0, y: cur.offsetY || 0 };
    } else if (pointers.size === 2) {
      const arr = [...pointers.values()];
      startDist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y) || 1;
      startScale = cur.scale;
      startMid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
      startOffset = { x: cur.offsetX || 0, y: cur.offsetY || 0 };
    }
  };

  const onDown = (e) => {
    if (!state.cropper) return;
    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { frame.setPointerCapture(e.pointerId); } catch (_) {}
    refreshStart();
  };
  const onMove = (e) => {
    const cur = state.cropper;
    if (!cur || !pointers.has(e.pointerId)) return;
    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      const [p] = pointers.values();
      cur.offsetX = startOffset.x + (p.x - startMid.x);
      cur.offsetY = startOffset.y + (p.y - startMid.y);
    } else if (pointers.size === 2) {
      const arr = [...pointers.values()];
      const dist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y) || 1;
      cur.scale = Math.max(1, Math.min(6, startScale * (dist / startDist)));
      const mid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
      cur.offsetX = startOffset.x + (mid.x - startMid.x);
      cur.offsetY = startOffset.y + (mid.y - startMid.y);
    }
    applyCropperTransform();
  };
  const onUp = (e) => {
    pointers.delete(e.pointerId);
    try { frame.releasePointerCapture(e.pointerId); } catch (_) {}
    refreshStart();
  };

  frame.addEventListener('pointerdown', onDown);
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', onUp);
  frame.addEventListener('pointerleave', onUp);

  // Maus-Wheel-Zoom (Desktop-Komfort)
  frame.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -e.deltaY * 0.0015;
    c.scale = Math.max(1, Math.min(6, (c.scale || 1) * (1 + delta)));
    applyCropperTransform();
  }, { passive: false });
}

function cropperReset() {
  const c = state.cropper;
  if (!c) return;
  c.scale = 1;
  c.offsetX = 0;
  c.offsetY = 0;
  applyCropperTransform();
}

function cropperCancel() {
  const c = state.cropper;
  const ret = c?.returnView || 'camera';
  if (c) { try { URL.revokeObjectURL(c.imageUrl); } catch (_) {} }
  state.cropper = null;
  go(ret);
}

async function cropperConfirm() {
  const c = state.cropper;
  if (!c || !c.imgW) { cropperCancel(); return; }
  setLoading(true, 'Foto wird zugeschnitten …');
  try {
    const s = c.baseScale * c.scale;
    const tx = (c.frameW - c.imgW * s) / 2 + c.offsetX;
    const ty = (c.frameH - c.imgH * s) / 2 + c.offsetY;
    // Frame-Bereich in Bildkoordinaten:
    let cropX = -tx / s;
    let cropY = -ty / s;
    let cropW = c.frameW / s;
    let cropH = c.frameH / s;
    // Sicherheitsclamp auf Bildgrenzen
    cropX = Math.max(0, Math.min(c.imgW, cropX));
    cropY = Math.max(0, Math.min(c.imgH, cropY));
    cropW = Math.max(1, Math.min(c.imgW - cropX, cropW));
    cropH = Math.max(1, Math.min(c.imgH - cropY, cropH));

    const imgEl = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('Bild-Decoder-Fehler'));
      i.src = c.imageUrl;
    });

    let outW = cropW, outH = cropH;
    const longest = Math.max(cropW, cropH);
    if (longest > PHOTO_MAX_EDGE) {
      const k = PHOTO_MAX_EDGE / longest;
      outW = Math.round(cropW * k);
      outH = Math.round(cropH * k);
    } else {
      outW = Math.round(outW);
      outH = Math.round(outH);
    }
    const canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(imgEl, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', PHOTO_JPEG_QUALITY));
    if (!blob) throw new Error('Encoding fehlgeschlagen');
    const baseName = (c.file?.name || 'photo').replace(/\.[^./]+$/, '');
    const file = new File([blob], baseName + '.jpg', { type: 'image/jpeg', lastModified: Date.now() });
    const url = URL.createObjectURL(file);
    const ret = c.returnView || 'camera';
    const mode = c.mode || 'newItem';

    if (mode === 'itemPhoto') {
      // Direkt-Upload zu bestehendem Item
      try { URL.revokeObjectURL(c.imageUrl); } catch (_) {}
      state.cropper = null;
      go(ret);
      // Upload nach Render starten (handleItemPhotoAdd setzt eigenen Loader)
      setLoading(false);
      handleItemPhotoAdd(file);
      return;
    }

    if (mode === 'replaceItemPhoto') {
      // Bestehendes Foto an targetPhotoIdx ersetzen — neue Datei hochladen, an Position einsortieren, altes löschen
      const targetItemId = c.targetItemId;
      const targetPhotoId = c.targetPhotoId;
      const targetIdx = c.targetPhotoIdx;
      try { URL.revokeObjectURL(c.imageUrl); } catch (_) {}
      state.cropper = null;
      go(ret);
      setLoading(false);
      replaceItemPhoto(targetItemId, targetPhotoId, targetIdx, file);
      return;
    }

    // Default-Mode 'newItem': zu Capture-Liste hinzufügen
    const wasFirst = (state.voicePhotoFiles || []).length === 0;
    state.voicePhotoFiles = [...(state.voicePhotoFiles || []), file];
    state.voicePhotoPreviews = [...(state.voicePhotoPreviews || []), url];
    state.galleryIndex = state.voicePhotoFiles.length - 1;
    state.cameraShowLive = false; // User soll das frisch zugeschnittene Foto sehen

    // Original-Datei für Scan vor URL-Revoke merken — Original hat höhere Auflösung als der Crop
    const scanFile = c.file || file;
    try { URL.revokeObjectURL(c.imageUrl); } catch (_) {}
    state.cropper = null;
    go(ret);
    // Erstes Foto: im Hintergrund nach Etikett/QR scannen — Original-Foto, da QR im gecroppten Bild oft zu klein ist
    if (wasFirst) autoScanFirstPhotoForTracker(scanFile);
  } catch (e) {
    showToast('Foto konnte nicht zugeschnitten werden: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
  }
}

// Swipe-Gesten auf der Foto-Galerie im Detail-Screen (links/rechts wischen blättert).
function setupGallerySwipe() {
  const it = state.item;
  const photos = it?.photo || [];
  if (photos.length < 2) return;
  const el = document.querySelector('.hero-image--photo');
  if (!el) return;
  let sx = 0, sy = 0, st = 0, active = false;

  const onDown = (e) => {
    // Nur erster Pointer; nicht wenn auf einem Button gestartet
    if (e.target.closest('button')) return;
    sx = e.clientX; sy = e.clientY; st = Date.now(); active = true;
  };
  const onUp = (e) => {
    if (!active) return;
    active = false;
    const dx = e.clientX - sx;
    const dy = e.clientY - sy;
    const dt = Date.now() - st;
    // Horizontaler Swipe: mind. 40px, dominanter als vertikal, nicht zu langsam
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.3 || dt > 700) return;
    const cur = state.item?.photo || [];
    const cnt = cur.length;
    if (cnt < 2) return;
    let i = Math.min(state.galleryIndex || 0, cnt - 1);
    if (dx < 0 && i < cnt - 1) i++;
    else if (dx > 0 && i > 0) i--;
    else return;
    state.galleryIndex = i;
    render();
  };
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', () => { active = false; });
}

        <button class="action-bar__btn" data-action="close-company-switcher" style="width:100%;padding:13px">Schließen</button>

        </div>
        <div>
          <div style="font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:8px">Akzentfarbe</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">

              <button data-action="company-color" data-col="${col}" style="width:40px;height:40px;border-radius:12px;background:${col};border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:${e.color === col ? '0 0 0 3px var(--c-bg),0 0 0 5px ' + col : 'none'};transition:transform .1s" onmousedown="this.style.transform='scale(.9)'" onmouseup="this.style.transform=''" onmouseleave="this.style.transform=''">
