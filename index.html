const screens = { home: renderHome, listen: renderListen, results: renderResults, bestand: renderBestand, dashboard: renderDashboard, users: renderUsers, integrations: renderIntegrations, list: renderItemList, detail: renderDetail, edit: renderEdit, issues: renderIssues, testStart: renderTestStart, testResult: renderTestResult, testSaved: renderTestSaved, photoSearch: renderPhotoSearch, aiAnalyze: renderAIAnalyze, photoResults: renderPhotoResults, wizardCat: renderWizardCat, wizardDesc: renderWizardDesc, wizardTracker: renderWizardTracker, wizardTrackerScan: renderWizardTrackerScan, wizardLoc: renderWizardLoc, wizardStock: renderWizardStock, wizardShop: renderWizardShop, wizardSummary: renderWizardSummary, camera: renderCamera, cropper: renderCropper, voice: renderVoiceForm, saved: renderSaved };

let timers = [];
function clearTimers() { timers.forEach(t => clearTimeout(t)); timers = []; }

// Aktualisiert die persistente Top-Statusleiste mit Name, Rolle, Version.
// Wird bei jedem Render aufgerufen — versteckt sich automatisch wenn User nicht eingeloggt.
function updateUserBar() {
  const bar = document.getElementById('userBar');
  if (!bar) return;
  if (!state.loggedIn || !APP_KEYS.user) {
    bar.classList.remove('user-bar--shown');
    document.body.classList.remove('has-user-bar');
    bar.innerHTML = '';
    return;
  }
  const u = APP_KEYS.user;
  const name = u.name || 'User';
  const admin = isAdmin();
  const customer = isCustomer();
  const roleLabel = admin ? 'Admin' : (customer ? 'Kunde' : 'User');
  const roleClass = admin ? 'user-bar__role--admin' : (customer ? 'user-bar__role--customer' : '');
  bar.classList.add('user-bar--shown');
  document.body.classList.add('has-user-bar');
  const reloading = !!state.reloadingAll;
  const tablet = isTabletMode();
  bar.innerHTML = `
    <div class="user-bar__user">
      ${svg('user', 11, 2.4)}
      <span class="user-bar__name">${String(name).replace(/</g, '&lt;')}</span>
      <span class="user-bar__role ${roleClass}">${roleLabel}</span>
    </div>
    <button class="user-bar__reload" data-action="toggle-device-mode" title="${tablet ? 'Auf Mobil-Modus umschalten' : 'Auf iPad-Modus umschalten (kein Anlegen)'}">
      ${svg(tablet ? 'tablet' : 'smartphone', 11, 2.4)}
    </button>
    <button class="user-bar__reload ${reloading ? 'user-bar__reload--spin' : ''}" data-action="reload-all-data" ${reloading ? 'disabled' : ''} title="Daten neu laden">
      ${svg('rotate-ccw', 11, 2.4)}
    </button>
    <span class="user-bar__version">${APP_VERSION}</span>
  `;
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  updateUserBar();
  // Body-Klasse spiegelt aktuellen Geräte-Modus, damit CSS bei Bedarf reagieren kann
  document.body.classList.toggle('mode-tablet', isTabletMode());
  document.body.classList.toggle('mode-phone', !isTabletMode());

  // Auth-Gate: vor erfolgreichem Login werden \u00f6ffentliche Screens angezeigt
  if (!state.authReady) { app.innerHTML = renderBoot('Lade \u2026'); return; }
  if (!state.loggedIn) {
    // Public-Screens vor Login: Landing-Page (Default), Login, Register, Legal-Pages
    if (state.view === 'login') { app.innerHTML = renderLogin(); return; }
    if (state.view === 'register') { app.innerHTML = renderRegister(); return; }
    if (state.view === 'registerSuccess') { app.innerHTML = renderRegisterSuccess(); return; }
    if (state.view === 'impressum') { app.innerHTML = renderImpressum(); return; }
    if (state.view === 'privacy') { app.innerHTML = renderPrivacy(); return; }
    // Default = Landing Page
    ensurePublicCompanies(); // im Hintergrund nachladen
    app.innerHTML = renderLanding();
    return;
  }
  if (state.bootingData) { app.innerHTML = renderBoot('Daten werden geladen \u2026'); return; }

  // Customer-Schutz: gesperrte Views auf customerHome (= renderHome\u2192renderCustomerHome) umleiten.
  // Erlaubt f\u00fcr Customer: home, photoSearch, aiAnalyze, photoResults, detail, results, listen
  if (isCustomer()) {
    const allowed = new Set(['home','photoSearch','aiAnalyze','photoResults','detail','results','listen','camera','cropper']);
    if (state.view && !allowed.has(state.view)) {
      state.view = 'home';
    }
  }

  // Save scroll positions of scrollable containers (.scroll = main screen scroll area, .js-scroll = inner sheet scroll)
  const savedScrolls = {};
  app.querySelectorAll('.scroll').forEach((el, i) => { savedScrolls[`scroll:${i}`] = el.scrollTop; });
  app.querySelectorAll('.js-scroll').forEach(el => {
    const k = el.dataset.scrollKey;
    if (k) savedScrolls[`js:${k}`] = el.scrollTop;
  });

  // Save horizontal scroll for chip rows (so management mode in the middle of a long chip row doesn't lose position)
  app.querySelectorAll('.chip-row').forEach((el, i) => { savedScrolls[`chip:${i}`] = el.scrollLeft; });

  // Save focus state of any active input/textarea so live-typing doesn't lose focus
  const activeEl = document.activeElement;
  let savedFocus = null;
  if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA') && activeEl.dataset?.action) {
    savedFocus = { action: activeEl.dataset.action, key: activeEl.dataset.key, target: activeEl.dataset.target, pos: activeEl.selectionStart };
  }

  // Safety-Net: wenn ein Render-Aufruf wirft, zeigen wir den Fehler statt eines leeren Screens
  let _html = '';
  let _overlay = '';
  try { _html = screens[state.view]?.() || ''; }
  catch (renderErr) {
    console.error('[render] screen "' + state.view + '" threw:', renderErr);
    _html = `<div class="screen"><div class="scroll" style="padding:32px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center"><div style="width:64px;height:64px;border-radius:50%;background:var(--c-red-soft);color:var(--c-red);display:flex;align-items:center;justify-content:center">⚠</div><h2 style="font-size:18px;font-weight:700;margin:0">Render-Fehler in "${state.view}"</h2><pre style="font-family:var(--f-mono);font-size:11.5px;color:var(--c-red);background:var(--c-red-soft);padding:12px 14px;border-radius:8px;white-space:pre-wrap;word-break:break-word;max-width:90%;text-align:left">${String(renderErr?.message || renderErr).replace(/</g,'&lt;')}</pre><button class="action-bar__btn" onclick="state.view='home';render()" style="padding:12px 24px;background:var(--c-blue);color:#fff;border:0;border-radius:12px;font-weight:600">Zurück zum Home</button><button class="action-bar__btn" onclick="location.reload()" style="padding:12px 24px;background:var(--c-surface);color:var(--c-ink);border:1px solid var(--c-border);border-radius:12px;font-weight:600">Neu laden</button></div></div>`;
  }
  try { _overlay = renderCompanyOverlay(); }
  catch (overlayErr) { console.error('[render] overlay threw:', overlayErr); _overlay = ''; }
  app.innerHTML = _html + _overlay;

  // Restore scroll positions
  app.querySelectorAll('.scroll').forEach((el, i) => { if (savedScrolls[`scroll:${i}`]) el.scrollTop = savedScrolls[`scroll:${i}`]; });
  app.querySelectorAll('.js-scroll').forEach(el => {
    const k = el.dataset.scrollKey;
    if (k && savedScrolls[`js:${k}`]) el.scrollTop = savedScrolls[`js:${k}`];
  });
  app.querySelectorAll('.chip-row').forEach((el, i) => { if (savedScrolls[`chip:${i}`]) el.scrollLeft = savedScrolls[`chip:${i}`]; });

  // Restore focus
  if (savedFocus) {
    let selector = `[data-action="${savedFocus.action}"]`;
    if (savedFocus.key) selector += `[data-key="${savedFocus.key}"]`;
    if (savedFocus.target) selector += `[data-target="${savedFocus.target}"]`;
    const newEl = app.querySelector(selector);
    if (newEl && (newEl.tagName === 'INPUT' || newEl.tagName === 'TEXTAREA')) {
      newEl.focus();
      try { if (savedFocus.pos != null) newEl.setSelectionRange(savedFocus.pos, savedFocus.pos); } catch(e) {}
    }
  }

  // Auto-Scroll: zum Pending-Returns-Block springen wenn Flag gesetzt (von go-pending-returns oder dash-scroll-pending-returns)
  if (state._scrollToPendingReturns && state.view === 'dashboard') {
    state._scrollToPendingReturns = false;
    setTimeout(() => {
      const anchor = document.getElementById('dashPendingReturnsAnchor');
      const scroll = anchor?.closest('.scroll');
      if (anchor && scroll) {
        const top = anchor.getBoundingClientRect().top - scroll.getBoundingClientRect().top + scroll.scrollTop - 12;
        scroll.scrollTo({ top, behavior: 'smooth' });
      }
    }, 60);
  }

  triggerEffects();
}

function triggerEffects() {
  clearTimers();
  if (state.view === 'listen') {
    state.listenTranscript = '';
    Speech.start(
      (txt) => {
        state.listenTranscript = txt;
        const el = document.getElementById('transcriptText');
        if (el) el.innerHTML = (txt || '').replace(/</g, '&lt;') + '<span class="cursor" style="background:var(--c-blue)"></span>';
      },
      (finalText) => {
        state.query = (finalText || state.listenTranscript || '').trim();
        if (state.view === 'listen') {
          if (state.query) go('results');
          else go('home');
        }
      },
    );
  } else if (state.view !== 'listen') {
    Speech.stop();
  }

  // Live-Kamera-Lifecycle
  if (state.view === 'camera') {
    // Erst nach DOM-Render wirken: Stream nur starten wenn Live-Element gerade sichtbar
    setTimeout(startLiveCameraIfNeeded, 30);
  } else if (state.view === 'wizardTrackerScan') {
    setTimeout(startLiveTrackerScan, 30);
  } else {
    Camera.stop();
    stopLiveTrackerScan();
  }

  // Cropper nach Render initialisieren
  if (state.view === 'cropper') {
    setTimeout(setupCropper, 30);
  }

  // Swipe-Gesten in Detail-Galerie aktivieren
  if (state.view === 'detail') {
    setTimeout(setupGallerySwipe, 30);
  }

  // aiAnalyze wird jetzt von runPhotoSearch() gesteuert (echte AI), keine Mock-Animation mehr
}

function go(view, opts = {}) {
  // Navigations-Historie für Swipe-Back: aktueller View wird gepusht bevor wir wechseln,
  // außer wenn wir explizit zurücknavigieren oder zur Home springen.
  const pushHistory = opts.pushHistory !== false;
  if (pushHistory && state.view && state.view !== view) {
    state.navHistory = state.navHistory || [];
    state.navHistory.push(state.view);
    if (state.navHistory.length > 30) state.navHistory.shift();
  }
  state.view = view;
  if (view !== 'detail') { state.quickEdit = null; state.quickLocDraft = null; state.saleDraft = null; state.returnDraft = null; }
  if (view !== 'users') { state.userDraft = null; state.userDeleteConfirm = null; }
  if (view !== 'list') { state.listClearConfirm = false; }
  state.locAddingFor = null; state.locAddDraft = ''; state.locManageMode = null;
  if (view !== 'results') state.editingQuery = false;
  if (view !== 'detail') state.detailTab = 'overview';
  if (view !== 'testStart') state.checks = { visual: false, connect: false, label: false };
  if (view !== 'testResult') state.testChosen = null;
  if (view === 'home') { state.item = null; state.testResult = null; state.galleryIndex = 0; state.wizardStep = null; state.homeFilterCond = 'all'; state.homeFilterFunc = 'all'; state.homeFilterOpen = null; state.navHistory = []; }
  if (view === 'camera') { state.cameraShowLive = true; }
  // Cropper-Cleanup: bei Verlassen des Cropper-Flows Object-URL freigeben
  if (view !== 'cropper' && state.cropper) {
    try { URL.revokeObjectURL(state.cropper.imageUrl); } catch(_) {}
    state.cropper = null;
  }
  if (view !== 'voice' && view !== 'saved' && view !== 'camera' && view !== 'cropper' && view !== 'wizardCat' && view !== 'wizardDesc' && view !== 'wizardTracker' && view !== 'wizardTrackerScan' && view !== 'wizardLoc' && view !== 'wizardStock' && view !== 'wizardShop' && view !== 'wizardSummary') {
    // Aufnahme-State komplett zurücksetzen wenn der Anlege-Flow verlassen wird
    state.voicePhase = 'idle';
    state.voiceTranscript = '';
    state.voiceFields = { name: '', maker: '', cat: '', owner: '', stock: '1', tracker: '', trackerUrl: '', vp: '', inShop: false };
    state.voiceLocDraft = { hall: '', shelf: '', pos: '', box: '' };
    (state.voicePhotoPreviews || []).forEach(u => { try { URL.revokeObjectURL(u); } catch(_) {} });
    state.voicePhotoFiles = [];
    state.voicePhotoPreviews = [];
  }
  // Kategorie-Manage-Modus / Inline-Add nur auf Screens behalten, die ihn nutzen können (wizardCat, edit, voice)
  if (view !== 'wizardCat' && view !== 'edit' && view !== 'voice') {
    state.catManageMode = false;
    state.catAdding = false;
    state.catAddDraft = '';
  }
  // Besitzer-Manage / Inline-Add zurücksetzen wenn nicht auf einem Screen mit Owner-Picker
  if (view !== 'wizardDesc' && view !== 'edit' && view !== 'voice' && view !== 'bestand') {
    state.ownerManageMode = false;
    state.ownerAdding = false;
    state.ownerAddDraft = '';
  }
  render();
}

async function handleLogin() {
  const key = (state.loginInput || '').trim();
  if (!key) { state.loginError = 'Bitte Schl\u00fcssel eingeben'; render(); return; }
  state.loginPending = true; state.loginError = ''; render();
  try {
    await loginWithUserKey(key);
    state.loginPending = false;
    state.loggedIn = true;
    state.loginInput = '';
    render();
    showToast('Willkommen, ' + (APP_KEYS.user.name || 'Benutzer'), 'success');
    await bootData();
  } catch (err) {
    state.loginPending = false;
    state.loginError = err.message || 'Login fehlgeschlagen';
    render();
  }
}

document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-action="login-submit"]');
  if (!f) return;
  e.preventDefault();
  handleLogin();
});

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  switch (a) {
    case 'logout': if (confirm('Wirklich abmelden?')) logout(); break;
    case 'go-home': go('home'); break;

    /* Company switcher / editor */
    case 'open-company-switcher':
      state.companySwitcherOpen = true;
      render();
      break;
    case 'close-company-switcher':
      state.companySwitcherOpen = false;
      render();
      break;
    case 'select-company': {
      const id = btn.dataset.id;
      if (state.activeCompanyId !== id) {
        state.activeCompanyId = id;
        // Reset state that's tied to the previous company's data
        state.item = null;
        state.editForm = null;
        state.bestandFilter = 'all';
        state.bestandMaker = 'all';
        state.bestandCond = 'all';
        state.bestandFunc = 'all';
        state.bestandOwner = 'all';
        state.bestandQuery = '';
        state.bestandFiltersExpanded = false;
        state.locManageMode = null;
        state.locAddingFor = null;
      }
      state.companySwitcherOpen = false;
      go('home');
      break;
    }
    case 'add-company':
      state.editingCompany = { id: null, name: '', color: COMPANY_COLORS[state.companies.length % COMPANY_COLORS.length] };
      state.companySwitcherOpen = false;
      render();
      break;
    case 'edit-company': {
      const c = state.companies.find(x => x.id === btn.dataset.id);
      if (c) {
        state.editingCompany = { id: c.id, name: c.name, color: c.color };
        state.companySwitcherOpen = false;
        render();
      }
      break;
    }
    case 'company-color':
      if (state.editingCompany) { state.editingCompany.color = btn.dataset.col; render(); }
      break;
    case 'cancel-company-edit':
      state.editingCompany = null;
      render();
      break;
    case 'save-company': {
      const eC = state.editingCompany;
      if (!eC || !(eC.name || '').trim()) break;
      const isNew = !eC.id;
      let c;
      if (eC.id) {
        c = state.companies.find(x => x.id === eC.id);
        if (c) { c.name = eC.name.trim(); c.color = eC.color; }

    /* ===== Kunden-Selbstregistrierung (öffentlich, vor Login) ===== */
    case 'go-register': {

    case 'go-login': {
      // Aus Register zurück zum Login-Screen

    }
    case 'register-submit': {
      const d = state.registerDraft || {};
      const errors = {};
      const fn = (d.firstName || '').trim();
      const ln = (d.lastName || '').trim();
      const em = (d.email || '').trim();
      if (!fn) errors.firstName = 'Vorname fehlt';
      if (!ln) errors.lastName = 'Nachname fehlt';
      if (!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) errors.email = 'Bitte gültige Email-Adresse';
      if (Object.keys(errors).length) {
        state.registerErrors = errors;
        state.registerError = 'Bitte alle Pflichtfelder ausfüllen';
        render();
        break;
      }
      state.registerPending = true;
      state.registerError = '';
      state.registerErrors = {};
      render();
      (async () => {
        try {
          // Schritt 1: Public-Read-Token nutzen um den Customer-Register-Schreibtoken zu holen
          // (separater Key, der nur User-Anlegen darf — kein voller Write-Zugang vor Login)
          const readHeaders = { 'Authorization': 'Bearer ' + APP_CONFIG.AIRTABLE_READ_KEY };
          const registerKeyRes = await fetch(
            'https://api.airtable.com/v0/' + APP_CONFIG.MASTER_BASE_ID + '/Keys?filterByFormula=' + encodeURIComponent(`AND({project_id}='${APP_CONFIG.PROJECT_ID}',{key_name}='customerRegisterKey')`),
            { headers: readHeaders }
          );
          let registerKey = '';
          if (registerKeyRes.ok) {
            const data = await registerKeyRes.json();
            registerKey = data.records?.[0]?.fields?.key_value || '';
          }
          if (!registerKey) {
            state.registerPending = false;
            state.registerError = 'Registrierung aktuell nicht eingerichtet. Bitte FLP-Team kontaktieren: service@flp-shop.com';
            render();
            return;
          }

          // Schritt 2: Existierende User prüfen — öffentlich lesbar
          const userListRes = await fetch(
            'https://api.airtable.com/v0/' + APP_CONFIG.APP_BASE_ID + '/User',
            { headers: readHeaders }
          );
          let existing = [];
          if (userListRes.ok) {
            const ulData = await userListRes.json();
            existing = (ulData.records || []).map(recordToUser);
          }
          const emailLower = em.toLowerCase();
          if (existing.some(u => (u.email || '').toLowerCase() === emailLower)) {
            state.registerPending = false;
            state.registerError = 'Diese Email-Adresse ist schon registriert. Bitte mit dem bestehenden Code einloggen.';
            render();
            return;
          }

          // Schritt 3: tenant_key vom ersten Admin übernehmen, damit Customer Inventory sieht
          const adminTenant = existing.find(u => u.role === 'admin' && u.tenantKey)?.tenantKey || '';
          const apiKey = generateApiKey();
          const newUserFields = {
            name: `${fn} ${ln}`.trim(),
            first_name: fn,
            last_name: ln,
            email: em,
            role: 'customer',
            status: 'aktiv',
            api_key: apiKey,
            created: nowIso(),
          };
          if ((d.phone || '').trim()) newUserFields.phone = (d.phone || '').trim();
          if ((d.company || '').trim()) newUserFields.company_name = (d.company || '').trim();
          if (adminTenant) newUserFields.tenant_key = adminTenant;

          // Schritt 4: Mit Customer-Register-Token schreiben
          const writeRes = await fetch(
            'https://api.airtable.com/v0/' + APP_CONFIG.APP_BASE_ID + '/User',
            {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + registerKey,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ fields: newUserFields }),
            }
          );
          if (!writeRes.ok) {
            const errText = await writeRes.text();
            throw new Error('User konnte nicht angelegt werden (HTTP ' + writeRes.status + ')' + (errText ? ': ' + errText.slice(0, 200) : ''));
          }
          const writeData = await writeRes.json();

          state.registerCreatedUser = {
            _recordId: writeData.id || '',
            name: `${fn} ${ln}`.trim(),
            firstName: fn,
            lastName: ln,
            email: em,
            phone: (d.phone || '').trim(),
            companyName: (d.company || '').trim(),
            role: 'customer',
            status: 'aktiv',
            apiKey,
            tenantKey: adminTenant,
          };
          state.registerPending = false;
          state.view = 'registerSuccess';
          render();
        } catch (e) {
          state.registerPending = false;
          state.registerError = 'Anlegen fehlgeschlagen: ' + (e?.message || 'unbekannter Fehler');
          render();
        }
      })();
      break;
    }
    case 'register-continue': {
      // Vom Success-Screen direkt einloggen mit dem frisch erzeugten Code
      const u = state.registerCreatedUser;
      const apiKey = u?.apiKey || '';
      state.registerCreatedUser = null;
      state.registerDraft = null;
      if (!apiKey) { state.view = 'home'; render(); break; }
      state.loginInput = apiKey;

      (async () => {

          state.loggedIn = true;
          render();
          await bootData();
        } catch(e) {
          showToast('Auto-Login fehlgeschlagen — bitte Code manuell eintragen', 'error', 3000);

        }

      break;

    case 'toggle-device-mode': {

      showToast(next === 'tablet'

    /* Foto-Suche → Schwellen lockern und neu auswerten (kein neuer API-Call) */
    case 'photo-search-relax': {

    /* Foto-Suche → Manuelle Text-Suche mit Vorbelegung */
    case 'photo-search-as-text': {

    /* ====== Wizard ====== */

      state.voiceFields = {

        stock: '1',
        tracker: '', trackerUrl: '',

      };
      state.voiceLocDraft = { hall: '', shelf: '', pos: '', box: '' };
      state.voiceCond = 'neu';
      state.voiceFunc = 'untested';
      state.voicePhase = 'idle';
      state.voiceTranscript = '';
      (state.voicePhotoPreviews || []).forEach(u => { try { URL.revokeObjectURL(u); } catch(_) {} });
      state.voicePhotoFiles = [];
      state.voicePhotoPreviews = [];
      state.galleryIndex = 0;
      state.cameraShowLive = true;
      // Wenn Kategorie schon erkannt: Step 1 trotzdem anzeigen aber mit Vor-Auswahl, sonst Step 1 leer

    }
    case 'wizard-start': {
      // iPad-Modus: Anlegen ist deaktiviert. Hinweis + Abbruch.

        showToast('Anlegen ist im iPad-Modus deaktiviert. Wechsle oben in den Mobil-Modus.', 'info', 3200);
        break;
      }
      // Anlege-State sauber resetten (analog zu go() für Schritt 1)
      state.voiceFields = { name: '', maker: '', cat: '', owner: '', stock: '1', tracker: '', trackerUrl: '', vp: '', inShop: false };
      state.voiceLocDraft = { hall: '', shelf: '', pos: '', box: '' };

    case 'wiz-cancel': {

    case 'wiz-cat-add': {

        state.wizardStep = 3; go('wizardDesc');

    case 'wiz-preview-close': {

      break;

    case 'wiz-preview-next': {

    /* Step 4 — Tracker / QR */
    case 'wiz-tracker-from-photos': autoScanFirstPhotoForTracker((state.voicePhotoFiles || [])[0], { force: true }); break;
    case 'wiz-tracker-live': go('wizardTrackerScan'); break;
    case 'wiz-tracker-scan-stop': go('wizardTracker'); break;
    case 'wiz-tracker-snap': snapTrackerFromCamera(); break;

    /* Step 4 — Eigener Ziffernblock */
    case 'wiz-kp-digit': {
      const d = btn.dataset.d || '';
      let cur = String(state.voiceFields.tracker || '');

      if (cur.length >= 12) break;
      cur = cur + d;
      state.voiceFields.tracker = cur;
      state.voiceFields.trackerUrl = TRACKER_URL_BASE + cur;

    case 'wiz-kp-back': {

    }
    case 'wiz-kp-next': {

      go('wizardLoc');
      break;
    }
    case 'dash-set-range': state.dashRange = btn.dataset.range || '30d'; render(); break;
    case 'cleanup-merge-maker': {
      if (!isAdmin()) { showToast('Nur Admins', 'info', 2200); break; }
      const norm = btn.dataset.norm;
      const canonical = btn.dataset.canonical;
      if (!norm || !canonical) break;
      mergeMakerDuplicates(norm, canonical);
      break;
    }
    case 'cleanup-merge-model': {
      if (!isAdmin()) { showToast('Nur Admins', 'info', 2200); break; }
      const mNorm = btn.dataset.mnorm || '';
      const tNorm = btn.dataset.tnorm;
      const canonical = btn.dataset.canonical;
      if (!tNorm || !canonical) break;
      mergeModelDuplicates(mNorm, tNorm, canonical);
      break;
    }
    case 'dash-set-cat': state.dashCat = btn.dataset.cat || 'all'; render(); break;
    case 'dash-set-maker': state.dashMaker = btn.dataset.maker || 'all'; render(); break;
    case 'dash-scroll-pending-returns': {
      // KPI-Tile angeklickt → smooth-scroll zum Pending-Returns-Block
      const anchor = document.getElementById('dashPendingReturnsAnchor');
      const scroll = anchor?.closest('.scroll');
      if (anchor && scroll) {
        const top = anchor.getBoundingClientRect().top - scroll.getBoundingClientRect().top + scroll.scrollTop - 12;
        scroll.scrollTo({ top, behavior: 'smooth' });
      }
      break;
    }
    case 'go-photo-search': go('photoSearch'); break;
    case 'go-test-start': go('testStart'); break;
    case 'go-test-result': go('testResult'); break;
    case 'go-detail': go('detail'); break;
    case 'go-edit': {
      const it = state.item;
      if (!it) break;
      state.editForm = {
        title: it.title || '',
        description: it.description || '',
        maker: it.maker || '',
        cat: it.cat || '',
        owner: it.owner || '',
        loc: it.loc || '',
        locDraft: parseLoc(it.loc || ''),
        cond: it.cond || 'used',
        func: it.func || 'unknown',
        tracker: it.tracker || '',
        trackerUrl: it.trackerUrl || '',
        // Webshop
        vp: it.vp != null ? it.vp : '',
        inShop: !!it.inShop,
        sold: !!it.sold,
        soldAt: it.soldAt || '',
        _wasSold: !!it.sold, // Merker für Sold-Trigger beim Speichern
        // Tiefe Kopie der Specs damit Cancel ohne Nebenwirkungen geht
        specs: Array.isArray(it.specs) ? it.specs.map(p => [String(p[0] ?? ''), String(p[1] ?? '')]) : [],
      };
      go('edit');
      break;
    }
    case 'cancel-edit':
      state.editForm = null;
      go('detail');
      break;
    case 'save-edit': {
      if (!state.item || !state.editForm) break;
      const f = state.editForm;
      if (f.locDraft) f.loc = buildLoc(f.locDraft);
      // Leere Spec-Zeilen herausfiltern (User hat "+" gedrückt aber nichts ausgefüllt)
      if (Array.isArray(f.specs)) {
        f.specs = f.specs
          .map(p => [String(p[0] ?? '').trim(), String(p[1] ?? '').trim()])
          .filter(p => p[0] || p[1]);
      }
      // VP normalisieren: leerer String → null, Komma → Punkt, parseFloat
      if (f.vp === '' || f.vp == null) {
        f.vp = null;
      } else {
        const n = parseFloat(String(f.vp).replace(',', '.'));
        f.vp = isNaN(n) ? null : Math.max(0, n);
      }
      // Hersteller dedupen — wenn schon eine ähnliche Schreibweise im Bestand, übernehmen
      if (f.maker) f.maker = normalizeMakerForSave(f.maker);
      // Title dedupen gegen bestehende Modelle des Herstellers
      if (f.title) f.title = normalizeTitleForSave(f.title, f.maker);
      // Sold-Trigger: erst beim Speichern feuern (nicht beim Toggle, damit Cancel keinen falschen Push auslöst)
      const justSold = f.sold && !f._wasSold;
      const { locDraft, _wasSold, ...saveData } = f;
      const it = state.item;
      Object.assign(it, saveData);

    /* Webshop-Toggles im Edit-Form (admin) */
    case 'edit-toggle-inshop': if (state.editForm && isAdmin()) { state.editForm.inShop = !state.editForm.inShop; render(); } break;
    case 'edit-toggle-sold': {
      if (!state.editForm || !isAdmin()) break;

      state.editForm.sold = !wasSold;

      }

    /* Aktuelles Wizard-Foto freistellen (Hintergrund entfernen via KI) — nutzt galleryIndex */
    case 'bg-remove-current': {

      bgRemoveWizardPhoto(state.galleryIndex || 0);
      break;
    }
    /* Hauptfoto freistellen (Hintergrund entfernen via KI) */
    case 'bg-remove-first':
      if (!isAdmin()) { showToast('Freistellen ist nur für Admins', 'info', 2400); break; }
      bgRemoveFirstPhoto(); break;
    case 'edit-bg-remove-current':
      if (!isAdmin()) { showToast('Freistellen ist nur für Admins', 'info', 2400); break; }
      bgRemoveItemPhoto(state.galleryIndex || 0); break;
    case 'edit-bg-remove-undo':

    /* Bestehendes Item-Foto neu zuschneiden — öffnet Cropper mit Replace-Modus */
    case 'photo-recrop': {
      const idx = +btn.dataset.idx;
      const it = state.item;
      if (!it || !it.photo || idx < 0 || idx >= it.photo.length) break;
      startRecropExistingPhoto(idx);
      break;
    }

    /* Tracker / QR aus dem aktuellen Foto rescannen */
    case 'rescan-tracker': {
      const files = state.voicePhotoFiles || [];
      const f = files[0];
      if (!f) { showToast('Erst ein Foto aufnehmen', 'info', 2000); break; }
      autoScanFirstPhotoForTracker(f, { force: true });
      break;
    }
    /* Edit-Form: Tracker aus den bereits am Item hängenden Fotos scannen */
    case 'edit-scan-label': {
      scanItemPhotosForTracker();
      break;
    }
    /* Generischer Copy-to-Clipboard via data-text-Attribut */
    case 'copy-text': {
      const text = btn.dataset.text || '';
      if (!text) break;
      copyTextToClipboard(text).then(ok => {
        if (ok) showToast('Link kopiert', 'success', 1800);
        else showToast('Kopieren fehlgeschlagen', 'error', 2400);
      });
      break;
    }

    /* Specs editieren — Add / Delete (Cell-Edits via input-Listener) */
    case 'edit-spec-add': {
      if (!state.editForm) break;
      if (!Array.isArray(state.editForm.specs)) state.editForm.specs = [];
      state.editForm.specs.push(['', '']);
      render();
      // Fokus auf das frische Label-Feld setzen
      setTimeout(() => {
        const idx = state.editForm.specs.length - 1;
        const el = document.querySelector(`[data-action="edit-spec-cell"][data-key="${idx}"][data-target="key"]`);
        if (el) el.focus();
      }, 30);
      break;
    }
    case 'edit-spec-delete': {
      if (!state.editForm || !Array.isArray(state.editForm.specs)) break;
      const i = +btn.dataset.idx;
      if (i >= 0 && i < state.editForm.specs.length) {
        state.editForm.specs.splice(i, 1);
        render();
      }
      break;
    }
    case 'voice-cat': state.voiceFields.cat = btn.dataset.cat; render(); break;
    case 'cat-manage-toggle':
      state.catManageMode = !state.catManageMode;
      state.catAdding = false;
      state.catAddDraft = '';
      render();
      break;
    case 'cat-add-start':
      state.catAdding = true;
      state.catAddDraft = '';
      render();
      break;
    case 'cat-add-cancel':
      state.catAdding = false;
      state.catAddDraft = '';
      render();
      break;
    case 'cat-add-save': {
      const v = (state.catAddDraft || '').trim();
      if (v && state.company && !(state.categories || []).includes(v)) {
        state.categories = [...(state.categories || []), v];
        // Im Wizard / Edit / Voice direkt als gewählte Kategorie setzen
        if (state.view === 'edit' && state.editForm) state.editForm.cat = v;
        if (state.view === 'voice' || state.view === 'wizardCat') {
          if (!state.voiceFields) state.voiceFields = {};
          state.voiceFields.cat = v;
        }
        persistCompanyHallsShelves(state.company);
      }
      state.catAdding = false;
      state.catAddDraft = '';
      render();
      break;
    }
    case 'cat-remove': {
      const v = btn.dataset.val;
      if (state.company) {
        state.categories = (state.categories || []).filter(c => c !== v);
        if (state.view === 'edit' && state.editForm && state.editForm.cat === v) state.editForm.cat = '';
        if ((state.view === 'voice' || state.view === 'wizardCat') && state.voiceFields?.cat === v) state.voiceFields.cat = '';
        persistCompanyHallsShelves(state.company);
      }
      render();
      break;
    }

    /* ===== Besitzer-Verwaltung (externe Eigentümer) ===== */
    case 'owner-manage-toggle': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Besitzer verwalten', 'info', 2400); break; }
      state.ownerManageMode = !state.ownerManageMode;
      state.ownerAdding = false;
      state.ownerAddDraft = '';
      render();
      break;
    }
    case 'owner-add-start': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Besitzer anlegen', 'info', 2400); break; }
      state.ownerAdding = true;
      state.ownerAddDraft = '';
      render();
      break;
    }
    case 'owner-add-cancel': state.ownerAdding = false; state.ownerAddDraft = ''; render(); break;
    case 'owner-add-save': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Besitzer anlegen', 'info', 2400); break; }
      const v = (state.ownerAddDraft || '').trim();
      if (v && state.company && !(state.owners || []).includes(v)) {
        state.owners = [...(state.owners || []), v];
        // Direkt selektieren je nach aktuellem Screen
        if (state.view === 'edit' && state.editForm) state.editForm.owner = v;
        if (state.view === 'wizardDesc' || state.view === 'voice') {
          if (!state.voiceFields) state.voiceFields = {};
          state.voiceFields.owner = v;
        }
        if (state.view === 'bestand') state.bestandOwner = v;
        persistCompanyHallsShelves(state.company);
      }
      state.ownerAdding = false;
      state.ownerAddDraft = '';
      render();
      break;
    }
    case 'owner-remove': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Besitzer entfernen', 'info', 2400); break; }
      const v = btn.dataset.val;
      if (state.company) {
        state.owners = (state.owners || []).filter(o => o !== v);
        // Hinweis: Items behalten ihren Owner-Eintrag — der Name verschwindet nur aus der Vorschlagsliste,
        // bleibt am Item bis manuell entfernt. So gehen keine Daten verloren.
        if (state.view === 'edit' && state.editForm?.owner === v) state.editForm.owner = '';
        if ((state.view === 'wizardDesc' || state.view === 'voice') && state.voiceFields?.owner === v) state.voiceFields.owner = '';
        if (state.view === 'bestand' && state.bestandOwner === v) state.bestandOwner = 'all';
        persistCompanyHallsShelves(state.company);
      }
      render();
      break;
    }
    case 'edit-pick-owner': {
      if (state.editForm) { state.editForm.owner = btn.dataset.owner || ''; render(); }
      break;
    }
    case 'wiz-pick-owner': {
      if (!state.voiceFields) state.voiceFields = {};
      state.voiceFields.owner = btn.dataset.owner || '';
      render();
      break;
    }
    case 'set-bestand-owner': {
      state.bestandOwner = btn.dataset.owner || 'all';
      render();
      break;
    }
    case 'edit-cond': if (state.editForm) { state.editForm.cond = btn.dataset.id; render(); } break;
    case 'edit-func': if (state.editForm) { state.editForm.func = btn.dataset.id; render(); } break;
    case 'edit-loc-hall': if (state.editForm) { state.editForm.locDraft = state.editForm.locDraft || { hall:'', shelf:'', pos:'', box:'' }; state.editForm.locDraft.hall = btn.dataset.val; render(); } break;
    case 'edit-loc-shelf': if (state.editForm) { state.editForm.locDraft = state.editForm.locDraft || { hall:'', shelf:'', pos:'', box:'' }; state.editForm.locDraft.shelf = btn.dataset.val; render(); } break;
    case 'edit-loc-clear': if (state.editForm) { state.editForm.locDraft = state.editForm.locDraft || { hall:'', shelf:'', pos:'', box:'' }; state.editForm.locDraft[btn.dataset.target] = ''; render(); } break;
    case 'edit-delete': {
      if (!confirm('Artikel wirklich aus dem Bestand entfernen?\nDiese Aktion kann nicht r\u00fcckg\u00e4ngig gemacht werden.')) break;
      const it = state.item;
      const idx = inventory.findIndex(x => x.id === it.id);
      setLoading(true, 'L\u00f6sche \u2026');
      airDelete(TBL_ITEMS, it._recordId)
        .then(() => {
          if (idx >= 0) inventory.splice(idx, 1);
          showToast('Artikel gel\u00f6scht', 'success');
          state.item = null;
          state.editForm = null;
          go('home');
        })
        .catch(err => showToast('L\u00f6schen fehlgeschlagen: ' + err.message, 'error', 3500))
        .finally(() => setLoading(false));
      break;
    }
    case 'regenerate-specs': regenerateSpecs(); break;
    case 'quick-cond': state.quickEdit = 'cond'; render(); break;
    case 'quick-func': state.quickEdit = 'func'; render(); break;
    case 'quick-loc': state.quickEdit = 'loc'; state.quickLocDraft = state.item ? parseLoc(state.item.loc) : { hall: '', shelf: '', pos: '', box: '' }; state.locAddingFor = null; state.locAddDraft = ''; state.locManageMode = null; render(); break;
    case 'close-quick': state.quickEdit = null; state.quickLocDraft = null; state.locAddingFor = null; state.locAddDraft = ''; state.locManageMode = null; state.saleDraft = null; state.returnDraft = null; render(); break;

    /* ===== Customer-Onboarding (3 Schritte beim ersten Login) ===== */
    case 'onboard-next': {
      const step = state.customerOnboardStep || 1;
      if (step < 3) {
        state.customerOnboardStep = step + 1;
        state.customerOnboarding = true;
      } else {
        markCustomerOnboarded();
        state.customerOnboarding = false;
        state.customerOnboardStep = 0;
      }
      render();
      break;
    }
    case 'onboard-back': {
      const step = state.customerOnboardStep || 1;
      state.customerOnboardStep = Math.max(1, step - 1);
      render();
      break;
    }
    case 'onboard-skip': {
      // Customer überspringt — wir merken uns das aber speichern Onboard nicht als „erledigt"
      // damit der User es per Info-Button noch mal aufrufen kann
      markCustomerOnboarded();
      state.customerOnboarding = false;
      state.customerOnboardStep = 0;
      state.customerOnboardSkipped = true;
      render();
      break;
    }
    case 'onboard-pick-lager': {
      const id = btn.dataset.id;
      if (id) state.activeCompanyId = id;
      render();
      break;
    }
    case 'onboard-finish': {
      markCustomerOnboarded();
      state.customerOnboarding = false;
      state.customerOnboardStep = 0;
      state.customerOnboardSkipped = true;
      render();
      break;
    }
    case 'show-onboard-again': {
      // Vom Info-Button im Customer-Home aufgerufen
      state.customerOnboarding = true;
      state.customerOnboardStep = 1;
      render();
      break;
    }

    /* ===== Install-to-Home Hilfe-Sheet ===== */
    case 'show-install-help': {
      state.installHelpOpen = true;
      render();
      break;
    }
    case 'close-install-help': {
      state.installHelpOpen = false;
      render();
      break;
    }
    case 'dismiss-install': {
      dismissInstallBanner();
      render();
      break;
    }

    /* Customer-Anfrage-Sheet — POSTet an Freshdesk-Proxy (Phase B); Phase A: zeigt Hinweis falls Proxy fehlt */
    case 'open-inquiry-sheet': {
      if (!state.item) break;
      state.quickEdit = 'inquiry';
      state.inquiryDraft = { note: '' };
      state.inquirySent = false;
      state.inquirySending = false;
      state.inquiryError = '';
      render();
      break;
    }
    case 'send-inquiry': {
      if (state.inquirySending) break;
      const it = state.item;
      if (!it) break;
      const u = APP_KEYS.user || {};
      const draft = state.inquiryDraft || {};
      const note = (draft.note || '').trim();
      const customerName = [u.firstName, u.lastName].filter(Boolean).join(' ') || u.name || 'Kunde';
      const customerEmail = (u.email || '').trim();
      if (!customerEmail) {
        state.inquiryError = 'Keine Email-Adresse hinterlegt — bitte beim Support melden';
        render();
        break;
      }
      const co = state.company;
      const activeCoName = co?.name || '';

      // Deep-Link zum Artikel im Stock Manager (Admin kann das öffnen)
      const baseUrl = (location.origin + location.pathname).replace(/\/loader\.html$/i, '/');
      const articleLink = baseUrl + '?item=' + encodeURIComponent(it.id);

      const subject = `[Stockmanager] Anfrage zu ${it.title} (#${it.id})`;
      const description = [
        `Neue Kunden-Anfrage über FLP Stockmanager:`,
        ``,
        `Artikel: ${it.title}`,
        `Artikel-Nr.: ${it.id}`,
        it.maker ? `Hersteller: ${it.maker}` : '',
        it.cat ? `Kategorie: ${it.cat}` : '',
        activeCoName ? `Lager: ${activeCoName}` : '',
        ``,
        `Link im Stockmanager: ${articleLink}`,
        ``,
        '----- Nachricht des Kunden -----',
        note || '(keine zusätzliche Nachricht)',
        ``,
        `----- Absender -----`,
        `Name: ${customerName}`,
        `Email: ${customerEmail}`,
        u.phone ? `Telefon: ${u.phone}` : '',
        u.companyName ? `Firma: ${u.companyName}` : '',
      ].filter(Boolean).join('\n');

      const proxyUrl = APP_KEYS.inquiryProxyUrl || '';
      const proxyToken = APP_KEYS.inquiryProxyToken || '';

      if (!proxyUrl) {
        // Fallback: Mailto öffnen — falls Backend noch nicht eingerichtet
        const mailto = 'mailto:service@flp-shop.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(description);
        window.location.href = mailto;
        // Trotzdem als „gesendet" markieren, damit der User Feedback bekommt
        state.inquirySent = true;
        state.inquirySending = false;
        render();
        break;
      }

      // Mit Proxy: Echtes Freshdesk-Ticket via POST
      state.inquirySending = true;
      state.inquiryError = '';
      render();
      (async () => {
        try {
          const payload = {
            subject,
            description,
            email: customerEmail,
            name: customerName,
            phone: u.phone || '',
            company: u.companyName || '',
            item_id: it.id,
            item_title: it.title,
            item_maker: it.maker || '',
            item_url: articleLink,
            company_name: activeCoName,
          };
          const headers = { 'Content-Type': 'application/json' };
          if (proxyToken) headers['Authorization'] = 'Bearer ' + proxyToken;
          const res = await fetch(proxyUrl, {
            method: 'POST',
            headers,
            body: JSON.stringify(payload),
          });
          if (!res.ok) {
            const txt = await res.text();
            throw new Error('HTTP ' + res.status + (txt ? ': ' + txt.slice(0, 200) : ''));
          }
          state.inquirySent = true;
          state.inquirySending = false;
          render();
        } catch (e) {
          state.inquirySending = false;
          state.inquiryError = 'Anfrage konnte nicht gesendet werden: ' + (e?.message || 'unbekannter Fehler') + '. Bitte später erneut versuchen oder eine Email an service@flp-shop.com senden.';
          render();
        }
      })();
      break;
    }
    /* Customer-Manuell-Suche — geht zum Home und fokussiert das Search-Input */
    case 'go-manual-search': {
      state.query = '';
      go('home');
      setTimeout(() => {
        const inp = document.querySelector('[data-action="manual-search-input"], [data-action="query-input"]');
        if (inp) inp.focus();
      }, 80);
      break;
    }

    /* Service-Tausch / Verkauf eintragen aus Detail-Screen (Iteration 1) */
    case 'open-sale-sheet': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Verkäufe eintragen', 'info', 2400); break; }
      if (!state.item || state.item.sold) break;
      state.quickEdit = 'sale';
      state.saleDraft = {
        saleType: 'sale',
        orderNumber: state.item.orderNumber || '',
        vp: state.item.vp != null ? String(state.item.vp).replace('.', ',') : '',
      };
      render();
      break;
    }
    case 'set-sale-type': {
      if (state.saleDraft) { state.saleDraft.saleType = btn.dataset.type || 'sale'; render(); }
      break;
    }
    case 'sale-order-input': /* handled by input event */ break;
    case 'sale-vp-input': /* handled by input event */ break;
    /* Service-Tausch-Rücksendung anlegen (Iteration 2) */
    case 'open-return-sheet': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Rücksendungen erfassen', 'info', 2400); break; }
      if (!state.item || !isPendingReturn(state.item)) break;
      state.quickEdit = 'return';
      state.returnDraft = {
        loc: state.item.loc || '',
      };
      render();
      break;
    }
    case 'return-loc-input':  /* handled by input event */ break;
    case 'save-return': {
      if (!isAdmin() || !state.item || !state.returnDraft) break;
      const original = state.item;
      if (!isPendingReturn(original)) {
        showToast('Original ist keine offene Rücksendung mehr', 'error', 3000);
        state.quickEdit = null;
        state.returnDraft = null;
        render();
        break;
      }
      const company = state.company;
      if (!company) { showToast('Keine Firma aktiv', 'error'); break; }
      const d = state.returnDraft;
      const now = nowIso();

      // Neuen Artikel als defekte Rücksendung anlegen — Beschreibung bleibt leer, kommt später per Foto/Typenschild oder manuell
      const newItem = {
        id: shortId('A'),
        company_id: company.id,
        maker: original.maker || '',
        title: original.title || '',
        description: '',
        cat: original.cat || '',
        loc: (d.loc || '').trim() || original.loc || '',
        cond: 'used',
        func: 'defective',
        specs: [],
        photo: [],
        photoUrl: null,
        tracker: '',
        trackerUrl: '',
        vp: null,
        inShop: false,
        sold: false,
        soldAt: null,
        // Service-Tausch-Verlinkung — Original-RecordId; Original wird unten reziprok verlinkt
        saleType: '',
        orderNumber: original.orderNumber || '',
        linkedItemId: original._recordId || '',
        returnedAt: null,
        created: now,
        updated: now,
        upd: 'gerade eben',
      };

      setLoading(true, 'Rücksendung wird angelegt …');
      airWrite(TBL_ITEMS, itemToFields(newItem, teamKey()))
        .then(rec => {
          newItem._recordId = rec.id;
          // Original-Item updaten: returnedAt + linkedItemId auf neuen Record
          original.returnedAt = now;
          original.linkedItemId = rec.id;
          original.updated = now;
          original.upd = 'gerade eben';
          // Lokal in Inventory aufnehmen (vorne)
          company.inventory.unshift(newItem);
          // Original asynchron persistieren
          return persistItemPatch(original, {
            returned_at: now,
            linked_item_id: rec.id,
          }).then(() => rec);
        })
        .then(() => {
          showToast('Rücksendung erfasst & verknüpft', 'success', 2800);
          // Auf neuen Artikel navigieren
          state.item = newItem;
          state.galleryIndex = 0;
          state.quickEdit = null;
          state.returnDraft = null;
          go('detail');
        })
        .catch(err => {
          showToast('Anlegen fehlgeschlagen: ' + err.message, 'error', 3500);
          state.quickEdit = null;
          state.returnDraft = null;
          render();
        })
        .finally(() => setLoading(false));
      break;
    }
    case 'save-sale': {
      if (!isAdmin() || !state.item || !state.saleDraft) break;
      const it = state.item;
      const d = state.saleDraft;
      // VP normalisieren
      let vp = it.vp;
      const vpRaw = (d.vp || '').trim();
      if (vpRaw === '') {
        // leer lassen → keine Änderung am bestehenden vp? Wir setzen explizit auf null wenn leer.
        vp = null;
      } else {
        const n = parseFloat(vpRaw.replace(',', '.'));
        vp = isNaN(n) ? it.vp : Math.max(0, n);
      }
      const saleType = d.saleType === 'service-exchange' ? 'service-exchange' : 'sale';
      const orderNumber = (d.orderNumber || '').trim();
      const soldAt = nowIso();
      // State aktualisieren
      it.sold = true;
      it.soldAt = soldAt;
      it.saleType = saleType;
      it.orderNumber = orderNumber;
      it.vp = vp;
      it.updated = soldAt;
      it.upd = 'gerade eben';
      // Persistieren — alle relevanten Felder (auch leere strings, damit Airtable überschreibt)
      persistItemPatch(it, {
        sold: '1',
        sold_at: soldAt,
        sale_type: saleType,
        order_number: orderNumber,
        vp: (vp != null && !isNaN(vp)) ? String(vp) : '',
      });
      state.quickEdit = null;
      state.saleDraft = null;
      const label = saleType === 'service-exchange' ? 'Service-Tausch eingetragen · Rücksendung erwartet' : 'Verkauf eingetragen';
      showToast(label, 'success', 2600);
      notifyArticleSold(it);
      render();
      break;
    }
    case 'set-quick-cond': {
      if (state.item) {
        state.item.cond = btn.dataset.id;
        state.item.updated = nowIso();
        state.item.upd = 'gerade eben';
        persistItemPatch(state.item, { cond: state.item.cond });
      }
      state.quickEdit = null;
      render();
      break;
    }
    case 'set-quick-func': {
      if (state.item) {
        state.item.func = btn.dataset.id;
        state.item.updated = nowIso();
        state.item.upd = 'gerade eben';
        persistItemPatch(state.item, { func: state.item.func });
      }
      state.quickEdit = null;
      render();
      break;
    }
    case 'save-quick-loc': {
      const newLoc = state.quickLocDraft ? buildLoc(state.quickLocDraft) : '';
      if (state.item && newLoc) {
        state.item.loc = newLoc;
        state.item.updated = nowIso();
        state.item.upd = 'gerade eben';
        persistItemPatch(state.item, { loc: newLoc });
      }
      state.quickEdit = null;
      state.quickLocDraft = null;
      state.locAddingFor = null;
      state.locAddDraft = '';
      state.locManageMode = null;
      render();
      break;
    }
    case 'quick-loc-clear': if (state.quickLocDraft) { state.quickLocDraft[btn.dataset.target] = ''; render(); } break;
    case 'loc-add-start':
      if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); break; }
      state.locAddingFor = btn.dataset.target; state.locAddDraft = ''; render(); break;
    case 'loc-add-cancel': state.locAddingFor = null; state.locAddDraft = ''; render(); break;
    case 'loc-add-save': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); break; }
      const v = (state.locAddDraft || '').trim();
      const draft = getActiveLocDraft();
      let changed = false;
      if (v && draft) {
        if (state.locAddingFor === 'hall' && !state.halls.includes(v)) {
          state.halls.push(v); draft.hall = v; changed = true;
        } else if (state.locAddingFor === 'shelf' && !state.shelves.includes(v)) {
          state.shelves.push(v); draft.shelf = v; changed = true;
        }
      }
      state.locAddingFor = null;
      state.locAddDraft = '';
      if (changed) persistCompanyHallsShelves(state.company);
      render();
      break;
    }
    case 'loc-manage-toggle': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); break; }
      const target = btn.dataset.target;
      state.locManageMode = state.locManageMode === target ? null : target;
      state.locAddingFor = null;
      state.locAddDraft = '';
      render();
      break;
    }
    case 'loc-remove-hall': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); break; }
      const h = btn.dataset.val;
      state.halls = state.halls.filter(x => x !== h);
      const draft = getActiveLocDraft();
      if (draft && draft.hall === h) draft.hall = '';
      persistCompanyHallsShelves(state.company);
      // Zugehörigen Foto-Record asynchron löschen, falls vorhanden
      const photoRec = state.hallPhotos?.[h];
      if (photoRec?._recordId) {
        airDelete(TBL_HALLS, photoRec._recordId).catch(() => {});
        delete state.hallPhotos[h];
      }
      render();
      break;
    }
    /* Halle umbenennen */
    case 'hall-rename-start': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); break; }
      state.locRenamingHall = btn.dataset.val;
      state.locRenameDraft = btn.dataset.val;
      render();
      break;
    }
    case 'hall-rename-cancel': {
      state.locRenamingHall = null;
      state.locRenameDraft = '';
      render();
      break;
    }
    case 'hall-rename-save': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); break; }
      const oldName = btn.dataset.val;
      const newName = (state.locRenameDraft || '').trim();
      state.locRenamingHall = null;
      state.locRenameDraft = '';
      if (!newName || newName === oldName) { render(); break; }
      renameHallEverywhere(oldName, newName);
      break;
    }
    /* Hallen-Foto: Tap auf Karte im Verwalten-Modus → Datei-Picker öffnen */
    case 'hall-photo-pick': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); break; }
      const hallName = btn.dataset.hall || btn.dataset.val;
      if (!hallName) break;
      state._hallPhotoPickFor = hallName; // welche Halle bekommt das nächste Foto
      document.getElementById('hallPhotoInput')?.click();
      break;
    }
    case 'loc-remove-shelf': {
      if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); break; }
      const s = btn.dataset.val;
      state.shelves = state.shelves.filter(x => x !== s);
      const draft = getActiveLocDraft();
      if (draft && draft.shelf === s) draft.shelf = '';
      persistCompanyHallsShelves(state.company);
      render();
      break;
    }
    case 'quick-loc-hall': if (state.quickLocDraft) { state.quickLocDraft.hall = btn.dataset.val; render(); } break;
    case 'quick-loc-shelf': if (state.quickLocDraft) { state.quickLocDraft.shelf = btn.dataset.val; render(); } break;
    case 'set-bestand-filter': state.bestandFilter = btn.dataset.cat; render(); break;
    case 'set-bestand-maker':
      state.bestandMaker = btn.dataset.maker;
      // Wenn Hersteller geändert: Modell-Filter zurücksetzen, sonst Mismatch
      if (state.bestandModel && state.bestandModel !== 'all') {
        const stillVisible = getDedupedProductTitles(btn.dataset.maker === 'all' ? '' : btn.dataset.maker)
          .some(t => normalizeTitle(t) === normalizeTitle(state.bestandModel));
        if (!stillVisible) state.bestandModel = 'all';
      }
      render(); break;
    case 'set-bestand-model': state.bestandModel = btn.dataset.model; render(); break;
    case 'set-bestand-cond': state.bestandCond = btn.dataset.cond; render(); break;
    case 'set-bestand-func': state.bestandFunc = btn.dataset.func; render(); break;
    case 'set-bestand-sort': state.bestandSort = btn.dataset.sort; render(); break;
    case 'toggle-bestand-filters': state.bestandFiltersExpanded = !state.bestandFiltersExpanded; render(); break;
    case 'toggle-bestand-show-sold': state.bestandShowSold = !state.bestandShowSold; render(); break;
    case 'reset-bestand-filters': state.bestandFilter = 'all'; state.bestandMaker = 'all'; state.bestandModel = 'all'; state.bestandCond = 'all'; state.bestandFunc = 'all'; state.bestandOwner = 'all'; render(); break;
    case 'bestand-clear': state.bestandQuery = ''; render(); break;
    case 'select-item': {
      const it = inventory.find(i => i.id === btn.dataset.id);
      if (it) {
        state.item = it;
        state.galleryIndex = 0;
        go('detail');
        // Im Hintergrund frisch nachladen — sicher dass Fotos aktuell sind
        refreshItemPhotos(it).catch(() => {});
      }
      break;
    }
    case 'set-filter': state.filterIdx = +btn.dataset.idx; render(); break;
    case 'set-issues-tab': state.issuesTab = btn.dataset.tab; render(); break;
    case 'set-detail-tab': state.detailTab = btn.dataset.tab; render(); break;
    case 'query-edit': state.editingQuery = true; render(); break;
    case 'query-save': state.editingQuery = false; render(); break;
    case 'toggle-check': state.checks[btn.dataset.id] = !state.checks[btn.dataset.id]; render(); break;
    case 'set-test-result': state.testChosen = btn.dataset.id; render(); break;
    case 'save-test': state.testResult = state.testChosen; go('testSaved'); break;
    case 'listen-stop':
      Speech.stop();
      // onend f\u00fchrt die Navigation aus
      break;
    case 'capture-photo': go('aiAnalyze'); break;
    case 'capture-new-item': go('voice'); break;
    case 'open-camera': document.getElementById('cameraFileInput')?.click(); break;
    case 'open-gallery': document.getElementById('cameraGalleryInput')?.click(); break;

    /* Crop-Editor */
    case 'cropper-confirm': cropperConfirm(); break;
    case 'cropper-cancel': cropperCancel(); break;
    case 'cropper-reset': cropperReset(); break;

    /* Live-Camera */
    case 'cam-live-capture': captureLiveFrame(); break;
    case 'cam-flip': Camera.toggleFacing().catch(e => showToast('Kamera-Wechsel fehlgeschlagen: ' + e.message, 'error')); break;
    case 'cam-back-to-live': {
      // Vom Vorschau-Modus zurück zur Live-Kamera
      state.cameraShowLive = true;
      render();
      // Stream nach Re-Render starten
      setTimeout(startLiveCameraIfNeeded, 50);
      break;
    }
    case 'reset-camera-photo':
      // Object-URLs aufräumen
      (state.voicePhotoPreviews || []).forEach(u => { try { URL.revokeObjectURL(u); } catch(_) {} });
      state.voicePhotoFiles = [];
      state.voicePhotoPreviews = [];
      state.galleryIndex = 0;
      state.cameraShowLive = true;
      render();
      setTimeout(startLiveCameraIfNeeded, 30);
      break;
    case 'cam-photo-show':
      state.galleryIndex = +btn.dataset.idx || 0;
      state.cameraShowLive = false; // Tap auf Thumbnail → Preview-Modus
      render();
      break;
    case 'cam-photo-delete': {
      const i = +btn.dataset.idx;
      const previews = state.voicePhotoPreviews || [];
      if (i >= 0 && i < previews.length) {
        try { URL.revokeObjectURL(previews[i]); } catch(_) {}
        state.voicePhotoFiles = (state.voicePhotoFiles || []).filter((_, j) => j !== i);
        state.voicePhotoPreviews = previews.filter((_, j) => j !== i);
        state.galleryIndex = Math.min(state.galleryIndex || 0, Math.max(0, state.voicePhotoPreviews.length - 1));
        // Wenn nichts mehr übrig: zurück zur Live-Cam
        if (state.voicePhotoPreviews.length === 0) state.cameraShowLive = true;
      }
      render();
      if (state.cameraShowLive) setTimeout(startLiveCameraIfNeeded, 30);
      break;
    }
    case 'continue-to-voice':
      // Im Wizard: weiter zu Step 3 (Beschreibung). Sonst: altes Voice-Formular.
      if (state.wizardStep === 2) {
        state.wizardStep = 3;
        go('wizardDesc');
      } else {
        go('voice');
      }
      break;
    case 'open-photo-search-camera': document.getElementById('photoSearchInput')?.click(); break;

    /* Foto-Galerie: Navigation */
    case 'gallery-prev': {
      const photos = state.item?.photo || [];
      state.galleryIndex = Math.max(0, (state.galleryIndex || 0) - 1);
      render();
      break;
    }
    case 'gallery-next': {
      const photos = state.item?.photo || [];
      state.galleryIndex = Math.min(photos.length - 1, (state.galleryIndex || 0) + 1);
      render();
      break;
    }
    case 'gallery-goto': {
      state.galleryIndex = +btn.dataset.idx || 0;
      render();
      break;
    }
    case 'photo-delete': {
      const idx = +btn.dataset.idx;
      if (!confirm('Dieses Foto wirklich löschen?')) break;
      handleItemPhotoDelete(idx);
      break;
    }
    case 'photo-set-primary': {
      const idx = +btn.dataset.idx;
      handleItemPhotoSetPrimary(idx);
      break;
    }
    case 'voice-start': /* legacy \u2014 ersetzt durch Push-to-Talk (pttBtn) */ break;
    case 'voice-stop': Speech.stop(); break;
    case 'voice-redo':
      Speech.stop(true);
      state.voiceTranscript = '';
      state.voicePhase = 'idle';
      render();
      break;
    case 'voice-analyze': {
      const txt = (state.voiceTranscript || '').trim();
      if (!txt) break;
      state.voicePhase = 'analyzing';
      render();
      parseVoiceTranscript(txt);
      break;
    }
    case 'set-cond': state.voiceCond = btn.dataset.id; render(); break;
    case 'set-func': state.voiceFunc = btn.dataset.id; render(); break;
    case 'voice-loc-hall': { if (!state.voiceLocDraft) state.voiceLocDraft = { hall:'', shelf:'', pos:'', box:'' }; state.voiceLocDraft.hall = btn.dataset.val; render(); break; }
    case 'voice-loc-shelf': { if (!state.voiceLocDraft) state.voiceLocDraft = { hall:'', shelf:'', pos:'', box:'' }; state.voiceLocDraft.shelf = btn.dataset.val; render(); break; }
    case 'voice-loc-clear': { if (!state.voiceLocDraft) state.voiceLocDraft = { hall:'', shelf:'', pos:'', box:'' }; state.voiceLocDraft[btn.dataset.target] = ''; render(); break; }
    case 'save-new-item': {
      // Speichern erlaubt sobald Bezeichnung gesetzt ist (manuell ODER nach Diktat-Analyse)
      const nm = (state.voiceFields?.name || '').trim();
      if (nm) saveNewItemFromVoice();
      else showToast('Bezeichnung fehlt', 'error');
      break;
    }
  }
});

/* ============================================================
   PUSH-TO-TALK (Voice-Form Mic)
   ============================================================ */
function startPTT() {
  if (state.voicePhase === 'recording') return;
  state.voicePhase = 'recording';
  state.voiceTranscript = '';
  render();
  const ok = Speech.start(
    (txt) => {
      // Direkt nur Text-Knoten updaten (kein render() w\u00e4hrend Aufnahme)
      state.voiceTranscript = txt;
      const el = document.getElementById('voiceTranscriptText');
      if (el) el.innerHTML = (txt || '').replace(/</g, '&lt;') + '<span class="cursor" style="background:var(--c-red)"></span>';
    },
    (finalText) => {
      state.voiceTranscript = finalText || state.voiceTranscript;
      // KEIN automatisches Parsing! In Review-Phase wechseln
      if ((state.voiceTranscript || '').trim()) {
        state.voicePhase = 'review';
      } else {
        state.voicePhase = 'idle';
      }
      render();
    },
  );
  if (!ok) { state.voicePhase = 'idle'; render(); }
}
function stopPTT() {
  if (state.voicePhase === 'recording') Speech.stop();
}

document.addEventListener('pointerdown', (e) => {
  const btn = e.target.closest('[data-ptt]');
  if (!btn) return;
  e.preventDefault();
  try { btn.setPointerCapture(e.pointerId); } catch(_){}
  startPTT();
});
document.addEventListener('pointerup', (e) => {
  if (state.voicePhase !== 'recording') return;
  const btn = document.getElementById('pttBtn');
  if (btn) { try { btn.releasePointerCapture(e.pointerId); } catch(_){} }
  stopPTT();
});
document.addEventListener('pointercancel', (e) => {
  if (state.voicePhase === 'recording') stopPTT();
});

document.addEventListener('input', (e) => {
  const t = e.target;
  const a = t.dataset?.action;
  if (a === 'voice-transcript-edit') {
    state.voiceTranscript = t.value;
    return;
  }
  if (a === 'login-input') {
    state.loginInput = t.value;
    // Button-Disabled-Zustand aktualisieren ohne Re-Render (Fokus halten)
    const btn = document.querySelector('.login-btn');
    if (btn) btn.disabled = !t.value || state.loginPending;
    return;
  }
  if (a === 'manual-search-input') {
    state.query = t.value;
    // Live-Re-Render der Home-Treffer (Fokus bleibt durch focus-restore in render() erhalten)
    if (state.view === 'home') render();
  }
  else if (a === 'query-input') state.query = t.value;
  else if (a === 'voice-field') {
    state.voiceFields[t.dataset.key] = t.value;
    // Auto-URL: bei Eingabe der Tracker-Nummer den QR-Link automatisch aus dem Standard-Schema bauen
    if (t.dataset.key === 'tracker') {
      const num = String(t.value || '').trim();
      state.voiceFields.trackerUrl = num ? TRACKER_URL_BASE + num : '';
      // URL-Vorschau im Wizard live mitupdaten ohne komplettes re-render
      const preview = document.getElementById('wizTrackerUrlPreview');
      if (preview) preview.textContent = state.voiceFields.trackerUrl || '— wird automatisch erzeugt —';
    }
    // Wizard-Step 3 (wizardDesc): „Weiter"-Button live freischalten/sperren wenn Bezeichnung getippt wird
    if (state.view === 'wizardDesc' && t.dataset.key === 'name') {
      const nextBtn = document.getElementById('wizDescNext');
      if (nextBtn) {
        const has = !!String(t.value || '').trim();
        nextBtn.classList.toggle('wiz-actions__next--disabled', !has);
      }
    }
  }
  else if (a === 'voice-loc-pos') { if (!state.voiceLocDraft) state.voiceLocDraft = { hall:'', shelf:'', pos:'', box:'' }; state.voiceLocDraft.pos = t.value; }
  else if (a === 'voice-loc-box') { if (!state.voiceLocDraft) state.voiceLocDraft = { hall:'', shelf:'', pos:'', box:'' }; state.voiceLocDraft.box = t.value; }
  else if (a === 'bestand-query') { state.bestandQuery = t.value; render(); }
  else if (a === 'loc-add-input') state.locAddDraft = t.value;
  else if (a === 'hall-rename-input') state.locRenameDraft = t.value;
  else if (a === 'wiz-desc-text') state.voiceTranscript = t.value;
  else if (a === 'cat-add-input') state.catAddDraft = t.value;
  else if (a === 'owner-add-input') state.ownerAddDraft = t.value;
  else if (a === 'integration-input') {
    if (!state.integrationsDraft) state.integrationsDraft = {};
    state.integrationsDraft[t.dataset.key] = t.value;
  }
  else if (a === 'inquiry-note-input') {
    if (!state.inquiryDraft) state.inquiryDraft = { note: '' };
    state.inquiryDraft.note = t.value;
  }
  else if (a === 'customer-search-input') {
    state.customerSearch = t.value;
    if (state.view === 'home' && isCustomer()) render();
  }
  else if (a === 'register-input') {
    if (!state.registerDraft) state.registerDraft = { firstName:'', lastName:'', email:'', phone:'', company:'' };
    state.registerDraft[t.dataset.key] = t.value;
    // Live-Button-State updaten ohne kompletten Re-Render (Fokus halten)
    const d = state.registerDraft;
    const valid = !!((d.firstName || '').trim() && (d.lastName || '').trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((d.email || '').trim()));
    const btn = document.getElementById('registerSubmitBtn');
    if (btn) {
      btn.style.opacity = valid ? '1' : '.55';
      btn.style.cursor = 'pointer';
    }
  }
  else if (a === 'quick-loc-pos-input') { if (state.quickLocDraft) state.quickLocDraft.pos = t.value; }
  else if (a === 'quick-loc-box-input') { if (state.quickLocDraft) state.quickLocDraft.box = t.value; }
  else if (a === 'sale-order-input') { if (state.saleDraft) state.saleDraft.orderNumber = t.value; }
  else if (a === 'sale-vp-input') { if (state.saleDraft) state.saleDraft.vp = t.value; }
  else if (a === 'return-loc-input') { if (state.returnDraft) state.returnDraft.loc = t.value; }
  else if (a === 'user-name-input') { if (state.userDraft) state.userDraft.name = t.value; }
  else if (a === 'user-key-input')  { if (state.userDraft) state.userDraft.apiKey = t.value; }
  else if (a === 'edit-field' && state.editForm) state.editForm[t.dataset.key] = t.value;
  else if (a === 'edit-spec-cell' && state.editForm) {
    if (!Array.isArray(state.editForm.specs)) state.editForm.specs = [];
    const i = +t.dataset.key;
    const tgt = t.dataset.target; // 'key' | 'val'
    if (i >= 0 && i < state.editForm.specs.length) {
      const row = state.editForm.specs[i];
      if (tgt === 'key') row[0] = t.value;
      else if (tgt === 'val') row[1] = t.value;
    }
  }
  else if (a === 'edit-loc-pos' && state.editForm) { state.editForm.locDraft = state.editForm.locDraft || { hall:'', shelf:'', pos:'', box:'' }; state.editForm.locDraft.pos = t.value; }
  else if (a === 'edit-loc-box' && state.editForm) { state.editForm.locDraft = state.editForm.locDraft || { hall:'', shelf:'', pos:'', box:'' }; state.editForm.locDraft.box = t.value; }
  else if (a === 'company-name-input' && state.editingCompany) { state.editingCompany.name = t.value; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.target.dataset?.action === 'manual-search-input' && e.key === 'Enter' && state.query) go('results');
  else if (e.target.dataset?.action === 'loc-add-input' && e.key === 'Enter') {
    document.querySelector('[data-action="loc-add-save"]')?.click();
  }
  else if (e.target.dataset?.action === 'hall-rename-input' && e.key === 'Enter') {
    document.querySelector('[data-action="hall-rename-save"]')?.click();
  }
  else if (e.target.dataset?.action === 'hall-rename-input' && e.key === 'Escape') {
    document.querySelector('[data-action="hall-rename-cancel"]')?.click();
  }
  else if (e.target.dataset?.action === 'cat-add-input' && e.key === 'Enter') {
    document.querySelector('[data-action="cat-add-save"]')?.click();
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  const a = t.dataset?.action;
  if (!a) return;
  const file = t.files && t.files[0];
  if (!file) return;
  // Sehr gro\u00dfes File-Limit nur als Notbremse \u2014 Bilder werden vor Upload auf <500 KB optimiert.
  if (file.size > 50 * 1024 * 1024) {
    showToast('Datei zu gro\u00df (max. 50 MB)', 'error');
    t.value = '';
    return;
  }
  // HEIC/HEIF (iPhone-Default) kann <canvas> meist nicht laden \u2192 Hinweis statt stiller Fehler
  const isHeic = /\.(heic|heif)$/i.test(file.name) || /heic|heif/i.test(file.type || '');
  if (isHeic) {
    showToast('HEIC nicht unterst\u00fctzt \u2014 bitte iPhone-Einstellungen \u2192 Kamera \u2192 Formate \u2192 "Maximale Kompatibilit\u00e4t"', 'error', 5000);
    t.value = '';
    return;
  }
  if (a === 'camera-file-picked') {
    const files = state.voicePhotoFiles || [];
    if (files.length >= PHOTO_MAX_PER_ITEM) {
      showToast('Max ' + PHOTO_MAX_PER_ITEM + ' Fotos pro Artikel', 'error');
      t.value = '';
      return;
    }
    t.value = '';
    // Statt direkt zu prozessieren: interaktiver Crop-Editor — User wählt Ausschnitt selbst
    const url = URL.createObjectURL(file);
    state.cropper = {
      file,
      imageUrl: url,
      imgW: 0, imgH: 0,
      scale: 1, offsetX: 0, offsetY: 0,
      frameW: 0, frameH: 0, baseScale: 1,
      returnView: state.view, // wohin nach Confirm/Cancel zurückkehren
    };
    go('cropper');
  } else if (a === 'photo-search-picked') {
    const url = URL.createObjectURL(file);
    state.photoSearchFile = file;
    state.photoSearchPreview = url;
    t.value = '';
    runPhotoSearch();
  } else if (a === 'edit-photo-picked' && state.item) {
    t.value = '';
    // Auch hier: User soll Ausschnitt selbst wählen
    const url = URL.createObjectURL(file);
    state.cropper = {
      file,
      imageUrl: url,
      imgW: 0, imgH: 0,
      scale: 1, offsetX: 0, offsetY: 0,
      frameW: 0, frameH: 0, baseScale: 1,
      returnView: state.view,
      mode: 'itemPhoto',           // → nach Confirm direkt zu Item hochladen
      targetItemId: state.item._recordId,
    };
    go('cropper');
  } else if (a === 'hall-photo-picked') {
    t.value = '';
    const hallName = state._hallPhotoPickFor;
    state._hallPhotoPickFor = null;
    if (!hallName) return;
    uploadHallPhoto(hallName, file);
  }
});

/* ============================================================
   INIT
   ============================================================ */
// Manueller Komplett-Reload: lädt alle Companies/Items/Halls neu von Airtable.
// Behält die aktive Firma + Detail-Ansicht wenn möglich.
async function reloadAllData() {
  if (state.reloadingAll) return;
  state.reloadingAll = true;
  updateUserBar();
  const prevActiveId = state.activeCompanyId;
  const prevItemId = state.item?._recordId;
  try {
    await loadAllData();
    // Aktive Firma wiederherstellen wenn sie noch existiert
    if (prevActiveId && state.companies.some(c => c.id === prevActiveId)) {
      state.activeCompanyId = prevActiveId;
    }
    // Geöffneten Artikel auffrischen wenn er noch da ist
    if (prevItemId) {
      const fresh = (state.companies.flatMap(c => c.inventory || [])).find(it => it._recordId === prevItemId);
      if (fresh) state.item = fresh;
    }
    // Sold-Polling-State neu initialisieren, damit nicht alle existierenden "sold" als neu erkannt werden
    startSoldPolling();
    showToast('Daten aktualisiert', 'success', 1800);
  } catch (e) {
    showToast('Reload fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    state.reloadingAll = false;
    render();
  }
}

// Springt zum vorherigen View aus der Navigations-Historie. Fallback: Home.
function goBack() {
  // In bestimmten Modi keinen Back-Swipe akzeptieren (eigene Gesten / Modal-Layer)
  if (state.cropper) return;                         // Cropper hat eigene Gesten
  if (state.wizPhotoPreviewIdx != null) {            // Lightbox offen → erst Lightbox schließen
    state.wizPhotoPreviewIdx = null;
    render();
    return;
  }
  if (state.locManageMode || state.locAddingFor) {   // Verwaltungs-Modi schließen
    state.locManageMode = null; state.locAddingFor = null; state.locAddDraft = '';
    render();
    return;
  }
  if (state.homeFilterOpen) {                        // Home-Filter-Dropdown schließen
    state.homeFilterOpen = null; render(); return;
  }
  // Wizard-spezifische Back-Navigation hat eigene Logik (mehr Steps)
  if (state.wizardStep && state.wizardStep > 1) {
    // wiz-back Logik replizieren — schritt-weise zurück
    if (state.wizardStep === 8) { if (isAdmin()) { state.wizardStep = 7; go('wizardShop', { pushHistory: false }); } else { state.wizardStep = 6; go('wizardStock', { pushHistory: false }); } return; }
    if (state.wizardStep === 7) { state.wizardStep = 6; go('wizardStock', { pushHistory: false }); return; }
    if (state.wizardStep === 6) { state.wizardStep = 5; go('wizardLoc', { pushHistory: false }); return; }
    if (state.wizardStep === 5) { state.wizardStep = 4; go('wizardTracker', { pushHistory: false }); return; }
    if (state.wizardStep === 4) { state.wizardStep = 3; go('wizardDesc', { pushHistory: false }); return; }
    if (state.wizardStep === 3) { state.wizardStep = 2; go('camera', { pushHistory: false }); return; }
    if (state.wizardStep === 2) { state.wizardStep = 1; go('wizardCat', { pushHistory: false }); return; }
  }
  // Standard: aus Historie zurück
  const hist = state.navHistory || [];
  if (hist.length === 0) {
    if (state.view !== 'home') go('home', { pushHistory: false });
    return;
  }
  const prev = hist.pop();
  go(prev, { pushHistory: false });
}

async function bootData() {
  state.bootingData = true; render();
  try {
    await ensureAllTables();
    await loadAllData();
    // Persönliche Merkliste laden (nach loadAllData, damit Inventory verfügbar ist)
    state.itemList = loadItemList();
    // Vorausgewählte Firma aus Landing-Page übernehmen (falls vorhanden)
    if (state.preselectedCompanyId) {
      const has = (state.companies || []).some(c => c.id === state.preselectedCompanyId);
      if (has) state.activeCompanyId = state.preselectedCompanyId;
      state.preselectedCompanyId = '';
      state.preselectedCompanyName = '';
    }
    state.bootingData = false;
    render();
    // Polling für Sold-Status starten — andere User sehen Verkaufs-Updates ~30s nach Speichern
    startSoldPolling();
  } catch (e) {
    state.bootingData = false;
    state.loggedIn = false;
    state.loginError = 'Daten konnten nicht geladen werden: ' + e.message;
    showToast(state.loginError, 'error', 3500);
    render();
  }
}

// Re-Render beim Drehen / Größen­änderung des Viewports — damit Filter-Sichtbarkeit, Detail-Grid usw.
// sich auf iPad bei Orientation-Change neu anpassen. Throttling: max einmal pro 250 ms.
let _resizeTimer = null;
let _lastViewportW = window.innerWidth;
function _onViewportChange() {
  // Nur re-rendern wenn sich die Breite signifikant geändert hat (Tastatur ein/aus → Höhe ändert sich, Breite nicht)
  if (Math.abs(window.innerWidth - _lastViewportW) < 30) return;
  _lastViewportW = window.innerWidth;
  if (typeof render === 'function' && state.loggedIn) render();
}
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(_onViewportChange, 250);
});
window.addEventListener('orientationchange', () => {
  // Nach Rotation kurz warten bis das Layout sich beruhigt hat
  setTimeout(() => { _lastViewportW = 0; _onViewportChange(); }, 300);
});

// Edge-Swipe-Back-Geste: Swipe vom linken Rand nach rechts → goBack()
// Funktioniert iOS-typisch — startet im linken 30px-Bereich, mind. 80px Auslauf,
// max. 600 ms, dominant horizontal.
let _backSwipeStart = null;
document.addEventListener('pointerdown', (e) => {
  _backSwipeStart = null;
  // Nur Edge-Swipes vom linken Bildschirmrand
  if (e.clientX > 30) return;
  // Nicht auf Eingabefeldern starten — die haben eigene Selektions-Gesten
  if (e.target.closest && e.target.closest('input, textarea, select, .cropper-frame, .live-cam, .hero-image--photo, .wiz-keypad')) return;
  // Auf Login/Boot/Home keinen Back-Swipe
  if (!state.view || state.view === 'home') return;
  _backSwipeStart = { x: e.clientX, y: e.clientY, t: Date.now() };
}, { passive: true });

document.addEventListener('pointerup', (e) => {
  if (!_backSwipeStart) return;
  const dx = e.clientX - _backSwipeStart.x;
  const dy = e.clientY - _backSwipeStart.y;
  const dt = Date.now() - _backSwipeStart.t;
  _backSwipeStart = null;
  // Swipe nach rechts: dx ausreichend, vertikal nicht zu stark, nicht zu langsam
  if (dx >= 80 && Math.abs(dy) < 60 && dt < 700) {
    goBack();
  }
}, { passive: true });

document.addEventListener('pointercancel', () => { _backSwipeStart = null; }, { passive: true });

async function init() {
  const vb = document.getElementById('versionBadge');
  if (vb) vb.textContent = APP_CONFIG.PROJECT_NAME + ' \u00b7 ' + APP_VERSION;
  // Ger\u00e4te-Modus initial bestimmen (Override \u2192 UA \u2192 Viewport-Heuristik)
  state.deviceMode = detectDeviceMode();
  // Erst rendern (zeigt Boot-Spinner), dann Auto-Login probieren
  render();
  const ok = await tryAutoLogin();
  state.authReady = true;
  if (ok) {
    state.loggedIn = true;
    render();
    await bootData();
  } else {
    state.loggedIn = false;
    render();
  }

  // Update-Check (best effort, blockiert nichts)
  setTimeout(checkForUpdate, 1500);
}

async function checkForUpdate() {
  try {
    const r = await fetch('https://api.github.com/repos/' + APP_CONFIG.GITHUB_REPO + '/releases/latest');
    if (!r.ok) return;
    const d = await r.json();
    if (d.tag_name && d.tag_name !== APP_VERSION) {
      showToast('Neue Version verf\u00fcgbar: ' + d.tag_name + ' \u2014 Loader neu starten', 'info', 5000);
    }
  } catch (e) { /* offline / Repo privat / Rate-Limit \u2014 egal */ }
}

init();

</script>
