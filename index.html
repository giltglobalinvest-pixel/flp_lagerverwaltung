<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DDE7F0">
<title>Lager.OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c-bg:#DDE7F0;--c-bg-soft:#E8EFF6;--c-surface:#FFFFFF;--c-surface-alt:#F4F7FB;--c-ink:#0F1830;--c-ink-soft:#3D4A66;--c-ink-mute:#5C6E87;--c-ink-subtle:#94A3B8;--c-blue:#2456E5;--c-blue-deep:#1740B8;--c-blue-soft:#EBF1FE;--c-blue-light:#C5D4F2;--c-red:#E5484D;--c-red-soft:#FBE5E6;--c-amber:#D97706;--c-amber-soft:#FEF3C7;--c-green:#16A34A;--c-green-soft:#DCFCE7;--c-green-deep:#0F5132;--c-border:rgba(15,24,48,0.06);--c-border-strong:rgba(15,24,48,0.12);--c-divider:rgba(15,24,48,0.06);--r-tile:20px;--r-md:14px;--r-sm:10px;--r-pill:999px;--elev-1:0 1px 2px rgba(15,24,48,0.04),0 2px 8px rgba(15,24,48,0.04);--elev-2:0 1px 2px rgba(15,24,48,0.06),0 8px 20px rgba(15,24,48,0.06);--elev-blue:0 1px 2px rgba(36,86,229,0.2),0 8px 24px rgba(36,86,229,0.2);--f-display:'Geist',system-ui,sans-serif;--f-mono:'Geist Mono',ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f-display);font-feature-settings:"ss01","ss02";background:linear-gradient(160deg,#C5D4F2 0%,#DDE7F0 50%,#B8C9E2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:var(--c-ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;color:inherit}
input,textarea{font-family:inherit;outline:none}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
.phone{position:relative;width:100%;max-width:400px;aspect-ratio:9/19.5;min-height:720px;background:var(--c-bg);border-radius:44px;border:10px solid var(--c-ink);overflow:hidden;box-shadow:0 50px 100px -20px rgba(15,24,48,0.4),0 0 0 1px rgba(15,24,48,0.08)}
@media (max-width:600px){
  /* App-Shell: body komplett unscrollbar machen, damit nur .scroll im Inneren scrollt.
     Verhindert dass iOS Safari beim Scrollen die ganze Seite verschiebt + Adressleisten-Toggle. */
  html,body{height:100%;height:100dvh;overflow:hidden;position:fixed;width:100%;top:0;left:0;overscroll-behavior:none}
  body{padding:0;display:block}
  .phone{border-radius:0;border:0;max-width:100%;aspect-ratio:auto;min-height:0;height:100%;height:100dvh;width:100%;box-shadow:none}
  .phone__inner{height:100%}
  /* Safe-Area-Insets f\u00fcr Notch / Home-Indicator (iPhone X+) */
  .header{padding-top:calc(12px + env(safe-area-inset-top));padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}
  .scroll{padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right))}
  .bottom-bar{margin:8px calc(12px + env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-right))}
  .action-bar{margin:8px calc(12px + env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-right))}
  .action-sheet{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .toast-stack{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));right:calc(14px + env(safe-area-inset-right))}
  .login-screen{padding:calc(32px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-right))}
  .listen-screen .header{padding-top:calc(12px + env(safe-area-inset-top))}
  .listen-screen__body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  .cam-screen .header{padding-top:calc(12px + env(safe-area-inset-top))}
  .cam-screen>div:last-child{padding-bottom:calc(20px + env(safe-area-inset-bottom))!important}
  .version-badge{bottom:calc(4px + env(safe-area-inset-bottom));right:calc(6px + env(safe-area-inset-right))}
}
.phone__inner{position:relative;height:100%;display:flex;flex-direction:column}
.app{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--c-bg)}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;flex-shrink:0}
.header__slot{width:40px}
.tile{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1)}
.tile--blue{background:var(--c-blue);color:#fff;border-radius:var(--r-tile);box-shadow:var(--elev-blue);border:none}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--c-surface);border:1px solid var(--c-border);border-radius:12px;box-shadow:var(--elev-1);color:var(--c-ink);transition:transform .1s}
.icon-btn:active{transform:scale(.96)}
.icon-btn--ghost{background:rgba(255,255,255,0.1);border:none;box-shadow:none;color:#fff}
.icon-btn--blue{background:var(--c-blue);color:#fff;border:none;box-shadow:var(--elev-blue)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;font-size:10px;font-weight:600;border-radius:var(--r-pill);white-space:nowrap}
.pill--ink{background:var(--c-ink);color:#fff}
.pill--blue{background:var(--c-blue);color:#fff}
.pill--blue-soft{background:var(--c-blue-soft);color:var(--c-blue-deep)}
.pill--amber{background:var(--c-amber-soft);color:var(--c-amber)}
.pill--red{background:var(--c-red-soft);color:var(--c-red)}
.pill--neutral{background:var(--c-surface-alt);color:var(--c-ink-soft)}
.pill--ghost{background:rgba(255,255,255,0.15);color:#fff}
.code-chip{display:inline-block;padding:2px 6px;font-family:var(--f-mono);font-size:10px;font-weight:500;background:var(--c-surface-alt);color:var(--c-ink-soft);border-radius:6px}
.item-card{width:100%;padding:14px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;gap:12px;text-align:left;transition:transform .1s}
.item-card:active{transform:scale(.99)}
.item-card--highlight{border:1.5px solid var(--c-blue);box-shadow:var(--elev-blue)}
.item-card__icon{flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--c-blue-soft);border-radius:var(--r-md);position:relative;color:var(--c-blue)}
.item-card__icon--neutral{background:var(--c-surface-alt);color:var(--c-ink-soft)}
.item-card__dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.item-card__body{flex:1;min-width:0}
.item-card__row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-card__name{font-size:15.5px;font-weight:600;line-height:1.2;letter-spacing:-.015em;margin:4px 0 0}
.item-card__sub{font-size:11.5px;font-weight:500;color:var(--c-ink-soft);margin:2px 0 0}
.item-card__divider{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--c-divider)}
.item-card__loc{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--c-ink-soft)}
.item-card__stock{font-size:18px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.item-card__stock--critical{color:var(--c-red)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:14px}
.kpi__label{font-size:10px;font-weight:600;color:var(--c-ink-mute);margin-bottom:8px;letter-spacing:.02em;text-transform:uppercase}
.kpi__value{font-size:28px;font-weight:600;line-height:1;letter-spacing:-.025em}
.kpi__value--md{font-size:18px;letter-spacing:-.015em}
.kpi__sub{font-size:10.5px;font-weight:500;color:var(--c-ink-mute);margin-top:6px}
.kpi--blue{background:var(--c-blue);color:#fff;border:none;box-shadow:var(--elev-blue);border-radius:var(--r-tile)}
.kpi--blue .kpi__label,.kpi--blue .kpi__sub{color:rgba(255,255,255,0.75)}
.segctrl{display:flex;gap:4px;padding:4px;background:var(--c-surface-alt);border:1px solid var(--c-border);border-radius:var(--r-md)}
.segctrl__btn{flex:1;padding:8px;font-size:12.5px;font-weight:600;color:var(--c-ink-mute);border-radius:var(--r-sm);transition:all .15s}
.segctrl__btn--active{background:var(--c-surface);color:var(--c-ink);box-shadow:var(--elev-1)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 12px;font-size:12px;font-weight:600;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-pill);box-shadow:var(--elev-1);color:var(--c-ink-soft);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:transform .1s}
.chip:active{transform:scale(.97)}
.chip--active{background:var(--c-ink);color:#fff;border:1px solid var(--c-ink)}
.chip__count{font-family:var(--f-mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:var(--r-pill);background:var(--c-surface-alt);color:var(--c-ink-soft)}
.chip--active .chip__count{background:rgba(255,255,255,0.2);color:#fff}
.field{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);padding:10px 16px}
.field__label{display:block;font-size:10.5px;font-weight:600;color:var(--c-ink-mute)}
.field__input{width:100%;background:transparent;border:0;padding:2px 0 0;font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--c-ink)}
.search-input{position:relative}
.search-input input{width:100%;padding:14px 16px 14px 44px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;box-shadow:var(--elev-1);font-size:14px;font-weight:500;color:var(--c-ink)}
.search-input__icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--c-ink-mute);display:flex;align-items:center}
.bottom-bar{flex-shrink:0;margin:8px 12px 12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-2);display:flex;gap:6px;padding:6px;z-index:50}
.bottom-bar__btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-size:12.5px;font-weight:600;color:var(--c-ink-mute);border-radius:var(--r-md)}
.bottom-bar__btn--active{background:var(--c-blue);color:#fff;box-shadow:var(--elev-blue)}
.action-bar{flex-shrink:0;margin:8px 12px 12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:18px;box-shadow:var(--elev-2);padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:50}
.action-bar__btn{padding:10px;font-size:11.5px;font-weight:600;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--c-surface-alt);color:var(--c-ink)}
.action-bar__btn--primary{background:var(--c-blue);color:#fff;box-shadow:var(--elev-blue)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 18px;-webkit-overflow-scrolling:touch;min-height:0}
.scroll>*+*{margin-top:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand__logo{width:40px;height:40px;background:var(--c-ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--elev-1)}
.brand__name{font-size:15px;font-weight:600;line-height:1;letter-spacing:-.01em}
.brand__sub{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--c-ink-mute);margin-top:4px}
.notif-btn{position:relative}
.notif-btn__dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--c-red);box-shadow:0 0 0 2px #fff}
.hero{width:100%;padding:18px 18px 16px;background:var(--c-blue);color:#fff;border-radius:var(--r-tile);box-shadow:var(--elev-blue);text-align:left;position:relative;overflow:hidden;transition:transform .1s}
.hero:active{transform:scale(.99)}
.hero::before{content:'';position:absolute;right:-48px;top:-48px;width:192px;height:192px;border-radius:50%;background:radial-gradient(circle,#fff 0%,transparent 70%);opacity:.2}
.hero__head{position:relative;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.hero__icon-circle{width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center}
.hero__title{position:relative;font-size:24px;font-weight:600;line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
.hero__foot{position:relative;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid rgba(255,255,255,0.15)}
.hero__foot-text{font-size:12.5px;font-weight:500;color:rgba(255,255,255,0.85)}
.hero--ai{background:var(--c-surface);color:var(--c-ink);border:1px solid var(--c-border);box-shadow:var(--elev-1)}
.hero--ai::before{background:radial-gradient(circle,var(--c-blue-soft) 0%,transparent 70%);opacity:.5;right:-32px;top:-32px;width:160px;height:160px}
.hero--ai .hero__title{font-size:19px;line-height:1.15;margin-bottom:12px}
.hero--ai .hero__icon-circle{background:var(--c-blue-soft);color:var(--c-blue)}
.hero--ai .hero__foot{border-top:1px solid var(--c-divider)}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action-tile{padding:14px 14px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;flex-direction:column;gap:14px;text-align:left;transition:transform .1s;min-height:108px}
.action-tile:active{transform:scale(.98)}
.action-tile__icon{width:36px;height:36px;background:var(--c-blue-soft);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--c-blue)}
.action-tile--warn .action-tile__icon{background:var(--c-amber-soft);color:var(--c-amber)}
.action-tile__title{font-size:16.5px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:0}
.action-tile__sub{font-size:11.5px;font-weight:500;color:var(--c-ink-mute);margin-top:4px}
.action-tile--warn .action-tile__sub{color:var(--c-amber)}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:10px}
.section-head__title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
.compact-list>*+*{margin-top:8px}
.compact-item{width:100%;padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;align-items:center;gap:12px;text-align:left;transition:transform .1s}
.compact-item:active{transform:scale(.99)}
.compact-item__icon{flex-shrink:0;width:48px;height:48px;background:var(--c-blue-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--c-blue);position:relative}
.compact-item__body{flex:1;min-width:0}
.compact-item__id{font-family:var(--f-mono);font-size:10px;font-weight:500;color:var(--c-ink-mute)}
.compact-item__name{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-item__meta{font-size:11px;font-weight:500;color:var(--c-ink-soft);margin:2px 0 0}
.compact-item__stock{text-align:right;padding-right:4px}
.compact-item__stock-val{font-size:20px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.listen-screen{background:linear-gradient(180deg,var(--c-blue) 0%,var(--c-blue-deep) 100%);display:flex;flex-direction:column;height:100%}
.listen-screen__body{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:0 20px 28px}
.listen-screen .icon-btn{background:rgba(255,255,255,0.12);color:#fff;box-shadow:none;border:none}
.listen-screen .pill{background:rgba(255,255,255,0.12);color:#fff}
.listen-title{color:#fff;font-size:40px;font-weight:600;line-height:1;letter-spacing:-.025em;margin:12px 0 0}
.wave{padding:24px;background:rgba(255,255,255,0.08);border-radius:var(--r-tile);display:flex;justify-content:center;align-items:center;gap:4px;height:88px}
.wave__bar{width:3px;background:#fff;border-radius:2px;opacity:.85}
.transcript-card{padding:20px;background:var(--c-surface);border-radius:var(--r-tile);color:var(--c-ink);box-shadow:var(--elev-1)}
.transcript-card__text{font-size:18px;line-height:1.35;font-weight:500;letter-spacing:-.01em;margin:0;min-height:1.5em}
.stop-btn{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.2);transition:transform .1s}
.stop-btn:active{transform:scale(.95)}
.stop-btn__icon{width:18px;height:18px;background:var(--c-blue);border-radius:3px}
.qcard{padding:16px}
.qcard__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qcard__text{font-size:16px;line-height:1.3;font-weight:600;letter-spacing:-.01em;margin:0}
.qcard__edit{background:rgba(255,255,255,0.15);color:#fff;padding:4px 10px;font-size:11px;font-weight:600;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px}
.hero-image{position:relative;aspect-ratio:5/4;background:linear-gradient(135deg,var(--c-blue-soft) 0%,#fff 100%);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-image__circle{width:112px;height:112px;border-radius:50%;background:#fff;box-shadow:var(--elev-2);display:flex;align-items:center;justify-content:center;color:var(--c-blue)}
.hero-image__tag{position:absolute;padding:2px 8px;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-radius:var(--r-pill);box-shadow:var(--elev-1);font-size:10.5px;font-weight:600;color:var(--c-ink-soft)}
.title-block h1{font-size:26px;font-weight:600;line-height:1.05;letter-spacing:-.025em;margin:0}
.title-block__by{font-size:13px;font-weight:500;color:var(--c-ink-soft);margin:6px 0 0}
.title-block__by strong{color:var(--c-ink);font-weight:600}
.title-block__pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.status-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-card{padding:16px}
.status-card__label{font-size:10px;font-weight:600;color:var(--c-ink-mute);margin-bottom:10px;letter-spacing:.02em;text-transform:uppercase}
.status-card__row{display:flex;align-items:center;gap:10px}
.status-card__icon{flex-shrink:0;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
.status-card__name{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:0}
.alert-banner{padding:12px 16px;border-radius:var(--r-md);display:flex;align-items:flex-start;gap:10px}
.alert-banner--amber{background:var(--c-amber-soft);border:1px solid #FDE68A;color:#7C4A06}
.alert-banner--red{background:var(--c-red-soft);border:1px solid #FCA5A5;color:#7F1D1D}
.alert-banner__title{font-size:12.5px;font-weight:600;line-height:1.2;margin:0}
.alert-banner__sub{font-size:11px;font-weight:500;margin:2px 0 0}
.trend{padding:16px}
.trend__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.trend__title{font-size:13px;font-weight:600;letter-spacing:-.01em;margin:0}
.trend__bars{display:flex;align-items:flex-end;gap:6px;height:48px}
.trend__bar{flex:1;border-radius:3px}
.trend__bar--past{background:var(--c-blue-light)}
.trend__bar--current{background:var(--c-blue)}
.spec-list>*+*{margin-top:8px}
.spec-row{padding:10px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;justify-content:space-between;align-items:center}
.spec-row__key{font-size:12px;font-weight:500;color:var(--c-ink-mute)}

async function airRead(table, filter) {
  const headers = { 'Authorization': 'Bearer ' + APP_CONFIG.AIRTABLE_READ_KEY };

  let offset = '';

/* ============================================================
   IMAGE PROCESSING (Crop + Resize + JPEG)
   ============================================================ */
const PHOTO_TARGET_RATIO = 5 / 4;     // Hero-Format
const PHOTO_MAX_EDGE = 1600;           // px Längskante
const PHOTO_JPEG_QUALITY = 0.82;
const PHOTO_MAX_PER_ITEM = 6;

// Liest ein Bild-File, beschneidet zentriert auf 5:4, skaliert auf max. 1600px,
// kodiert als JPEG. Liefert ein neues File-Objekt mit ~80–90% kleinerer Größe.
async function processImage(inputFile) {
  if (!inputFile.type.startsWith('image/')) return inputFile; // PDF etc. unverändert
  let dataUrl;
  try {
    dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('FileReader-Fehler'));
      r.readAsDataURL(inputFile);
    });
  } catch (e) {
    throw new Error('Datei konnte nicht gelesen werden (' + (inputFile.type || 'unbekannter Typ') + ')');
  }
  let img;
  try {
    img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('Bild-Decoder-Fehler'));
      i.src = dataUrl;
    });
  } catch (e) {
    throw new Error('Bildformat nicht unterstützt (' + (inputFile.type || 'unbekannt') + '). HEIC bitte vorher konvertieren.');
  }

  const srcW = img.naturalWidth, srcH = img.naturalHeight;
  if (!srcW || !srcH) throw new Error('Bild hat keine gültige Größe');

  // Zentrierter Crop auf Zielratio (5:4 = 1.25)
  const srcRatio = srcW / srcH;
  let cropW, cropH, cropX, cropY;
  if (srcRatio > PHOTO_TARGET_RATIO) {
    // Quelle zu breit → links/rechts beschneiden
    cropH = srcH;
    cropW = Math.round(srcH * PHOTO_TARGET_RATIO);
    cropX = Math.round((srcW - cropW) / 2);
    cropY = 0;
  } else {
    // Quelle zu hoch → oben/unten beschneiden
    cropW = srcW;
    cropH = Math.round(srcW / PHOTO_TARGET_RATIO);
    cropX = 0;
    cropY = Math.round((srcH - cropH) / 2);
  }

  // Resize: längste Seite auf max PHOTO_MAX_EDGE
  let outW = cropW, outH = cropH;
  const longest = Math.max(cropW, cropH);
  if (longest > PHOTO_MAX_EDGE) {
    const scale = PHOTO_MAX_EDGE / longest;
    outW = Math.round(cropW * scale);
    outH = Math.round(cropH * scale);
  }

  const canvas = document.createElement('canvas');
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', PHOTO_JPEG_QUALITY));
  if (!blob) return inputFile;

  // Original-Dateiname behalten, aber als .jpg
  const baseName = (inputFile.name || 'photo').replace(/\.[^./]+$/, '');
  const newName = baseName + '.jpg';
  return new File([blob], newName, { type: 'image/jpeg', lastModified: Date.now() });
}

async function uploadFileToRecord(table, recordId, attachmentField, file) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  // Bild vor Upload optimieren (Crop + Resize + JPEG)
  const processed = await processImage(file);
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(processed);
  });
  const url = 'https://content.airtable.com/v0/' + AIR_BASE() + '/' + recordId + '/' + attachmentField + '/uploadAttachment';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ contentType: processed.type, file: base64, filename: processed.name }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Upload fehlgeschlagen: ' + (err.error?.message || res.status));
  }
  return await res.json();
}

/* ============================================================
   AI / ANTHROPIC
   ============================================================ */
async function askAI(prompt, opts = {}) {
  if (!APP_KEYS.anthropicKey) throw new Error('Anthropic-Key fehlt');
  const content = [];
  if (opts.imageBase64 && opts.imageMediaType) {
    content.push({ type: 'image', source: { type: 'base64', media_type: opts.imageMediaType, data: opts.imageBase64 } });
  }
  if (opts.imageUrl) {
    content.push({ type: 'image', source: { type: 'url', url: opts.imageUrl } });
  }
  content.push({ type: 'text', text: prompt });

  const body = {
    model: opts.model || 'claude-sonnet-4-5-20250929',
    max_tokens: opts.maxTokens || 1024,
    messages: [{ role: 'user', content }],
  };
  if (opts.system) body.system = opts.system;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': APP_KEYS.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('AI-Anfrage fehlgeschlagen: ' + (err.error?.message || res.status));
  }
  const data = await res.json();
  return data.content && data.content[0] ? data.content[0].text : '';
}

// Liefert reines JSON-Objekt aus Claude-Antwort (entfernt ggf. Markdown-Codeblock)
function parseAIJson(text) {
  let t = (text || '').trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) t = fence[1].trim();
  return JSON.parse(t);
}

async function fileToBase64(file) {
  return await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   AUTH
   ============================================================ */
async function loginWithUserKey(userKey) {
  const headers = { 'Authorization': 'Bearer ' + APP_CONFIG.AIRTABLE_READ_KEY };
  const formula = "AND({api_key}='" + userKey.replace(/'/g, "\\'") + "',{status}='aktiv')";
  const userRes = await fetch(
    'https://api.airtable.com/v0/' + APP_CONFIG.APP_BASE_ID + '/User?filterByFormula=' + encodeURIComponent(formula),
    { headers }
  );
  if (!userRes.ok) throw new Error('Login-Server nicht erreichbar');
  const userData = await userRes.json();
  if (!userData.records || !userData.records.length) throw new Error('Ung\u00fcltiger Key');
  APP_KEYS.user = { ...userData.records[0].fields, _recordId: userData.records[0].id };

  // Project-spezifische Keys
  const projectKeysRes = await fetch(
    'https://api.airtable.com/v0/' + APP_CONFIG.MASTER_BASE_ID + '/Keys?filterByFormula=' + encodeURIComponent("{project_id}='" + APP_CONFIG.PROJECT_ID + "'"),
    { headers }
  );
  if (projectKeysRes.ok) {
    const projectKeysData = await projectKeysRes.json();
    (projectKeysData.records || []).forEach(rec => {
      const f = rec.fields;
      if (f.key_name === 'anthropicKey') APP_KEYS.anthropicKey = f.key_value;
      if (f.key_name === 'airtableWriteKey') APP_KEYS.airtableWriteKey = f.key_value;
      if (f.key_name === 'airtableBaseId') APP_KEYS.appBaseId = f.key_value;
    });
  }

  // Globaler Anthropic-Fallback
  if (!APP_KEYS.anthropicKey) {
    const globalKeysRes = await fetch(
      'https://api.airtable.com/v0/' + APP_CONFIG.MASTER_BASE_ID + "/Keys?filterByFormula=" + encodeURIComponent("{project_id}='GLOBAL'"),
      { headers }
    );
    if (globalKeysRes.ok) {
      const globalKeysData = await globalKeysRes.json();
      (globalKeysData.records || []).forEach(rec => {
        if (rec.fields.key_name === 'anthropicKey') APP_KEYS.anthropicKey = rec.fields.key_value;
      });
    }
  }

  if (!APP_KEYS.airtableWriteKey) throw new Error('Schreib-Token fehlt - bitte Admin kontaktieren');

  localStorage.setItem('user_key_' + APP_CONFIG.PROJECT_ID, userKey);
  return APP_KEYS.user;
}

async function tryAutoLogin() {
  const savedKey = localStorage.getItem('user_key_' + APP_CONFIG.PROJECT_ID);
  if (!savedKey) return false;
  try {
    await loginWithUserKey(savedKey);
    return true;
  } catch (e) {
    localStorage.removeItem('user_key_' + APP_CONFIG.PROJECT_ID);
    return false;
  }
}

function logout() {
  localStorage.removeItem('user_key_' + APP_CONFIG.PROJECT_ID);
  APP_KEYS = { airtableWriteKey: null, anthropicKey: null, appBaseId: null, user: null };
  location.reload();
}

/* ============================================================
   TOAST + LOADING
   ============================================================ */
function showToast(msg, kind = 'info', durationMs = 2400) {
  let stack = document.getElementById('toast-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.id = 'toast-stack';
    stack.className = 'toast-stack';
    (document.querySelector('.phone__inner') || document.body).appendChild(stack);
  }
  const t = document.createElement('div');
  t.className = 'toast' + (kind === 'success' ? ' toast--success' : kind === 'error' ? ' toast--error' : '');
  const icon = kind === 'success' ? svg('check', 13, 3) : kind === 'error' ? svg('alert-triangle', 13, 2.5) : svg('sparkles', 13, 2.5);
  t.innerHTML = icon + '<span>' + String(msg).replace(/</g, '&lt;') + '</span>';
  stack.appendChild(t);
  setTimeout(() => {
    t.classList.add('toast--out');
    setTimeout(() => t.remove(), 220);
  }, durationMs);
}

function setLoading(on, label) {
  let ov = document.getElementById('loading-overlay');
  if (on) {
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'loading-overlay';
      ov.className = 'loading-overlay';
      (document.querySelector('.phone__inner') || document.body).appendChild(ov);
    }
    ov.innerHTML = '<div class="spinner"></div>' + (label ? '<div style="font-size:12px;font-weight:600;color:var(--c-ink-soft)">' + label + '</div>' : '');
  } else if (ov) {
    ov.remove();
  }
}

async function ensureFieldsExist(tableName, expectedFields) {
  if (!APP_KEYS.airtableWriteKey) return;
  try {
    const metaUrl = 'https://api.airtable.com/v0/meta/bases/' + AIR_BASE() + '/tables';
    const r = await fetch(metaUrl, { headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey } });
    if (!r.ok) return;
    const meta = await r.json();
    const tbl = (meta.tables || []).find(t => t.name === tableName);
    if (!tbl) return;
    const existingNames = new Set((tbl.fields || []).map(f => f.name));
    const missing = expectedFields.filter(f => !existingNames.has(f.name));
    for (const f of missing) {
      try {
        await fetch(metaUrl + '/' + tbl.id + '/fields', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: f.name, type: f.type }),
        });
      } catch (e) { /* feld bereits da oder permission fehlt – egal */ }
    }
  } catch (e) { /* offline / metadata-API nicht verfügbar */ }
}

function nowIso() { return new Date().toISOString(); }
function shortId(prefix) { return (prefix || '') + Math.random().toString(36).slice(2, 8).toUpperCase(); }
function relTime(iso) {
  if (!iso) return '\u2014';
  const t = Date.parse(iso); if (isNaN(t)) return '\u2014';
  const diffH = Math.max(0, (Date.now() - t) / 36e5);
  if (diffH < 1) return Math.max(1, Math.round(diffH * 60)) + ' min';
  if (diffH < 24) return Math.round(diffH) + ' h';
  return Math.round(diffH / 24) + ' d';
}

function recordToCompany(rec) {
  const f = rec.fields || {};
  let halls = SEED_FLP_HALLS.slice();
  let shelves = SEED_FLP_SHELVES.slice();
  let categories = SEED_FLP_CATEGORIES.slice();
  try { if (f.halls) halls = JSON.parse(f.halls); } catch(e) {}
  try { if (f.shelves) shelves = JSON.parse(f.shelves); } catch(e) {}
  try { if (f.categories) categories = JSON.parse(f.categories); } catch(e) {}
  return {
    id: f.company_id,
    _recordId: rec.id,
    name: f.name || '',
    color: f.color || COMPANY_COLORS[0],
    halls, shelves, categories,
    inventory: [],
  };
}

function recordToItem(rec) {
  const f = rec.fields || {};
  let specs = [];
  try { if (f.specs) specs = JSON.parse(f.specs); } catch(e) {}
  const photoArr = Array.isArray(f.photo) ? f.photo : [];
  return {
    _recordId: rec.id,
    id: f.item_id,
    company_id: f.company_id,
    title: f.title || '',
    description: f.description || '',
    maker: f.maker || '',
    cat: f.cat || '',
    loc: f.loc || '',
    cond: f.cond || 'used',
    func: f.func || 'unknown',
    specs,
    photo: photoArr,
    photoUrl: photoArr[0]?.url || null,
    updated: f.updated || nowIso(),
    upd: relTime(f.updated),
  };
}

function itemToFields(it, apiKey) {
  return {
    item_id: it.id,
    company_id: it.company_id,
    title: it.title || '',
    description: it.description || '',
    maker: it.maker || '',
    cat: it.cat || '',
    loc: it.loc || '',
    cond: it.cond || 'used',
    func: it.func || 'unknown',
    specs: JSON.stringify(it.specs || []),
    updated: it.updated || nowIso(),
    api_key: apiKey,
  };
}

function companyToFields(c, apiKey) {
  return {
    company_id: c.id,
    name: c.name,
    color: c.color,
    halls: JSON.stringify(c.halls || []),
    shelves: JSON.stringify(c.shelves || []),
    categories: JSON.stringify(c.categories || []),
    created: c._created || nowIso(),
    api_key: apiKey,
  };
}

async function loadAllData() {
  const apiKey = APP_KEYS.user.api_key;
  const filter = "{api_key}='" + String(apiKey).replace(/'/g, "\\'") + "'";

  const [companyRecs, itemRecs] = await Promise.all([
    airRead(TBL_COMPANIES, filter),
    airRead(TBL_ITEMS, filter),
  ]);

  let companies = companyRecs.map(recordToCompany).filter(c => c.id);

  // Seed bei erstem Start: FLP Lift Parts mit Beispiel-Bestand
  if (companies.length === 0) {
    showToast('Erste Einrichtung \u2026 Beispieldaten werden angelegt', 'info', 3000);
    const flpId = 'co_flp_' + Date.now().toString(36);
    const seedCompany = {
      id: flpId,
      name: 'FLP Lift Parts',
      color: '#2456E5',
      halls: SEED_FLP_HALLS.slice(),
      shelves: SEED_FLP_SHELVES.slice(),
      categories: SEED_FLP_CATEGORIES.slice(),
      inventory: [],
      _created: nowIso(),
    };
    const created = await airWrite(TBL_COMPANIES, companyToFields(seedCompany, apiKey));
    seedCompany._recordId = created.id;
    companies = [seedCompany];

    // Seed-Artikel anlegen (mit kleiner Verz\u00f6gerung gegen Rate-Limit)
    for (const tpl of SEED_FLP_INVENTORY) {
      const it = {
        ...tpl,
        company_id: flpId,
        updated: nowIso(),
        photo: [],
        photoUrl: null,
      };
      try {
        const rec = await airWrite(TBL_ITEMS, itemToFields(it, apiKey));
        it._recordId = rec.id;
        seedCompany.inventory.push(it);
      } catch (e) {
        console.warn('Seed-Artikel \u00fcbersprungen:', e.message);
      }
    }
  } else {
    // Items den Companies zuordnen
    const items = itemRecs.map(recordToItem);
    const byCompany = {};
    items.forEach(it => {
      (byCompany[it.company_id] = byCompany[it.company_id] || []).push(it);
    });
    companies.forEach(c => {
      c.inventory = byCompany[c.id] || [];
    });
    // Migration: falls categories-Feld in Airtable noch leer war, im Hintergrund nachziehen
    for (const c of companies) {
      const recCategories = companyRecs.find(r => r.id === c._recordId)?.fields?.categories;
      if (!recCategories && c.categories?.length) {
        airUpdate(TBL_COMPANIES, c._recordId, { categories: JSON.stringify(c.categories) }).catch(() => {});
      }
    }
  }

  state.companies = companies;

  });
  fields.updated = nowIso();
  return airUpdate(TBL_ITEMS, it._recordId, fields)

}

// Lädt die Photo-Liste eines bereits angezeigten Items frisch nach (im Hintergrund).
// Macht den Detail-Screen self-healing wenn die in-memory-Daten veraltet sind.
async function refreshItemPhotos(it) {
  if (!it?._recordId) return;
  try {
    const rec = await airReadOne(TBL_ITEMS, it._recordId);
    const photos = rec.fields?.photo || [];
    // Nur neu rendern wenn sich etwas geändert hat
    const sameCount = (it.photo || []).length === photos.length;
    const sameFirst = (it.photo?.[0]?.id || '') === (photos[0]?.id || '');
    if (sameCount && sameFirst) return;
    it.photo = photos;
    it.photoUrl = photos[0]?.url || null;
    if (state.item === it) render();
  } catch (e) { /* offline / 404 — egal */ }
}

// Holt Photo-Liste eines Records mit Retry, weil Airtable die Attachment-URLs
// nach Upload manchmal erst nach 1-2 Sekunden ausliefert.
async function fetchPhotosWithRetry(recordId, expectedCount, maxAttempts = 5) {
  let lastPhotos = [];
  for (let i = 0; i < maxAttempts; i++) {
    try {
      const rec = await airReadOne(TBL_ITEMS, recordId);
      const photos = (rec.fields?.photo) || [];
      lastPhotos = photos;
      // Wenn wir mindestens die erwartete Anzahl haben UND alle URLs vorhanden sind \u2192 fertig
      if (photos.length >= expectedCount && photos.every(p => p.url)) {
        return photos;
      }
    } catch (e) { /* n\u00e4chster Versuch */ }
    await new Promise(r => setTimeout(r, 600 + i * 400)); // 600, 1000, 1400, 1800, 2200 ms
  }
  return lastPhotos; // Fallback: das, was wir zuletzt gesehen haben
}

// H\u00e4ngt ein neues Foto an das Item an (Multi-Photo).
// Wenn bereits PHOTO_MAX_PER_ITEM erreicht, abbrechen mit Hinweis.
async function handleItemPhotoAdd(file) {
  const it = state.item;
  if (!it) return;
  const current = it.photo || [];
  if (current.length >= PHOTO_MAX_PER_ITEM) {
    showToast('Max ' + PHOTO_MAX_PER_ITEM + ' Fotos pro Artikel', 'error');
    return;
  }
  const expectedCount = current.length + 1;
  setLoading(true, 'Foto wird optimiert & hochgeladen \u2026');
  try {
    await uploadFileToRecord(TBL_ITEMS, it._recordId, 'photo', file);
    setLoading(true, 'Foto wird verarbeitet \u2026');
    // Frisch nachladen \u2014 uploadAttachment-Response ist nicht zuverl\u00e4ssig
    const photos = await fetchPhotosWithRetry(it._recordId, expectedCount);
    it.photo = photos;
    it.photoUrl = photos[0]?.url || null;
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = Math.max(0, photos.length - 1); // springe auf neues Foto
    showToast('Foto hinzugef\u00fcgt', 'success');
  } catch (e) {
    showToast('Upload fehlgeschlagen: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Entfernt ein Foto am Index aus dem Item.
async function handleItemPhotoDelete(idx) {
  const it = state.item;
  if (!it || !it.photo || idx < 0 || idx >= it.photo.length) return;
  const remaining = it.photo.filter((_, i) => i !== idx).map(p => ({ id: p.id }));
  const expectedCount = remaining.length;
  setLoading(true, 'Foto wird entfernt \u2026');
  try {
    await airUpdate(TBL_ITEMS, it._recordId, { photo: remaining });
    const photos = await fetchPhotosWithRetry(it._recordId, expectedCount);
    it.photo = photos;
    it.photoUrl = photos[0]?.url || null;
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = Math.min(state.galleryIndex || 0, Math.max(0, photos.length - 1));
    showToast('Foto entfernt', 'success');
  } catch (e) {
    showToast('L\u00f6schen fehlgeschlagen: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Setzt ein Foto als Hauptbild (auf Index 0 verschieben).
async function handleItemPhotoSetPrimary(idx) {

async function runPhotoSearch() {
  state.photoSearchPhase = 'analyze';
  state.aiStep = 0;
  go('aiAnalyze');
  try {
    if (!state.photoSearchFile) throw new Error('Kein Foto');
    state.aiStep = 1; render();
    const base64 = await fileToBase64(state.photoSearchFile);
    const mediaType = state.photoSearchFile.type || 'image/jpeg';

    // Schritt 1: Claude Vision \u2014 OCR + Bauteil-Identifikation
    const cats = (state.categories || []).join('|') || 'Antrieb|Sicherheit|T\u00fcren|Notruf|Mechanik|Steuerung|Beleuchtung';
    const visionPrompt = `Du analysierst ein Foto eines Aufzugs-Ersatzteils. Antworte AUSSCHLIESSLICH als JSON:\n{"text_on_label":"...","probable_maker":"...","probable_model":"...","category":"${cats}","keywords":["w1","w2",...]}\nW\u00e4hle die fachlich passendste Kategorie aus der Liste. Wenn keine passt, lasse "category" leer.`;
    const visionRes = await askAI(visionPrompt, { imageBase64: base64, imageMediaType: mediaType, maxTokens: 400 });
    let info; try { info = parseAIJson(visionRes); } catch(e) { info = { keywords: [] }; }
    state.aiStep = 2; render();

    // Schritt 2: Lokal aus Bestand passende Treffer suchen (Text-Match + Vision-Match)
    const items = inventory;
    const lc = (s) => (s || '').toLowerCase();
    const labelText = lc(info.text_on_label) + ' ' + lc(info.probable_maker) + ' ' + lc(info.probable_model);
    const tokens = (info.keywords || []).concat([info.probable_maker, info.probable_model]).map(lc).filter(Boolean);

    function scoreItem(it) {
      const hay = (it.title + ' ' + it.maker + ' ' + it.id + ' ' + (it.description || '')).toLowerCase();
      let score = 0;
      tokens.forEach(tk => { if (tk && hay.includes(tk)) score += 30; });
      if (info.category && it.cat === info.category) score += 25;
      if (info.probable_maker && lc(it.maker) === lc(info.probable_maker)) score += 35;
      // Etikett-Text ein- oder enth\u00e4lt
      if (labelText.trim() && (hay.includes(lc(it.title)) || labelText.includes(lc(it.id)))) score += 40;
      return Math.min(99, score);
    }
    const ranked = items.map(it => ({ it, score: scoreItem(it) })).sort((a,b) => b.score - a.score);
    const text = ranked.filter(r => r.score >= 60).slice(0, 2).map(r => r.it);
    const visual = ranked.filter(r => r.score < 60 && r.score >= 15).slice(0, 4).map(r => ({ ...r.it, match: r.score }));

    state.photoSearchTextMatches = text;
    state.photoSearchVisualMatches = visual;
    state.photoSearchPhase = 'results';
    go('photoResults');
  } catch (e) {
    showToast('Foto-Suche fehlgeschlagen: ' + e.message, 'error', 3500);
    state.photoSearchPhase = 'idle';
    go('photoSearch');
  }
}

    loc: buildLoc(state.voiceLocDraft || {}),
    cond: state.voiceCond || 'neu',
    func: state.voiceFunc || 'untested',
    specs: [],
    photo: [],
    photoUrl: null,
    updated: nowIso(),
  };

      }

  } finally {
    setLoading(false);
  }
}

  if (!transcript) return;
  try {
    const cats = state.categories || [];
    const catList = cats.length ? cats.join(' | ') : 'beliebig';
    const sys = `Du extrahierst Felder f\u00fcr ein Lager-System f\u00fcr Aufzugsersatzteile aus deutschsprachiger Sprache.

Verf\u00fcgbare Kategorien (w\u00e4hle die fachlich passendste!): ${catList}

Antworte AUSSCHLIESSLICH als JSON in diesem Schema:
{
  "name": "kurzer Artikelname",
  "maker": "Hersteller",
  "cat": "<eine der verf\u00fcgbaren Kategorien ODER neue Bezeichnung wenn keine passt>",
  "cat_is_new": false,
  "loc": {"hall":"","shelf":"","pos":"","box":""},
  "cond": "neu|refurb|used|",
  "func": "ok|untested|unknown|defective|scrap|",
  "stock": ""
}

Regeln zur Kategorie:
- Ordne den Artikel logisch in die fachlich passendste Kategorie aus der Liste ein.
- Beispiele: Frequenzumrichter, Getriebe, Motor \u2192 "Antrieb"; Lichtgitter, Fangvorrichtung \u2192 "Sicherheit"; T\u00fcrantriebe, T\u00fcrschlitten \u2192 "T\u00fcren"; Notrufger\u00e4te \u2192 "Notruf"; Treibscheiben, Seilrollen \u2192 "Mechanik"; Steuerungen, Platinen \u2192 "Steuerung"; Lampen, LEDs \u2192 "Beleuchtung".
- Wenn KEINE der verf\u00fcgbaren Kategorien passt, schlage einen NEUEN, kurzen, sinnvollen deutschen Kategorienamen vor (1 Wort, max 2) und setze "cat_is_new": true.
- Lasse "cat" NIEMALS leer wenn ein Artikel beschrieben wird.

Lasse andere Felder leer wenn nicht erw\u00e4hnt.`;
    const txt = await askAI('Diktat: ' + transcript, { system: sys, maxTokens: 500 });
    const data = parseAIJson(txt);

    // Falls AI eine neue Kategorie vorgeschlagen hat \u2192 automatisch hinzuf\u00fcgen
    if (data.cat && data.cat_is_new && !cats.includes(data.cat) && state.company) {
      state.categories = [...cats, data.cat];
      persistCompanyHallsShelves(state.company);
      showToast('Neue Kategorie erg\u00e4nzt: ' + data.cat, 'info', 2400);
    }

    state.voiceFields = {
      name: data.name || state.voiceFields.name || '',
      maker: data.maker || state.voiceFields.maker || '',
      cat: data.cat || state.voiceFields.cat || '',
      stock: data.stock || state.voiceFields.stock || '',
    };
    if (data.loc) {
      state.voiceLocDraft = {
        hall: data.loc.hall || '',
        shelf: data.loc.shelf || '',
        pos: data.loc.pos || '',
        box: data.loc.box || '',
      };
    }
    if (data.cond) state.voiceCond = data.cond;
    if (data.func) state.voiceFunc = data.func;
    state.voicePhase = 'done';
    render();
  } catch (e) {
    showToast('Sprache konnte nicht ausgewertet werden: ' + e.message, 'error', 3500);
    state.voicePhase = 'done';
    render();
  }
}

/* ============================================================
   WEB SPEECH API
   ============================================================ */
// iOS Safari beendet die Erkennung nach jeder kurzen Sprechpause automatisch.
// Wir restarten dann transparent solange der User nicht selbst gestoppt hat.
const Speech = {
  rec: null,
  active: false,
  userStopped: false,        // true = User hat manuell gestoppt
  accumulated: '',           // gesammeltes finales Transkript \u00fcber Restarts hinweg
  onUpdateFn: null,
  onFinalFn: null,
  start(onUpdate, onFinal) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('Sprache nicht unterst\u00fctzt (bitte Chrome/Safari)', 'error', 3500); return false; }
    this.stop(true); // sicherheitshalber, ohne Final-Callback
    this.userStopped = false;
    this.accumulated = '';
    this.onUpdateFn = onUpdate;
    this.onFinalFn = onFinal;
    return this._spawn();
  },
  _spawn() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = 'de-DE';
    rec.interimResults = true;
    rec.continuous = true;
    let sessionFinal = '';
    rec.onresult = (e) => {
      let interim = '';
      sessionFinal = '';
      for (let i = 0; i < e.results.length; i++) {
        const tr = e.results[i][0].transcript;
        if (e.results[i].isFinal) sessionFinal += tr; else interim += tr;
      }
      const combined = (this.accumulated + ' ' + sessionFinal + ' ' + interim).trim();
      this.onUpdateFn?.(combined);
    };
    rec.onerror = (e) => {
      // 'no-speech' und 'aborted' sind harmlos \u2014 onend k\u00fcmmert sich um Restart
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        this.userStopped = true;
        showToast('Mikrofon-Zugriff verweigert. Bitte in den Browser-Einstellungen erlauben.', 'error', 4000);
        return;
      }
      showToast('Mikrofon-Fehler: ' + e.error, 'error', 3500);
    };
    rec.onend = () => {
      // sessionFinal in den Gesamtspeicher \u00fcbernehmen
      if (sessionFinal) {
        this.accumulated = (this.accumulated + ' ' + sessionFinal).trim();
      }
      // Wenn User noch nicht gestoppt hat \u2192 transparent neu starten
      if (this.active && !this.userStopped) {
        try {
          this._spawn();
          return;
        } catch (e) { /* fallthrough */ }
      }
      // Echtes Ende
      this.active = false;
      const finalText = this.accumulated.trim();
      this.accumulated = '';
      this.onFinalFn?.(finalText);
    };
    try {
      rec.start();
      this.rec = rec;
      this.active = true;
      return true;
    } catch (e) {
      showToast('Konnte Mikrofon nicht starten: ' + (e.message || ''), 'error');
      return false;
    }
  },
  stop(silent) {
    this.userStopped = true;
    if (silent) {
      // ohne Final-Callback (bei programmatischem Reset)
      this.onFinalFn = null;
    }
    if (this.rec && this.active) {
      try { this.rec.stop(); } catch(e) {}
    }
  },
};

// Returns the active locDraft based on the current view, used by global manage handlers.
// Auto-initializes the draft if missing so add/remove always have a target to mutate.
function getActiveLocDraft() {
  if (state.view === 'detail' && state.quickEdit === 'loc') {
    if (!state.quickLocDraft) state.quickLocDraft = { hall:'', shelf:'', pos:'', box:'' };
    return state.quickLocDraft;
  }
  if (state.view === 'edit' && state.editForm) {
    if (!state.editForm.locDraft) state.editForm.locDraft = { hall:'', shelf:'', pos:'', box:'' };
    return state.editForm.locDraft;
  }
  if (state.view === 'voice') {
    if (!state.voiceLocDraft) state.voiceLocDraft = { hall:'', shelf:'', pos:'', box:'' };
    return state.voiceLocDraft;
  }
  return null;
}

const wave = (n = 28) => Array.from({ length: n }, (_, i) => {
  const h = 20 + Math.abs(Math.sin(i * 0.7)) * 80;
  const dur = 0.7 + (i % 5) * 0.18;
  return `<div class="wave__bar" style="height:${h}%;animation:wave ${dur}s ease-in-out ${i * 0.025}s infinite alternate"></div>`;
}).join('');

function renderBestand() {
  // Aggregate categories
  const catCounts = {};
  inventory.forEach(it => { catCounts[it.cat] = (catCounts[it.cat] || 0) + 1; });
  const categories = Object.keys(catCounts).sort();
  const totalHalls = new Set(inventory.map(it => parseLoc(it.loc).hall).filter(Boolean)).size;

  // Aggregate manufacturers
  const makerCounts = {};
  inventory.forEach(it => { makerCounts[it.maker] = (makerCounts[it.maker] || 0) + 1; });
  const makers = Object.keys(makerCounts).sort((a, b) => makerCounts[b] - makerCounts[a] || a.localeCompare(b));

  // Aggregate conditions
  const condCounts = {};
  inventory.forEach(it => { condCounts[it.cond] = (condCounts[it.cond] || 0) + 1; });

  // Aggregate function statuses
  const funcCounts = {};
  inventory.forEach(it => { funcCounts[it.func] = (funcCounts[it.func] || 0) + 1; });

  // Apply category filter
  let items = state.bestandFilter === 'all' ? [...inventory] : inventory.filter(it => it.cat === state.bestandFilter);

  // Apply manufacturer filter
  if (state.bestandMaker && state.bestandMaker !== 'all') {
    items = items.filter(it => it.maker === state.bestandMaker);
  }

  // Apply condition filter
  if (state.bestandCond && state.bestandCond !== 'all') {
    items = items.filter(it => it.cond === state.bestandCond);
  }

  // Apply function status filter
  if (state.bestandFunc && state.bestandFunc !== 'all') {
    items = items.filter(it => it.func === state.bestandFunc);
  }

  // Apply search query
  const q = (state.bestandQuery || '').trim().toLowerCase();
  if (q) {
    items = items.filter(it =>
      it.title.toLowerCase().includes(q) ||
      it.maker.toLowerCase().includes(q) ||
      it.id.toLowerCase().includes(q) ||
      (it.description || '').toLowerCase().includes(q)
    );
  }

  // Apply sort
  if (state.bestandSort === 'az') {
    items.sort((a, b) => a.title.localeCompare(b.title));
  } else if (state.bestandSort === 'updated') {
    items.sort((a, b) => Date.parse(b.updated || 0) - Date.parse(a.updated || 0));
  }

  // Group by category when no filter, no maker, no cond, no func and no query active
  const grouped = state.bestandFilter === 'all' && (!state.bestandMaker || state.bestandMaker === 'all') && (!state.bestandCond || state.bestandCond === 'all') && (!state.bestandFunc || state.bestandFunc === 'all') && !q;
  const filterLabel = 'KATEGORIE';

  return `

      <span style="font-size:12px;font-weight:600;letter-spacing:-.005em;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${state.company?.name || ''}</span>

    <div style="margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:8px;padding:0 4px;margin-bottom:10px">
        <h2 style="font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c-ink-mute);margin:0">${cat}</h2>
        <span style="flex:1;height:1px;background:var(--c-divider)"></span>
        <span style="font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--c-ink-mute)">${list.length}</span>

      <div style="display:flex;flex-direction:column;gap:8px">${list.map(it => itemCard(it)).join('')}</div>

}

function renderIssues() {
  const defective = inventory.filter(it => it.func === 'defective');
  const scrap = inventory.filter(it => it.func === 'scrap');
  const untested = inventory.filter(it => it.func === 'unknown' || it.func === 'untested');
  const tabs = {
    defect:   { label: 'Defekt', items: defective, color: 'var(--c-amber)', icon: 'alert-triangle', hint: 'Reparatur pr\u00fcfen' },
    scrap:    { label: 'Schrott', items: scrap, color: 'var(--c-red)', icon: 'trash-2', hint: 'Entsorgung dokumentieren' },
    untested: { label: 'Test offen', items: untested, color: 'var(--c-ink-soft)', icon: 'help-circle', hint: 'Funktion noch nicht best\u00e4tigt' },
  };
  if (!tabs[state.issuesTab]) state.issuesTab = 'defect';
  const a = tabs[state.issuesTab];

  return `
<div class="screen">
  ${headerBar(backBtn('go-home'),
    `<div class="pill pill--amber">${svg('alert-triangle', 11, 2.5)} Aufmerksamkeit</div>`,
    `<div class="header__slot"></div>`)}
  <div style="padding:0 20px 8px"><h1 style="font-size:26px;font-weight:600;line-height:1.05;letter-spacing:-.025em;margin:0">Was Aufmerksamkeit<br>braucht</h1></div>
  <div style="padding:8px 20px">
    <div class="chip-row">
      ${Object.entries(tabs).map(([id, t]) => `
        <button class="chip ${state.issuesTab === id ? 'chip--active' : ''}" data-action="set-issues-tab" data-tab="${id}">
          <span style="color:${state.issuesTab === id ? '#fff' : t.color};display:flex">${svg(t.icon, 12, 2.5)}</span>
          ${t.label}
          <span class="chip__count">${t.items.length}</span>
        </button>`).join('')}
    </div>
  </div>
  <div style="padding:12px 20px 0">
    <div class="hint-banner" style="background:${a.color}15;border:1px solid ${a.color}30;color:${a.color}">
      ${svg(a.icon, 13, 2.5)} ${a.hint}
    </div>
  </div>
  <div class="scroll" style="padding-top:12px;padding-bottom:24px">
    ${a.items.length === 0
      ? `<div class="tile" style="padding:32px;text-align:center"><div style="margin-bottom:8px;color:var(--c-green)">${svg('check', 28, 2)}</div><div style="font-size:14px;font-weight:600">Keine Eintr\u00e4ge</div></div>`
      : `<div style="display:flex;flex-direction:column;gap:8px">${a.items.map(it => itemCard(it)).join('')}</div>`}
  </div>
</div>`;
}

function renderAIAnalyze() {
  const steps = [
    { icon: 'scan-text', label: 'Etikett & Bauteil erkennen', sub: 'Claude Vision', done: state.aiStep >= 2 },
    { icon: 'search', label: 'Im Bestand suchen', sub: inventory.length + ' Artikel \u00b7 lokal', done: state.aiStep >= 2 },
  ];
  const preview = state.photoSearchPreview;
  return `
<div class="screen">
  ${headerBar('', `<div class="pill pill--blue" style="box-shadow:var(--elev-blue)">${svg('sparkles', 11, 2.5)} AI analysiert</div>`)}
  <div style="padding:0 20px;flex:1;display:flex;flex-direction:column">
    <div class="tile" style="position:relative;aspect-ratio:5/4;background:#0F1830;overflow:hidden;margin-bottom:20px">
      ${preview
        ? `<img src="${preview}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`
        : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.5">${svg('image', 40, 2)}</div>`}
      ${state.aiStep < 2 ? `<div style="position:absolute;inset:0;pointer-events:none"><div style="position:absolute;left:0;right:0;height:48px;background:linear-gradient(180deg,transparent,rgba(36,86,229,0.25) 50%,transparent);animation:scanY 1.8s ease-in-out infinite"></div></div>` : ''}
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${steps.map((s, i) => {
        const active = !s.done && (i === 0 || (i === 1 && state.aiStep >= 1));
        return `
          <div class="ai-step ${(!s.done && !active) ? 'ai-step--pending' : ''}">
            <div class="ai-step__icon ${s.done ? 'ai-step__icon--done' : ''} ${active ? 'ai-step__icon--active' : ''}">
              ${s.done ? svg('check', 16, 3) : svg(s.icon, 15, 2.4)}
            </div>
            <div style="flex:1;min-width:0">
              <h4 class="ai-step__title">${s.label}</h4>
              <p class="ai-step__sub">${s.sub}</p>
            </div>
          </div>`;
      }).join('')}
    </div>
  </div>
</div>`;
}

function renderCamera() {
  const previews = state.voicePhotoPreviews || [];
  const idx = Math.min(state.galleryIndex || 0, Math.max(0, previews.length - 1));
  const cur = previews[idx];
  const count = previews.length;
  const canAddMore = count < PHOTO_MAX_PER_ITEM;
  return `
<div class="screen cam-screen">
  ${headerBar(`<button class="icon-btn icon-btn--ghost" data-action="go-home">${svg('x', 18, 2.5)}</button>`,
    `<div class="pill">${count === 0 ? 'Foto vom Artikel' : count + ' / ' + PHOTO_MAX_PER_ITEM + ' Fotos'}</div>`,
    `<div class="header__slot"></div>`)}

  <div class="viewfinder" style="display:flex;align-items:center;justify-content:center;flex:1;min-height:200px">
    ${cur
      ? `<img src="${cur}" alt="" style="width:100%;height:100%;object-fit:contain;background:#0F1830">`
      : `<div style="text-align:center;color:#fff">
          <div style="width:96px;height:96px;border-radius:24px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">${svg('camera', 40, 1.8)}</div>
          <div style="font-size:14px;font-weight:500;opacity:.85">Tippen zum Aufnehmen oder Ausw\u00e4hlen</div>
          <div style="font-size:11px;font-weight:500;opacity:.5;margin-top:4px">Bis zu ${PHOTO_MAX_PER_ITEM} Fotos \u00b7 werden automatisch optimiert</div>
         </div>`}
    <div class="viewfinder__corners"><div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div></div>
    ${cur ? `<button data-action="cam-photo-delete" data-idx="${idx}" style="position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(229,72,77,0.85);backdrop-filter:blur(8px);color:#fff;display:flex;align-items:center;justify-content:center;border:0;z-index:2">${svg('trash-2', 16, 2.4)}</button>` : ''}
  </div>

  ${count > 0 ? `
    <div class="cam-strip">
      ${previews.map((p, i) => `
        <button class="cam-strip__thumb ${i === idx ? 'cam-strip__thumb--active' : ''}" data-action="cam-photo-show" data-idx="${i}" style="background-image:url('${p}')">
          ${i === 0 ? `<span class="cam-strip__primary">${svg('check', 9, 3)}</span>` : ''}
        </button>
      `).join('')}
      ${canAddMore ? `
        <button class="cam-strip__add" data-action="open-camera">
          ${svg('plus', 22, 2.2)}
        </button>
      ` : ''}
    </div>
  ` : ''}

  <input type="file" id="cameraFileInput" accept="image/*" capture="environment" class="photo-input" data-action="camera-file-picked">
  <input type="file" id="cameraGalleryInput" accept="image/*" class="photo-input" data-action="camera-file-picked">

  <div style="padding:0 20px 8px;display:flex;align-items:center;justify-content:space-between">
    <button class="icon-btn icon-btn--ghost" style="width:48px;height:48px;border-radius:14px;${canAddMore ? '' : 'opacity:.3;pointer-events:none'}" data-action="open-gallery">${svg('image', 18, 2.2)}</button>
    ${count === 0
      ? `<button class="cam-shutter" data-action="open-camera">${svg('camera', 26, 2.2)}</button>`
      : canAddMore
        ? `<button class="cam-shutter" data-action="open-camera">${svg('camera', 26, 2.2)}</button>`
        : `<button class="cam-shutter" data-action="continue-to-voice" style="background:var(--c-blue);color:#fff">${svg('arrow-right', 26, 2.5)}</button>`}
    <div class="header__slot"></div>
  </div>

  ${count === 0 ? `
    <div style="padding:0 20px 16px;text-align:center">
      <button data-action="continue-to-voice" style="display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:rgba(255,255,255,0.1);color:#fff;border-radius:var(--r-pill);font-size:13px;font-weight:600">
        Ohne Foto fortfahren ${svg('arrow-right', 13, 2.5)}
      </button>
    </div>
  ` : `
    <div style="padding:0 20px 16px">
      <button data-action="continue-to-voice" style="width:100%;padding:13px;background:var(--c-blue);color:#fff;border-radius:14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--elev-blue)">
        Weiter mit ${count} Foto${count === 1 ? '' : 's'} ${svg('arrow-right', 16, 2.5)}
      </button>
    </div>
  `}
</div>`;
}

function renderLogin() {
