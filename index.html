<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FLP Stockmanager">
<meta name="application-name" content="FLP Stockmanager">
<meta name="theme-color" content="#1D7CAF">
<title>FLP Stockmanager</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=3">
<link rel="shortcut icon" type="image/png" href="favicon.ico">
<link rel="manifest" href="manifest.json?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c-bg:#DDE7F0;--c-bg-soft:#E8EFF6;--c-surface:#FFFFFF;--c-surface-alt:#F4F7FB;--c-ink:#0F1830;--c-ink-soft:#3D4A66;--c-ink-mute:#5C6E87;--c-ink-subtle:#94A3B8;--c-blue:#2456E5;--c-blue-deep:#1740B8;--c-blue-soft:#EBF1FE;--c-blue-light:#C5D4F2;--c-red:#E5484D;--c-red-soft:#FBE5E6;--c-amber:#D97706;--c-amber-soft:#FEF3C7;--c-green:#16A34A;--c-green-soft:#DCFCE7;--c-green-deep:#0F5132;--c-border:rgba(15,24,48,0.06);--c-border-strong:rgba(15,24,48,0.12);--c-divider:rgba(15,24,48,0.06);--r-tile:20px;--r-md:14px;--r-sm:10px;--r-pill:999px;--elev-1:0 1px 2px rgba(15,24,48,0.04),0 2px 8px rgba(15,24,48,0.04);--elev-2:0 1px 2px rgba(15,24,48,0.06),0 8px 20px rgba(15,24,48,0.06);--elev-blue:0 1px 2px rgba(36,86,229,0.2),0 8px 24px rgba(36,86,229,0.2);--f-display:'Geist',system-ui,sans-serif;--f-mono:'Geist Mono',ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f-display);font-feature-settings:"ss01","ss02";background:linear-gradient(160deg,#C5D4F2 0%,#DDE7F0 50%,#B8C9E2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:var(--c-ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;color:inherit}
input,textarea{font-family:inherit;outline:none}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
.phone{position:relative;width:100%;max-width:400px;aspect-ratio:9/19.5;min-height:720px;background:var(--c-bg);border-radius:44px;border:10px solid var(--c-ink);overflow:hidden;box-shadow:0 50px 100px -20px rgba(15,24,48,0.4),0 0 0 1px rgba(15,24,48,0.08)}
@media (max-width:600px){
  /* App-Shell: body komplett unscrollbar machen, damit nur .scroll im Inneren scrollt.
     Verhindert dass iOS Safari beim Scrollen die ganze Seite verschiebt + Adressleisten-Toggle. */
  html,body{height:100%;height:100dvh;overflow:hidden;position:fixed;width:100%;top:0;left:0;overscroll-behavior:none}
  body{padding:0;display:block}
  .phone{border-radius:0;border:0;max-width:100%;aspect-ratio:auto;min-height:0;height:100%;height:100dvh;width:100%;box-shadow:none}
  .phone__inner{height:100%}
  /* Safe-Area-Insets f\u00fcr Notch / Home-Indicator (iPhone X+) */
  .header{padding-top:calc(12px + env(safe-area-inset-top));padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}
  .scroll{padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right))}
  .bottom-bar{margin:8px calc(12px + env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-right))}
  .action-bar{margin:8px calc(12px + env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-right))}
  .action-sheet{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .toast-stack{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));right:calc(14px + env(safe-area-inset-right))}
  .login-screen{padding:calc(32px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-right))}
  .listen-screen .header{padding-top:calc(12px + env(safe-area-inset-top))}
  .listen-screen__body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  .cam-screen .header{padding-top:calc(12px + env(safe-area-inset-top))}
  .cam-screen>div:last-child{padding-bottom:calc(20px + env(safe-area-inset-bottom))!important}
  .version-badge{bottom:calc(4px + env(safe-area-inset-bottom));right:calc(6px + env(safe-area-inset-right))}
}
.phone__inner{position:relative;height:100%;display:flex;flex-direction:column}

/* ============================================================
   iPad / Tablet — optimierte Darstellung (≥ 768px)
   App füllt den gesamten Bildschirm, Inhalte werden mittig
   begrenzt, Grids bekommen mehr Spalten, Action-Sheets werden
   zu zentrierten Modalen.
   ============================================================ */
@media (min-width:768px){
  html,body{height:100%;height:100dvh;overflow:hidden;position:fixed;width:100%;top:0;left:0;overscroll-behavior:none}
  body{padding:0;align-items:stretch;background:var(--c-bg);display:block}
  .phone{max-width:100%;aspect-ratio:auto;min-height:0;height:100%;height:100dvh;width:100%;border-radius:0;border:0;box-shadow:none}
  .phone__inner{height:100%}
  /* Safe-Area-Insets für iPad mit Home-Indicator */
  .header{padding-top:14px;padding-left:calc(28px + env(safe-area-inset-left));padding-right:calc(28px + env(safe-area-inset-right));max-width:1096px;width:100%;margin:0 auto}
  .scroll{padding-left:max(28px, calc((100vw - 1040px) / 2 + env(safe-area-inset-left)));padding-right:max(28px, calc((100vw - 1040px) / 2 + env(safe-area-inset-right)));padding-bottom:24px}
  .bottom-bar,.action-bar{max-width:1040px;margin:8px auto calc(14px + env(safe-area-inset-bottom));width:calc(100% - 56px)}
  .toast-stack{top:calc(16px + env(safe-area-inset-top)) !important;left:50% !important;right:auto !important;transform:translateX(-50%) !important;width:min(560px, calc(100% - 32px)) !important}
  .user-bar{padding:7px 18px;font-size:11px;padding-top:max(7px, env(safe-area-inset-top));padding-left:max(18px, env(safe-area-inset-left));padding-right:max(18px, env(safe-area-inset-right))}
  .user-bar__user{justify-content:center}
  .user-bar__name{flex:0 1 auto}
  .has-user-bar .header{padding-top:14px}

  /* Mehr Spalten in den wichtigen Grids */
  .action-grid{grid-template-columns:repeat(4,1fr);gap:14px}
  .wiz-tile-grid{grid-template-columns:repeat(4,1fr);gap:14px}
  .hall-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .dash-grid{grid-template-columns:repeat(4,1fr);gap:12px}

  /* Bestand / Suche / Issues: Item-Cards in 2 Spalten */
  .item-list{display:grid !important;grid-template-columns:repeat(2,1fr);gap:10px !important}
  .item-list>*{flex:none}

  /* Item-Card Layout: höher und etwas mehr Padding für Tablet */
  .item-card{padding:16px}
  .item-card__icon{width:64px;height:64px}

  /* Headlines etwas größer */
  .screen h1{font-size:34px}

  /* Login-Karte breiter wirken lassen */
  .login-screen{align-items:center;justify-content:center}
  .login-card{max-width:480px}

  /* Action-Sheets: zentriertes Modal statt Bottom-Sheet
     !important nötig, weil die Basis-Regel später im Source steht und sonst gewinnen würde
     (gleiche Spezifität, Source-Order entscheidet) */
  .action-sheet{
    position:fixed !important;
    bottom:auto !important;
    top:50% !important;
    left:50% !important;
    right:auto !important;
    width:min(640px, calc(100vw - 64px)) !important;
    max-height:min(82vh, 720px) !important;
    border-radius:24px !important;
    padding-bottom:12px !important;
    box-shadow:0 24px 64px rgba(15,24,48,0.28) !important;
    animation:none !important;
    transform:translate(-50%, -50%) !important;
  }
  .sheet-backdrop{
    position:fixed !important;
    inset:0 !important;
    background:rgba(15,24,48,0.5) !important;
    backdrop-filter:blur(4px);
  }
  .action-sheet__handle{display:none}

  /* Camera-Viewfinder nicht über volle Breite ziehen, aber breiter als auf Phone */
  .cam-screen .viewfinder{padding:24px}
  .cam-screen .viewfinder>div:first-child{max-width:720px !important;margin:0 auto}
  .cam-screen .live-cam{max-width:720px;margin:0 auto}
  .cam-strip{max-width:720px;margin-left:auto;margin-right:auto}

  /* Wiz-Lightbox: Bilder zentrieren */
  .wiz-lightbox img{max-width:90vw;max-height:80vh}
}

/* iPad Pro 12.9" und Landscape: noch mehr Spalten */
@media (min-width:1100px){
  .item-list{grid-template-columns:repeat(3,1fr)}
  .wiz-tile-grid{grid-template-columns:repeat(5,1fr)}
  .hall-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}

/* ============================================================
   Detail-Screen 2-Spalten-Layout auf iPad-Landscape
   - links: Hero-Foto + Tracker-Kachel (sticky beim Scrollen)
   - rechts: Titel, Banner, Status, Lagerort, Beschreibung, Specs
   - unter 1100 px: ganz normaler 1-spaltiger Stack
   ============================================================ */
.detail-grid{display:flex;flex-direction:column;gap:14px}
.detail-grid__left,.detail-grid__right{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1100px){
  .detail-grid{display:grid;grid-template-columns:minmax(380px, 460px) 1fr;gap:32px;align-items:start;max-width:1240px;margin:0 auto;padding-top:8px}
  .detail-grid__left{position:sticky;top:16px}
}
/* Subtiler iPad-Tag in der User-Bar (statt knallorange) */
body.mode-tablet .user-bar__user::after{
  content:'iPad';
  margin-left:6px;
  padding:1px 6px;
  background:rgba(255,255,255,0.14);
  color:rgba(255,255,255,0.75);
  border-radius:var(--r-pill);
  font-size:8.5px;
  letter-spacing:.06em;
  font-weight:600;
}

/* Top User-Bar: zeigt Login-Name, Rolle und Versionsnummer über jedem Screen */
.user-bar{display:none;align-items:center;justify-content:space-between;padding:5px 14px;font-size:10.5px;font-weight:600;background:var(--c-ink);color:rgba(255,255,255,0.85);font-family:var(--f-mono);letter-spacing:.04em;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.08);gap:10px;min-height:24px}
.user-bar--shown{display:flex}
.user-bar__user{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;flex:1}
.user-bar__name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.user-bar__role{padding:1px 6px;border-radius:var(--r-pill);background:rgba(255,255,255,0.18);font-size:9px;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;line-height:1.4}
.user-bar__role--admin{background:#FFD45C;color:#3A2400}
.user-bar__role--customer{background:#A78BFA;color:#1A0B47}

/* ============================================================
   Customer-Home: bewusst „spürbarer" Look statt Power-User-UI
   ============================================================ */
.customer-home .scroll{padding-top:8px}
.customer-hero{position:relative;margin:0 0 20px;padding:28px 24px 32px;border-radius:24px;background:linear-gradient(135deg,#2456E5 0%,#1D7CAF 50%,#7C3AED 100%);color:#fff;overflow:hidden;box-shadow:0 12px 40px rgba(36,86,229,.35)}
.customer-hero::before{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.25) 0%,rgba(255,255,255,0) 70%);pointer-events:none}
.customer-hero::after{content:"";position:absolute;bottom:-80px;left:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,0.4) 0%,rgba(167,139,250,0) 70%);pointer-events:none}
.customer-hero__sparkle{position:absolute;top:16px;right:18px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:#fff;backdrop-filter:blur(4px)}
.customer-hero__title{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:0 0 10px;position:relative;z-index:1}
.customer-hero__sub{font-size:13.5px;font-weight:500;color:rgba(255,255,255,.88);line-height:1.4;margin:0;max-width:90%;position:relative;z-index:1}

.customer-action{width:100%;display:flex;align-items:center;gap:14px;padding:20px 20px 22px;border-radius:20px;text-align:left;transition:transform .12s;cursor:pointer;border:none}
.customer-action:active{transform:scale(.98)}
.customer-action__icon{flex-shrink:0;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.customer-action__title{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
.customer-action__sub{font-size:12.5px;font-weight:500;margin:4px 0 0;line-height:1.35}
.customer-action--primary{background:linear-gradient(135deg,#0F1830 0%,#1740B8 100%);color:#fff;margin-bottom:10px;box-shadow:0 8px 28px rgba(15,24,48,.28)}
.customer-action--primary .customer-action__icon{background:rgba(255,255,255,0.16);color:#fff}
.customer-action--primary .customer-action__sub{color:rgba(255,255,255,.78)}
.customer-action--secondary{background:var(--c-surface);color:var(--c-ink);border:1px solid var(--c-border);box-shadow:var(--elev-1)}
.customer-action--secondary .customer-action__icon--alt{background:var(--c-blue-soft);color:var(--c-blue)}
.customer-action__title--alt{color:var(--c-ink)}
.customer-action__sub--alt{color:var(--c-ink-mute)}

.customer-step{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1)}
.customer-step__num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--c-blue);color:#fff;font-family:var(--f-mono);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.customer-step__icon{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--c-blue-soft);color:var(--c-blue);display:flex;align-items:center;justify-content:center}
.customer-step__title{font-size:13.5px;font-weight:600;color:var(--c-ink);letter-spacing:-.005em}
.customer-step__sub{font-size:11.5px;font-weight:500;color:var(--c-ink-mute);margin-top:2px;line-height:1.4}

/* iPad: Customer-Hero zentral und etwas größer */
@media (min-width:768px){
  .customer-hero{padding:40px 32px 44px;border-radius:28px}
  .customer-hero__title{font-size:38px}
  .customer-hero__sub{font-size:15px;max-width:540px}
  .customer-action{padding:24px 24px 26px}
  .customer-action__icon{width:60px;height:60px;border-radius:18px}
  .customer-action__title{font-size:20px}
  .customer-action__sub{font-size:13.5px}
}

/* ============================================================
   ONBOARDING (3 Schritte) für neue Customer
   ============================================================ */
.onboard-shell{position:relative;display:flex;flex-direction:column;min-height:100%;padding:20px 18px 24px}
.onboard-progress{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.onboard-progress__dot{width:8px;height:8px;border-radius:50%;background:rgba(15,24,48,0.15);transition:all .2s}
.onboard-progress__dot--active{background:var(--c-blue);width:22px;border-radius:4px}
.onboard-skip{position:absolute;top:18px;right:18px;font-size:12px;font-weight:600;color:var(--c-ink-mute);padding:6px 10px;border-radius:var(--r-pill)}
.onboard-skip:active{background:var(--c-surface-alt)}
.onboard-card{flex:1;background:var(--c-surface);border-radius:24px;box-shadow:0 12px 40px rgba(15,24,48,0.10);padding:28px 22px;text-align:center;margin-top:8px;display:flex;flex-direction:column;align-items:center}
.onboard-card__icon{width:88px;height:88px;border-radius:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:#fff}
.onboard-card__icon--blue{background:linear-gradient(135deg,#2456E5 0%,#1D7CAF 100%);box-shadow:0 8px 24px rgba(36,86,229,.35)}
.onboard-card__icon--green{background:linear-gradient(135deg,#10B981 0%,#0F766E 100%);box-shadow:0 8px 24px rgba(16,185,129,.35)}
.onboard-card__icon--orange{background:linear-gradient(135deg,#FB923C 0%,#EA580C 100%);box-shadow:0 8px 24px rgba(234,88,12,.35)}
.onboard-card__title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.onboard-card__sub{font-size:13.5px;font-weight:500;color:var(--c-ink-mute);line-height:1.5;margin:0 0 18px;max-width:340px}
.onboard-install{width:100%;max-width:360px;padding:16px 16px;background:var(--c-bg-soft);border-radius:var(--r-md);text-align:left;margin-top:6px}
.onboard-install__title{font-size:11.5px;font-weight:700;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.onboard-install__steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.onboard-install__steps li{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--c-ink-soft);line-height:1.45}
.onboard-install__num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--c-blue);color:#fff;font-family:var(--f-mono);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.onboard-install__more{margin-top:12px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--c-blue);padding:4px 0}
.onboard-steps{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.onboard-step{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--c-bg-soft);border-radius:var(--r-md);text-align:left}
.onboard-step__icon{flex-shrink:0;width:42px;height:42px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center}
.onboard-step__title{font-size:14px;font-weight:600;color:var(--c-ink);letter-spacing:-.005em}
.onboard-step__sub{font-size:11.5px;color:var(--c-ink-mute);margin-top:3px;line-height:1.4}
.onboard-lager-grid{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.onboard-lager{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--c-surface);border:2px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);cursor:pointer;transition:transform .12s}
.onboard-lager:active{transform:scale(.99)}
.onboard-lager--active{background:var(--c-bg-soft)}
.onboard-lager__icon{flex-shrink:0;width:48px;height:48px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center}
.onboard-lager__name{font-size:15px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onboard-lager__meta{font-family:var(--f-mono);font-size:11px;color:var(--c-ink-mute);margin-top:3px}
.onboard-actions{display:flex;gap:8px;margin-top:16px}
.onboard-btn{flex:1;padding:14px 16px;font-size:14px;font-weight:600;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:transform .1s}
.onboard-btn:active{transform:scale(.98)}
.onboard-btn--primary{background:linear-gradient(135deg,#2456E5 0%,#1740B8 100%);color:#fff;box-shadow:var(--elev-blue);border:0}
.onboard-btn--ghost{background:var(--c-surface);color:var(--c-ink-soft);border:1px solid var(--c-border);box-shadow:var(--elev-1);flex:0 1 auto;min-width:110px}

@media (min-width:768px){
  .onboard-shell{padding:28px 24px;max-width:560px;margin:0 auto}
  .onboard-card{padding:36px 28px}
  .onboard-card__title{font-size:30px}
  .onboard-card__sub{font-size:15px}
}

/* ============================================================
   INSTALL-BANNER + LAGER-KARUSSELL + FOTO-CTA + BROWSE-GRID
   ============================================================ */
.install-banner{display:flex;align-items:center;gap:10px;padding:11px 12px;margin:0 0 14px;background:linear-gradient(135deg,#EBF1FE 0%,#C5D4F2 100%);border:1px solid rgba(36,86,229,.18);border-radius:14px;color:var(--c-blue-deep)}
.install-banner__icon{flex-shrink:0;width:34px;height:34px;border-radius:10px;background:var(--c-blue);color:#fff;display:flex;align-items:center;justify-content:center}
.install-banner__title{font-size:13px;font-weight:700;letter-spacing:-.005em}
.install-banner__sub{font-size:11px;font-weight:500;opacity:.85;margin-top:1px}
.install-banner__btn{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--c-blue);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0}
.install-banner__close{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:rgba(15,24,48,0.08);color:var(--c-ink-mute);display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;margin-left:-4px}

.lager-section{margin-bottom:18px}
.lager-section__head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;gap:10px}
.lager-section__label{font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center;gap:5px;margin-bottom:3px}
.lager-section__title{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--c-ink)}
.lager-section__count{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--c-ink-mute);background:var(--c-surface-alt);padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap}
.lager-section__meta{font-family:var(--f-mono);font-size:12px;color:var(--c-ink-mute);margin-top:6px}
.lager-section--single{padding:14px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1)}

.lager-carousel{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -18px;padding-left:18px;padding-right:18px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.lager-carousel::-webkit-scrollbar{display:none}
.lager-tile{flex-shrink:0;width:148px;display:flex;flex-direction:column;gap:6px;padding:14px 14px 16px;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:18px;box-shadow:var(--elev-1);text-align:left;cursor:pointer;transition:transform .12s;position:relative}
.lager-tile:active{transform:scale(.97)}
.lager-tile--active{background:var(--c-bg-soft)}
.lager-tile__icon{width:42px;height:42px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.lager-tile__name{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lager-tile__meta{font-family:var(--f-mono);font-size:10.5px;color:var(--c-ink-mute);margin-top:auto}
.lager-tile__active-pill{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;color:#fff;font-size:9.5px;font-weight:700;border-radius:var(--r-pill);letter-spacing:.04em;text-transform:uppercase}

.photo-cta{width:100%;background:linear-gradient(135deg,#0F1830 0%,#1740B8 60%,#7C3AED 100%);color:#fff;border-radius:24px;padding:0;text-align:left;cursor:pointer;border:0;box-shadow:0 14px 40px rgba(36,86,229,.32);overflow:hidden;position:relative;transition:transform .12s}
.photo-cta:active{transform:scale(.985)}
.photo-cta::before{content:"";position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 70%);pointer-events:none}
.photo-cta__inner{display:flex;align-items:center;gap:14px;padding:20px 18px 12px;position:relative;z-index:1}
.photo-cta__camera{position:relative;flex-shrink:0;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.photo-cta__ring{position:absolute;inset:0;border:2px solid rgba(255,255,255,0.25);border-radius:50%;animation:photoRing 2.4s ease-in-out infinite}
.photo-cta__camera-icon{position:relative;width:52px;height:52px;background:rgba(255,255,255,0.16);backdrop-filter:blur(6px);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
@keyframes photoRing{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.1);opacity:.2}}
.photo-cta__title{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.photo-cta__sub{font-size:12.5px;font-weight:500;color:rgba(255,255,255,.78);margin:5px 0 0;line-height:1.4}
.photo-cta__arrow{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:#fff}
.photo-cta__hint{padding:10px 18px 14px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:.02em;border-top:1px solid rgba(255,255,255,0.12)}

.browse-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:768px){.browse-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
.browse-card{display:flex;flex-direction:column;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--elev-1);transition:transform .12s;padding:0}
.browse-card:active{transform:scale(.98)}
.browse-card__photo{aspect-ratio:5/4;background-color:#0F1830;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.browse-card__body{padding:10px 12px 12px}
.browse-card__title{font-size:12.5px;font-weight:600;color:var(--c-ink);letter-spacing:-.005em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.browse-card__sub{font-size:10.5px;color:var(--c-ink-mute);margin-top:3px;font-weight:500}

.install-help-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--c-divider)}
.install-help-step:last-child{border-bottom:0}
.install-help-step__num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--c-blue);color:#fff;font-family:var(--f-mono);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.install-help-step__title{font-size:13.5px;font-weight:600;color:var(--c-ink)}
.install-help-step__sub{font-size:12px;color:var(--c-ink-soft);line-height:1.5;margin-top:4px;display:flex;align-items:flex-start;gap:4px;flex-wrap:wrap}

/* ============================================================
   LANDING PAGE (public, vor Login) + LEGAL PAGES (Impressum/Privacy)
   Eigenes scrollbares Layout, das die phone-frame-Box füllt.
   ============================================================ */
.landing{position:absolute;inset:0;background:linear-gradient(180deg,#F0F4FA 0%,#E0E8F3 100%);overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:200}
.landing__topbar{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid rgba(15,24,48,0.06);z-index:5}
.landing__brand{display:flex;align-items:center;gap:8px}
.landing__brand-name{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--c-ink)}
.landing__login-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--c-ink);color:#fff;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;border:0;cursor:pointer;transition:transform .1s}
.landing__login-btn:active{transform:scale(.96)}
.landing__back-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;background:var(--c-surface);color:var(--c-ink);border:1px solid var(--c-border);border-radius:var(--r-pill);font-size:12.5px;font-weight:600;cursor:pointer}

.landing__hero{padding:28px 22px 36px;text-align:center;max-width:680px;margin:0 auto}
.landing__hero-icon{width:96px;height:96px;border-radius:24px;box-shadow:var(--elev-2);object-fit:cover;background:#fff;margin:8px auto 18px;display:block}
.landing__hero-title{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:0 0 14px;color:var(--c-ink)}
.landing__hero-sub{font-size:14.5px;font-weight:500;color:var(--c-ink-soft);line-height:1.55;margin:0 0 22px;max-width:540px;margin-left:auto;margin-right:auto}
.landing__hero-cta{display:flex;flex-direction:column;gap:8px;align-items:center}
.landing__btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:14px 20px;font-size:14.5px;font-weight:600;border-radius:14px;cursor:pointer;border:0;transition:transform .12s;letter-spacing:-.005em}
.landing__btn:active{transform:scale(.98)}
.landing__btn--primary{background:linear-gradient(135deg,#2456E5 0%,#1740B8 100%);color:#fff;box-shadow:var(--elev-blue)}
.landing__btn--ghost{background:transparent;color:var(--c-ink-soft);padding:10px 16px;font-size:13px}
.landing__btn--big{padding:18px 28px;font-size:16px}

.landing__h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;color:var(--c-ink);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.landing__sub-h2{font-size:13.5px;color:var(--c-ink-mute);line-height:1.5;text-align:center;margin:0 auto 22px;max-width:520px}

.landing__steps{padding:36px 18px;background:rgba(255,255,255,0.65)}
.landing__steps-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px;max-width:520px;margin-left:auto;margin-right:auto}
.landing__step{padding:18px 18px 20px;background:#fff;border:1px solid var(--c-border);border-radius:18px;box-shadow:var(--elev-1)}
.landing__step-icon{width:44px;height:44px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.landing__step-num{font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.landing__step-title{font-size:16px;font-weight:600;color:var(--c-ink);letter-spacing:-.01em}
.landing__step-sub{font-size:12.5px;color:var(--c-ink-mute);margin-top:4px;line-height:1.45}

.landing__firmen{padding:40px 18px}
.landing__firmen-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px;max-width:520px;margin-left:auto;margin-right:auto}
.landing__firma-tile{display:flex;align-items:stretch;background:#fff;border:1px solid var(--c-border);border-radius:18px;box-shadow:var(--elev-1);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .12s}
.landing__firma-tile:active{transform:scale(.98)}
.landing__firma-head{flex-shrink:0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff}
.landing__firma-body{flex:1;padding:16px 16px 16px 18px;min-width:0}
.landing__firma-name{font-size:17px;font-weight:700;letter-spacing:-.015em;color:var(--c-ink);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.landing__firma-meta{font-family:var(--f-mono);font-size:11px;color:var(--c-ink-mute);margin-top:4px}
.landing__firma-cta{margin-top:10px;font-size:12.5px;font-weight:600;color:var(--c-blue);display:inline-flex;align-items:center;gap:4px}
.landing__firmen-loading{padding:24px;text-align:center;color:var(--c-ink-mute);font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px}
.landing__firmen-empty{padding:24px;text-align:center;color:var(--c-ink-mute);font-size:13px}
.landing__firmen-hint{font-size:11.5px;color:var(--c-ink-mute);text-align:center;margin:18px 0 0;display:flex;align-items:center;justify-content:center;gap:5px}

.landing__perks{padding:36px 18px;display:grid;grid-template-columns:1fr;gap:14px;max-width:520px;margin:0 auto}
.landing__perk{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:rgba(255,255,255,0.7);border-radius:14px;border:1px solid var(--c-border)}
.landing__perk-icon{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--c-blue-soft);color:var(--c-blue);display:flex;align-items:center;justify-content:center}
.landing__perk-title{font-size:13.5px;font-weight:600;color:var(--c-ink)}
.landing__perk-sub{font-size:11.5px;color:var(--c-ink-mute);margin-top:2px;line-height:1.4}

.landing__cta-bottom{padding:40px 22px 36px;text-align:center;background:linear-gradient(180deg,#FFF 0%,#F0F4FA 100%)}

.landing__footer{padding:22px 18px 32px;background:var(--c-ink);color:rgba(255,255,255,.85)}
.landing__footer--minimal{padding:18px}
.landing__footer-row{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;max-width:680px;margin:0 auto}
.landing__footer-brand{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:#fff}
.landing__footer-links{display:inline-flex;align-items:center;gap:10px;font-size:12.5px}
.landing__footer-links button,
.landing__footer-links a{color:rgba(255,255,255,.78);text-decoration:none;font-weight:500;background:none;border:0;cursor:pointer;padding:4px;font-family:inherit;font-size:inherit}
.landing__footer-links button:hover,
.landing__footer-links a:hover{color:#fff}
.landing__footer-dot{color:rgba(255,255,255,.35)}
.landing__footer-copy{margin-top:10px;font-size:10.5px;color:rgba(255,255,255,.4);text-align:center;font-family:var(--f-mono)}

/* Legal-Seiten (Impressum / Datenschutz) */
.legal{max-width:680px;margin:0 auto;padding:24px 22px 80px;color:var(--c-ink-soft);font-size:14px;line-height:1.6}
.legal h1{font-size:28px;font-weight:700;color:var(--c-ink);letter-spacing:-.025em;margin:0 0 4px}
.legal__intro{color:var(--c-ink-mute);font-size:13px;margin:0 0 24px}
.legal h2{font-size:17px;font-weight:700;color:var(--c-ink);letter-spacing:-.015em;margin:28px 0 8px}
.legal p,.legal ul{margin:0 0 12px}
.legal ul{padding-left:22px}
.legal ul li{margin-bottom:5px}
.legal a{color:var(--c-blue);text-decoration:underline}
.legal__updated{margin-top:24px;font-size:12px;color:var(--c-ink-mute);font-family:var(--f-mono)}
.legal__placeholder-note{margin-top:28px;padding:14px 16px;background:#FEF3C7;border:1px solid #FCD34D;border-radius:12px;color:#7C4A06;font-size:12.5px;line-height:1.5}

@media (min-width:768px){
  .landing__hero{padding:48px 24px 56px}
  .landing__hero-title{font-size:48px}
  .landing__hero-sub{font-size:16.5px}
  .landing__hero-icon{width:120px;height:120px;border-radius:30px}
  .landing__hero-cta{flex-direction:row;justify-content:center;gap:12px}
  .landing__steps-grid{grid-template-columns:repeat(2,1fr);max-width:840px;gap:14px}
  .landing__firmen-grid{grid-template-columns:repeat(2,1fr);max-width:840px}
  .landing__perks{grid-template-columns:repeat(3,1fr);max-width:840px}
  .landing__footer-row{flex-direction:row}
  .landing__h2{font-size:28px}
  .legal{padding:48px 32px 96px}
  .legal h1{font-size:36px}
}
@media (min-width:1100px){
  .landing__steps-grid{grid-template-columns:repeat(4,1fr)}
  .landing__firmen-grid{grid-template-columns:repeat(3,1fr)}
}

/* FLP-Brand-Pill (Mini-Logo + Wordmark) — im Customer-Home Header */
.flp-brand{display:inline-flex;align-items:center;gap:8px;cursor:default}
.flp-brand__sq{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;color:#fff;font-family:-apple-system,system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:-.02em;margin-right:-3px}
.flp-brand__sq:last-of-type{margin-right:6px}
.flp-brand__sq--gray{background:#585858}
.flp-brand__sq--blue{background:#1D7CAF}
.flp-brand__wordmark{font-size:13px;font-weight:600;color:var(--c-ink);letter-spacing:-.005em}
.user-bar__version{opacity:.55;flex-shrink:0;white-space:nowrap}
.user-bar__reload{flex-shrink:0;width:24px;height:20px;border-radius:6px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.85);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,opacity .15s;padding:0}
.user-bar__reload:active{background:rgba(255,255,255,0.22)}
.user-bar__reload[disabled]{opacity:.55;cursor:default}
.user-bar__reload--spin svg{animation:user-bar-spin 1s linear infinite}
@keyframes user-bar-spin{to{transform:rotate(-360deg)}}
@media (max-width:600px){
  .user-bar{padding-top:max(5px, env(safe-area-inset-top));padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  .has-user-bar .header{padding-top:12px}
  .has-user-bar .listen-screen .header{padding-top:12px}
  .has-user-bar .login-screen{padding-top:32px}
}
.app{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--c-bg)}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;flex-shrink:0}
.header__slot{width:40px}
.tile{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1)}
.tile--blue{background:var(--c-blue);color:#fff;border-radius:var(--r-tile);box-shadow:var(--elev-blue);border:none}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--c-surface);border:1px solid var(--c-border);border-radius:12px;box-shadow:var(--elev-1);color:var(--c-ink);transition:transform .1s}
.icon-btn:active{transform:scale(.96)}
.icon-btn--ghost{background:rgba(255,255,255,0.1);border:none;box-shadow:none;color:#fff}
.icon-btn--blue{background:var(--c-blue);color:#fff;border:none;box-shadow:var(--elev-blue)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;font-size:10px;font-weight:600;border-radius:var(--r-pill);white-space:nowrap}
.pill--ink{background:var(--c-ink);color:#fff}
.pill--blue{background:var(--c-blue);color:#fff}
.pill--blue-soft{background:var(--c-blue-soft);color:var(--c-blue-deep)}
.pill--amber{background:var(--c-amber-soft);color:var(--c-amber)}
.pill--red{background:var(--c-red-soft);color:var(--c-red)}
.pill--neutral{background:var(--c-surface-alt);color:var(--c-ink-soft)}
.pill--ghost{background:rgba(255,255,255,0.15);color:#fff}
.code-chip{display:inline-block;padding:2px 6px;font-family:var(--f-mono);font-size:10px;font-weight:500;background:var(--c-surface-alt);color:var(--c-ink-soft);border-radius:6px}
.item-card{width:100%;padding:14px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;gap:12px;text-align:left;transition:transform .1s}
.item-card:active{transform:scale(.99)}
.item-card--highlight{border:1.5px solid var(--c-blue);box-shadow:var(--elev-blue)}
.item-card__icon{flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--c-blue-soft);border-radius:var(--r-md);position:relative;color:var(--c-blue)}
.item-card__icon--neutral{background:var(--c-surface-alt);color:var(--c-ink-soft)}
.item-card__dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.item-card__body{flex:1;min-width:0}
.item-card__row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-card__name{font-size:15.5px;font-weight:600;line-height:1.2;letter-spacing:-.015em;margin:4px 0 0}
.item-card__sub{font-size:11.5px;font-weight:500;color:var(--c-ink-soft);margin:2px 0 0}
.item-card__divider{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--c-divider)}
.item-card__loc{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--c-ink-soft)}
.item-card__stock{font-size:18px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.item-card__stock--critical{color:var(--c-red)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:14px}
.kpi__label{font-size:10px;font-weight:600;color:var(--c-ink-mute);margin-bottom:8px;letter-spacing:.02em;text-transform:uppercase}
.kpi__value{font-size:28px;font-weight:600;line-height:1;letter-spacing:-.025em}
.kpi__value--md{font-size:18px;letter-spacing:-.015em}
.kpi__sub{font-size:10.5px;font-weight:500;color:var(--c-ink-mute);margin-top:6px}
.kpi--blue{background:var(--c-blue);color:#fff;border:none;box-shadow:var(--elev-blue);border-radius:var(--r-tile)}
.kpi--blue .kpi__label,.kpi--blue .kpi__sub{color:rgba(255,255,255,0.75)}
.segctrl{display:flex;gap:4px;padding:4px;background:var(--c-surface-alt);border:1px solid var(--c-border);border-radius:var(--r-md)}
.segctrl__btn{flex:1;padding:8px;font-size:12.5px;font-weight:600;color:var(--c-ink-mute);border-radius:var(--r-sm);transition:all .15s}
.segctrl__btn--active{background:var(--c-surface);color:var(--c-ink);box-shadow:var(--elev-1)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 12px;font-size:12px;font-weight:600;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-pill);box-shadow:var(--elev-1);color:var(--c-ink-soft);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:transform .1s}
.chip:active{transform:scale(.97)}
.chip--active{background:var(--c-ink);color:#fff;border:1px solid var(--c-ink)}
.chip__count{font-family:var(--f-mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:var(--r-pill);background:var(--c-surface-alt);color:var(--c-ink-soft)}
.chip--active .chip__count{background:rgba(255,255,255,0.2);color:#fff}
.field{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);padding:10px 16px}
.field__label{display:block;font-size:10.5px;font-weight:600;color:var(--c-ink-mute)}
.field__input{width:100%;background:transparent;border:0;padding:2px 0 0;font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--c-ink)}
.search-input{position:relative}
.search-input input{width:100%;padding:14px 16px 14px 44px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;box-shadow:var(--elev-1);font-size:14px;font-weight:500;color:var(--c-ink)}
.search-input__icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--c-ink-mute);display:flex;align-items:center}

/* Such-Hero: blaue Kachel mit eingebautem Such-Input */
.hero--search{cursor:default}
.hero--search:active{transform:none}
.hero__search{position:relative;margin-top:14px}
.hero__search-input{width:100%;padding:13px 40px 13px 42px;background:rgba(255,255,255,0.96);border:0;border-radius:14px;box-shadow:0 4px 12px rgba(15,24,48,0.18);font-size:14.5px;font-weight:500;color:var(--c-ink);outline:none}
.hero__search-input::placeholder{color:var(--c-ink-subtle);font-weight:500}
.hero__search-input:focus{box-shadow:0 6px 18px rgba(15,24,48,0.28)}
.hero__search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--c-ink-mute);display:flex;align-items:center;pointer-events:none;z-index:1}
.hero__search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--c-surface-alt);color:var(--c-ink-mute);display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;z-index:1}
.hero__search-clear:active{filter:brightness(.95)}

/* Home-Filter — kompakte Dropdown-Pills statt langer Chip-Reihen */
.home-filterbar{display:flex;gap:8px;margin-top:12px}
.home-filterpill{flex:1;min-width:0;display:flex;align-items:center;gap:5px;padding:8px 10px;background:var(--c-surface);border:1px solid var(--c-border);box-shadow:var(--elev-1);border-radius:var(--r-pill);font-size:12px;font-weight:600;color:var(--c-ink);cursor:pointer;transition:border-color .15s, background .15s}
.home-filterpill:active{filter:brightness(.97)}
.home-filterpill--active{background:var(--c-blue);color:#fff;border-color:var(--c-blue);box-shadow:var(--elev-blue)}
.home-filterpill--open{border-color:var(--c-blue);box-shadow:var(--elev-blue)}
.home-filterpill__label{font-family:var(--f-mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.65;flex-shrink:0}
.home-filterpill--active .home-filterpill__label{opacity:.85}
.home-filterpill__val{flex:1;min-width:0;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.home-filtermenu{margin-top:8px;background:var(--c-surface);border:1px solid var(--c-border);box-shadow:var(--elev-2);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column}
.home-filtermenu__item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:transparent;border:0;font-size:13px;font-weight:500;color:var(--c-ink);text-align:left;cursor:pointer;border-bottom:1px solid var(--c-divider)}
.home-filtermenu__item:last-child{border-bottom:0}
.home-filtermenu__item:active{background:var(--c-bg-soft)}
.home-filtermenu__item--active{background:var(--c-blue-soft);font-weight:600;color:var(--c-blue-deep)}

/* Live-Ergebnisliste */
.home-results{margin-bottom:14px}
.home-results__head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;gap:10px}
.home-results__count{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--c-ink-soft);text-transform:uppercase;letter-spacing:.05em}
.home-results__more{font-size:11.5px;font-weight:600;color:var(--c-blue);display:inline-flex;align-items:center;gap:4px;background:transparent;border:0;cursor:pointer;padding:4px 6px}
.home-results__more:active{filter:brightness(.92)}
.bottom-bar{flex-shrink:0;margin:8px 12px 12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-2);display:flex;gap:6px;padding:6px;z-index:50}
.bottom-bar__btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-size:12.5px;font-weight:600;color:var(--c-ink-mute);border-radius:var(--r-md)}
.bottom-bar__btn--active{background:var(--c-blue);color:#fff;box-shadow:var(--elev-blue)}
.action-bar{flex-shrink:0;margin:8px 12px 12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:18px;box-shadow:var(--elev-2);padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:50}
.action-bar__btn{padding:10px;font-size:11.5px;font-weight:600;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--c-surface-alt);color:var(--c-ink)}
.action-bar__btn--primary{background:var(--c-blue);color:#fff;box-shadow:var(--elev-blue)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 18px;-webkit-overflow-scrolling:touch;min-height:0}
.scroll>*+*{margin-top:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand__logo{width:40px;height:40px;background:var(--c-ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--elev-1)}
.brand__name{font-size:15px;font-weight:600;line-height:1;letter-spacing:-.01em}
.brand__sub{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--c-ink-mute);margin-top:4px}
.notif-btn{position:relative}
.notif-btn__dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--c-red);box-shadow:0 0 0 2px #fff}
.hero{width:100%;padding:18px 18px 16px;background:var(--c-blue);color:#fff;border-radius:var(--r-tile);box-shadow:var(--elev-blue);text-align:left;position:relative;overflow:hidden;transition:transform .1s}
.hero:active{transform:scale(.99)}
.hero::before{content:'';position:absolute;right:-48px;top:-48px;width:192px;height:192px;border-radius:50%;background:radial-gradient(circle,#fff 0%,transparent 70%);opacity:.2}
.hero__head{position:relative;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.hero__icon-circle{width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center}
.hero__title{position:relative;font-size:24px;font-weight:600;line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
.hero__foot{position:relative;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid rgba(255,255,255,0.15)}
.hero__foot-text{font-size:12.5px;font-weight:500;color:rgba(255,255,255,0.85)}
.hero--ai{background:var(--c-surface);color:var(--c-ink);border:1px solid var(--c-border);box-shadow:var(--elev-1)}
.hero--ai::before{background:radial-gradient(circle,var(--c-blue-soft) 0%,transparent 70%);opacity:.5;right:-32px;top:-32px;width:160px;height:160px}
.hero--ai .hero__title{font-size:19px;line-height:1.15;margin-bottom:12px}
.hero--ai .hero__icon-circle{background:var(--c-blue-soft);color:var(--c-blue)}
.hero--ai .hero__foot{border-top:1px solid var(--c-divider)}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action-tile{padding:14px 14px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;flex-direction:column;gap:14px;text-align:left;transition:transform .1s;min-height:108px}
.action-tile:active{transform:scale(.98)}
.action-tile__icon{width:36px;height:36px;background:var(--c-blue-soft);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--c-blue)}
.action-tile--warn .action-tile__icon{background:var(--c-amber-soft);color:var(--c-amber)}
.action-tile__title{font-size:16.5px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:0}
.action-tile__sub{font-size:11.5px;font-weight:500;color:var(--c-ink-mute);margin-top:4px}
.action-tile--warn .action-tile__sub{color:var(--c-amber)}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:10px}
.section-head__title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
.compact-list>*+*{margin-top:8px}
.compact-item{width:100%;padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;align-items:center;gap:12px;text-align:left;transition:transform .1s}
.compact-item:active{transform:scale(.99)}
.compact-item__icon{flex-shrink:0;width:48px;height:48px;background:var(--c-blue-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--c-blue);position:relative}
.compact-item__body{flex:1;min-width:0}
.compact-item__id{font-family:var(--f-mono);font-size:10px;font-weight:500;color:var(--c-ink-mute)}
.compact-item__name{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-item__meta{font-size:11px;font-weight:500;color:var(--c-ink-soft);margin:2px 0 0}
.compact-item__stock{text-align:right;padding-right:4px}
.compact-item__stock-val{font-size:20px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.listen-screen{background:linear-gradient(180deg,var(--c-blue) 0%,var(--c-blue-deep) 100%);display:flex;flex-direction:column;height:100%}
.listen-screen__body{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:0 20px 28px}
.listen-screen .icon-btn{background:rgba(255,255,255,0.12);color:#fff;box-shadow:none;border:none}
.listen-screen .pill{background:rgba(255,255,255,0.12);color:#fff}
.listen-title{color:#fff;font-size:40px;font-weight:600;line-height:1;letter-spacing:-.025em;margin:12px 0 0}
.wave{padding:24px;background:rgba(255,255,255,0.08);border-radius:var(--r-tile);display:flex;justify-content:center;align-items:center;gap:4px;height:88px}
.wave__bar{width:3px;background:#fff;border-radius:2px;opacity:.85}
.transcript-card{padding:20px;background:var(--c-surface);border-radius:var(--r-tile);color:var(--c-ink);box-shadow:var(--elev-1)}
.transcript-card__text{font-size:18px;line-height:1.35;font-weight:500;letter-spacing:-.01em;margin:0;min-height:1.5em}
.stop-btn{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.2);transition:transform .1s}
.stop-btn:active{transform:scale(.95)}
.stop-btn__icon{width:18px;height:18px;background:var(--c-blue);border-radius:3px}
.qcard{padding:16px}
.qcard__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qcard__text{font-size:16px;line-height:1.3;font-weight:600;letter-spacing:-.01em;margin:0}
.qcard__edit{background:rgba(255,255,255,0.15);color:#fff;padding:4px 10px;font-size:11px;font-weight:600;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px}
.hero-image{position:relative;aspect-ratio:5/4;background:linear-gradient(135deg,var(--c-blue-soft) 0%,#fff 100%);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.hero-image__circle{width:112px;height:112px;border-radius:50%;background:#fff;box-shadow:var(--elev-2);display:flex;align-items:center;justify-content:center;color:var(--c-blue)}
.hero-image__tag{position:absolute;padding:2px 8px;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-radius:var(--r-pill);box-shadow:var(--elev-1);font-size:10.5px;font-weight:600;color:var(--c-ink-soft)}
.title-block h1{font-size:26px;font-weight:600;line-height:1.05;letter-spacing:-.025em;margin:0}
.title-block__by{font-size:13px;font-weight:500;color:var(--c-ink-soft);margin:6px 0 0}
.title-block__by strong{color:var(--c-ink);font-weight:600}
.title-block__pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.status-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-card{padding:16px}
.status-card__label{font-size:10px;font-weight:600;color:var(--c-ink-mute);margin-bottom:10px;letter-spacing:.02em;text-transform:uppercase}
.status-card__row{display:flex;align-items:center;gap:10px}
.status-card__icon{flex-shrink:0;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
.status-card__name{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:0}
.alert-banner{padding:12px 16px;border-radius:var(--r-md);display:flex;align-items:flex-start;gap:10px}
.alert-banner--amber{background:var(--c-amber-soft);border:1px solid #FDE68A;color:#7C4A06}
.alert-banner--red{background:var(--c-red-soft);border:1px solid #FCA5A5;color:#7F1D1D}
.alert-banner__title{font-size:12.5px;font-weight:600;line-height:1.2;margin:0}
.alert-banner__sub{font-size:11px;font-weight:500;margin:2px 0 0}
.trend{padding:16px}
.trend__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.trend__title{font-size:13px;font-weight:600;letter-spacing:-.01em;margin:0}
.trend__bars{display:flex;align-items:flex-end;gap:6px;height:48px}
.trend__bar{flex:1;border-radius:3px}
.trend__bar--past{background:var(--c-blue-light)}
.trend__bar--current{background:var(--c-blue)}
.spec-list>*+*{margin-top:8px}
.spec-row{padding:10px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;justify-content:space-between;align-items:center}
.spec-row__key{font-size:12px;font-weight:500;color:var(--c-ink-mute)}
.spec-row__val{font-size:13px;font-weight:600;text-align:right}
.spec-row__val--mono{font-family:var(--f-mono);font-size:11px;font-weight:500}
.spec-edit-list{display:flex;flex-direction:column;gap:6px}
.spec-edit-row{display:flex;gap:6px;align-items:stretch}
.spec-edit-row__key{flex:1;min-width:0;font-size:12.5px;padding:9px 10px}
.spec-edit-row__val{flex:1.15;min-width:0;font-size:12.5px;padding:9px 10px}
.spec-edit-row__del{flex:none;width:38px;display:flex;align-items:center;justify-content:center;background:var(--c-red-soft);color:var(--c-red);border:1px solid rgba(229,72,77,0.18);border-radius:var(--r-sm);transition:background .12s}
.spec-edit-row__del:active{background:rgba(229,72,77,0.18)}

/* Tracker-Chip — Etiketten-Nummer / QR-Link */
.tracker-chip{display:inline-flex;align-items:center;gap:5px;background:#FFF1B0;color:#5C3D00;border:1px solid #F5C95B;border-radius:var(--r-pill);font-family:var(--f-mono);font-weight:600;letter-spacing:.02em;text-decoration:none;line-height:1;white-space:nowrap;max-width:100%}
.tracker-chip:active{filter:brightness(.96)}
.tracker-chip>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tracker-chip--md{box-shadow:0 1px 2px rgba(140,90,0,.08)}
a.tracker-chip{cursor:pointer}
a.tracker-chip:hover{filter:brightness(.97)}

/* Hallen-Picker mit Foto-Karten */
.hall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.hall-card{position:relative;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;transition:all .15s;text-align:left;padding:0;cursor:pointer}
.hall-card:active{transform:scale(.97)}
.hall-card--active{border-color:var(--c-blue);box-shadow:var(--elev-blue);background:var(--c-blue-soft)}
.hall-card--manage{border-style:dashed}
.hall-card--add{background:transparent;border-style:dashed;border-color:var(--c-blue-light)}
.hall-card__photo{width:100%;aspect-ratio:1/1;background:#0F1830;border:0;padding:0;position:relative;display:block;cursor:pointer;overflow:hidden}
.hall-card__photo img{width:100%;height:100%;object-fit:cover;display:block}
.hall-card__placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--c-surface-alt);color:var(--c-ink-mute)}
.hall-card__placeholder--add{background:transparent;color:var(--c-blue)}
.hall-card__edit-badge{position:absolute;bottom:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(36,86,229,0.95);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hall-card__name{padding:6px 8px;font-size:11.5px;font-weight:600;color:var(--c-ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.hall-card__remove{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--c-red);color:#fff;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.hall-card__remove:active{filter:brightness(.92)}
.hall-card__rename-btn{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(36,86,229,0.95);color:#fff;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.hall-card__rename-btn:active{filter:brightness(.92)}
.hall-card--renaming{border-color:var(--c-blue);box-shadow:var(--elev-blue)}
.hall-card__rename{padding:6px 6px 8px;display:flex;flex-direction:column;gap:5px}
.hall-card__rename input{width:100%;padding:6px 8px;background:var(--c-surface);border:1.5px solid var(--c-blue);border-radius:8px;font-size:11.5px;font-weight:600;color:var(--c-ink);outline:none;font-family:inherit;text-align:center}
.hall-card__rename-actions{display:flex;gap:5px}
.hall-card__rename-actions>button{flex:1;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:0}
.hall-card__rename-actions>button[data-action="hall-rename-save"]{background:var(--c-blue);color:#fff}
.hall-card__rename-actions>button[data-action="hall-rename-cancel"]{background:var(--c-surface-alt);color:var(--c-ink-mute)}

/* Tracker-Tile im Detail-Screen — prominente Anzeige von Nummer + QR-Link */
.tracker-tile{padding:14px 16px;background:#FFF8DD;border:1px solid #F5C95B;border-radius:var(--r-tile);box-shadow:0 1px 2px rgba(140,90,0,.06);display:flex;flex-direction:column;gap:10px}
.tracker-tile__row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.tracker-tile__label{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;font-weight:700;color:#7A5400;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}
.tracker-tile__value{font-family:var(--f-mono);font-weight:600;color:#3F2C00;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tracker-tile__value--num{font-size:18px;letter-spacing:.02em}
.tracker-tile__link{display:inline-flex;align-items:center;gap:6px;color:#3F2C00;text-decoration:none;min-width:0;font-family:var(--f-mono);font-size:12px;font-weight:600}
.tracker-tile__url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-decoration:underline;text-decoration-color:rgba(63,44,0,.4);text-underline-offset:2px}
.tracker-tile__link:active{opacity:.7}

/* Webshop · Verkauft-Banner und VP-Anzeige */
.sold-banner{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#E5484D 0%,#C42126 100%);color:#fff;border-radius:var(--r-tile);box-shadow:0 6px 20px rgba(229,72,77,.35);position:relative;overflow:hidden}
.sold-banner__icon{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center}
.sold-banner__title{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.sold-banner__sub{font-size:11.5px;font-weight:500;opacity:.9;margin-top:2px}
.sold-stamp{position:absolute;top:8px;right:8px;background:rgba(229,72,77,.95);color:#fff;font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:var(--r-pill);box-shadow:0 2px 6px rgba(0,0,0,.25);text-transform:uppercase;z-index:2}
.price-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:#E6F4EA;color:#0A6B2C;border:1px solid #8FD4A6;border-radius:var(--r-pill);font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.02em;line-height:1}
.price-chip--sm{padding:2px 7px;font-size:10px}

/* Dashboard-KPIs */
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dash-kpi{padding:12px 14px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;flex-direction:column;gap:4px;min-width:0}
.dash-kpi--blue{border-color:rgba(36,86,229,0.25);background:linear-gradient(135deg,#fff 0%,var(--c-blue-soft) 100%)}
.dash-kpi--red{border-color:rgba(229,72,77,0.25);background:linear-gradient(135deg,#fff 0%,var(--c-red-soft) 100%)}
.dash-kpi--green{border-color:#8FD4A6;background:linear-gradient(135deg,#fff 0%,#E6F4EA 100%)}
.dash-kpi--orange{border-color:#FB923C;background:linear-gradient(135deg,#fff 0%,#FFEDD5 100%)}
.dash-kpi--orange .dash-kpi__label{color:#9A3412}
.dash-kpi--orange .dash-kpi__val{color:#9A3412}
.dash-kpi__label{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em}
.dash-kpi__val{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--c-ink);font-variant-numeric:tabular-nums}
.dash-kpi__sub{font-size:10.5px;font-weight:500;color:var(--c-ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Wizard — Progress + Steps + Tiles + Footer-Actions */
.wiz-progress{display:flex;align-items:center;gap:5px;padding:0 4px}
.wiz-progress__step{flex:1;height:5px;border-radius:3px;background:var(--c-bg-soft);transition:background .2s}
.wiz-progress__step--active{background:var(--c-blue)}
.wiz-progress__step--done{background:var(--c-blue-light)}
.wiz-progress-label{margin-top:7px;padding:0 4px;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--c-ink-mute);letter-spacing:.05em;text-transform:uppercase}
/* Dark-Variante: weißer Text, transparentes Dot-BG — automatisch auf .cam-screen */
.cam-screen .wiz-progress__step{background:rgba(255,255,255,0.18)}
.cam-screen .wiz-progress__step--active{background:#fff}
.cam-screen .wiz-progress__step--done{background:rgba(255,255,255,0.55)}
.cam-screen .wiz-progress-label{color:rgba(255,255,255,0.7)}
.wiz-tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.wiz-tile{padding:22px 14px;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;min-height:128px;transition:transform .1s, background .15s, border-color .15s, box-shadow .15s}
.wiz-tile:active{transform:scale(.97)}
.wiz-tile--active{border-color:var(--c-blue);background:var(--c-blue-soft);box-shadow:var(--elev-blue)}
.wiz-tile--add{background:transparent;border-style:dashed;border-color:var(--c-blue-light);box-shadow:none}
.wiz-tile__icon{width:48px;height:48px;border-radius:14px;background:var(--c-bg-soft);color:var(--c-blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wiz-tile--active .wiz-tile__icon{background:#fff;color:var(--c-blue)}
.wiz-tile__name{font-size:13.5px;font-weight:600;text-align:center;line-height:1.25;color:var(--c-ink)}
.wiz-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom)) 16px;background:var(--c-bg);border-top:1px solid var(--c-divider);flex-shrink:0}
.wiz-actions>button{height:50px;border-radius:14px;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;transition:filter .12s, transform .1s}
.wiz-actions>button:active{transform:scale(.98)}
.wiz-actions__back{background:var(--c-surface);color:var(--c-ink-soft);border:1px solid var(--c-border) !important}
.wiz-actions__next{background:var(--c-blue);color:#fff;box-shadow:var(--elev-blue)}
.wiz-actions__next--disabled,.wiz-actions__next[disabled]{background:var(--c-surface-alt);color:var(--c-ink-subtle);box-shadow:none;cursor:default}
.wiz-actions__next:not([disabled]):active{filter:brightness(.95)}
.wiz-actions__skip{background:transparent;color:var(--c-ink-mute);border:0;font-size:12px;font-weight:600;padding:8px;text-align:center;display:inline-block;width:100%}

/* Thumbnail-Strip in Step 3 */
.wiz-thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 14px;-webkit-overflow-scrolling:touch}
.wiz-thumb{flex-shrink:0;width:72px;height:72px;border-radius:12px;background-size:cover;background-position:center;background-color:#0F1830;border:1.5px solid var(--c-border);box-shadow:var(--elev-1);cursor:pointer;position:relative;padding:0;overflow:hidden}
.wiz-thumb:active{transform:scale(.96)}
.wiz-thumb__no{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;font-family:var(--f-mono);font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}

/* Lightbox-Vollbild für Step-3-Vorschau */
.wiz-lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:max(20px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom));cursor:pointer}
.wiz-lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.wiz-lightbox__counter{position:absolute;top:max(20px, env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.55);color:#fff;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:4px 12px;border-radius:var(--r-pill);backdrop-filter:blur(8px);letter-spacing:.04em}
.wiz-lightbox__close{position:absolute;top:max(16px, env(safe-area-inset-top));right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;border:0;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);cursor:pointer}
.wiz-lightbox__close:active{background:rgba(255,255,255,0.28)}
.wiz-lightbox__nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;border:0;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);cursor:pointer;z-index:2}
.wiz-lightbox__nav:active{background:rgba(255,255,255,0.28)}
.wiz-lightbox__nav[disabled]{opacity:.3;cursor:default}
.wiz-lightbox__nav--prev{left:12px;transform:translateY(-50%) scaleX(-1)}
.wiz-lightbox__nav--next{right:12px}

/* Tracker-Nummer-Display in Step 4 — groß, mono, mit Caret */
.wiz-tracker-display{display:flex;align-items:center;gap:6px;padding:18px 20px;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);font-family:var(--f-mono);font-size:32px;font-weight:700;letter-spacing:.04em;line-height:1;color:var(--c-ink-subtle);min-height:32px}
.wiz-tracker-display--filled{color:var(--c-ink);border-color:var(--c-blue);box-shadow:var(--elev-blue)}
.wiz-tracker-display__hash{color:var(--c-ink-mute);flex-shrink:0}
.wiz-tracker-display__num{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiz-tracker-display__caret{display:inline-block;width:2px;height:30px;background:var(--c-blue);animation:wiz-caret-blink 1s infinite;flex-shrink:0;border-radius:1px}
@keyframes wiz-caret-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.wiz-tracker-url{padding:12px 14px;background:#FFF8DD;border:1px solid #F5C95B;border-radius:var(--r-md);display:flex;flex-direction:column;gap:5px}
.wiz-tracker-url__label{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;font-weight:700;color:#7A5400;text-transform:uppercase;letter-spacing:.06em}
.wiz-tracker-url__value{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:#3F2C00;word-break:break-all;line-height:1.35}

/* Ziffernblock (Step 4) */
.wiz-keypad{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;padding:8px 14px 0;flex-shrink:0}
.wiz-keypad__btn{height:60px;border-radius:14px;background:var(--c-surface);box-shadow:var(--elev-1);font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--c-ink);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .07s, background .12s}
.wiz-keypad__btn:active{transform:scale(.95);background:var(--c-bg-soft)}
.wiz-keypad__btn--del{color:var(--c-ink-mute)}
.wiz-keypad__btn--del:active{background:var(--c-red-soft);color:var(--c-red)}
.wiz-keypad__btn--ok{background:var(--c-blue);color:#fff;box-shadow:var(--elev-blue)}
.wiz-keypad__btn--ok:active{filter:brightness(.93);transform:scale(.95)}
.wiz-keypad__btn--ok[disabled]{background:var(--c-surface-alt);color:var(--c-ink-subtle);box-shadow:none;cursor:default}
.wiz-keypad__btn--ok[disabled]:active{transform:none;filter:none}
.summary-card{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.summary-card>*+*{border-left:1px solid var(--c-divider);padding-left:12px}
.hint-banner{padding:8px 12px;border-radius:12px;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500}
.inline-action{width:100%;margin-top:4px;padding:8px 12px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px;font-weight:600;box-shadow:var(--elev-1);transition:transform .1s}
.inline-action:active{transform:scale(.99)}
.inline-action--blue{background:var(--c-blue);color:#fff}
.inline-action--amber{background:var(--c-amber);color:#fff}
.inline-action--red{background:var(--c-red);color:#fff}
.check-item{width:100%;padding:14px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;align-items:flex-start;gap:12px;text-align:left;transition:all .15s}
.check-item:active{transform:scale(.99)}
.check-item--checked{background:var(--c-green-soft);border:1.5px solid var(--c-green)}
.check-item__box{flex-shrink:0;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--c-border-strong);display:flex;align-items:center;justify-content:center;margin-top:2px;color:transparent}
.check-item--checked .check-item__box{background:var(--c-green);border-color:var(--c-green);color:#fff}
.check-item__title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
.check-item--checked .check-item__title{color:var(--c-green-deep)}
.check-item__sub{font-size:11.5px;font-weight:500;color:var(--c-ink-soft);line-height:1.35;margin:2px 0 0}
.check-item--checked .check-item__sub{color:var(--c-green-deep);opacity:.85}
.result-opt{width:100%;padding:16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;align-items:center;gap:12px;text-align:left;transition:all .15s}
.result-opt:active{transform:scale(.99)}
.result-opt--active{border-width:2px}
.result-opt__icon{flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.result-opt__title{font-size:16px;font-weight:600;letter-spacing:-.015em;margin:0}
.result-opt__sub{font-size:11.5px;font-weight:500;margin:2px 0 0}
.result-opt__check{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.cam-screen{background:var(--c-ink);display:flex;flex-direction:column;height:100%}
.cam-screen .icon-btn{background:rgba(255,255,255,0.1);color:#fff;box-shadow:none;border:none}
.cam-screen .pill{background:rgba(255,255,255,0.1);color:#fff}
.viewfinder{flex:1;margin:0 20px 12px;position:relative;overflow:hidden;border-radius:var(--r-tile);box-shadow:0 8px 32px rgba(0,0,0,.5);background:radial-gradient(ellipse at 50% 60%,#1a2940 0%,#050d1a 75%)}
.viewfinder__corners>*{position:absolute;width:40px;height:40px}
.viewfinder__corners .tl{top:32px;left:32px;border-top:2px solid #fff;border-left:2px solid #fff;border-radius:8px 0 0 0}
.viewfinder__corners .tr{top:32px;right:32px;border-top:2px solid #fff;border-right:2px solid #fff;border-radius:0 8px 0 0}
.viewfinder__corners .bl{bottom:32px;left:32px;border-bottom:2px solid #fff;border-left:2px solid #fff;border-radius:0 0 0 8px}
.viewfinder__corners .br{bottom:32px;right:32px;border-bottom:2px solid #fff;border-right:2px solid #fff;border-radius:0 0 8px 0}
.mock-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%) rotate(-2deg);background:#fff;padding:12px 16px;border-radius:6px;box-shadow:var(--elev-2)}
.mock-label__brand{font-family:var(--f-mono);font-size:9px;font-weight:700;color:var(--c-ink);letter-spacing:-.01em}
.mock-label__model{font-family:var(--f-mono);font-size:8px;font-weight:500;color:var(--c-ink-soft);margin-top:2px}
.mock-block{position:absolute;top:calc(50% + 50px);left:50%;transform:translate(-50%,-50%) rotate(-2deg);width:128px;height:48px;background:var(--c-blue);border-radius:8px}
.cam-shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,.25);box-shadow:0 8px 32px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:var(--c-ink);transition:transform .1s}
.cam-shutter:active{transform:scale(.95)}
.cam-shutter--ai{color:var(--c-blue)}
.detect-text{position:absolute;border:2px solid var(--c-blue);border-radius:4px;box-shadow:0 0 0 4px rgba(36,86,229,.2)}
.detect-text__label{position:absolute;top:-28px;left:0;padding:2px 6px;background:var(--c-blue);border-radius:4px;font-family:var(--f-mono);font-size:9px;font-weight:600;color:#fff}
.detect-obj{position:absolute;border:2px dashed #fff;border-radius:6px}
.ai-step{padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;align-items:center;gap:12px;transition:opacity .3s}
.ai-step--pending{opacity:.5}
.ai-step__icon{flex-shrink:0;width:36px;height:36px;background:var(--c-blue-soft);color:var(--c-blue);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;position:relative}
.ai-step__icon--done{background:var(--c-blue);color:#fff}
.ai-step__icon--active::after{content:'';position:absolute;inset:0;border-radius:var(--r-sm);border:2px solid var(--c-blue);animation:pulse 1.2s ease-in-out infinite}
.ai-step__title{font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin:0}
.ai-step__sub{font-size:11px;font-weight:500;color:var(--c-ink-mute);margin:2px 0 0}
.match-bar{margin-top:8px;height:4px;border-radius:var(--r-pill);background:var(--c-surface-alt);overflow:hidden}
.match-bar__fill{height:100%;border-radius:var(--r-pill)}
.picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.picker-tile{padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s}
.picker-tile:active{transform:scale(.97)}
.picker-tile__label{font-size:11.5px;font-weight:600}
.picker-list>*+*{margin-top:8px}
.picker-row{width:100%;padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;align-items:center;gap:12px;text-align:left;transition:all .15s}
.picker-row:active{transform:scale(.99)}
.picker-row__icon{flex-shrink:0;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
.picker-row__title{font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin:0}
.picker-row__check{flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.success-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.success-screen__circle{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:24px}
.success-screen__title{font-size:32px;font-weight:600;line-height:1.05;letter-spacing:-.025em;margin:16px 0}
@keyframes wave{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scanY{0%{top:-10%}100%{top:110%}}
@keyframes scanH{0%{top:10%;opacity:0}50%{opacity:1}100%{top:90%;opacity:0}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
@keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.cursor{display:inline-block;width:2px;height:1em;vertical-align:middle;background:currentColor;margin-left:2px;animation:blink 1s infinite}
.dot-pulse{animation:pulse-dot 1.5s ease-in-out infinite}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#fff 50%,transparent);animation:scanH 2.5s ease-in-out infinite}

/* Action sheet */
.sheet-backdrop{position:absolute;inset:0;background:rgba(15,24,48,0.4);backdrop-filter:blur(2px);z-index:100;animation:sheetFade .2s ease-out}
.action-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--c-surface);border-top-left-radius:24px;border-top-right-radius:24px;padding:0 0 12px;box-shadow:0 -8px 32px rgba(15,24,48,0.18);z-index:101;animation:sheetSlide .28s cubic-bezier(.32,.72,0,1)}
.action-sheet__handle{width:36px;height:4px;background:var(--c-ink-subtle);opacity:.35;border-radius:2px;margin:8px auto 14px;display:block}
.action-sheet__title{padding:0 20px 14px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--c-ink-mute);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--c-divider)}
.action-sheet__row{width:100%;display:flex;align-items:center;gap:14px;padding:13px 20px;text-align:left;font-size:14.5px;font-weight:500;color:var(--c-ink);transition:background .1s}
