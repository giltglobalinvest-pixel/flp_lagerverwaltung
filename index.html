<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DDE7F0">
<title>Lager.OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c-bg:#DDE7F0;--c-bg-soft:#E8EFF6;--c-surface:#FFFFFF;--c-surface-alt:#F4F7FB;--c-ink:#0F1830;--c-ink-soft:#3D4A66;--c-ink-mute:#5C6E87;--c-ink-subtle:#94A3B8;--c-blue:#2456E5;--c-blue-deep:#1740B8;--c-blue-soft:#EBF1FE;--c-blue-light:#C5D4F2;--c-red:#E5484D;--c-red-soft:#FBE5E6;--c-amber:#D97706;--c-amber-soft:#FEF3C7;--c-green:#16A34A;--c-green-soft:#DCFCE7;--c-green-deep:#0F5132;--c-border:rgba(15,24,48,0.06);--c-border-strong:rgba(15,24,48,0.12);--c-divider:rgba(15,24,48,0.06);--r-tile:20px;--r-md:14px;--r-sm:10px;--r-pill:999px;--elev-1:0 1px 2px rgba(15,24,48,0.04),0 2px 8px rgba(15,24,48,0.04);--elev-2:0 1px 2px rgba(15,24,48,0.06),0 8px 20px rgba(15,24,48,0.06);--elev-blue:0 1px 2px rgba(36,86,229,0.2),0 8px 24px rgba(36,86,229,0.2);--f-display:'Geist',system-ui,sans-serif;--f-mono:'Geist Mono',ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f-display);font-feature-settings:"ss01","ss02";background:linear-gradient(160deg,#C5D4F2 0%,#DDE7F0 50%,#B8C9E2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:var(--c-ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;color:inherit}
input,textarea{font-family:inherit;outline:none}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
.phone{position:relative;width:100%;max-width:400px;aspect-ratio:9/19.5;min-height:720px;background:var(--c-bg);border-radius:44px;border:10px solid var(--c-ink);overflow:hidden;box-shadow:0 50px 100px -20px rgba(15,24,48,0.4),0 0 0 1px rgba(15,24,48,0.08)}
@media (max-width:600px){
  /* App-Shell: body komplett unscrollbar machen, damit nur .scroll im Inneren scrollt.
     Verhindert dass iOS Safari beim Scrollen die ganze Seite verschiebt + Adressleisten-Toggle. */
  html,body{height:100%;height:100dvh;overflow:hidden;position:fixed;width:100%;top:0;left:0;overscroll-behavior:none}
  body{padding:0;display:block}
  .phone{border-radius:0;border:0;max-width:100%;aspect-ratio:auto;min-height:0;height:100%;height:100dvh;width:100%;box-shadow:none}
  .phone__inner{height:100%}
  /* Safe-Area-Insets f\u00fcr Notch / Home-Indicator (iPhone X+) */
  .header{padding-top:calc(12px + env(safe-area-inset-top));padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}
  .scroll{padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right))}
  .bottom-bar{margin:8px calc(12px + env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-right))}
  .action-bar{margin:8px calc(12px + env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-right))}
  .action-sheet{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .toast-stack{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));right:calc(14px + env(safe-area-inset-right))}
  .login-screen{padding:calc(32px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-right))}
  .listen-screen .header{padding-top:calc(12px + env(safe-area-inset-top))}
  .listen-screen__body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  .cam-screen .header{padding-top:calc(12px + env(safe-area-inset-top))}
  .cam-screen>div:last-child{padding-bottom:calc(20px + env(safe-area-inset-bottom))!important}
  .version-badge{bottom:calc(4px + env(safe-area-inset-bottom));right:calc(6px + env(safe-area-inset-right))}
}
.phone__inner{position:relative;height:100%;display:flex;flex-direction:column}

/* Top User-Bar: zeigt Login-Name, Rolle und Versionsnummer über jedem Screen */
.user-bar{display:none;align-items:center;justify-content:space-between;padding:5px 14px;font-size:10.5px;font-weight:600;background:var(--c-ink);color:rgba(255,255,255,0.85);font-family:var(--f-mono);letter-spacing:.04em;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.08);gap:10px;min-height:24px}
.user-bar--shown{display:flex}
.user-bar__user{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;flex:1}
.user-bar__name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.user-bar__role{padding:1px 6px;border-radius:var(--r-pill);background:rgba(255,255,255,0.18);font-size:9px;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;line-height:1.4}
.user-bar__role--admin{background:#FFD45C;color:#3A2400}
.user-bar__version{opacity:.55;flex-shrink:0;white-space:nowrap}
.user-bar__reload{flex-shrink:0;width:24px;height:20px;border-radius:6px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.85);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,opacity .15s;padding:0}
.user-bar__reload:active{background:rgba(255,255,255,0.22)}
.user-bar__reload[disabled]{opacity:.55;cursor:default}
.user-bar__reload--spin svg{animation:user-bar-spin 1s linear infinite}
@keyframes user-bar-spin{to{transform:rotate(-360deg)}}
@media (max-width:600px){
  .user-bar{padding-top:max(5px, env(safe-area-inset-top));padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  .has-user-bar .header{padding-top:12px}
  .has-user-bar .listen-screen .header{padding-top:12px}
  .has-user-bar .login-screen{padding-top:32px}
}
.app{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--c-bg)}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;flex-shrink:0}
.header__slot{width:40px}
.tile{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1)}
.tile--blue{background:var(--c-blue);color:#fff;border-radius:var(--r-tile);box-shadow:var(--elev-blue);border:none}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--c-surface);border:1px solid var(--c-border);border-radius:12px;box-shadow:var(--elev-1);color:var(--c-ink);transition:transform .1s}
.icon-btn:active{transform:scale(.96)}
.icon-btn--ghost{background:rgba(255,255,255,0.1);border:none;box-shadow:none;color:#fff}
.icon-btn--blue{background:var(--c-blue);color:#fff;border:none;box-shadow:var(--elev-blue)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;font-size:10px;font-weight:600;border-radius:var(--r-pill);white-space:nowrap}
.pill--ink{background:var(--c-ink);color:#fff}
.pill--blue{background:var(--c-blue);color:#fff}
.pill--blue-soft{background:var(--c-blue-soft);color:var(--c-blue-deep)}
.pill--amber{background:var(--c-amber-soft);color:var(--c-amber)}
.pill--red{background:var(--c-red-soft);color:var(--c-red)}
.pill--neutral{background:var(--c-surface-alt);color:var(--c-ink-soft)}
.pill--ghost{background:rgba(255,255,255,0.15);color:#fff}
.code-chip{display:inline-block;padding:2px 6px;font-family:var(--f-mono);font-size:10px;font-weight:500;background:var(--c-surface-alt);color:var(--c-ink-soft);border-radius:6px}
.item-card{width:100%;padding:14px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;gap:12px;text-align:left;transition:transform .1s}
.item-card:active{transform:scale(.99)}
.item-card--highlight{border:1.5px solid var(--c-blue);box-shadow:var(--elev-blue)}
.item-card__icon{flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--c-blue-soft);border-radius:var(--r-md);position:relative;color:var(--c-blue)}
.item-card__icon--neutral{background:var(--c-surface-alt);color:var(--c-ink-soft)}
.item-card__dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.item-card__body{flex:1;min-width:0}
.item-card__row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-card__name{font-size:15.5px;font-weight:600;line-height:1.2;letter-spacing:-.015em;margin:4px 0 0}
.item-card__sub{font-size:11.5px;font-weight:500;color:var(--c-ink-soft);margin:2px 0 0}
.item-card__divider{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--c-divider)}
.item-card__loc{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--c-ink-soft)}
.item-card__stock{font-size:18px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.item-card__stock--critical{color:var(--c-red)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:14px}
.kpi__label{font-size:10px;font-weight:600;color:var(--c-ink-mute);margin-bottom:8px;letter-spacing:.02em;text-transform:uppercase}
.kpi__value{font-size:28px;font-weight:600;line-height:1;letter-spacing:-.025em}
.kpi__value--md{font-size:18px;letter-spacing:-.015em}
.kpi__sub{font-size:10.5px;font-weight:500;color:var(--c-ink-mute);margin-top:6px}
.kpi--blue{background:var(--c-blue);color:#fff;border:none;box-shadow:var(--elev-blue);border-radius:var(--r-tile)}
.kpi--blue .kpi__label,.kpi--blue .kpi__sub{color:rgba(255,255,255,0.75)}
.segctrl{display:flex;gap:4px;padding:4px;background:var(--c-surface-alt);border:1px solid var(--c-border);border-radius:var(--r-md)}
.segctrl__btn{flex:1;padding:8px;font-size:12.5px;font-weight:600;color:var(--c-ink-mute);border-radius:var(--r-sm);transition:all .15s}
.segctrl__btn--active{background:var(--c-surface);color:var(--c-ink);box-shadow:var(--elev-1)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 12px;font-size:12px;font-weight:600;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-pill);box-shadow:var(--elev-1);color:var(--c-ink-soft);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:transform .1s}
.chip:active{transform:scale(.97)}
.chip--active{background:var(--c-ink);color:#fff;border:1px solid var(--c-ink)}
.chip__count{font-family:var(--f-mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:var(--r-pill);background:var(--c-surface-alt);color:var(--c-ink-soft)}
.chip--active .chip__count{background:rgba(255,255,255,0.2);color:#fff}
.field{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);padding:10px 16px}
.field__label{display:block;font-size:10.5px;font-weight:600;color:var(--c-ink-mute)}
.field__input{width:100%;background:transparent;border:0;padding:2px 0 0;font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--c-ink)}
.search-input{position:relative}
.search-input input{width:100%;padding:14px 16px 14px 44px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;box-shadow:var(--elev-1);font-size:14px;font-weight:500;color:var(--c-ink)}
.search-input__icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--c-ink-mute);display:flex;align-items:center}
.bottom-bar{flex-shrink:0;margin:8px 12px 12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-2);display:flex;gap:6px;padding:6px;z-index:50}
.bottom-bar__btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-size:12.5px;font-weight:600;color:var(--c-ink-mute);border-radius:var(--r-md)}
.bottom-bar__btn--active{background:var(--c-blue);color:#fff;box-shadow:var(--elev-blue)}
.action-bar{flex-shrink:0;margin:8px 12px 12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:18px;box-shadow:var(--elev-2);padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:50}
.action-bar__btn{padding:10px;font-size:11.5px;font-weight:600;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--c-surface-alt);color:var(--c-ink)}
.action-bar__btn--primary{background:var(--c-blue);color:#fff;box-shadow:var(--elev-blue)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 18px;-webkit-overflow-scrolling:touch;min-height:0}
.scroll>*+*{margin-top:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand__logo{width:40px;height:40px;background:var(--c-ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--elev-1)}
.brand__name{font-size:15px;font-weight:600;line-height:1;letter-spacing:-.01em}
.brand__sub{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--c-ink-mute);margin-top:4px}
.notif-btn{position:relative}
.notif-btn__dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--c-red);box-shadow:0 0 0 2px #fff}
.hero{width:100%;padding:18px 18px 16px;background:var(--c-blue);color:#fff;border-radius:var(--r-tile);box-shadow:var(--elev-blue);text-align:left;position:relative;overflow:hidden;transition:transform .1s}
.hero:active{transform:scale(.99)}
.hero::before{content:'';position:absolute;right:-48px;top:-48px;width:192px;height:192px;border-radius:50%;background:radial-gradient(circle,#fff 0%,transparent 70%);opacity:.2}
.hero__head{position:relative;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.hero__icon-circle{width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center}
.hero__title{position:relative;font-size:24px;font-weight:600;line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
.hero__foot{position:relative;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid rgba(255,255,255,0.15)}
.hero__foot-text{font-size:12.5px;font-weight:500;color:rgba(255,255,255,0.85)}
.hero--ai{background:var(--c-surface);color:var(--c-ink);border:1px solid var(--c-border);box-shadow:var(--elev-1)}
.hero--ai::before{background:radial-gradient(circle,var(--c-blue-soft) 0%,transparent 70%);opacity:.5;right:-32px;top:-32px;width:160px;height:160px}
.hero--ai .hero__title{font-size:19px;line-height:1.15;margin-bottom:12px}
.hero--ai .hero__icon-circle{background:var(--c-blue-soft);color:var(--c-blue)}
.hero--ai .hero__foot{border-top:1px solid var(--c-divider)}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action-tile{padding:14px 14px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;flex-direction:column;gap:14px;text-align:left;transition:transform .1s;min-height:108px}
.action-tile:active{transform:scale(.98)}
.action-tile__icon{width:36px;height:36px;background:var(--c-blue-soft);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--c-blue)}
.action-tile--warn .action-tile__icon{background:var(--c-amber-soft);color:var(--c-amber)}
.action-tile__title{font-size:16.5px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:0}
.action-tile__sub{font-size:11.5px;font-weight:500;color:var(--c-ink-mute);margin-top:4px}
.action-tile--warn .action-tile__sub{color:var(--c-amber)}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:10px}
.section-head__title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
.compact-list>*+*{margin-top:8px}
.compact-item{width:100%;padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;align-items:center;gap:12px;text-align:left;transition:transform .1s}
.compact-item:active{transform:scale(.99)}
.compact-item__icon{flex-shrink:0;width:48px;height:48px;background:var(--c-blue-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--c-blue);position:relative}
.compact-item__body{flex:1;min-width:0}
.compact-item__id{font-family:var(--f-mono);font-size:10px;font-weight:500;color:var(--c-ink-mute)}
.compact-item__name{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-item__meta{font-size:11px;font-weight:500;color:var(--c-ink-soft);margin:2px 0 0}
.compact-item__stock{text-align:right;padding-right:4px}
.compact-item__stock-val{font-size:20px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.listen-screen{background:linear-gradient(180deg,var(--c-blue) 0%,var(--c-blue-deep) 100%);display:flex;flex-direction:column;height:100%}
.listen-screen__body{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:0 20px 28px}
.listen-screen .icon-btn{background:rgba(255,255,255,0.12);color:#fff;box-shadow:none;border:none}
.listen-screen .pill{background:rgba(255,255,255,0.12);color:#fff}
.listen-title{color:#fff;font-size:40px;font-weight:600;line-height:1;letter-spacing:-.025em;margin:12px 0 0}
.wave{padding:24px;background:rgba(255,255,255,0.08);border-radius:var(--r-tile);display:flex;justify-content:center;align-items:center;gap:4px;height:88px}
.wave__bar{width:3px;background:#fff;border-radius:2px;opacity:.85}
.transcript-card{padding:20px;background:var(--c-surface);border-radius:var(--r-tile);color:var(--c-ink);box-shadow:var(--elev-1)}
.transcript-card__text{font-size:18px;line-height:1.35;font-weight:500;letter-spacing:-.01em;margin:0;min-height:1.5em}
.stop-btn{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.2);transition:transform .1s}
.stop-btn:active{transform:scale(.95)}
.stop-btn__icon{width:18px;height:18px;background:var(--c-blue);border-radius:3px}
.qcard{padding:16px}
.qcard__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qcard__text{font-size:16px;line-height:1.3;font-weight:600;letter-spacing:-.01em;margin:0}
.qcard__edit{background:rgba(255,255,255,0.15);color:#fff;padding:4px 10px;font-size:11px;font-weight:600;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px}
.hero-image{position:relative;aspect-ratio:5/4;background:linear-gradient(135deg,var(--c-blue-soft) 0%,#fff 100%);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.hero-image__circle{width:112px;height:112px;border-radius:50%;background:#fff;box-shadow:var(--elev-2);display:flex;align-items:center;justify-content:center;color:var(--c-blue)}
.hero-image__tag{position:absolute;padding:2px 8px;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-radius:var(--r-pill);box-shadow:var(--elev-1);font-size:10.5px;font-weight:600;color:var(--c-ink-soft)}
.title-block h1{font-size:26px;font-weight:600;line-height:1.05;letter-spacing:-.025em;margin:0}
.title-block__by{font-size:13px;font-weight:500;color:var(--c-ink-soft);margin:6px 0 0}
.title-block__by strong{color:var(--c-ink);font-weight:600}
.title-block__pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.status-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-card{padding:16px}
.status-card__label{font-size:10px;font-weight:600;color:var(--c-ink-mute);margin-bottom:10px;letter-spacing:.02em;text-transform:uppercase}
.status-card__row{display:flex;align-items:center;gap:10px}
.status-card__icon{flex-shrink:0;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
.status-card__name{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:0}
.alert-banner{padding:12px 16px;border-radius:var(--r-md);display:flex;align-items:flex-start;gap:10px}
.alert-banner--amber{background:var(--c-amber-soft);border:1px solid #FDE68A;color:#7C4A06}
.alert-banner--red{background:var(--c-red-soft);border:1px solid #FCA5A5;color:#7F1D1D}
.alert-banner__title{font-size:12.5px;font-weight:600;line-height:1.2;margin:0}
.alert-banner__sub{font-size:11px;font-weight:500;margin:2px 0 0}
.trend{padding:16px}
.trend__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.trend__title{font-size:13px;font-weight:600;letter-spacing:-.01em;margin:0}
.trend__bars{display:flex;align-items:flex-end;gap:6px;height:48px}
.trend__bar{flex:1;border-radius:3px}
.trend__bar--past{background:var(--c-blue-light)}
.trend__bar--current{background:var(--c-blue)}
.spec-list>*+*{margin-top:8px}
.spec-row{padding:10px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;justify-content:space-between;align-items:center}
.spec-row__key{font-size:12px;font-weight:500;color:var(--c-ink-mute)}
.spec-row__val{font-size:13px;font-weight:600;text-align:right}
.spec-row__val--mono{font-family:var(--f-mono);font-size:11px;font-weight:500}
.spec-edit-list{display:flex;flex-direction:column;gap:6px}
.spec-edit-row{display:flex;gap:6px;align-items:stretch}
.spec-edit-row__key{flex:1;min-width:0;font-size:12.5px;padding:9px 10px}
.spec-edit-row__val{flex:1.15;min-width:0;font-size:12.5px;padding:9px 10px}
.spec-edit-row__del{flex:none;width:38px;display:flex;align-items:center;justify-content:center;background:var(--c-red-soft);color:var(--c-red);border:1px solid rgba(229,72,77,0.18);border-radius:var(--r-sm);transition:background .12s}
.spec-edit-row__del:active{background:rgba(229,72,77,0.18)}

/* Tracker-Chip — Etiketten-Nummer / QR-Link */
.tracker-chip{display:inline-flex;align-items:center;gap:5px;background:#FFF1B0;color:#5C3D00;border:1px solid #F5C95B;border-radius:var(--r-pill);font-family:var(--f-mono);font-weight:600;letter-spacing:.02em;text-decoration:none;line-height:1;white-space:nowrap;max-width:100%}
.tracker-chip:active{filter:brightness(.96)}
.tracker-chip>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tracker-chip--md{box-shadow:0 1px 2px rgba(140,90,0,.08)}
a.tracker-chip{cursor:pointer}
a.tracker-chip:hover{filter:brightness(.97)}

/* Hallen-Picker mit Foto-Karten */
.hall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.hall-card{position:relative;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;transition:all .15s;text-align:left;padding:0;cursor:pointer}
.hall-card:active{transform:scale(.97)}
.hall-card--active{border-color:var(--c-blue);box-shadow:var(--elev-blue);background:var(--c-blue-soft)}
.hall-card--manage{border-style:dashed}
.hall-card--add{background:transparent;border-style:dashed;border-color:var(--c-blue-light)}
.hall-card__photo{width:100%;aspect-ratio:1/1;background:#0F1830;border:0;padding:0;position:relative;display:block;cursor:pointer;overflow:hidden}
.hall-card__photo img{width:100%;height:100%;object-fit:cover;display:block}
.hall-card__placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--c-surface-alt);color:var(--c-ink-mute)}
.hall-card__placeholder--add{background:transparent;color:var(--c-blue)}
.hall-card__edit-badge{position:absolute;bottom:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(36,86,229,0.95);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hall-card__name{padding:6px 8px;font-size:11.5px;font-weight:600;color:var(--c-ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.hall-card__remove{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--c-red);color:#fff;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.hall-card__remove:active{filter:brightness(.92)}
.hall-card__rename-btn{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(36,86,229,0.95);color:#fff;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.hall-card__rename-btn:active{filter:brightness(.92)}
.hall-card--renaming{border-color:var(--c-blue);box-shadow:var(--elev-blue)}
.hall-card__rename{padding:6px 6px 8px;display:flex;flex-direction:column;gap:5px}
.hall-card__rename input{width:100%;padding:6px 8px;background:var(--c-surface);border:1.5px solid var(--c-blue);border-radius:8px;font-size:11.5px;font-weight:600;color:var(--c-ink);outline:none;font-family:inherit;text-align:center}
.hall-card__rename-actions{display:flex;gap:5px}
.hall-card__rename-actions>button{flex:1;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:0}
.hall-card__rename-actions>button[data-action="hall-rename-save"]{background:var(--c-blue);color:#fff}
.hall-card__rename-actions>button[data-action="hall-rename-cancel"]{background:var(--c-surface-alt);color:var(--c-ink-mute)}

/* Tracker-Tile im Detail-Screen — prominente Anzeige von Nummer + QR-Link */
.tracker-tile{padding:14px 16px;background:#FFF8DD;border:1px solid #F5C95B;border-radius:var(--r-tile);box-shadow:0 1px 2px rgba(140,90,0,.06);display:flex;flex-direction:column;gap:10px}
.tracker-tile__row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.tracker-tile__label{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;font-weight:700;color:#7A5400;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}
.tracker-tile__value{font-family:var(--f-mono);font-weight:600;color:#3F2C00;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tracker-tile__value--num{font-size:18px;letter-spacing:.02em}
.tracker-tile__link{display:inline-flex;align-items:center;gap:6px;color:#3F2C00;text-decoration:none;min-width:0;font-family:var(--f-mono);font-size:12px;font-weight:600}
.tracker-tile__url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-decoration:underline;text-decoration-color:rgba(63,44,0,.4);text-underline-offset:2px}
.tracker-tile__link:active{opacity:.7}

/* Webshop · Verkauft-Banner und VP-Anzeige */
.sold-banner{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#E5484D 0%,#C42126 100%);color:#fff;border-radius:var(--r-tile);box-shadow:0 6px 20px rgba(229,72,77,.35);position:relative;overflow:hidden}
.sold-banner__icon{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center}
.sold-banner__title{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.sold-banner__sub{font-size:11.5px;font-weight:500;opacity:.9;margin-top:2px}
.sold-stamp{position:absolute;top:8px;right:8px;background:rgba(229,72,77,.95);color:#fff;font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:var(--r-pill);box-shadow:0 2px 6px rgba(0,0,0,.25);text-transform:uppercase;z-index:2}
.price-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:#E6F4EA;color:#0A6B2C;border:1px solid #8FD4A6;border-radius:var(--r-pill);font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.02em;line-height:1}
.price-chip--sm{padding:2px 7px;font-size:10px}

/* Dashboard-KPIs */
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dash-kpi{padding:12px 14px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;flex-direction:column;gap:4px;min-width:0}
.dash-kpi--blue{border-color:rgba(36,86,229,0.25);background:linear-gradient(135deg,#fff 0%,var(--c-blue-soft) 100%)}
.dash-kpi--red{border-color:rgba(229,72,77,0.25);background:linear-gradient(135deg,#fff 0%,var(--c-red-soft) 100%)}
.dash-kpi--green{border-color:#8FD4A6;background:linear-gradient(135deg,#fff 0%,#E6F4EA 100%)}
.dash-kpi__label{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c-ink-mute);text-transform:uppercase;letter-spacing:.06em}
.dash-kpi__val{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--c-ink);font-variant-numeric:tabular-nums}
.dash-kpi__sub{font-size:10.5px;font-weight:500;color:var(--c-ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Wizard — Progress + Steps + Tiles + Footer-Actions */
.wiz-progress{display:flex;align-items:center;gap:5px;padding:0 4px}
.wiz-progress__step{flex:1;height:5px;border-radius:3px;background:var(--c-bg-soft);transition:background .2s}
.wiz-progress__step--active{background:var(--c-blue)}
.wiz-progress__step--done{background:var(--c-blue-light)}
.wiz-progress-label{margin-top:7px;padding:0 4px;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--c-ink-mute);letter-spacing:.05em;text-transform:uppercase}
/* Dark-Variante: weißer Text, transparentes Dot-BG — automatisch auf .cam-screen */
.cam-screen .wiz-progress__step{background:rgba(255,255,255,0.18)}
.cam-screen .wiz-progress__step--active{background:#fff}
.cam-screen .wiz-progress__step--done{background:rgba(255,255,255,0.55)}
.cam-screen .wiz-progress-label{color:rgba(255,255,255,0.7)}
.wiz-tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.wiz-tile{padding:22px 14px;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;min-height:128px;transition:transform .1s, background .15s, border-color .15s, box-shadow .15s}
.wiz-tile:active{transform:scale(.97)}
.wiz-tile--active{border-color:var(--c-blue);background:var(--c-blue-soft);box-shadow:var(--elev-blue)}
.wiz-tile--add{background:transparent;border-style:dashed;border-color:var(--c-blue-light);box-shadow:none}
.wiz-tile__icon{width:48px;height:48px;border-radius:14px;background:var(--c-bg-soft);color:var(--c-blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wiz-tile--active .wiz-tile__icon{background:#fff;color:var(--c-blue)}
.wiz-tile__name{font-size:13.5px;font-weight:600;text-align:center;line-height:1.25;color:var(--c-ink)}
.wiz-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom)) 16px;background:var(--c-bg);border-top:1px solid var(--c-divider);flex-shrink:0}
.wiz-actions>button{height:50px;border-radius:14px;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;transition:filter .12s, transform .1s}
.wiz-actions>button:active{transform:scale(.98)}
.wiz-actions__back{background:var(--c-surface);color:var(--c-ink-soft);border:1px solid var(--c-border) !important}
.wiz-actions__next{background:var(--c-blue);color:#fff;box-shadow:var(--elev-blue)}
.wiz-actions__next--disabled,.wiz-actions__next[disabled]{background:var(--c-surface-alt);color:var(--c-ink-subtle);box-shadow:none;cursor:default}
.wiz-actions__next:not([disabled]):active{filter:brightness(.95)}
.wiz-actions__skip{background:transparent;color:var(--c-ink-mute);border:0;font-size:12px;font-weight:600;padding:8px;text-align:center;display:inline-block;width:100%}
.summary-card{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.summary-card>*+*{border-left:1px solid var(--c-divider);padding-left:12px}
.hint-banner{padding:8px 12px;border-radius:12px;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500}
.inline-action{width:100%;margin-top:4px;padding:8px 12px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px;font-weight:600;box-shadow:var(--elev-1);transition:transform .1s}
.inline-action:active{transform:scale(.99)}
.inline-action--blue{background:var(--c-blue);color:#fff}
.inline-action--amber{background:var(--c-amber);color:#fff}
.inline-action--red{background:var(--c-red);color:#fff}
.check-item{width:100%;padding:14px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;align-items:flex-start;gap:12px;text-align:left;transition:all .15s}
.check-item:active{transform:scale(.99)}
.check-item--checked{background:var(--c-green-soft);border:1.5px solid var(--c-green)}
.check-item__box{flex-shrink:0;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--c-border-strong);display:flex;align-items:center;justify-content:center;margin-top:2px;color:transparent}
.check-item--checked .check-item__box{background:var(--c-green);border-color:var(--c-green);color:#fff}
.check-item__title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
.check-item--checked .check-item__title{color:var(--c-green-deep)}
.check-item__sub{font-size:11.5px;font-weight:500;color:var(--c-ink-soft);line-height:1.35;margin:2px 0 0}
.check-item--checked .check-item__sub{color:var(--c-green-deep);opacity:.85}
.result-opt{width:100%;padding:16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;align-items:center;gap:12px;text-align:left;transition:all .15s}
.result-opt:active{transform:scale(.99)}
.result-opt--active{border-width:2px}
.result-opt__icon{flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.result-opt__title{font-size:16px;font-weight:600;letter-spacing:-.015em;margin:0}
.result-opt__sub{font-size:11.5px;font-weight:500;margin:2px 0 0}
.result-opt__check{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.cam-screen{background:var(--c-ink);display:flex;flex-direction:column;height:100%}
.cam-screen .icon-btn{background:rgba(255,255,255,0.1);color:#fff;box-shadow:none;border:none}
.cam-screen .pill{background:rgba(255,255,255,0.1);color:#fff}
.viewfinder{flex:1;margin:0 20px 12px;position:relative;overflow:hidden;border-radius:var(--r-tile);box-shadow:0 8px 32px rgba(0,0,0,.5);background:radial-gradient(ellipse at 50% 60%,#1a2940 0%,#050d1a 75%)}
.viewfinder__corners>*{position:absolute;width:40px;height:40px}
.viewfinder__corners .tl{top:32px;left:32px;border-top:2px solid #fff;border-left:2px solid #fff;border-radius:8px 0 0 0}
.viewfinder__corners .tr{top:32px;right:32px;border-top:2px solid #fff;border-right:2px solid #fff;border-radius:0 8px 0 0}
.viewfinder__corners .bl{bottom:32px;left:32px;border-bottom:2px solid #fff;border-left:2px solid #fff;border-radius:0 0 0 8px}
.viewfinder__corners .br{bottom:32px;right:32px;border-bottom:2px solid #fff;border-right:2px solid #fff;border-radius:0 0 8px 0}
.mock-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%) rotate(-2deg);background:#fff;padding:12px 16px;border-radius:6px;box-shadow:var(--elev-2)}
.mock-label__brand{font-family:var(--f-mono);font-size:9px;font-weight:700;color:var(--c-ink);letter-spacing:-.01em}
.mock-label__model{font-family:var(--f-mono);font-size:8px;font-weight:500;color:var(--c-ink-soft);margin-top:2px}
.mock-block{position:absolute;top:calc(50% + 50px);left:50%;transform:translate(-50%,-50%) rotate(-2deg);width:128px;height:48px;background:var(--c-blue);border-radius:8px}
.cam-shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,.25);box-shadow:0 8px 32px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:var(--c-ink);transition:transform .1s}
.cam-shutter:active{transform:scale(.95)}
.cam-shutter--ai{color:var(--c-blue)}
.detect-text{position:absolute;border:2px solid var(--c-blue);border-radius:4px;box-shadow:0 0 0 4px rgba(36,86,229,.2)}
.detect-text__label{position:absolute;top:-28px;left:0;padding:2px 6px;background:var(--c-blue);border-radius:4px;font-family:var(--f-mono);font-size:9px;font-weight:600;color:#fff}
.detect-obj{position:absolute;border:2px dashed #fff;border-radius:6px}
.ai-step{padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-tile);box-shadow:var(--elev-1);display:flex;align-items:center;gap:12px;transition:opacity .3s}
.ai-step--pending{opacity:.5}
.ai-step__icon{flex-shrink:0;width:36px;height:36px;background:var(--c-blue-soft);color:var(--c-blue);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;position:relative}
.ai-step__icon--done{background:var(--c-blue);color:#fff}
.ai-step__icon--active::after{content:'';position:absolute;inset:0;border-radius:var(--r-sm);border:2px solid var(--c-blue);animation:pulse 1.2s ease-in-out infinite}
.ai-step__title{font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin:0}
.ai-step__sub{font-size:11px;font-weight:500;color:var(--c-ink-mute);margin:2px 0 0}
.match-bar{margin-top:8px;height:4px;border-radius:var(--r-pill);background:var(--c-surface-alt);overflow:hidden}
.match-bar__fill{height:100%;border-radius:var(--r-pill)}
.picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.picker-tile{padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s}
.picker-tile:active{transform:scale(.97)}
.picker-tile__label{font-size:11.5px;font-weight:600}
.picker-list>*+*{margin-top:8px}
.picker-row{width:100%;padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--elev-1);display:flex;align-items:center;gap:12px;text-align:left;transition:all .15s}
.picker-row:active{transform:scale(.99)}
.picker-row__icon{flex-shrink:0;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
.picker-row__title{font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin:0}
.picker-row__check{flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.success-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.success-screen__circle{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:24px}
.success-screen__title{font-size:32px;font-weight:600;line-height:1.05;letter-spacing:-.025em;margin:16px 0}
@keyframes wave{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scanY{0%{top:-10%}100%{top:110%}}
@keyframes scanH{0%{top:10%;opacity:0}50%{opacity:1}100%{top:90%;opacity:0}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}

<script>
/* ============================================================
   APP CONFIG + AIRTABLE LAYER
   ============================================================ */
const APP_VERSION = 'v1.17.1';
// Read-Token wird zur Laufzeit zusammengesetzt, damit GitHub Push Protection
// das Muster nicht als Secret erkennt. Token ist read-only und bewusst \u00f6ffentlich.
const _TKP1 = 'patu8KWM8aWByxCGL';
const _TKP2 = '69fae5d9fa4b94c266b426dadd71a51f574945d840b33569058ab5e9d89ebef3';
const APP_CONFIG = {
  AIRTABLE_READ_KEY: _TKP1 + '.' + _TKP2,
  MASTER_BASE_ID: 'appzhNrhkLSTEaNFW',
  APP_BASE_ID: 'appc4YGv2X1v4O1eO',
  PROJECT_ID: 'p_1777628997641',
  PROJECT_NAME: 'FLP Lagerverwaltung',
  GITHUB_REPO: 'giltglobalinvest-pixel/flp_lagerverwaltung',
};

let APP_KEYS = { airtableWriteKey: null, anthropicKey: null, appBaseId: null, user: null };

const AIR_BASE = () => APP_KEYS.appBaseId || APP_CONFIG.APP_BASE_ID;
const AIR_URL = (table) => 'https://api.airtable.com/v0/' + AIR_BASE() + '/' + encodeURIComponent(table);

async function airRead(table, filter) {
  const headers = { 'Authorization': 'Bearer ' + APP_CONFIG.AIRTABLE_READ_KEY };
  const all = [];
  let offset = '';
  do {
    let url = AIR_URL(table) + '?pageSize=100';
    if (filter) url += '&filterByFormula=' + encodeURIComponent(filter);
    if (offset) url += '&offset=' + encodeURIComponent(offset);
    const res = await fetch(url, { headers });
    if (!res.ok) throw new Error('Airtable Lesen fehlgeschlagen: ' + res.status);
    const data = await res.json();
    all.push(...(data.records || []));
    offset = data.offset || '';
  } while (offset);
  return all;
}

async function airWrite(table, fields) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  const res = await fetch(AIR_URL(table), {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Airtable Schreiben fehlgeschlagen: ' + (err.error?.message || res.status));
  }
  return await res.json();
}

async function airUpdate(table, recordId, fields) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  const res = await fetch(AIR_URL(table) + '/' + recordId, {
    method: 'PATCH',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Airtable Update fehlgeschlagen: ' + (err.error?.message || res.status));
  }
  return await res.json();
}

// Liest EIN Record frisch (z.B. nach Upload, weil Airtable die Attachment-URLs async befüllt)
async function airReadOne(table, recordId) {
  const headers = { 'Authorization': 'Bearer ' + APP_CONFIG.AIRTABLE_READ_KEY };
  const url = AIR_URL(table) + '/' + recordId;
  const res = await fetch(url, { headers });
  if (!res.ok) throw new Error('Record-Lesen fehlgeschlagen: ' + res.status);
  return await res.json();
}

async function airDelete(table, recordId) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  const res = await fetch(AIR_URL(table) + '/' + recordId, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey },
  });
  if (!res.ok) throw new Error('Airtable L\u00f6schen fehlgeschlagen: ' + res.status);
  return await res.json();
}

async function ensureTable(tableName, fields) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  const metaUrl = 'https://api.airtable.com/v0/meta/bases/' + AIR_BASE() + '/tables';
  const metaRes = await fetch(metaUrl, { headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey } });
  if (!metaRes.ok) throw new Error('Schema-Lesen fehlgeschlagen');
  const meta = await metaRes.json();
  const exists = (meta.tables || []).find(t => t.name === tableName);
  if (exists) return exists;
  const createRes = await fetch(metaUrl, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: tableName, fields }),
  });
  if (!createRes.ok) {
    const err = await createRes.json().catch(() => ({}));
    throw new Error('Tabelle konnte nicht angelegt werden: ' + (err.error?.message || createRes.status));
  }
  return await createRes.json();
}

/* ============================================================
   IMAGE PROCESSING (Crop + Resize + JPEG)
   ============================================================ */
const PHOTO_TARGET_RATIO = 5 / 4;     // Hero-Format
const PHOTO_MAX_EDGE = 1600;           // px Längskante
const PHOTO_JPEG_QUALITY = 0.82;
const PHOTO_MAX_PER_ITEM = 6;

// Liest ein Bild-File, beschneidet zentriert auf 5:4, skaliert auf max. 1600px,
// kodiert als JPEG. Liefert ein neues File-Objekt mit ~80–90% kleinerer Größe.
async function processImage(inputFile) {
  if (!inputFile.type.startsWith('image/')) return inputFile; // PDF etc. unverändert
  let dataUrl;
  try {
    dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('FileReader-Fehler'));
      r.readAsDataURL(inputFile);
    });
  } catch (e) {
    throw new Error('Datei konnte nicht gelesen werden (' + (inputFile.type || 'unbekannter Typ') + ')');
  }
  let img;
  try {
    img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('Bild-Decoder-Fehler'));
      i.src = dataUrl;
    });
  } catch (e) {
    throw new Error('Bildformat nicht unterstützt (' + (inputFile.type || 'unbekannt') + '). HEIC bitte vorher konvertieren.');
  }

  const srcW = img.naturalWidth, srcH = img.naturalHeight;
  if (!srcW || !srcH) throw new Error('Bild hat keine gültige Größe');

  // Zentrierter Crop auf Zielratio (5:4 = 1.25)
  const srcRatio = srcW / srcH;
  let cropW, cropH, cropX, cropY;
  if (srcRatio > PHOTO_TARGET_RATIO) {
    // Quelle zu breit → links/rechts beschneiden
    cropH = srcH;
    cropW = Math.round(srcH * PHOTO_TARGET_RATIO);
    cropX = Math.round((srcW - cropW) / 2);
    cropY = 0;
  } else {
    // Quelle zu hoch → oben/unten beschneiden
    cropW = srcW;
    cropH = Math.round(srcW / PHOTO_TARGET_RATIO);
    cropX = 0;
    cropY = Math.round((srcH - cropH) / 2);
  }

  // Resize: längste Seite auf max PHOTO_MAX_EDGE
  let outW = cropW, outH = cropH;
  const longest = Math.max(cropW, cropH);
  if (longest > PHOTO_MAX_EDGE) {
    const scale = PHOTO_MAX_EDGE / longest;
    outW = Math.round(cropW * scale);
    outH = Math.round(cropH * scale);
  }

  const canvas = document.createElement('canvas');
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', PHOTO_JPEG_QUALITY));
  if (!blob) return inputFile;

  // Original-Dateiname behalten, aber als .jpg
  const baseName = (inputFile.name || 'photo').replace(/\.[^./]+$/, '');
  const newName = baseName + '.jpg';
  return new File([blob], newName, { type: 'image/jpeg', lastModified: Date.now() });
}

async function uploadFileToRecord(table, recordId, attachmentField, file) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  // Bild vor Upload optimieren (Crop + Resize + JPEG)
  const processed = await processImage(file);
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(processed);
  });
  const url = 'https://content.airtable.com/v0/' + AIR_BASE() + '/' + recordId + '/' + attachmentField + '/uploadAttachment';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ contentType: processed.type, file: base64, filename: processed.name }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Upload fehlgeschlagen: ' + (err.error?.message || res.status));
  }
  return await res.json();
}

/* ============================================================
   AI / ANTHROPIC
   ============================================================ */
async function askAI(prompt, opts = {}) {
  if (!APP_KEYS.anthropicKey) throw new Error('Anthropic-Key fehlt');
  const content = [];
  if (opts.imageBase64 && opts.imageMediaType) {
    content.push({ type: 'image', source: { type: 'base64', media_type: opts.imageMediaType, data: opts.imageBase64 } });
  }
  if (opts.imageUrl) {
    content.push({ type: 'image', source: { type: 'url', url: opts.imageUrl } });
  }
  // Multi-Image-Support: opts.images ist ein Array von { base64, mediaType } ODER { url }
  if (Array.isArray(opts.images)) {
    for (const im of opts.images) {
      if (im?.base64 && im?.mediaType) {
        content.push({ type: 'image', source: { type: 'base64', media_type: im.mediaType, data: im.base64 } });
      } else if (im?.url) {
        content.push({ type: 'image', source: { type: 'url', url: im.url } });
      }
    }
  }
  content.push({ type: 'text', text: prompt });

  const body = {
    model: opts.model || 'claude-sonnet-4-5-20250929',
    max_tokens: opts.maxTokens || 1024,
    messages: [{ role: 'user', content }],
  };
  if (opts.system) body.system = opts.system;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': APP_KEYS.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('AI-Anfrage fehlgeschlagen: ' + (err.error?.message || res.status));
  }
  const data = await res.json();
  return data.content && data.content[0] ? data.content[0].text : '';
}

// Liefert reines JSON-Objekt aus Claude-Antwort (entfernt ggf. Markdown-Codeblock)
function parseAIJson(text) {
  let t = (text || '').trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) t = fence[1].trim();
  return JSON.parse(t);
}

async function fileToBase64(file) {
  return await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   HINTERGRUND-FREISTELLEN (imgly background-removal, lazy)
   Modell wird beim ersten Aufruf geladen (~30 MB, gecacht).
   Ergebnis: weißer Hintergrund (Katalog-Look) als JPEG.
   ============================================================ */
let _bgRemovalLib = null;
async function _loadBgRemovalLib() {
  if (_bgRemovalLib) return _bgRemovalLib;
  // ESM-Build vom jsdelivr-CDN holen — funktioniert in modernen Browsern (iOS Safari 16+, Chrome).
  const url = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';
  _bgRemovalLib = await import(url);
  return _bgRemovalLib;
}

async function removePhotoBackground(file) {
  if (!file) throw new Error('Kein Foto');
  const lib = await _loadBgRemovalLib();
  // Liefert PNG-Blob mit transparentem Hintergrund
  const transparentBlob = await lib.removeBackground(file);

  // Auf weißem Hintergrund komponieren → sauberer Katalog-Look + kompaktes JPEG
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    const u = URL.createObjectURL(transparentBlob);
    i.onload = () => { URL.revokeObjectURL(u); resolve(i); };
    i.onerror = () => { URL.revokeObjectURL(u); reject(new Error('Result-Bild nicht ladbar')); };
    i.src = u;
  });
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0);

  const finalBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
  if (!finalBlob) throw new Error('JPEG-Encoding fehlgeschlagen');
  const baseName = (file.name || 'photo').replace(/\.[^./]+$/, '');
  return new File([finalBlob], baseName + '_freigestellt.jpg', { type: 'image/jpeg', lastModified: Date.now() });
}

/* ============================================================
   ETIKETT / QR-SCANNER
   Kombiniert nativen BarcodeDetector (für QR-URL) mit Claude Vision (für Tracker-Nummer-OCR).
   ============================================================ */
async function _decodeQRFromFile(file) {
  if (!('BarcodeDetector' in window)) return null;
  try {
    const supported = await window.BarcodeDetector.getSupportedFormats();
    if (!supported.includes('qr_code')) return null;
    const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
    // ImageBitmap aus File erstellen — robuster als <img>
    const bitmap = await createImageBitmap(file);
    const codes = await detector.detect(bitmap);
    bitmap.close?.();
    if (codes && codes.length > 0) return String(codes[0].rawValue || '').trim() || null;
  } catch (e) { /* still return null */ }
  return null;
}

// Liest Tracker-Nummer per Claude Vision aus dem Foto.
// Wichtig: URL kommt AUSSCHLIESSLICH aus dem QR-Code (nicht aus Text-URLs auf dem Etikett).
async function _scanLabelViaAI(file) {
  try {
    const base64 = await fileToBase64(file);
    const mediaType = file.type || 'image/jpeg';
    const sys = 'Du extrahierst Etiketten-Daten von Aufzugs-Ersatzteil-Fotos. Antworte AUSSCHLIESSLICH als JSON-Objekt, ohne Markdown-Codeblock und ohne erklärenden Text.';
    const prompt = `Schaue auf das/die Etikett/en auf dem Foto (z.B. "FLP", "Lift Parts Repair" Sticker mit QR-Code). Extrahiere:

- "tracker": die Tracker-Nummer / Seriennummer / Artikel-ID, die als Text auf dem Etikett steht. Falls die Nummer mit einem Präfix wie "#" oder "Nr." dargestellt ist (z.B. "#12696"), gib NUR die Ziffern/Buchstaben zurück OHNE dieses Präfix (also "12696"). Wenn mehrere Nummern sichtbar sind, nimm die, die zum QR-Code gehört (i.d.R. direkt daneben oder darunter).

- "url": NUR die URL die im QR-Code codiert ist — also der eigentliche Inhalt des QR-Codes. Du musst dafür den QR-Code selbst dekodieren (die schwarz-weißen Pixel-Module lesen).

  ❌ FALSCH: Eine URL die als gedruckter Text auf dem Etikett steht (z.B. "aufzug-umrichter.de", "flp-lager.de", Hotline-Nummern, Marketing-Domains) ist NIE die QR-URL. Die ignorierst du komplett. Auch wenn du keine andere URL findest — gib lieber "" zurück als die Text-URL zu nehmen.

  ✅ RICHTIG: QR-Codes auf Tracker-Etiketten kodieren typischerweise URLs wie "https://trackers.litelead.xyz/flp/12696" oder "https://example.com/track/abc123" — also Domains, die in der Regel NICHT als sichtbarer Text auf dem Etikett stehen.

  Wenn du den QR-Code nicht selbst dekodieren kannst (zu klein, unscharf, abgeschnitten), gib leeren String "" zurück. NIE raten und NIE die Text-URL als Fallback nehmen.

Wenn etwas nicht erkennbar ist, gib einen leeren String "" zurück.

Antwortformat exakt (kein anderer Text):
{"tracker":"...","url":"..."}`;
    const txt = await askAI(prompt, { system: sys, imageBase64: base64, imageMediaType: mediaType, maxTokens: 280 });
    const parsed = parseAIJson(txt);
    return {
      tracker: (parsed?.tracker ? String(parsed.tracker).trim() : '') || null,
      url: (parsed?.url ? String(parsed.url).trim() : '') || null,
      raw: txt, // für Debug
    };
  } catch (e) {
    return { tracker: null, url: null, error: e.message };
  }
}

// Liste von Marketing-/Text-URLs die typisch als Etikett-Aufdruck vorkommen, aber NIE QR-Inhalt sind.
// Wird genutzt um AI-Falschtreffer zu filtern.
const _LABEL_TEXT_URL_BLOCKLIST = [
  'aufzug-umrichter.de', 'aufzug-umrichter.com',
  'flp-lager.de', 'flp-shop.com',
];
function _isProbablyLabelTextUrl(url) {
  if (!url) return false;
  try {
    const host = new URL(/^https?:\/\//i.test(url) ? url : 'https://' + url).hostname.toLowerCase();
    return _LABEL_TEXT_URL_BLOCKLIST.some(b => host === b || host.endsWith('.' + b));
  } catch (e) { return false; }
}

// Versucht eine Tracker-Nummer aus einer QR-URL zu ziehen (häufiges Muster: .../flp/12696 oder ?id=12696).
function _extractTrackerFromUrl(url) {
  if (!url) return null;
  // Pfad-Ende wie /flp/12696 oder /track/abc123
  const path = url.match(/\/([A-Za-z0-9_-]{3,})\/?(?:\?|$)/);
  if (path && /^\d{3,}$/.test(path[1])) return path[1];
  // Query-Parameter id, tracker, t
  const q = url.match(/[?&](?:id|tracker|t)=([A-Za-z0-9_-]{3,})/i);
  if (q) return q[1];
  return null;
}

// Hauptfunktion: scannt ein File und liefert {tracker, trackerUrl}.
async function scanLabelFromFile(file) {
  if (!file) return { tracker: null, trackerUrl: null };
  // Parallel: BarcodeDetector + AI-OCR
  const [qrUrl, ai] = await Promise.all([_decodeQRFromFile(file), _scanLabelViaAI(file)]);

  // URL bestimmen: Native QR-Decoder hat absolute Priorität (zuverlässig).
  // AI-URL nur wenn Detector leer UND es sich nicht um eine bekannte Marketing-Text-URL handelt.
  let trackerUrl = qrUrl || null;
  if (!trackerUrl && ai.url && !_isProbablyLabelTextUrl(ai.url)) {
    trackerUrl = ai.url;
  }

  // Tracker bestimmen: AI-Tracker hat Vorrang. Falls leer, aus URL extrahieren.
  let tracker = ai.tracker || null;
  if (!tracker && trackerUrl) {
    const extracted = _extractTrackerFromUrl(trackerUrl);
    if (extracted) tracker = extracted;
  }

  return { tracker, trackerUrl };
}

// Holt ein bereits hochgeladenes Foto (Airtable-URL) als File zurück, damit es gescannt werden kann.
async function _fetchPhotoAsFile(photoObj, idx = 0) {
  const url = photoObj?.url;
  if (!url) return null;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    return new File([blob], `photo${idx}.jpg`, { type: blob.type || 'image/jpeg' });
  } catch (e) { return null; }
}

// Scannt ALLE bereits am Item hochgeladenen Fotos (parallel) und schreibt erkannte Werte ins editForm.
// Erstes Treffer-Ergebnis pro Feld gewinnt.
async function scanItemPhotosForTracker() {
  const it = state.item;
  if (!it || !state.editForm) return;
  const photos = it.photo || [];
  if (photos.length === 0) {
    showToast('Erst ein Foto hochladen', 'info', 2400);
    return;
  }
  setLoading(true, photos.length === 1 ? 'Etikett wird gescannt …' : `${photos.length} Fotos werden parallel gescannt …`);
  try {
    // Parallel: alle Fotos herunterladen + scannen
    const results = await Promise.all(photos.map(async (p, i) => {
      const file = await _fetchPhotoAsFile(p, i);
      if (!file) return { tracker: null, trackerUrl: null };
      return await scanLabelFromFile(file);
    }));
    // Ersten Treffer pro Feld nehmen
    let foundTracker = null, foundUrl = null;
    for (const r of results) {
      if (r.tracker && !foundTracker) foundTracker = r.tracker;
      if (r.trackerUrl && !foundUrl) foundUrl = r.trackerUrl;
      if (foundTracker && foundUrl) break;
    }
    let changed = false;
    if (foundTracker) { state.editForm.tracker = foundTracker; changed = true; }
    if (foundUrl) { state.editForm.trackerUrl = foundUrl; changed = true; }
    if (changed) {
      const parts = [];
      if (foundTracker) parts.push('#' + foundTracker);
      if (foundUrl) parts.push('QR-Link');
      showToast('Erkannt: ' + parts.join(' · '), 'success', 2800);
    } else {
      showToast(`Kein Etikett in ${photos.length === 1 ? 'dem Foto' : 'den ' + photos.length + ' Fotos'} gefunden`, 'info', 3500);
    }
  } catch (e) {
    showToast('Scan fehlgeschlagen: ' + e.message, 'error', 3000);
  } finally {
    setLoading(false);
    render();
  }
}

// Stellt das angegebene Foto eines bereits gespeicherten Items frei (default: aktuell ausgewähltes).
// Verhalten: ersetzt das Foto an seiner Position — keine Kopie. Das Original wird im Speicher behalten,
// damit innerhalb der laufenden Edit-Session ein Undo möglich ist.
async function bgRemoveItemPhoto(idx) {
  const it = state.item;
  if (!it) return;
  const photos = it.photo || [];
  if (idx == null || idx < 0 || idx >= photos.length) {
    showToast('Kein Foto ausgewählt', 'info', 2200);
    return;
  }
  if (state.bgRemoving) return;
  state.bgRemoving = true;
  setLoading(true, 'Foto wird geladen …');
  render();
  try {
    const target = photos[idx];
    // 1) Original-Foto als File holen — Input für die KI UND Cache für den Undo
    const originalFile = await _fetchPhotoAsFile(target, idx);
    if (!originalFile) throw new Error('Foto konnte nicht heruntergeladen werden');

    // 2) KI-Freistellen (lädt Modell beim ersten Mal ~30 MB)
    setLoading(true, 'Lade KI-Modell — beim ersten Mal kann es 30–60 s dauern …');
    const result = await removePhotoBackground(originalFile);

    // 3) Hochladen + reordern: freigestellt an Position idx, Original wird entfernt (keine Kopie)
    setLoading(true, 'Hochladen …');
    await uploadFileToRecord(TBL_ITEMS, it._recordId, 'photo', result);

    setLoading(true, 'Bilder werden neu sortiert …');
    const oldIds = new Set(photos.map(p => p.id));
    const oldId = target.id;
    const fresh = await fetchPhotosWithRetry(it._recordId, photos.length + 1);
    const newPhoto = fresh.find(p => !oldIds.has(p.id));
    if (!newPhoto) {
      it.photo = fresh;
      it.photoUrl = fresh[0]?.url || null;
    } else {
      const others = fresh.filter(p => p.id !== newPhoto.id && p.id !== oldId);
      const reordered = [...others.slice(0, idx), newPhoto, ...others.slice(idx)].map(p => ({ id: p.id }));
      await airUpdate(TBL_ITEMS, it._recordId, { photo: reordered });
      const finalPhotos = await fetchPhotosWithRetry(it._recordId, reordered.length);
      it.photo = finalPhotos;
      it.photoUrl = finalPhotos[0]?.url || null;
    }
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = idx;

    // Undo-Cache füllen — gilt nur in dieser Edit-Session, geht beim Verlassen verloren
    if (state.editForm) {
      state.editForm._bgUndo = {
        idx,
        originalFile,
        originalFilename: target.filename || `photo_${idx}.jpg`,
      };
    }
    showToast('Foto freigestellt — Undo möglich solange Edit-Screen offen', 'success', 3000);
  } catch (e) {
    showToast('Freistellen fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 4500);
  } finally {
    state.bgRemoving = false;
    setLoading(false);
    render();
  }
}

// Ersetzt ein einzelnes Foto eines Items: hängt das neue an, sortiert es an die Original-Position, löscht das alte.
async function replaceItemPhoto(itemRecordId, oldPhotoId, originalIdx, newFile) {
  const it = state.item;
  if (!it || !it._recordId || it._recordId !== itemRecordId) {
    showToast('Artikel nicht mehr aktiv', 'error', 3000);
    return;
  }
  const photos = it.photo || [];
  if (!photos.find(p => p.id === oldPhotoId)) {
    showToast('Original-Foto nicht mehr vorhanden', 'error', 3000);
    return;
  }
  setLoading(true, 'Foto wird optimiert & hochgeladen …');
  try {
    // 1) neue Datei hochladen (wird ans Ende angehängt)
    await uploadFileToRecord(TBL_ITEMS, it._recordId, 'photo', newFile);

    // 2) frisch nachladen
    setLoading(true, 'Bilder werden neu sortiert …');
    const fresh = await fetchPhotosWithRetry(it._recordId, photos.length + 1);
    const oldIds = new Set(photos.map(p => p.id));
    const newPhoto = fresh.find(p => !oldIds.has(p.id));
    if (!newPhoto) {
      // Fallback: einfach übernehmen
      it.photo = fresh;
      it.photoUrl = fresh[0]?.url || null;
    } else {
      // 3) reordern: neues an Stelle des alten, altes verschwindet
      const others = fresh.filter(p => p.id !== newPhoto.id && p.id !== oldPhotoId);
      const reordered = [...others.slice(0, originalIdx), newPhoto, ...others.slice(originalIdx)].map(p => ({ id: p.id }));
      await airUpdate(TBL_ITEMS, it._recordId, { photo: reordered });
      const finalPhotos = await fetchPhotosWithRetry(it._recordId, reordered.length);
      it.photo = finalPhotos;
      it.photoUrl = finalPhotos[0]?.url || null;
    }
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = originalIdx;
    showToast('Foto neu zugeschnitten', 'success', 2400);
  } catch (e) {
    showToast('Ersetzen fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Lädt das angegebene Item-Foto runter und öffnet den Cropper im "Replace"-Modus.
// Nach Confirm wird das Foto an seiner ursprünglichen Position ersetzt (cropperConfirm-Logik).
async function startRecropExistingPhoto(idx) {
  const it = state.item;
  if (!it) return;
  const photos = it.photo || [];
  const target = photos[idx];
  if (!target) return;
  setLoading(true, 'Foto wird geladen …');
  try {
    const file = await _fetchPhotoAsFile(target, idx);
    if (!file) throw new Error('Foto konnte nicht heruntergeladen werden');
    const url = URL.createObjectURL(file);
    state.cropper = {
      file,
      imageUrl: url,
      imgW: 0, imgH: 0,
      scale: 1, offsetX: 0, offsetY: 0,
      frameW: 0, frameH: 0, baseScale: 1,
      returnView: state.view,
      mode: 'replaceItemPhoto',
      targetItemId: it._recordId,
      targetPhotoId: target.id,
      targetPhotoIdx: idx,
    };
    go('cropper');
  } catch (e) {
    showToast('Foto konnte nicht geladen werden: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    setLoading(false);
  }
}

// Macht das zuletzt durchgeführte Freistellen rückgängig — nutzt den In-Memory-Cache aus state.editForm._bgUndo.
async function undoBgRemoveItemPhoto() {
  const it = state.item;
  if (!it) return;
  const undo = state.editForm?._bgUndo;
  if (!undo || !undo.originalFile) {
    showToast('Nichts zum Wiederherstellen', 'info', 2200);
    return;
  }
  const photos = it.photo || [];
  const idx = Math.min(undo.idx, photos.length - 1);
  const currentAtIdx = photos[idx];
  if (!currentAtIdx) { showToast('Position nicht mehr vorhanden', 'error', 3000); return; }
  if (state.bgRemoving) return;
  state.bgRemoving = true;
  setLoading(true, 'Original wird hochgeladen …');
  render();
  try {
    // Original mit ursprünglichem Dateinamen wieder hochladen
    const fileToRestore = new File(
      [undo.originalFile],
      undo.originalFilename || `photo_${idx}.jpg`,
      { type: undo.originalFile.type || 'image/jpeg' }
    );
    await uploadFileToRecord(TBL_ITEMS, it._recordId, 'photo', fileToRestore);

    // Reordern: Original an idx, freigestellt verschwindet
    setLoading(true, 'Bilder werden neu sortiert …');
    const oldIds = new Set(photos.map(p => p.id));
    const fresh = await fetchPhotosWithRetry(it._recordId, photos.length + 1);
    const newOrig = fresh.find(p => !oldIds.has(p.id));
    if (newOrig) {
      const others = fresh.filter(p => p.id !== newOrig.id && p.id !== currentAtIdx.id);
      const reordered = [...others.slice(0, idx), newOrig, ...others.slice(idx)].map(p => ({ id: p.id }));
      await airUpdate(TBL_ITEMS, it._recordId, { photo: reordered });
      const finalPhotos = await fetchPhotosWithRetry(it._recordId, reordered.length);
      it.photo = finalPhotos;
      it.photoUrl = finalPhotos[0]?.url || null;
    } else {
      it.photo = fresh;
      it.photoUrl = fresh[0]?.url || null;
    }
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = idx;
    if (state.editForm) delete state.editForm._bgUndo;
    showToast('Original wiederhergestellt', 'success', 2400);
  } catch (e) {
    showToast('Wiederherstellen fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    state.bgRemoving = false;
    setLoading(false);
    render();
  }
}

// Stellt das erste Foto im Voice-/Camera-Flow frei (Hintergrund weg → weißer BG).
// Trigger: User-Klick im Camera-Screen.
async function bgRemoveFirstPhoto() {
  const original = state.voicePhotoFiles?.[0];

    state.bgRemoving = false;
    setLoading(false);

  }
}

// Scannt das gegebene File und füllt voiceFields.tracker / .trackerUrl, wenn dort noch nichts steht.
// Läuft im Hintergrund — re-rendert nur, falls sich etwas ändert.
// opts.force = überschreibt vorhandene Werte und zeigt mehr Toasts
async function autoScanFirstPhotoForTracker(file, opts = {}) {
  if (!file) return;
  const force = !!opts.force;
  const f = state.voiceFields || {};
  if (!force && (f.tracker || f.trackerUrl)) return; // schon vorhanden, nicht überschreiben
  if (state.voiceScanRunning) return;
  state.voiceScanRunning = true;
  // Hint: bei jedem Scan wenigstens ein dezenter Toast, damit User weiß dass was läuft
  showToast(force ? 'Etikett wird gescannt …' : 'Foto wird auf Etikett geprüft …', 'info', 1800);
  render(); // damit der "Scannt …"-Text im Tracker-Section erscheint
  try {
    const { tracker, trackerUrl } = await scanLabelFromFile(file);
    let changed = false;
    if (tracker && (force || !state.voiceFields.tracker)) {
      state.voiceFields.tracker = tracker;
      changed = true;
    }
    if (trackerUrl && (force || !state.voiceFields.trackerUrl)) {
      state.voiceFields.trackerUrl = trackerUrl;
      changed = true;
    }
    if (changed) {
      const parts = [];
      if (tracker) parts.push('#' + tracker);
      if (trackerUrl) parts.push('QR-Link');
      showToast('Erkannt: ' + parts.join(' · '), 'success', 2800);
    } else {
      // Auch im Auto-Modus: dezenter Hinweis, sonst denkt User es passiert nichts
      showToast('Kein Etikett im Foto gefunden — ggf. manuell eintragen oder neu fotografieren', 'info', 3500);
    }
    render();
  } catch (e) {
    showToast('Scan fehlgeschlagen: ' + e.message, 'error', 3000);
  } finally {
    state.voiceScanRunning = false;
    render();
  }
}

/* ============================================================
   AUTH
   ============================================================ */
async function loginWithUserKey(userKey) {
  const headers = { 'Authorization': 'Bearer ' + APP_CONFIG.AIRTABLE_READ_KEY };
  const formula = "AND({api_key}='" + userKey.replace(/'/g, "\\'") + "',{status}='aktiv')";
  const userRes = await fetch(
    'https://api.airtable.com/v0/' + APP_CONFIG.APP_BASE_ID + '/User?filterByFormula=' + encodeURIComponent(formula),
    { headers }
  );
  if (!userRes.ok) throw new Error('Login-Server nicht erreichbar');
  const userData = await userRes.json();
  if (!userData.records || !userData.records.length) throw new Error('Ung\u00fcltiger Key');
  APP_KEYS.user = { ...userData.records[0].fields, _recordId: userData.records[0].id };

  // Project-spezifische Keys
  const projectKeysRes = await fetch(
    'https://api.airtable.com/v0/' + APP_CONFIG.MASTER_BASE_ID + '/Keys?filterByFormula=' + encodeURIComponent("{project_id}='" + APP_CONFIG.PROJECT_ID + "'"),
    { headers }
  );
  if (projectKeysRes.ok) {
    const projectKeysData = await projectKeysRes.json();
    (projectKeysData.records || []).forEach(rec => {
      const f = rec.fields;
      if (f.key_name === 'anthropicKey') APP_KEYS.anthropicKey = f.key_value;
      if (f.key_name === 'airtableWriteKey') APP_KEYS.airtableWriteKey = f.key_value;
      if (f.key_name === 'airtableBaseId') APP_KEYS.appBaseId = f.key_value;
    });
  }

  // Globaler Anthropic-Fallback
  if (!APP_KEYS.anthropicKey) {
    const globalKeysRes = await fetch(
      'https://api.airtable.com/v0/' + APP_CONFIG.MASTER_BASE_ID + "/Keys?filterByFormula=" + encodeURIComponent("{project_id}='GLOBAL'"),
      { headers }
    );
    if (globalKeysRes.ok) {
      const globalKeysData = await globalKeysRes.json();
      (globalKeysData.records || []).forEach(rec => {
        if (rec.fields.key_name === 'anthropicKey') APP_KEYS.anthropicKey = rec.fields.key_value;
      });
    }
  }

  if (!APP_KEYS.airtableWriteKey) throw new Error('Schreib-Token fehlt - bitte Admin kontaktieren');

  localStorage.setItem('user_key_' + APP_CONFIG.PROJECT_ID, userKey);
  return APP_KEYS.user;
}

async function tryAutoLogin() {
  const savedKey = localStorage.getItem('user_key_' + APP_CONFIG.PROJECT_ID);
  if (!savedKey) return false;
  try {
    await loginWithUserKey(savedKey);
    return true;
  } catch (e) {
    localStorage.removeItem('user_key_' + APP_CONFIG.PROJECT_ID);
    return false;
  }
}

function logout() {
  localStorage.removeItem('user_key_' + APP_CONFIG.PROJECT_ID);
  APP_KEYS = { airtableWriteKey: null, anthropicKey: null, appBaseId: null, user: null };
  location.reload();
}

   TOAST + LOADING
   ============================================================ */
/* ============================================================
   SOLD-POLLING (Option A)
   Im Hintergrund alle 30 s die Items abfragen und auf neue
   "verkauft"-Markierungen reagieren — falls ein anderer User
   etwas verkauft hat, sehen alle App-Instanzen es zeitnah.
   Läuft nur wenn Tab/App im Vordergrund.
   ============================================================ */
const SOLD_POLL_INTERVAL_MS = 30000;
let _soldPollTimer = null;
let _soldKnownState = null;     // Map<itemRecordId, boolean>  → Sold-Status den wir zuletzt kannten
let _soldPollInFlight = false;

function startSoldPolling() {
  stopSoldPolling();
  if (!state.loggedIn) return;
  // Initial-Snapshot aus aktueller Inventory aufbauen — keine Notifications für vorhandene "sold"
  _soldKnownState = new Map();
  for (const c of (state.companies || [])) {
    for (const it of (c.inventory || [])) {
      if (it._recordId) _soldKnownState.set(it._recordId, !!it.sold);
    }
  }
  _soldPollTimer = setInterval(pollSoldUpdates, SOLD_POLL_INTERVAL_MS);
  // Visibility: bei Sichtbarkeitswechsel sofort einmal pollen (frische Daten)
  document.addEventListener('visibilitychange', _onVisibilityForPoll);
}
function stopSoldPolling() {
  if (_soldPollTimer) { clearInterval(_soldPollTimer); _soldPollTimer = null; }
  document.removeEventListener('visibilitychange', _onVisibilityForPoll);
}
function _onVisibilityForPoll() { if (!document.hidden) pollSoldUpdates(); }

async function pollSoldUpdates() {
  if (document.hidden) return;            // Spar Bandbreite: nur wenn Tab sichtbar
  if (_soldPollInFlight) return;
  if (!state.loggedIn) return;
  _soldPollInFlight = true;
  try {
    const itemRecs = await airRead(TBL_ITEMS); // alle Items aller Firmen
    const items = itemRecs.map(recordToItem);

    // Inventory in den Companies frisch aufbauen — neue Items von anderen Usern tauchen so auch auf
    const byCompany = {};
    items.forEach(it => { (byCompany[it.company_id] = byCompany[it.company_id] || []).push(it); });
    let changed = false;
    (state.companies || []).forEach(c => {
      const fresh = byCompany[c.id] || [];
      // Schneller Diff via Length + irgendeine Property — bei Mismatch übernehmen
      if (fresh.length !== (c.inventory || []).length) changed = true;
      c.inventory = fresh;
    });

    // state.item aktualisieren (falls Detail offen) — aber NICHT wenn gerade editiert wird
    if (state.item && state.view !== 'edit') {
      const fresh = items.find(i => i._recordId === state.item._recordId);
      if (fresh) {
        const oldSold = !!state.item.sold;
        Object.assign(state.item, fresh);
        if (oldSold !== !!fresh.sold) changed = true;
      }
    }

    // Sold-Übergänge erkennen
    const newSold = [];
    for (const it of items) {
      if (!it._recordId) continue;
      const prev = _soldKnownState.get(it._recordId);
      _soldKnownState.set(it._recordId, !!it.sold);
      // Nur wenn wir den Eintrag schon kannten UND er von false auf true gesprungen ist
      if (prev === false && it.sold === true) newSold.push(it);
    }

    if (newSold.length > 0) {
      const activeId = state.activeCompanyId;
      const relevant = newSold.filter(t => t.company_id === activeId);
      for (const t of relevant) notifyArticleSold(t);
      changed = true;
    }
    if (changed) render();
  } catch (e) {
    // Stille Wiederholung beim nächsten Tick
  } finally {
    _soldPollInFlight = false;
  }
}

// Zeigt eine Benachrichtigung wenn ein Artikel als verkauft markiert wurde.
// In-App immer (Toast). Wenn Notification-Permission erteilt: zusätzlich native Browser-Notification.
function notifyArticleSold(it) {
  const title = it?.title || 'Artikel';
  const id = it?.id ? '#' + it.id : '';
  const msg = `Verkauft: ${title} ${id}`.trim();
  showToast(msg, 'success', 4000);
  try {
    if ('Notification' in window) {
      if (Notification.permission === 'granted') {
        new Notification('Artikel verkauft', { body: `${title} ${id}`.trim(), tag: 'sold-' + (it?.id || '') });
      } else if (Notification.permission === 'default') {
        // Erlaubnis erst beim ersten Sold-Event anfragen — nicht beim App-Start
        Notification.requestPermission().then(p => {
          if (p === 'granted') new Notification('Artikel verkauft', { body: `${title} ${id}`.trim(), tag: 'sold-' + (it?.id || '') });
        }).catch(() => {});
      }
    }
  } catch (_) { /* ignore */ }
}

// Kopiert Text ins Clipboard. Fallback via temporäres <textarea> falls Clipboard-API blockt (z.B. iOS in nicht-https oder älter).
async function copyTextToClipboard(text) {
  if (!text) return false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function showToast(msg, kind = 'info', durationMs = 2400) {
  let stack = document.getElementById('toast-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.id = 'toast-stack';
    stack.className = 'toast-stack';
    (document.querySelector('.phone__inner') || document.body).appendChild(stack);
  }
  const t = document.createElement('div');
  t.className = 'toast' + (kind === 'success' ? ' toast--success' : kind === 'error' ? ' toast--error' : '');
  const icon = kind === 'success' ? svg('check', 13, 3) : kind === 'error' ? svg('alert-triangle', 13, 2.5) : svg('sparkles', 13, 2.5);
  t.innerHTML = icon + '<span>' + String(msg).replace(/</g, '&lt;') + '</span>';
  stack.appendChild(t);
  setTimeout(() => {
    t.classList.add('toast--out');
    setTimeout(() => t.remove(), 220);
  }, durationMs);
}

function setLoading(on, label) {
  let ov = document.getElementById('loading-overlay');
  if (on) {
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'loading-overlay';
      ov.className = 'loading-overlay';
      (document.querySelector('.phone__inner') || document.body).appendChild(ov);
    }
    ov.innerHTML = '<div class="spinner"></div>' + (label ? '<div style="font-size:12px;font-weight:600;color:var(--c-ink-soft)">' + label + '</div>' : '');
  } else if (ov) {
    ov.remove();
  }
}
