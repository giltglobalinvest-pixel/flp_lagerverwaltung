.action-sheet__row:active{background:var(--c-surface-alt)}
.action-sheet__row--destructive{color:var(--c-red)}
.action-sheet__icon{flex-shrink:0;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--c-surface-alt);color:var(--c-ink-soft)}
.action-sheet__row--destructive .action-sheet__icon{background:var(--c-red-soft);color:var(--c-red)}
.action-sheet__sep{height:8px;background:var(--c-bg);margin:4px 0}
.action-sheet__cancel{display:block;width:calc(100% - 32px);margin:10px 16px 0;padding:14px;background:var(--c-surface-alt);border-radius:14px;font-size:15px;font-weight:600;text-align:center;color:var(--c-ink)}
@keyframes sheetFade{from{opacity:0}to{opacity:1}}
@keyframes sheetSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* Push-to-Talk Mic */
.ptt-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 16px}
.ptt-btn{width:108px;height:108px;border-radius:50%;background:var(--c-blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--elev-blue);transition:transform .12s,background .15s;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.ptt-btn:active,.ptt-btn--rec{transform:scale(.94);background:var(--c-red);box-shadow:0 0 0 8px rgba(229,72,77,0.18),0 8px 24px rgba(229,72,77,0.4)}
.ptt-btn--rec{animation:pttPulse 1.4s ease-in-out infinite}
@keyframes pttPulse{0%,100%{box-shadow:0 0 0 8px rgba(229,72,77,0.18),0 8px 24px rgba(229,72,77,0.4)}50%{box-shadow:0 0 0 18px rgba(229,72,77,0.06),0 8px 24px rgba(229,72,77,0.4)}}
.ptt-hint{font-size:12.5px;font-weight:500;color:var(--c-ink-mute);text-align:center;line-height:1.4}
.ptt-hint strong{color:var(--c-ink);font-weight:600}

/* Login screen */
.login-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:linear-gradient(160deg,#C5D4F2 0%,#DDE7F0 50%,#B8C9E2 100%);z-index:200}
.login-card{width:100%;max-width:340px;padding:28px 24px;background:var(--c-surface);border-radius:24px;box-shadow:0 20px 60px rgba(15,24,48,0.18);text-align:center}
.login-logo{width:64px;height:64px;border-radius:18px;background:var(--c-blue);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:var(--elev-blue)}
.login-logo-img{display:block;width:80px;height:80px;border-radius:20px;margin:0 auto 16px;box-shadow:var(--elev-1);object-fit:cover;background:#fff}
.login-title{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.login-sub{font-size:12.5px;font-weight:500;color:var(--c-ink-mute);margin:0 0 24px}
.login-input{width:100%;padding:14px 16px;background:var(--c-surface-alt);border:1.5px solid var(--c-border);border-radius:14px;font-size:14px;font-weight:500;font-family:var(--f-mono);color:var(--c-ink);text-align:center;letter-spacing:.02em;outline:none;transition:border-color .15s}
.login-input:focus{border-color:var(--c-blue);background:#fff}
.login-btn{width:100%;margin-top:12px;padding:14px;background:var(--c-blue);color:#fff;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--elev-blue);transition:opacity .15s}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{margin-top:12px;padding:10px 14px;background:var(--c-red-soft);color:var(--c-red);border-radius:10px;font-size:12px;font-weight:500;text-align:left;display:flex;align-items:flex-start;gap:8px}
.login-foot{margin-top:18px;font-size:10.5px;font-weight:500;color:var(--c-ink-subtle);font-family:var(--f-mono)}

/* Loading overlay */
.loading-overlay{position:absolute;inset:0;background:rgba(221,231,240,0.75);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:300}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--c-border-strong);border-top-color:var(--c-blue);animation:spin 0.8s linear infinite}
.spinner--sm{width:14px;height:14px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast-stack{position:absolute;top:14px;left:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:400;pointer-events:none}
.toast{padding:11px 14px;background:var(--c-ink);color:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(15,24,48,0.3);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:10px;animation:toastIn .25s cubic-bezier(.32,.72,0,1);pointer-events:auto}
.toast--success{background:var(--c-green);color:#fff}
.toast--error{background:var(--c-red);color:#fff}
.toast--out{animation:toastOut .2s ease-in forwards}
@keyframes toastIn{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastOut{to{transform:translateY(-12px);opacity:0}}

/* Logout button in header */
.logout-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--c-surface);border:1px solid var(--c-border);border-radius:10px;box-shadow:var(--elev-1);color:var(--c-ink-mute)}
.logout-btn:active{transform:scale(.96)}

/* Hero image with real photo */
.hero-image--photo{background:#0F1830}
.hero-image__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-input{display:none}

/* Galerie-Navigation im Detail-Hero */
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(15,24,48,0.55);backdrop-filter:blur(8px);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2;transition:opacity .15s}
.gallery-nav:disabled{opacity:.25;pointer-events:none}
.gallery-nav--prev{left:10px;transform:translateY(-50%) rotate(180deg)}
.gallery-nav--next{right:10px}
.gallery-counter{position:absolute;top:10px;right:10px;padding:3px 9px;background:rgba(15,24,48,0.55);backdrop-filter:blur(8px);color:#fff;font-family:var(--f-mono);font-size:10.5px;font-weight:600;border-radius:var(--r-pill);z-index:2}
.gallery-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.gallery-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.4);transition:all .15s}
.gallery-dot--active{background:#fff;width:18px;border-radius:4px}

/* Foto-Strip im Edit-Screen */
.photo-strip{display:flex;gap:8px;padding:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.photo-strip::-webkit-scrollbar{display:none}
.photo-strip__item{position:relative;flex-shrink:0;width:84px;height:67px;border-radius:12px;overflow:hidden;border:2px solid transparent;transition:border-color .15s}
.photo-strip__item--active{border-color:var(--c-blue)}
.photo-strip__thumb{width:100%;height:100%;background-size:cover;background-position:center;background-color:#0F1830;border:0;padding:0;cursor:pointer;position:relative;display:block}
.photo-strip__primary{position:absolute;top:4px;left:4px;padding:1px 5px 1px 4px;background:var(--c-blue);color:#fff;font-size:8.5px;font-weight:700;border-radius:6px;display:inline-flex;align-items:center;gap:2px;letter-spacing:.02em}
.photo-strip__actions{position:absolute;top:0;right:0;display:flex;gap:2px;padding:3px}
.photo-strip__act{width:22px;height:22px;border-radius:7px;background:rgba(15,24,48,0.65);backdrop-filter:blur(8px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;padding:0}
.photo-strip__act--del{background:rgba(229,72,77,0.85)}
.photo-strip__add{flex-shrink:0;width:84px;height:67px;border-radius:12px;background:var(--c-surface);border:1.5px dashed var(--c-blue-light);color:var(--c-blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:10.5px;font-weight:600;padding:4px 6px;line-height:1.1;text-align:center}
.photo-strip__add--gallery{width:50px}
.photo-strip__add span{display:block}
.photo-strip__hint{flex-shrink:0;align-self:center;padding:4px 12px;background:var(--c-surface-alt);color:var(--c-ink-mute);font-size:10.5px;font-weight:600;border-radius:var(--r-pill)}

/* Foto-Strip im Camera-Screen (dunkles Theme) */
.cam-strip{display:flex;gap:8px;padding:10px 20px 6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cam-strip::-webkit-scrollbar{display:none}
.cam-strip__thumb{position:relative;flex-shrink:0;width:64px;height:51px;border-radius:10px;overflow:hidden;background-size:cover;background-position:center;background-color:#0F1830;border:2px solid transparent;cursor:pointer;padding:0;transition:border-color .15s}
.cam-strip__thumb--active{border-color:#fff}
.cam-strip__primary{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--c-blue);color:#fff;display:flex;align-items:center;justify-content:center}

/* Interaktiver Crop-Editor */

.cropper-frame{position:relative;aspect-ratio:5/4;width:100%;max-width:520px;max-height:70vh;background:#0a0a0a;overflow:hidden;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none}

.cropper-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.18) 1px,transparent 1px);background-size:33.333% 33.333%;background-position:33.333% 33.333%}
.cropper-hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;opacity:.7;font-size:11px;font-family:var(--f-mono);letter-spacing:.04em;pointer-events:none;text-align:center;white-space:nowrap}

.rotate-prompt__title{font-size:18px;font-weight:600;letter-spacing:-.005em}
.rotate-prompt__sub{font-size:13px;font-weight:500;opacity:.75;max-width:280px;line-height:1.4}
@keyframes rotate-prompt-shake{

<script>
/* ============================================================
   APP CONFIG + AIRTABLE LAYER
   ============================================================ */
const APP_VERSION = 'v1.56';
// Read-Token wird zur Laufzeit zusammengesetzt, damit GitHub Push Protection
// das Muster nicht als Secret erkennt. Token ist read-only und bewusst \u00f6ffentlich.

const _TKP2 = '69fae5d9fa4b94c266b426dadd71a51f574945d840b33569058ab5e9d89ebef3';
const APP_CONFIG = {
  AIRTABLE_READ_KEY: _TKP1 + '.' + _TKP2,
  MASTER_BASE_ID: 'appzhNrhkLSTEaNFW',
  APP_BASE_ID: 'appc4YGv2X1v4O1eO',
  PROJECT_ID: 'p_1777628997641',
  PROJECT_NAME: 'FLP Stockmanager',
  GITHUB_REPO: 'giltglobalinvest-pixel/flp_lagerverwaltung',
};

let APP_KEYS = {
  airtableWriteKey: null, anthropicKey: null, appBaseId: null, user: null,
  // Inquiry-Proxy (Freshdesk) — wird über Integrationen-Settings gesetzt
  inquiryProxyUrl: null, inquiryProxyToken: null,
  // Val.town Setup (für Admin-UI um Proxy zu deployen/aktualisieren)
  valtownKey: null, valtownValId: null,
  // Freshdesk Settings (für val.town env vars)
  freshdeskDomain: null, freshdeskApiKey: null, freshdeskGroupId: null,
};

const AIR_BASE = () => APP_KEYS.appBaseId || APP_CONFIG.APP_BASE_ID;
const AIR_URL = (table) => 'https://api.airtable.com/v0/' + AIR_BASE() + '/' + encodeURIComponent(table);

async function airRead(table, filter) {
  const headers = { 'Authorization': 'Bearer ' + APP_CONFIG.AIRTABLE_READ_KEY };
  const all = [];
  let offset = '';
  do {
    let url = AIR_URL(table) + '?pageSize=100';
    if (filter) url += '&filterByFormula=' + encodeURIComponent(filter);
    if (offset) url += '&offset=' + encodeURIComponent(offset);
    const res = await fetch(url, { headers });
    if (!res.ok) throw new Error('Airtable Lesen fehlgeschlagen: ' + res.status);
    const data = await res.json();
    all.push(...(data.records || []));
    offset = data.offset || '';
  } while (offset);
  return all;
}

async function airWrite(table, fields) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  const res = await fetch(AIR_URL(table), {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Airtable Schreiben fehlgeschlagen: ' + (err.error?.message || res.status));
  }
  return await res.json();
}

async function airUpdate(table, recordId, fields) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  const res = await fetch(AIR_URL(table) + '/' + recordId, {
    method: 'PATCH',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Airtable Update fehlgeschlagen: ' + (err.error?.message || res.status));

  return await res.json();
}

// Liest EIN Record frisch (z.B. nach Upload, weil Airtable die Attachment-URLs async befüllt)
async function airReadOne(table, recordId) {
  const headers = { 'Authorization': 'Bearer ' + APP_CONFIG.AIRTABLE_READ_KEY };

async function airDelete(table, recordId) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  const res = await fetch(AIR_URL(table) + '/' + recordId, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey },
  });

async function ensureTable(tableName, fields) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  const metaUrl = 'https://api.airtable.com/v0/meta/bases/' + AIR_BASE() + '/tables';
  const metaRes = await fetch(metaUrl, { headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey } });
  if (!metaRes.ok) throw new Error('Schema-Lesen fehlgeschlagen');
  const meta = await metaRes.json();
  const exists = (meta.tables || []).find(t => t.name === tableName);
  if (exists) return exists;
  const createRes = await fetch(metaUrl, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: tableName, fields }),
  });
  if (!createRes.ok) {
    const err = await createRes.json().catch(() => ({}));
    throw new Error('Tabelle konnte nicht angelegt werden: ' + (err.error?.message || createRes.status));
  }
  return await createRes.json();
}

/* ============================================================
   IMAGE PROCESSING (Crop + Resize + JPEG)
   ============================================================ */
const PHOTO_TARGET_RATIO = 5 / 4;     // Hero-Format
const PHOTO_MAX_EDGE = 1600;           // px Längskante
const PHOTO_JPEG_QUALITY = 0.82;
const PHOTO_MAX_PER_ITEM = 6;

// Standard-Schema für Tracker-URLs. Wenn der User in Step 4 eine Tracker-Nummer eingibt,
// wird daraus automatisch der QR-Link gebaut: TRACKER_URL_BASE + Nummer.
const TRACKER_URL_BASE = 'https://trackers.litelead.xyz/flp/';

// Liest ein Bild-File, beschneidet zentriert auf 5:4, skaliert auf max. 1600px,
// kodiert als JPEG. Liefert ein neues File-Objekt mit ~80–90% kleinerer Größe.
async function processImage(inputFile) {
  if (!inputFile.type.startsWith('image/')) return inputFile; // PDF etc. unverändert
  let dataUrl;
  try {
    dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('FileReader-Fehler'));
      r.readAsDataURL(inputFile);
    });
  } catch (e) {
    throw new Error('Datei konnte nicht gelesen werden (' + (inputFile.type || 'unbekannter Typ') + ')');
  }
  let img;
  try {
    img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('Bild-Decoder-Fehler'));
      i.src = dataUrl;
    });
  } catch (e) {
    throw new Error('Bildformat nicht unterstützt (' + (inputFile.type || 'unbekannt') + '). HEIC bitte vorher konvertieren.');
  }

  const srcW = img.naturalWidth, srcH = img.naturalHeight;
  if (!srcW || !srcH) throw new Error('Bild hat keine gültige Größe');

  // Zentrierter Crop auf Zielratio (5:4 = 1.25)
  const srcRatio = srcW / srcH;
  let cropW, cropH, cropX, cropY;
  if (srcRatio > PHOTO_TARGET_RATIO) {
    // Quelle zu breit → links/rechts beschneiden
    cropH = srcH;
    cropW = Math.round(srcH * PHOTO_TARGET_RATIO);
    cropX = Math.round((srcW - cropW) / 2);
    cropY = 0;
  } else {
    // Quelle zu hoch → oben/unten beschneiden
    cropW = srcW;
    cropH = Math.round(srcW / PHOTO_TARGET_RATIO);
    cropX = 0;
    cropY = Math.round((srcH - cropH) / 2);
  }

  // Resize: längste Seite auf max PHOTO_MAX_EDGE
  let outW = cropW, outH = cropH;
  const longest = Math.max(cropW, cropH);
  if (longest > PHOTO_MAX_EDGE) {
    const scale = PHOTO_MAX_EDGE / longest;
    outW = Math.round(cropW * scale);
    outH = Math.round(cropH * scale);
  }

  const canvas = document.createElement('canvas');
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', PHOTO_JPEG_QUALITY));
  if (!blob) return inputFile;

  // Original-Dateiname behalten, aber als .jpg
  const baseName = (inputFile.name || 'photo').replace(/\.[^./]+$/, '');
  const newName = baseName + '.jpg';
  return new File([blob], newName, { type: 'image/jpeg', lastModified: Date.now() });
}

async function uploadFileToRecord(table, recordId, attachmentField, file) {
  if (!APP_KEYS.airtableWriteKey) throw new Error('Bitte einloggen');
  // Bild vor Upload optimieren (Crop + Resize + JPEG)
  const processed = await processImage(file);
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(processed);
  });
  const url = 'https://content.airtable.com/v0/' + AIR_BASE() + '/' + recordId + '/' + attachmentField + '/uploadAttachment';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ contentType: processed.type, file: base64, filename: processed.name }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Upload fehlgeschlagen: ' + (err.error?.message || res.status));
  }
  return await res.json();
}

/* ============================================================
   AI / ANTHROPIC
   ============================================================ */
async function askAI(prompt, opts = {}) {
  if (!APP_KEYS.anthropicKey) throw new Error('Anthropic-Key fehlt');
  const content = [];
  if (opts.imageBase64 && opts.imageMediaType) {
    content.push({ type: 'image', source: { type: 'base64', media_type: opts.imageMediaType, data: opts.imageBase64 } });
  }
  if (opts.imageUrl) {
    content.push({ type: 'image', source: { type: 'url', url: opts.imageUrl } });
  }
  // Multi-Image-Support: opts.images ist ein Array von { base64, mediaType } ODER { url }
  if (Array.isArray(opts.images)) {
    for (const im of opts.images) {
      if (im?.base64 && im?.mediaType) {
        content.push({ type: 'image', source: { type: 'base64', media_type: im.mediaType, data: im.base64 } });
      } else if (im?.url) {
        content.push({ type: 'image', source: { type: 'url', url: im.url } });
      }
    }
  }
  content.push({ type: 'text', text: prompt });

  const body = {
    model: opts.model || 'claude-sonnet-4-5-20250929',
    max_tokens: opts.maxTokens || 1024,
    messages: [{ role: 'user', content }],
  };
  if (opts.system) body.system = opts.system;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': APP_KEYS.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('AI-Anfrage fehlgeschlagen: ' + (err.error?.message || res.status));
  }
  const data = await res.json();
  return data.content && data.content[0] ? data.content[0].text : '';
}

// Liefert reines JSON-Objekt aus Claude-Antwort (entfernt ggf. Markdown-Codeblock)
function parseAIJson(text) {
  let t = (text || '').trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) t = fence[1].trim();
  return JSON.parse(t);
}

async function fileToBase64(file) {
  return await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   HINTERGRUND-FREISTELLEN (imgly background-removal, lazy)
   Modell wird beim ersten Aufruf geladen (~30 MB, gecacht).
   Ergebnis: weißer Hintergrund (Katalog-Look) als JPEG.
   ============================================================ */
let _bgRemovalLib = null;
async function _loadBgRemovalLib() {
  if (_bgRemovalLib) return _bgRemovalLib;
  // ESM-Build vom jsdelivr-CDN holen — funktioniert in modernen Browsern (iOS Safari 16+, Chrome).
  const url = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';
  _bgRemovalLib = await import(url);
  return _bgRemovalLib;
}

async function removePhotoBackground(file) {
  if (!file) throw new Error('Kein Foto');
  const lib = await _loadBgRemovalLib();
  // Liefert PNG-Blob mit transparentem Hintergrund
  const transparentBlob = await lib.removeBackground(file);

  // Auf weißem Hintergrund komponieren → sauberer Katalog-Look + kompaktes JPEG
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    const u = URL.createObjectURL(transparentBlob);
    i.onload = () => { URL.revokeObjectURL(u); resolve(i); };
    i.onerror = () => { URL.revokeObjectURL(u); reject(new Error('Result-Bild nicht ladbar')); };
    i.src = u;
  });
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0);

  const finalBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
  if (!finalBlob) throw new Error('JPEG-Encoding fehlgeschlagen');
  const baseName = (file.name || 'photo').replace(/\.[^./]+$/, '');
  return new File([finalBlob], baseName + '_freigestellt.jpg', { type: 'image/jpeg', lastModified: Date.now() });
}

/* ============================================================
   ETIKETT / QR-SCANNER
   Kombiniert nativen BarcodeDetector (für QR-URL) mit Claude Vision (für Tracker-Nummer-OCR).
   ============================================================ */
async function _decodeQRFromFile(file) {
  if (!('BarcodeDetector' in window)) return null;
  try {
    const supported = await window.BarcodeDetector.getSupportedFormats();
    if (!supported.includes('qr_code')) return null;
    const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
    // ImageBitmap aus File erstellen — robuster als <img>
    const bitmap = await createImageBitmap(file);
    const codes = await detector.detect(bitmap);
    bitmap.close?.();
    if (codes && codes.length > 0) return String(codes[0].rawValue || '').trim() || null;
  } catch (e) { /* still return null */ }
  return null;
}

// Liest Tracker-Nummer per Claude Vision aus dem Foto.
// Wichtig: URL kommt AUSSCHLIESSLICH aus dem QR-Code (nicht aus Text-URLs auf dem Etikett).
async function _scanLabelViaAI(file) {
  try {
    const base64 = await fileToBase64(file);
    const mediaType = file.type || 'image/jpeg';
    const sys = 'Du extrahierst Etiketten-Daten von Aufzugs-Ersatzteil-Fotos. Antworte AUSSCHLIESSLICH als JSON-Objekt, ohne Markdown-Codeblock und ohne erklärenden Text.';
    const prompt = `Schaue auf das/die Etikett/en auf dem Foto (z.B. "FLP", "Lift Parts Repair" Sticker mit QR-Code). Extrahiere:

- "tracker": die Tracker-Nummer / Seriennummer / Artikel-ID, die als Text auf dem Etikett steht. Falls die Nummer mit einem Präfix wie "#" oder "Nr." dargestellt ist (z.B. "#12696"), gib NUR die Ziffern/Buchstaben zurück OHNE dieses Präfix (also "12696"). Wenn mehrere Nummern sichtbar sind, nimm die, die zum QR-Code gehört (i.d.R. direkt daneben oder darunter).

- "url": NUR die URL die im QR-Code codiert ist — also der eigentliche Inhalt des QR-Codes. Du musst dafür den QR-Code selbst dekodieren (die schwarz-weißen Pixel-Module lesen).

  ❌ FALSCH: Eine URL die als gedruckter Text auf dem Etikett steht (z.B. "aufzug-umrichter.de", "flp-lager.de", Hotline-Nummern, Marketing-Domains) ist NIE die QR-URL. Die ignorierst du komplett. Auch wenn du keine andere URL findest — gib lieber "" zurück als die Text-URL zu nehmen.

  ✅ RICHTIG: QR-Codes auf Tracker-Etiketten kodieren typischerweise URLs wie "https://trackers.litelead.xyz/flp/12696" oder "https://example.com/track/abc123" — also Domains, die in der Regel NICHT als sichtbarer Text auf dem Etikett stehen.

  Wenn du den QR-Code nicht selbst dekodieren kannst (zu klein, unscharf, abgeschnitten), gib leeren String "" zurück. NIE raten und NIE die Text-URL als Fallback nehmen.

Wenn etwas nicht erkennbar ist, gib einen leeren String "" zurück.

Antwortformat exakt (kein anderer Text):
{"tracker":"...","url":"..."}`;
    const txt = await askAI(prompt, { system: sys, imageBase64: base64, imageMediaType: mediaType, maxTokens: 280 });
    const parsed = parseAIJson(txt);
    return {
      tracker: (parsed?.tracker ? String(parsed.tracker).trim() : '') || null,
      url: (parsed?.url ? String(parsed.url).trim() : '') || null,
      raw: txt, // für Debug
    };
  } catch (e) {
    return { tracker: null, url: null, error: e.message };
  }
}

// Liste von Marketing-/Text-URLs die typisch als Etikett-Aufdruck vorkommen, aber NIE QR-Inhalt sind.
// Wird genutzt um AI-Falschtreffer zu filtern.
const _LABEL_TEXT_URL_BLOCKLIST = [
  'aufzug-umrichter.de', 'aufzug-umrichter.com',
  'flp-lager.de', 'flp-shop.com',
];
function _isProbablyLabelTextUrl(url) {
  if (!url) return false;
  try {
    const host = new URL(/^https?:\/\//i.test(url) ? url : 'https://' + url).hostname.toLowerCase();
    return _LABEL_TEXT_URL_BLOCKLIST.some(b => host === b || host.endsWith('.' + b));
  } catch (e) { return false; }
}

// Versucht eine Tracker-Nummer aus einer QR-URL zu ziehen (häufiges Muster: .../flp/12696 oder ?id=12696).
function _extractTrackerFromUrl(url) {
  if (!url) return null;
  // Pfad-Ende wie /flp/12696 oder /track/abc123
  const path = url.match(/\/([A-Za-z0-9_-]{3,})\/?(?:\?|$)/);
  if (path && /^\d{3,}$/.test(path[1])) return path[1];
  // Query-Parameter id, tracker, t
  const q = url.match(/[?&](?:id|tracker|t)=([A-Za-z0-9_-]{3,})/i);
  if (q) return q[1];
  return null;
}

// Hauptfunktion: scannt ein File und liefert {tracker, trackerUrl}.
async function scanLabelFromFile(file) {
  if (!file) return { tracker: null, trackerUrl: null };
  // Parallel: BarcodeDetector + AI-OCR
  const [qrUrl, ai] = await Promise.all([_decodeQRFromFile(file), _scanLabelViaAI(file)]);

  // URL bestimmen: Native QR-Decoder hat absolute Priorität (zuverlässig).
  // AI-URL nur wenn Detector leer UND es sich nicht um eine bekannte Marketing-Text-URL handelt.
  let trackerUrl = qrUrl || null;
  if (!trackerUrl && ai.url && !_isProbablyLabelTextUrl(ai.url)) {
    trackerUrl = ai.url;
  }

  // Tracker bestimmen: AI-Tracker hat Vorrang. Falls leer, aus URL extrahieren.
  let tracker = ai.tracker || null;
  if (!tracker && trackerUrl) {
    const extracted = _extractTrackerFromUrl(trackerUrl);
    if (extracted) tracker = extracted;
  }

  return { tracker, trackerUrl };
}

// Holt ein bereits hochgeladenes Foto (Airtable-URL) als File zurück, damit es gescannt werden kann.
async function _fetchPhotoAsFile(photoObj, idx = 0) {
  const url = photoObj?.url;
  if (!url) return null;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    return new File([blob], `photo${idx}.jpg`, { type: blob.type || 'image/jpeg' });
  } catch (e) { return null; }
}

// Scannt ALLE bereits am Item hochgeladenen Fotos (parallel) und schreibt erkannte Werte ins editForm.
// Erstes Treffer-Ergebnis pro Feld gewinnt.
async function scanItemPhotosForTracker() {
  const it = state.item;
  if (!it || !state.editForm) return;
  const photos = it.photo || [];
  if (photos.length === 0) {
    showToast('Erst ein Foto hochladen', 'info', 2400);
    return;
  }
  setLoading(true, photos.length === 1 ? 'Etikett wird gescannt …' : `${photos.length} Fotos werden parallel gescannt …`);
  try {
    // Parallel: alle Fotos herunterladen + scannen
    const results = await Promise.all(photos.map(async (p, i) => {
      const file = await _fetchPhotoAsFile(p, i);
      if (!file) return { tracker: null, trackerUrl: null };
      return await scanLabelFromFile(file);
    }));
    // Ersten Treffer pro Feld nehmen
    let foundTracker = null, foundUrl = null;
    for (const r of results) {
      if (r.tracker && !foundTracker) foundTracker = r.tracker;
      if (r.trackerUrl && !foundUrl) foundUrl = r.trackerUrl;
      if (foundTracker && foundUrl) break;
    }
    let changed = false;
    if (foundTracker) { state.editForm.tracker = foundTracker; changed = true; }
    if (foundUrl) { state.editForm.trackerUrl = foundUrl; changed = true; }
    if (changed) {
      const parts = [];
      if (foundTracker) parts.push('#' + foundTracker);
      if (foundUrl) parts.push('QR-Link');
      showToast('Erkannt: ' + parts.join(' · '), 'success', 2800);
    } else {
      showToast(`Kein Etikett in ${photos.length === 1 ? 'dem Foto' : 'den ' + photos.length + ' Fotos'} gefunden`, 'info', 3500);
    }
  } catch (e) {
    showToast('Scan fehlgeschlagen: ' + e.message, 'error', 3000);
  } finally {
    setLoading(false);
    render();
  }
}

// Stellt das angegebene Foto eines bereits gespeicherten Items frei (default: aktuell ausgewähltes).
// Verhalten: ersetzt das Foto an seiner Position — keine Kopie. Das Original wird im Speicher behalten,
// damit innerhalb der laufenden Edit-Session ein Undo möglich ist.
async function bgRemoveItemPhoto(idx) {
  const it = state.item;
  if (!it) return;
  const photos = it.photo || [];
  if (idx == null || idx < 0 || idx >= photos.length) {
    showToast('Kein Foto ausgewählt', 'info', 2200);
    return;
  }
  if (state.bgRemoving) return;
  state.bgRemoving = true;
  setLoading(true, 'Foto wird geladen …');
  render();
  try {
    const target = photos[idx];
    // 1) Original-Foto als File holen — Input für die KI UND Cache für den Undo
    const originalFile = await _fetchPhotoAsFile(target, idx);
    if (!originalFile) throw new Error('Foto konnte nicht heruntergeladen werden');

    // 2) KI-Freistellen (lädt Modell beim ersten Mal ~30 MB)
    setLoading(true, 'Lade KI-Modell — beim ersten Mal kann es 30–60 s dauern …');
    const result = await removePhotoBackground(originalFile);

    // 3) Hochladen + reordern: freigestellt an Position idx, Original wird entfernt (keine Kopie)
    setLoading(true, 'Hochladen …');
    await uploadFileToRecord(TBL_ITEMS, it._recordId, 'photo', result);

    setLoading(true, 'Bilder werden neu sortiert …');
    const oldIds = new Set(photos.map(p => p.id));
    const oldId = target.id;
    const fresh = await fetchPhotosWithRetry(it._recordId, photos.length + 1);
    const newPhoto = fresh.find(p => !oldIds.has(p.id));
    if (!newPhoto) {
      it.photo = fresh;
      it.photoUrl = fresh[0]?.url || null;
    } else {
      const others = fresh.filter(p => p.id !== newPhoto.id && p.id !== oldId);
      const reordered = [...others.slice(0, idx), newPhoto, ...others.slice(idx)].map(p => ({ id: p.id }));
      await airUpdate(TBL_ITEMS, it._recordId, { photo: reordered });
      const finalPhotos = await fetchPhotosWithRetry(it._recordId, reordered.length);
      it.photo = finalPhotos;
      it.photoUrl = finalPhotos[0]?.url || null;
    }
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = idx;

    // Undo-Cache füllen — gilt nur in dieser Edit-Session, geht beim Verlassen verloren
    if (state.editForm) {
      state.editForm._bgUndo = {
        idx,
        originalFile,
        originalFilename: target.filename || `photo_${idx}.jpg`,
      };
    }
    showToast('Foto freigestellt — Undo möglich solange Edit-Screen offen', 'success', 3000);
  } catch (e) {
    showToast('Freistellen fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 4500);
  } finally {
    state.bgRemoving = false;
    setLoading(false);
    render();
  }
}

// Ersetzt ein einzelnes Foto eines Items: hängt das neue an, sortiert es an die Original-Position, löscht das alte.
async function replaceItemPhoto(itemRecordId, oldPhotoId, originalIdx, newFile) {
  const it = state.item;
  if (!it || !it._recordId || it._recordId !== itemRecordId) {
    showToast('Artikel nicht mehr aktiv', 'error', 3000);
    return;
  }
  const photos = it.photo || [];
  if (!photos.find(p => p.id === oldPhotoId)) {
    showToast('Original-Foto nicht mehr vorhanden', 'error', 3000);
    return;
  }
  setLoading(true, 'Foto wird optimiert & hochgeladen …');
  try {
    // 1) neue Datei hochladen (wird ans Ende angehängt)
    await uploadFileToRecord(TBL_ITEMS, it._recordId, 'photo', newFile);

    // 2) frisch nachladen
    setLoading(true, 'Bilder werden neu sortiert …');
    const fresh = await fetchPhotosWithRetry(it._recordId, photos.length + 1);
    const oldIds = new Set(photos.map(p => p.id));
    const newPhoto = fresh.find(p => !oldIds.has(p.id));
    if (!newPhoto) {
      // Fallback: einfach übernehmen
      it.photo = fresh;
      it.photoUrl = fresh[0]?.url || null;
    } else {
      // 3) reordern: neues an Stelle des alten, altes verschwindet
      const others = fresh.filter(p => p.id !== newPhoto.id && p.id !== oldPhotoId);
      const reordered = [...others.slice(0, originalIdx), newPhoto, ...others.slice(originalIdx)].map(p => ({ id: p.id }));
      await airUpdate(TBL_ITEMS, it._recordId, { photo: reordered });
      const finalPhotos = await fetchPhotosWithRetry(it._recordId, reordered.length);
      it.photo = finalPhotos;
      it.photoUrl = finalPhotos[0]?.url || null;
    }
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = originalIdx;
    showToast('Foto neu zugeschnitten', 'success', 2400);
  } catch (e) {
    showToast('Ersetzen fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Macht das zuletzt durchgeführte Freistellen rückgängig — nutzt den In-Memory-Cache aus state.editForm._bgUndo.
async function undoBgRemoveItemPhoto() {
  const it = state.item;
  if (!it) return;
  const undo = state.editForm?._bgUndo;
  if (!undo || !undo.originalFile) {
    showToast('Nichts zum Wiederherstellen', 'info', 2200);
    return;
  }
  const photos = it.photo || [];
  const idx = Math.min(undo.idx, photos.length - 1);
  const currentAtIdx = photos[idx];
  if (!currentAtIdx) { showToast('Position nicht mehr vorhanden', 'error', 3000); return; }
  if (state.bgRemoving) return;
  state.bgRemoving = true;
  setLoading(true, 'Original wird hochgeladen …');
  render();
  try {
    // Original mit ursprünglichem Dateinamen wieder hochladen
    const fileToRestore = new File(
      [undo.originalFile],
      undo.originalFilename || `photo_${idx}.jpg`,
      { type: undo.originalFile.type || 'image/jpeg' }
    );
    await uploadFileToRecord(TBL_ITEMS, it._recordId, 'photo', fileToRestore);

    // Reordern: Original an idx, freigestellt verschwindet
    setLoading(true, 'Bilder werden neu sortiert …');
    const oldIds = new Set(photos.map(p => p.id));
    const fresh = await fetchPhotosWithRetry(it._recordId, photos.length + 1);
    const newOrig = fresh.find(p => !oldIds.has(p.id));
    if (newOrig) {
      const others = fresh.filter(p => p.id !== newOrig.id && p.id !== currentAtIdx.id);
      const reordered = [...others.slice(0, idx), newOrig, ...others.slice(idx)].map(p => ({ id: p.id }));
      await airUpdate(TBL_ITEMS, it._recordId, { photo: reordered });
      const finalPhotos = await fetchPhotosWithRetry(it._recordId, reordered.length);
      it.photo = finalPhotos;
      it.photoUrl = finalPhotos[0]?.url || null;
    } else {
      it.photo = fresh;
      it.photoUrl = fresh[0]?.url || null;
    }
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = idx;
    if (state.editForm) delete state.editForm._bgUndo;
    showToast('Original wiederhergestellt', 'success', 2400);
  } catch (e) {
    showToast('Wiederherstellen fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    state.bgRemoving = false;
    setLoading(false);
    render();
  }
}

}

const bgRemoveFirstPhoto = () => bgRemoveWizardPhoto(0);

// Scannt das gegebene File und füllt voiceFields.tracker / .trackerUrl, wenn dort noch nichts steht.
// Läuft im Hintergrund — re-rendert nur, falls sich etwas ändert.
// opts.force = überschreibt vorhandene Werte und zeigt mehr Toasts
async function autoScanFirstPhotoForTracker(file, opts = {}) {
  if (!file) return;
  const force = !!opts.force;
  const f = state.voiceFields || {};
  if (!force && (f.tracker || f.trackerUrl)) return; // schon vorhanden, nicht überschreiben
  if (state.voiceScanRunning) return;
  state.voiceScanRunning = true;
  // Hint: bei jedem Scan wenigstens ein dezenter Toast, damit User weiß dass was läuft
  showToast(force ? 'Etikett wird gescannt …' : 'Foto wird auf Etikett geprüft …', 'info', 1800);
  render(); // damit der "Scannt …"-Text im Tracker-Section erscheint
  try {
    const { tracker, trackerUrl } = await scanLabelFromFile(file);
    let changed = false;
    if (tracker && (force || !state.voiceFields.tracker)) {
      state.voiceFields.tracker = tracker;
      changed = true;
    }
    if (trackerUrl && (force || !state.voiceFields.trackerUrl)) {
      state.voiceFields.trackerUrl = trackerUrl;
      changed = true;
    }
    if (changed) {
      const parts = [];
      if (tracker) parts.push('#' + tracker);
      if (trackerUrl) parts.push('QR-Link');
      showToast('Erkannt: ' + parts.join(' · '), 'success', 2800);
    } else {
      // Auch im Auto-Modus: dezenter Hinweis, sonst denkt User es passiert nichts
      showToast('Kein Etikett im Foto gefunden — ggf. manuell eintragen oder neu fotografieren', 'info', 3500);
    }
    render();
  } catch (e) {
    showToast('Scan fehlgeschlagen: ' + e.message, 'error', 3000);
  } finally {
    state.voiceScanRunning = false;
    render();
  }
}

/* ============================================================
   AUTH
   ============================================================ */
async function loginWithUserKey(userKey) {
  const headers = { 'Authorization': 'Bearer ' + APP_CONFIG.AIRTABLE_READ_KEY };
  const formula = "AND({api_key}='" + userKey.replace(/'/g, "\\'") + "',{status}='aktiv')";
  const userRes = await fetch(
    'https://api.airtable.com/v0/' + APP_CONFIG.APP_BASE_ID + '/User?filterByFormula=' + encodeURIComponent(formula),
    { headers }
  );
  if (!userRes.ok) throw new Error('Login-Server nicht erreichbar');
  const userData = await userRes.json();
  if (!userData.records || !userData.records.length) throw new Error('Ung\u00fcltiger Key');
  APP_KEYS.user = { ...userData.records[0].fields, _recordId: userData.records[0].id };

  // Project-spezifische Keys
  const projectKeysRes = await fetch(
    'https://api.airtable.com/v0/' + APP_CONFIG.MASTER_BASE_ID + '/Keys?filterByFormula=' + encodeURIComponent("{project_id}='" + APP_CONFIG.PROJECT_ID + "'"),
    { headers }
  );
  if (projectKeysRes.ok) {
    const projectKeysData = await projectKeysRes.json();
    (projectKeysData.records || []).forEach(rec => {
      const f = rec.fields;
      if (f.key_name === 'anthropicKey') APP_KEYS.anthropicKey = f.key_value;
      if (f.key_name === 'airtableWriteKey') APP_KEYS.airtableWriteKey = f.key_value;
      if (f.key_name === 'airtableBaseId') APP_KEYS.appBaseId = f.key_value;
      if (f.key_name === 'inquiryProxyUrl') APP_KEYS.inquiryProxyUrl = f.key_value;
      if (f.key_name === 'inquiryProxyToken') APP_KEYS.inquiryProxyToken = f.key_value;
      if (f.key_name === 'valtownKey') APP_KEYS.valtownKey = f.key_value;
      if (f.key_name === 'valtownValId') APP_KEYS.valtownValId = f.key_value;
      if (f.key_name === 'freshdeskDomain') APP_KEYS.freshdeskDomain = f.key_value;
      if (f.key_name === 'freshdeskApiKey') APP_KEYS.freshdeskApiKey = f.key_value;
      if (f.key_name === 'freshdeskGroupId') APP_KEYS.freshdeskGroupId = f.key_value;
    });
  }

  // Globaler Anthropic-Fallback
  if (!APP_KEYS.anthropicKey) {
    const globalKeysRes = await fetch(
      'https://api.airtable.com/v0/' + APP_CONFIG.MASTER_BASE_ID + "/Keys?filterByFormula=" + encodeURIComponent("{project_id}='GLOBAL'"),
      { headers }
    );
    if (globalKeysRes.ok) {
      const globalKeysData = await globalKeysRes.json();
      (globalKeysData.records || []).forEach(rec => {
        if (rec.fields.key_name === 'anthropicKey') APP_KEYS.anthropicKey = rec.fields.key_value;
      });
    }
  }

  if (!APP_KEYS.airtableWriteKey) throw new Error('Schreib-Token fehlt - bitte Admin kontaktieren');

  localStorage.setItem('user_key_' + APP_CONFIG.PROJECT_ID, userKey);
  return APP_KEYS.user;
}

async function tryAutoLogin() {
  const savedKey = localStorage.getItem('user_key_' + APP_CONFIG.PROJECT_ID);
  if (!savedKey) return false;
  try {
    await loginWithUserKey(savedKey);
    return true;
  } catch (e) {
    localStorage.removeItem('user_key_' + APP_CONFIG.PROJECT_ID);
    return false;
  }
}

function logout() {
  localStorage.removeItem('user_key_' + APP_CONFIG.PROJECT_ID);
  APP_KEYS = { airtableWriteKey: null, anthropicKey: null, appBaseId: null, user: null };
  location.reload();
}

/* ============================================================
   SOLD-POLLING (Option A)
   Im Hintergrund alle 30 s die Items abfragen und auf neue
   "verkauft"-Markierungen reagieren — falls ein anderer User
   etwas verkauft hat, sehen alle App-Instanzen es zeitnah.
   Läuft nur wenn Tab/App im Vordergrund.
   ============================================================ */
const SOLD_POLL_INTERVAL_MS = 30000;
let _soldPollTimer = null;
let _soldKnownState = null;     // Map<itemRecordId, boolean>  → Sold-Status den wir zuletzt kannten
let _soldPollInFlight = false;

function startSoldPolling() {
  stopSoldPolling();
  if (!state.loggedIn) return;
  // Initial-Snapshot aus aktueller Inventory aufbauen — keine Notifications für vorhandene "sold"
  _soldKnownState = new Map();
  for (const c of (state.companies || [])) {
    for (const it of (c.inventory || [])) {
      if (it._recordId) _soldKnownState.set(it._recordId, !!it.sold);
    }
  }
  _soldPollTimer = setInterval(pollSoldUpdates, SOLD_POLL_INTERVAL_MS);
  // Visibility: bei Sichtbarkeitswechsel sofort einmal pollen (frische Daten)
  document.addEventListener('visibilitychange', _onVisibilityForPoll);
}
function stopSoldPolling() {
  if (_soldPollTimer) { clearInterval(_soldPollTimer); _soldPollTimer = null; }
  document.removeEventListener('visibilitychange', _onVisibilityForPoll);
}
function _onVisibilityForPoll() { if (!document.hidden) pollSoldUpdates(); }

async function pollSoldUpdates() {
  if (document.hidden) return;            // Spar Bandbreite: nur wenn Tab sichtbar
  if (_soldPollInFlight) return;
  if (!state.loggedIn) return;
  _soldPollInFlight = true;
  try {
    const itemRecs = await airRead(TBL_ITEMS); // alle Items aller Firmen
    const items = itemRecs.map(recordToItem);

    // Inventory in den Companies frisch aufbauen — neue Items von anderen Usern tauchen so auch auf
    const byCompany = {};
    items.forEach(it => { (byCompany[it.company_id] = byCompany[it.company_id] || []).push(it); });
    let changed = false;
    (state.companies || []).forEach(c => {
      const fresh = byCompany[c.id] || [];
      // Schneller Diff via Length + irgendeine Property — bei Mismatch übernehmen
      if (fresh.length !== (c.inventory || []).length) changed = true;
      c.inventory = fresh;
    });

    // state.item aktualisieren (falls Detail offen) — aber NICHT wenn gerade editiert wird
    if (state.item && state.view !== 'edit') {
      const fresh = items.find(i => i._recordId === state.item._recordId);
      if (fresh) {
        const oldSold = !!state.item.sold;
        Object.assign(state.item, fresh);
        if (oldSold !== !!fresh.sold) changed = true;
      }
    }

    // Sold-Übergänge erkennen
    const newSold = [];
    for (const it of items) {
      if (!it._recordId) continue;
      const prev = _soldKnownState.get(it._recordId);
      _soldKnownState.set(it._recordId, !!it.sold);
      // Nur wenn wir den Eintrag schon kannten UND er von false auf true gesprungen ist
      if (prev === false && it.sold === true) newSold.push(it);
    }

    if (newSold.length > 0) {
      const activeId = state.activeCompanyId;
      const relevant = newSold.filter(t => t.company_id === activeId);
      for (const t of relevant) notifyArticleSold(t);
      changed = true;
    }
    if (changed) render();
  } catch (e) {
    // Stille Wiederholung beim nächsten Tick
  } finally {
    _soldPollInFlight = false;
  }
}

// Zeigt eine Benachrichtigung wenn ein Artikel als verkauft markiert wurde.
// In-App immer (Toast). Wenn Notification-Permission erteilt: zusätzlich native Browser-Notification.
function notifyArticleSold(it) {
  const title = it?.title || 'Artikel';
  const id = it?.id ? '#' + it.id : '';
  const msg = `Verkauft: ${title} ${id}`.trim();
  showToast(msg, 'success', 4000);
  try {
    if ('Notification' in window) {
      if (Notification.permission === 'granted') {
        new Notification('Artikel verkauft', { body: `${title} ${id}`.trim(), tag: 'sold-' + (it?.id || '') });
      } else if (Notification.permission === 'default') {
        // Erlaubnis erst beim ersten Sold-Event anfragen — nicht beim App-Start
        Notification.requestPermission().then(p => {
          if (p === 'granted') new Notification('Artikel verkauft', { body: `${title} ${id}`.trim(), tag: 'sold-' + (it?.id || '') });
        }).catch(() => {});
      }
    }
  } catch (_) { /* ignore */ }
}

// Kopiert Text ins Clipboard. Fallback via temporäres <textarea> falls Clipboard-API blockt (z.B. iOS in nicht-https oder älter).
async function copyTextToClipboard(text) {
  if (!text) return false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function showToast(msg, kind = 'info', durationMs = 2400) {
  let stack = document.getElementById('toast-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.id = 'toast-stack';
    stack.className = 'toast-stack';
    (document.querySelector('.phone__inner') || document.body).appendChild(stack);
  }
  const t = document.createElement('div');
  t.className = 'toast' + (kind === 'success' ? ' toast--success' : kind === 'error' ? ' toast--error' : '');
  const icon = kind === 'success' ? svg('check', 13, 3) : kind === 'error' ? svg('alert-triangle', 13, 2.5) : svg('sparkles', 13, 2.5);
  t.innerHTML = icon + '<span>' + String(msg).replace(/</g, '&lt;') + '</span>';
  stack.appendChild(t);
  setTimeout(() => {
    t.classList.add('toast--out');
    setTimeout(() => t.remove(), 220);
  }, durationMs);
}

function setLoading(on, label) {
  let ov = document.getElementById('loading-overlay');
  if (on) {
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'loading-overlay';
      ov.className = 'loading-overlay';
      (document.querySelector('.phone__inner') || document.body).appendChild(ov);
    }
    ov.innerHTML = '<div class="spinner"></div>' + (label ? '<div style="font-size:12px;font-weight:600;color:var(--c-ink-soft)">' + label + '</div>' : '');
  } else if (ov) {
    ov.remove();
  }
}

  await ensureFieldsExist(TBL_ITEMS, ITEM_FIELDS);
  await ensureFieldsExist(TBL_HALLS, HALL_FIELDS);
  // User-Tabelle existiert bereits — nur Felder ggf. nachpflegen (für Customer-Registrierung)
  await ensureFieldsExist(TBL_USERS, USER_FIELDS);
}

async function ensureFieldsExist(tableName, expectedFields) {
  if (!APP_KEYS.airtableWriteKey) return;
  try {
    const metaUrl = 'https://api.airtable.com/v0/meta/bases/' + AIR_BASE() + '/tables';
    const r = await fetch(metaUrl, { headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey } });
    if (!r.ok) return;
    const meta = await r.json();
    const tbl = (meta.tables || []).find(t => t.name === tableName);
    if (!tbl) return;
    const existingNames = new Set((tbl.fields || []).map(f => f.name));
    const missing = expectedFields.filter(f => !existingNames.has(f.name));
    for (const f of missing) {
      try {
        await fetch(metaUrl + '/' + tbl.id + '/fields', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + APP_KEYS.airtableWriteKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: f.name, type: f.type }),
        });
      } catch (e) { /* feld bereits da oder permission fehlt – egal */ }
    }
  } catch (e) { /* offline / metadata-API nicht verfügbar */ }
}

// Generiert einen zufälligen api_key wie "flp_xxxxxxxxxxxxxxxx"
function generateApiKey() {
  const chars = 'abcdefghjkmnpqrstuvwxyz23456789'; // ohne ähnliche Zeichen (0,O,1,l,i)
  let s = '';
  for (let i = 0; i < 18; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return 'flp_' + s;
}

// Mapt Airtable-Record auf lokales User-Objekt
function recordToUser(rec) {
  const f = rec.fields || {};
  return {
    _recordId: rec.id,
    name: f.name || '',
    role: (f.role || 'user').toLowerCase(),
    status: (f.status || 'aktiv').toLowerCase(),
    apiKey: f.api_key || '',
    email: f.email || '',
    tenantKey: f.tenant_key || f.team_key || f.tenantKey || '',

    lastName: f.last_name || '',
    phone: f.phone || '',

async function loadUsers() {
  const recs = await airRead(TBL_USERS);
  return recs.map(recordToUser).sort((a, b) => {
    // Admins zuerst, dann nach Name
    if (a.role !== b.role) return a.role === 'admin' ? -1 : 1;
    return (a.name || '').localeCompare(b.name || '');
  });
}

async function persistUser(u) {
  const fields = {
    name: u.name || '',
    role: u.role || 'user',
    status: u.status || 'aktiv',
    api_key: u.apiKey || '',
  };
  // Optionale Felder nur mitsenden wenn gesetzt — vermeidet Airtable-Fehler bei nicht existierenden Spalten
  if (u.email) fields.email = u.email;
  if (u.tenantKey) fields.tenant_key = u.tenantKey;
  if (u.firstName) fields.first_name = u.firstName;
  if (u.lastName) fields.last_name = u.lastName;
  if (u.phone) fields.phone = u.phone;
  if (u.companyName) fields.company_name = u.companyName;
  if (u.created) fields.created = u.created;
  if (u._recordId) {
    return await airUpdate(TBL_USERS, u._recordId, fields);
  }
  return await airWrite(TBL_USERS, fields);
}

async function removeUser(u) {
  if (!u?._recordId) return;
  return await airDelete(TBL_USERS, u._recordId);
}

/* ============================================================
   GERÄTEMODUS (phone / tablet)
   - Tablet-Modus: keine „Neuer Artikel"-Buttons mehr sichtbar.
     Eingeben/Anlegen ist eine typische Mobile-Aufgabe (Foto, Tracker-Scan)
     — auf dem iPad meist unhandlich.
   - Erkennung: erstmal aus localStorage (User-Override gewinnt),
     sonst UA-basiert (iPad / Macintosh+Touch), sonst Viewport-Heuristik.
   - User kann jederzeit über User-Bar-Button umschalten.
   ============================================================ */
function detectDeviceMode() {
  try {
    const stored = localStorage.getItem('flp_device_mode');
    if (stored === 'phone' || stored === 'tablet') return stored;
  } catch(e) {}
  const ua = navigator.userAgent || '';
  // Klassischer iPad-UA + moderne iPads, die sich als Macintosh ausgeben + Touch melden
  const isIPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
  if (isIPad) return 'tablet';
  // Generische Tablet-Heuristik: Viewport ≥ 768×600 (iPad-mini Mindestmaß) UND Touch
  const w = Math.min(window.innerWidth, window.innerHeight);
  const big = Math.max(window.innerWidth, window.innerHeight);
  if (w >= 700 && big >= 1000 && (navigator.maxTouchPoints || 0) > 0) return 'tablet';
  return 'phone';
}
function setDeviceMode(mode) {
  state.deviceMode = (mode === 'tablet') ? 'tablet' : 'phone';
  try { localStorage.setItem('flp_device_mode', state.deviceMode); } catch(e) {}
}
function isTabletMode() { return state.deviceMode === 'tablet'; }

/* ============================================================
   PWA-Installation + Onboarding
   Erkennt Standalone-Modus, mobiles OS und ob der Customer schon
   das Onboarding gesehen hat.
   ============================================================ */
function isStandalone() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || window.navigator.standalone === true;
  } catch(e) { return false; }
}
function detectMobileOS() {
  const ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/.test(ua) && !window.MSStream) return 'ios';
  if (/Android/.test(ua)) return 'android';
  // Moderne iPads melden sich als Mac mit Touch
  if (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1) return 'ios';
  return 'desktop';
}

  return 'flp_customer_onboarded_' + (APP_KEYS.user?._recordId || 'anon');
}

/* ============================================================
   VAL.TOWN PROXY für Freshdesk-Anbindung
   Pattern analog zu ERP Hero: Admin gibt vtwn_pat_ ein,
   App deployt Proxy-Code via Val.town REST API.
   ============================================================ */
const VALTOWN_API_BASE = 'https://api.val.town';
const VALTOWN_VAL_NAME = 'flpstockmanagerinquiry'; // muss lowercase sein
const VALTOWN_FILE_PATH = 'main.tsx';

// Proxy-Code — Freshdesk-Ticket-Creator. ENV: FRESHDESK_DOMAIN, FRESHDESK_API_KEY, FRESHDESK_GROUP_ID (optional), SHARED_TOKEN (optional)
const VALTOWN_PROXY_CODE = `// FLP Stockmanager · Customer-Inquiry-Proxy
// Empfängt JSON-POST mit Anfrage-Daten und erstellt Freshdesk-Ticket
// mit dem Kunden als Requester. Kein OAuth, optionaler Shared-Token-Schutz.

const FRESHDESK_DOMAIN  = Deno.env.get("FRESHDESK_DOMAIN")  || "";
const FRESHDESK_API_KEY = Deno.env.get("FRESHDESK_API_KEY") || "";
const FRESHDESK_GROUP_ID = Deno.env.get("FRESHDESK_GROUP_ID") || "";
const SHARED_TOKEN      = Deno.env.get("SHARED_TOKEN")      || "";

function cors() {
  return {
    "Access-Control-Allow-Origin":  "*",
    "Access-Control-Allow-Methods": "POST, GET, OPTIONS",
    "Access-Control-Allow-Headers": "Content-Type, Authorization",
  };
}
function json(d: unknown, s = 200) {
  return new Response(JSON.stringify(d), { status: s, headers: { ...cors(), "Content-Type": "application/json" } });
}

export default async function (req: Request): Promise<Response> {
  if (req.method === "OPTIONS") return new Response(null, { status: 204, headers: cors() });
  if (req.method === "GET") {
    return json({
      ok: true,
      service: "flp-stockmanager-inquiry-proxy",
      freshdeskDomain: FRESHDESK_DOMAIN || "(nicht konfiguriert)",
      hasApiKey: !!FRESHDESK_API_KEY,
      hasSharedToken: !!SHARED_TOKEN,
    });
  }
  if (req.method !== "POST") return json({ error: "Method not allowed" }, 405);

  if (SHARED_TOKEN) {
    const auth = (req.headers.get("authorization") || "").replace(/^Bearer\\s+/i, "").trim();
    if (auth !== SHARED_TOKEN) return json({ error: "Unauthorized" }, 401);
  }

  if (!FRESHDESK_DOMAIN || !FRESHDESK_API_KEY) {
    return json({ error: "Proxy nicht konfiguriert — FRESHDESK_DOMAIN / FRESHDESK_API_KEY fehlt" }, 500);
  }

  let data: any;
  try { data = await req.json(); }
  catch { return json({ error: "Invalid JSON" }, 400); }

  const subject     = String(data.subject || "Anfrage Stockmanager").slice(0, 250);
  const description = String(data.description || "").slice(0, 50000);
  const email       = String(data.email || "").trim();
  const name        = String(data.name || "Kunde").slice(0, 100);
  const phone       = String(data.phone || "").trim().slice(0, 30);

  if (!email || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) {
    return json({ error: "Email fehlt oder ungültig" }, 400);
  }

  const ticket: any = {
    subject,
    description: description.replace(/\\n/g, "<br>"),
    email,
    name,
    priority: 1,    // Low
    status: 2,      // Open
    source: 7,      // Feedback widget
    type: "Question",
  };
  if (phone) ticket.phone = phone;
  if (FRESHDESK_GROUP_ID) ticket.group_id = Number(FRESHDESK_GROUP_ID);

  const auth = "Basic " + btoa(FRESHDESK_API_KEY + ":X");
  const res = await fetch(\`https://\${FRESHDESK_DOMAIN}.freshdesk.com/api/v2/tickets\`, {
    method: "POST",
    headers: { "Authorization": auth, "Content-Type": "application/json" },
    body: JSON.stringify(ticket),
  });
  const body = await res.text();
  if (!res.ok) {
    return json({ error: "Freshdesk-Fehler", status: res.status, body: body.slice(0, 500) }, 502);
  }
  let parsed: any = null; try { parsed = JSON.parse(body); } catch(_) {}
  return json({
    ok: true,
    ticket_id: parsed?.id || null,
    freshdesk_url: parsed?.id ? \`https://\${FRESHDESK_DOMAIN}.freshdesk.com/a/tickets/\${parsed.id}\` : null,
  });
}
`;

/* ── Val.town REST API client ── */
async function valtownApi(token, method, path, body) {
  if (!token) throw new Error('Val.town API-Key fehlt');
  const init = { method, headers: { 'Authorization':'Bearer '+token, 'Accept':'application/json' } };
  if (body) { init.body = JSON.stringify(body); init.headers['Content-Type'] = 'application/json'; }
  const res = await fetch(VALTOWN_API_BASE + path, init);
  let data = null; try { data = await res.json(); } catch(_){}
  if (!res.ok) {
    const msg = (data && (data.message || data.error)) || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return data;
}
async function valtownMe(token) { return valtownApi(token, 'GET', '/v1/me'); }
async function valtownCreateVal(token, name, description = '', privacy = 'public') {
  const body = { name, privacy };
  if (description) body.description = description;
  return valtownApi(token, 'POST', '/v2/vals', body);
}
async function valtownAddHttpFile(token, valId, code) {
  return valtownApi(token, 'POST', '/v2/vals/'+valId+'/files?path='+encodeURIComponent(VALTOWN_FILE_PATH), { content: code, type: 'http' });
}
async function valtownUpdateFile(token, valId, code) {
  return valtownApi(token, 'PUT', '/v2/vals/'+valId+'/files?path='+encodeURIComponent(VALTOWN_FILE_PATH), { content: code });
}
async function valtownGetFile(token, valId, filePath = VALTOWN_FILE_PATH) {
  return valtownApi(token, 'GET', '/v2/vals/'+valId+'/files?path='+encodeURIComponent(filePath));
}
async function valtownSetEnvVar(token, valId, key, value, description = '') {
  try {
    return await valtownApi(token, 'POST', '/v2/vals/'+valId+'/environment_variables', { key, value, description });
  } catch (e) {
    if (/already exists|409/.test(e.message)) {
      return valtownApi(token, 'PUT', '/v2/vals/'+valId+'/environment_variables/'+encodeURIComponent(key), { value, description });
    }
    throw e;
  }
}

/* ── Master-Base Keys schreiben (für Persistenz von valtown-Settings) ── */
async function writeMasterBaseKey(keyName, keyValue, existingId) {

async function loadMasterKeys() {

function _vtLog(msg, kind = 'info') {
  const ts = new Date().toLocaleTimeString('de-DE');
  if (!state.integrationsLog) state.integrationsLog = [];
  state.integrationsLog.push({ ts, msg, kind });
  if (state.view === 'integrations') render();
}
function _generateRandomToken(len = 32) {
  const a = new Uint8Array(len); crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2,'0')).join('');
}

// Setup-Flow: val.town-Val anlegen oder aktualisieren, Env-Vars setzen, Master-Keys persistieren
async function valtownRunSetup() {
  if (state.integrationsBusy) return;
  const d = state.integrationsDraft || {};
  const token = (d.valtownKey || '').trim();
  const fdDomain = (d.freshdeskDomain || '').trim();
  const fdKey    = (d.freshdeskApiKey || '').trim();
  const fdGroup  = (d.freshdeskGroupId || '').trim();
  if (!token) { showToast('Val.town-Token fehlt', 'error', 2800); return; }
  if (!fdDomain || !fdKey) { showToast('Freshdesk-Domain und API-Key sind Pflicht', 'error', 3000); return; }

  state.integrationsBusy = true;
  state.integrationsLog = [];
  _vtLog('Setup gestartet …', 'info');
  render();

  try {
    _vtLog('Prüfe Val.town-Token …', 'info');
    const me = await valtownMe(token);
    _vtLog('✓ Eingeloggt als ' + me.username, 'ok');

    let valId = APP_KEYS.valtownValId;
    let endpointUrl = null;

    if (valId) {
      _vtLog('Val existiert — aktualisiere Code …', 'info');
      try {
        const fileRes = await valtownUpdateFile(token, valId, VALTOWN_PROXY_CODE);
        endpointUrl = fileRes?.links?.endpoint || null;
        _vtLog('✓ Proxy-Code aktualisiert', 'ok');
      } catch (e) {
        _vtLog('Update fehlgeschlagen (' + e.message + ') — lege neuen Val an', 'warn');
        valId = null;
      }
    }

    if (!valId) {
      let valName = VALTOWN_VAL_NAME;
      let val;
      try {
        val = await valtownCreateVal(token, valName, 'FLP Stockmanager · Customer-Inquiry-Proxy', 'public');
      } catch (e) {
        if (/already exists|name/i.test(e.message)) {
          valName = VALTOWN_VAL_NAME + Date.now().toString(36).slice(-4);
          _vtLog('Name belegt — verwende: ' + valName, 'warn');
          val = await valtownCreateVal(token, valName, 'FLP Stockmanager · Customer-Inquiry-Proxy', 'public');
        } else { throw e; }
      }
      valId = val.id;
      _vtLog('✓ Val erstellt: ' + valName + ' (' + valId.substring(0,8) + '…)', 'ok');
      const fileRes = await valtownAddHttpFile(token, valId, VALTOWN_PROXY_CODE);
      endpointUrl = fileRes?.links?.endpoint || null;
      _vtLog('✓ HTTP-Endpoint angelegt', 'ok');
    }

    // Shared-Token generieren wenn noch keiner da
    let sharedToken = APP_KEYS.inquiryProxyToken;
    if (!sharedToken) {
      sharedToken = 'flp_sm_' + _generateRandomToken(24);
      _vtLog('🔐 Shared-Token generiert', 'info');
    }

    _vtLog('Setze Environment-Variablen …', 'info');
    const envs = [
      { k: 'FRESHDESK_DOMAIN', v: fdDomain, d: 'Freshdesk-Subdomain' },
      { k: 'FRESHDESK_API_KEY', v: fdKey, d: 'Freshdesk-API-Key' },
      { k: 'SHARED_TOKEN', v: sharedToken, d: 'Schutz vor Spam-POSTs' },
    ];
    if (fdGroup) envs.push({ k: 'FRESHDESK_GROUP_ID', v: fdGroup, d: 'Optional: Tickets in dieser Gruppe' });
    for (const env of envs) {
      await valtownSetEnvVar(token, valId, env.k, env.v, env.d);
      _vtLog('✓ ' + env.k + ' gesetzt', 'ok');
    }

    // Proxy-URL ermitteln
    let proxyUrl = endpointUrl;
    if (!proxyUrl) {
      try {
        const f = await valtownGetFile(token, valId);
        proxyUrl = f?.links?.endpoint || null;
      } catch (_) {}
    }
    if (!proxyUrl) {
      const val = await valtownApi(token, 'GET', '/v2/vals/' + valId);
      const rawName = (val.name || VALTOWN_VAL_NAME).toLowerCase();
      proxyUrl = 'https://' + (me.username || '').toLowerCase() + '--' + rawName + '.web.val.run';

// Normalisiert die Proxy-URL (Val.town-Hostnames sind lowercase)
function _normalizeProxyUrl(url) {
  if (!url) return url;
  try {
    const u = new URL(url);
    u.hostname = u.hostname.toLowerCase();
    return (u.protocol + '//' + u.hostname + (u.pathname && u.pathname !== '/' ? u.pathname : '')).replace(/\/+$/, '');
  } catch(_) { return String(url).replace(/\/+$/, ''); }
}

function relTime(iso) {
  if (!iso) return '\u2014';
  const t = Date.parse(iso); if (isNaN(t)) return '\u2014';
  const diffH = Math.max(0, (Date.now() - t) / 36e5);
  if (diffH < 1) return Math.max(1, Math.round(diffH * 60)) + ' min';
  if (diffH < 24) return Math.round(diffH) + ' h';
  return Math.round(diffH / 24) + ' d';
}

function recordToCompany(rec) {

function recordToItem(rec) {
  const f = rec.fields || {};
  let specs = [];
  try { if (f.specs) specs = JSON.parse(f.specs); } catch(e) {}
  const photoArr = Array.isArray(f.photo) ? f.photo : [];
  return {
    _recordId: rec.id,
    id: f.item_id,
    company_id: f.company_id,
    title: f.title || '',
    description: f.description || '',
    maker: f.maker || '',

    specs,
    photo: photoArr,
    photoUrl: photoArr[0]?.url || null,
    tracker: f.tracker || '',
    trackerUrl: f.tracker_url || '',
    // Externer Besitzer (z.B. Fremd-Antrieb im Lager) — leerer String = eigener Bestand
    owner: f.owner || '',
    // Webshop
    vp: (f.vp !== '' && f.vp != null) ? parseFloat(String(f.vp).replace(',', '.')) : null,
    inShop: f.in_shop === '1' || f.in_shop === 'true',
    sold: f.sold === '1' || f.sold === 'true',
    soldAt: f.sold_at || null,
    // Service-Tausch (Iteration 1)
    saleType: f.sale_type || '',           // '' | 'sale' | 'service-exchange'
    orderNumber: f.order_number || '',
    linkedItemId: f.linked_item_id || '',
    returnedAt: f.returned_at || null,
    // Bei Bestandsdaten ohne created-Feld auf updated zurückfallen, damit Filter funktionieren
    created: f.created || f.updated || nowIso(),
    updated: f.updated || nowIso(),
    upd: relTime(f.updated),
  };
}

// Benennt eine Halle um: aktualisiert state.halls, den Halls-Foto-Record (falls vorhanden),
// die Company-Tabelle (halls JSON), und alle Items in dieser Firma deren loc auf die alte Halle zeigt.
async function renameHallEverywhere(oldName, newName) {
  oldName = String(oldName).trim();
  newName = String(newName).trim();
  if (!oldName || !newName || oldName === newName) return;
  if (!isAdmin()) { showToast('Nur Admins dürfen Lagerorte ändern', 'info', 2400); return; }
  const c = state.company;
  if (!c) { showToast('Keine Firma aktiv', 'error'); return; }
  if ((state.halls || []).includes(newName)) {
    showToast('Halle „' + newName + '" existiert bereits', 'error', 2800);
    return;
  }
  setLoading(true, 'Halle wird umbenannt …');
  try {
    // 1) state.halls Array updaten (Reihenfolge erhalten)
    state.halls = (state.halls || []).map(h => h === oldName ? newName : h);

    // 2) hallPhotos-Map umtaggen + Halls-Tabelle patchen wenn Record existiert
    const hp = state.hallPhotos?.[oldName];
    if (hp) {
      delete state.hallPhotos[oldName];
      state.hallPhotos[newName] = { ...hp, name: newName };
      if (hp._recordId) {
        try { await airUpdate(TBL_HALLS, hp._recordId, { name: newName }); } catch (e) { /* lokal trotzdem behalten */ }
      }
    }

    // 3) Companies-Tabelle: halls JSON persistieren
    setLoading(true, 'Firmen-Daten werden aktualisiert …');
    await persistCompanyHallsShelves(c);

    // 4) Items mit alter Halle in loc-String umtaggen
    const affected = (c.inventory || []).filter(it => {
      const p = parseLoc(it.loc);
      return p.hall === oldName;
    });
    if (affected.length > 0) {
      setLoading(true, `${affected.length} Artikel werden umgetaggt …`);
      for (const it of affected) {
        const p = parseLoc(it.loc);
        p.hall = newName;
        it.loc = buildLoc(p);
        try { await airUpdate(TBL_ITEMS, it._recordId, { loc: it.loc }); } catch (e) { /* nächster */ }
      }
    }
    showToast(`Halle umbenannt: „${oldName}" → „${newName}"${affected.length ? ` · ${affected.length} Artikel mit angepasst` : ''}`, 'success', 3000);
  } catch (e) {
    showToast('Umbenennen fehlgeschlagen: ' + (e.message || 'Unbekannter Fehler'), 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Lädt ein Foto für eine Halle hoch — legt den Halls-Record bei Bedarf an, optimiert das Bild vorher.
async function uploadHallPhoto(hallName, file) {
  const c = state.company;
  if (!c) { showToast('Keine Firma aktiv', 'error'); return; }
  setLoading(true, 'Halle-Foto wird optimiert …');
  try {
    // Bild auf 5:4 + 1600 px reduzieren (gleiche Pipeline wie Item-Fotos)
    const processed = await processImage(file);
    // Record sicherstellen
    let rec = state.hallPhotos[hallName];
    if (!rec?._recordId) {
      setLoading(true, 'Halle wird angelegt …');
      const created = await airWrite(TBL_HALLS, {
        hall_id: 'h_' + Math.random().toString(36).slice(2, 10),
        company_id: c.id,
        name: hallName,
        api_key: teamKey(),
      });
      rec = { _recordId: created.id, id: created.fields?.hall_id, company_id: c.id, name: hallName, photo: null };
      state.hallPhotos[hallName] = rec;
    }
    setLoading(true, 'Foto wird hochgeladen …');
    await uploadFileToRecord(TBL_HALLS, rec._recordId, 'photo', processed);
    // Frisch nachladen — Airtable liefert Foto + Thumbnails asynchron
    setLoading(true, 'Foto wird verarbeitet …');
    let attempts = 0, freshPhoto = null;
    while (attempts < 6 && !freshPhoto) {
      await new Promise(r => setTimeout(r, 600 + attempts * 400));
      try {
        const fresh = await airReadOne(TBL_HALLS, rec._recordId);
        const arr = Array.isArray(fresh.fields?.photo) ? fresh.fields.photo : [];
        if (arr[0]?.url) freshPhoto = arr[0];
      } catch (e) { /* retry */ }
      attempts++;
    }
    if (freshPhoto) rec.photo = freshPhoto;
    showToast('Foto für „' + hallName + '" gespeichert', 'success', 2400);
  } catch (e) {
    showToast('Hall-Foto fehlgeschlagen: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

async function loadAllData() {
  // Geteilte Datenquelle: alle eingeloggten User sehen dieselben Firmen / Artikel / Hallen.
  // Isolation passiert auf Datenbank-Ebene (separate Project-Base pro Kunde) — nicht pro User.
  const apiKey = teamKey(); // wird beim Schreiben weiterhin als "angelegt von" mitgegeben
  const [companyRecs, itemRecs, hallRecs] = await Promise.all([
    airRead(TBL_COMPANIES),
    airRead(TBL_ITEMS),
    airRead(TBL_HALLS).catch(() => []), // Tabelle könnte beim ersten Mal noch fehlen
  ]);

  let companies = companyRecs.map(recordToCompany).filter(c => c.id);

  // Hallen-Foto-Records pro Company als Map { hallName → hallRecord }
  const hallsByCompany = {};
  hallRecs.forEach(r => {
    const h = recordToHall(r);
    if (!h.company_id || !h.name) return;
    (hallsByCompany[h.company_id] = hallsByCompany[h.company_id] || {})[h.name] = h;
  });
  companies.forEach(c => { c.hallPhotos = hallsByCompany[c.id] || {}; });

  // Seed bei erstem Start: FLP Lift Parts mit Beispiel-Bestand
  if (companies.length === 0) {
    showToast('Erste Einrichtung \u2026 Beispieldaten werden angelegt', 'info', 3000);
    const flpId = 'co_flp_' + Date.now().toString(36);
    const seedCompany = {
      id: flpId,
      name: 'FLP Lift Parts',
      color: '#2456E5',
      halls: SEED_FLP_HALLS.slice(),
      shelves: SEED_FLP_SHELVES.slice(),
      categories: SEED_FLP_CATEGORIES.slice(),
      inventory: [],
      _created: nowIso(),
    };
    const created = await airWrite(TBL_COMPANIES, companyToFields(seedCompany, apiKey));
    seedCompany._recordId = created.id;
    companies = [seedCompany];

    // Seed-Artikel anlegen (mit kleiner Verz\u00f6gerung gegen Rate-Limit)
    for (const tpl of SEED_FLP_INVENTORY) {
      const it = {
        ...tpl,
        company_id: flpId,
        updated: nowIso(),
        photo: [],
        photoUrl: null,
      };
      try {
        const rec = await airWrite(TBL_ITEMS, itemToFields(it, apiKey));
        it._recordId = rec.id;
        seedCompany.inventory.push(it);
      } catch (e) {
        console.warn('Seed-Artikel \u00fcbersprungen:', e.message);
      }
    }
  } else {
    // Items den Companies zuordnen
    const items = itemRecs.map(recordToItem);
    const byCompany = {};
    items.forEach(it => {
      (byCompany[it.company_id] = byCompany[it.company_id] || []).push(it);
    });
    companies.forEach(c => {
      c.inventory = byCompany[c.id] || [];
    });
    // Migration: falls categories-Feld in Airtable noch leer war, im Hintergrund nachziehen
    for (const c of companies) {
      const recCategories = companyRecs.find(r => r.id === c._recordId)?.fields?.categories;
      if (!recCategories && c.categories?.length) {
        airUpdate(TBL_COMPANIES, c._recordId, { categories: JSON.stringify(c.categories) }).catch(() => {});
      }
    }
  }

  state.companies = companies;
  state.activeCompanyId = companies[0]?.id || null;
}

function persistItemPatch(it, patch) {
  if (!it?._recordId) return Promise.resolve();
  const fields = {};
  Object.keys(patch).forEach(k => {
    if (k === 'specs') fields.specs = JSON.stringify(patch.specs || []);
    else fields[k] = patch[k];
  });
  fields.updated = nowIso();
  return airUpdate(TBL_ITEMS, it._recordId, fields)
    .catch(err => showToast('Sync fehlgeschlagen: ' + err.message, 'error', 3500));
}

async function persistCompany(c) {
  const fields = companyToFields(c, teamKey());

  const rec = await airWrite(TBL_COMPANIES, fields);
  c._recordId = rec.id;

}

// Lädt die Photo-Liste eines bereits angezeigten Items frisch nach (im Hintergrund).
// Macht den Detail-Screen self-healing wenn die in-memory-Daten veraltet sind.
async function refreshItemPhotos(it) {
  if (!it?._recordId) return;
  try {
    const rec = await airReadOne(TBL_ITEMS, it._recordId);
    const photos = rec.fields?.photo || [];
    // Nur neu rendern wenn sich etwas geändert hat
    const sameCount = (it.photo || []).length === photos.length;
    const sameFirst = (it.photo?.[0]?.id || '') === (photos[0]?.id || '');
    if (sameCount && sameFirst) return;
    it.photo = photos;
    it.photoUrl = photos[0]?.url || null;
    if (state.item === it) render();
  } catch (e) { /* offline / 404 — egal */ }
}

// Holt Photo-Liste eines Records mit Retry, weil Airtable die Attachment-URLs
// nach Upload manchmal erst nach 1-2 Sekunden ausliefert.
async function fetchPhotosWithRetry(recordId, expectedCount, maxAttempts = 5) {
  let lastPhotos = [];
  for (let i = 0; i < maxAttempts; i++) {
    try {
      const rec = await airReadOne(TBL_ITEMS, recordId);
      const photos = (rec.fields?.photo) || [];
      lastPhotos = photos;
      // Wenn wir mindestens die erwartete Anzahl haben UND alle URLs vorhanden sind \u2192 fertig
      if (photos.length >= expectedCount && photos.every(p => p.url)) {
        return photos;
      }
    } catch (e) { /* n\u00e4chster Versuch */ }
    await new Promise(r => setTimeout(r, 600 + i * 400)); // 600, 1000, 1400, 1800, 2200 ms
  }
  return lastPhotos; // Fallback: das, was wir zuletzt gesehen haben
}

// H\u00e4ngt ein neues Foto an das Item an (Multi-Photo).
// Wenn bereits PHOTO_MAX_PER_ITEM erreicht, abbrechen mit Hinweis.
async function handleItemPhotoAdd(file) {
  const it = state.item;
  if (!it) return;
  const current = it.photo || [];
  if (current.length >= PHOTO_MAX_PER_ITEM) {
    showToast('Max ' + PHOTO_MAX_PER_ITEM + ' Fotos pro Artikel', 'error');
    return;
  }
  const expectedCount = current.length + 1;
  setLoading(true, 'Foto wird optimiert & hochgeladen \u2026');
  try {
    await uploadFileToRecord(TBL_ITEMS, it._recordId, 'photo', file);
    setLoading(true, 'Foto wird verarbeitet \u2026');
    // Frisch nachladen \u2014 uploadAttachment-Response ist nicht zuverl\u00e4ssig
    const photos = await fetchPhotosWithRetry(it._recordId, expectedCount);
    it.photo = photos;
    it.photoUrl = photos[0]?.url || null;
    it.updated = nowIso();
    it.upd = 'gerade eben';
    state.galleryIndex = Math.max(0, photos.length - 1); // springe auf neues Foto
    showToast('Foto hinzugef\u00fcgt', 'success');
  } catch (e) {
    showToast('Upload fehlgeschlagen: ' + e.message, 'error', 3500);
  } finally {
    setLoading(false);
    render();
  }
}

// Entfernt ein Foto am Index aus dem Item.
async function handleItemPhotoDelete(idx) {
  const it = state.item;
  if (!it || !it.photo || idx < 0 || idx >= it.photo.length) return;
  const remaining = it.photo.filter((_, i) => i !== idx).map(p => ({ id: p.id }));
  const expectedCount = remaining.length;

    it.upd = 'gerade eben';

    showToast('L\u00f6schen fehlgeschlagen: ' + e.message, 'error', 3500);

    setLoading(false);

}
